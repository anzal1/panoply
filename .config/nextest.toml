# cargo-nextest settings. Local runs use the default profile; CI uses `--profile ci`.
[profile.default]
fail-fast = false

[profile.ci]
fail-fast = false
# Print only what matters in the log: failures, slow tests and a summary.
status-level = "fail"
final-status-level = "slow"
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.ci.junit]
path = "junit.xml"
