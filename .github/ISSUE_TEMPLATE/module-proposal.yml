name: Module proposal
description: Propose a new tool for Panoply
labels: ["module request"]
body:
  - type: markdown
    attributes:
      value: |
        Panoply only adds a tool when it can beat the paid one it replaces. The questions below are how we decide.
        See [CONTRIBUTING.md](https://github.com/anzal1/panoply/blob/main/CONTRIBUTING.md) for the rules every module follows.
  - type: input
    id: job
    attributes:
      label: Job
      description: The sentence a user would say, for example "make this PDF small enough to email".
    validations:
      required: true
  - type: dropdown
    id: pattern
    attributes:
      label: Flow pattern
      description: See docs/FLOWS.md for what each pattern means.
      options:
        - A. Instant transform
        - B. Tuned transform
        - C. Visual editor
        - D. Guided capture
        - E. Generator
        - F. Instant answer
        - G. Always on
        - H. Find
        - I. Inspect
    validations:
      required: true
  - type: textarea
    id: demand
    attributes:
      label: Demand evidence
      description: Search volume, paid apps people buy for it, launches, issues. Links please.
  - type: textarea
    id: bar
    attributes:
      label: Quality bar
      description: Which tool must we beat, and how will we measure it?
  - type: textarea
    id: engine
    attributes:
      label: Engine
      description: The OS engine per platform, and the fallback (a library, or a model with a clean license and its size).
  - type: checkboxes
    id: offline
    attributes:
      label: Privacy
      options:
        - label: It can run fully on the device, with no upload.
          required: true
