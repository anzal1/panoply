name: Linux system libraries
description: The system libraries the GPUI desktop app needs to compile on Linux.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        pkgs="pkg-config cmake clang libclang-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
          libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcb-render0-dev libxcb-shape0-dev
          libxcb-xfixes0-dev libfontconfig-dev libfreetype-dev libssl-dev libasound2-dev libvulkan-dev
          libdbus-1-dev libgtk-3-dev"
        # The runner image's package lists are recent, so try without `apt-get update` (about 10 s) and
        # only update when a package has moved on since the image was built.
        sudo apt-get install -y -qq --no-install-recommends $pkgs \
          || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $pkgs; }
