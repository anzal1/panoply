version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      # Everything arrives as one pull request a week, so the tree stays quiet. CI decides if it can merge.
      # Run the notices generator on that branch (see CONTRIBUTING.md) before merging, since Cargo.lock changes.
      rust-dependencies:
        patterns: ["*"]
    ignore:
      # Pinned to the 49 line on purpose, see Cargo.toml.
      - dependency-name: "wasmtime*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pdfium-render"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    groups:
      actions:
        patterns: ["*"]
