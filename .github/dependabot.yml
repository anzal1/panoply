version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      # Patch and minor bumps arrive as one pull request a week. Majors stay separate so they get a real look.
      rust-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Pinned to the 49 line on purpose, see Cargo.toml.
      - dependency-name: "wasmtime*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pdfium-render"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    groups:
      actions:
        patterns: ["*"]
