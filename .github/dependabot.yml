version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    # One pull request a month at most, with every update in it, majors included.
    # Run the notices generator on that branch (see CONTRIBUTING.md) before merging, since Cargo.lock changes.
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    labels: ["dependencies"]
    groups:
      rust-dependencies:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    ignore:
      # Pinned to the 49 line on purpose, see Cargo.toml.
      - dependency-name: "wasmtime*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pdfium-render"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    labels: ["dependencies"]
    groups:
      actions:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
