changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: New tools
      labels: ["module request"]
    - title: Improvements
      labels: ["enhancement", "area: desktop", "area: cli"]
    - title: Fixes
      labels: ["bug"]
    - title: Accessibility
      labels: ["accessibility"]
    - title: Documentation
      labels: ["documentation"]
    - title: Dependencies
      labels: ["dependencies"]
    - title: Other changes
      labels: ["*"]
