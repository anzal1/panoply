name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: tests/corpus/cache
          key: corpus-${{ runner.os }}-${{ hashFiles('tests/corpus/*.toml', 'tests/corpus/*.py') }}
      - name: Fetch and generate the test corpus
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python -I tests/corpus/fetch.py --kind pdf,image
          python tests/corpus/generate.py --kind pdf,image || echo "some generated files need local tools; their tests skip"
      # Corpus tests run on every file that is present; set PANOPLY_REQUIRE_CORPUS=1
      # once generate.py builds every generated file on all three OSes.
      - run: cargo test --workspace --no-fail-fast

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  conversions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate conversion graph and fail if it changed
        run: |
          python3 conversions/formats.py
          git diff --exit-code docs/CONVERSIONS.md crates/panoply-convert/data/graph.json
