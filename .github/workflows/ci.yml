name: CI

# What runs where, and why the jobs are split the way they are: docs/CI.md.

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new advisory against dependencies nobody touched still shows up, and so the
  # slow caches never go cold. A scheduled run always runs every job.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      variant:
        description: experiment tags
        default: ""
      matrix:
        description: test matrix json
        default: ""

# A superseded pull request or branch run is cancelled. A push to main is never cancelled by a
# later push (each gets its own group), so the last green run on main always finishes.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}-${{ inputs.variant }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: short
  # Tests that need a model or engine download it. Panoply asks before any download, so the test
  # run says yes the way `--yes` does (each yes is recorded in a throwaway data folder).
  PANOPLY_YES: "1"

jobs:
  # ------------------------------------------------------------------------------------------------
  # Which jobs does this change need? A push that only touches documentation skips every Rust job.
  # ------------------------------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.c.outputs.code }}
      deps: ${{ steps.c.outputs.deps }}
      notices: ${{ steps.c.outputs.notices }}
      conversions: ${{ steps.c.outputs.conversions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
      - id: c
        run: python3 -I tools/ci/changes.py
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}

  # Runs on every push and takes a few seconds: every relative link in the Markdown files resolves.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -I tools/ci/check_docs.py

  # ------------------------------------------------------------------------------------------------
  # Rust, split so the quick answers come first and the slow one starts at once.
  # ------------------------------------------------------------------------------------------------
  fmt:
    needs: changes
    if: needs.changes.outputs.code == 'true' && inputs.variant == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    needs: changes
    if: needs.changes.outputs.code == 'true' && inputs.variant == ''
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-libs
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: clippy-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --exclude gpui-base --all-targets -- -D warnings

  # Every test, on every OS, except the slowest corpus and model tests, which run on Linux only (the
  # nextest profiles in .config/nextest.toml and the table in docs/CI.md). The tests are built once
  # with the `ci` profile in Cargo.toml and run by cargo-nextest, which runs the test binaries side by
  # side instead of one after the other.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: test (${{ matrix.os }}${{ matrix.shards && format(', part {0} of {1}', matrix.shard, matrix.shards) || '' }}) ${{ inputs.variant }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix || '{"include":[{"os":"ubuntu-latest","profile":"ci","shard":1,"shards":3},{"os":"ubuntu-latest","profile":"ci","shard":2,"shards":3},{"os":"ubuntu-latest","profile":"ci","shard":3,"shards":3},{"os":"windows-latest","profile":"ci-core","shard":1},{"os":"macos-latest","profile":"ci-core","shard":1}]}') }}
    runs-on: ${{ matrix.os }}
    env:
      NEXTEST_ARGS: --workspace --exclude gpui-base --cargo-profile ci --profile ${{ matrix.profile }} --lib --bins --tests
    steps:
      - name: Dev Drive at the workspace
        if: runner.os == 'Windows' && contains(inputs.variant, 'ddw')
        shell: pwsh
        env:
          MOUNT: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $disk = New-VHD -Path C:\devdrive.vhdx -SizeBytes 40GB -Dynamic | Mount-VHD -Passthru | Initialize-Disk -PartitionStyle GPT -Passthru
          $part = $disk | New-Partition -AssignDriveLetter -UseMaximumSize
          try { $vol = $part | Format-Volume -DevDrive -Confirm:$false -Force } catch { Write-Host "DevDrive format failed: $_"; $vol = $part | Format-Volume -FileSystem ReFS -Confirm:$false -Force }
          $letter = $vol.DriveLetter
          Write-Host "volume $letter fs $($vol.FileSystem)"
          fsutil devdrv trust /f "${letter}:"
          fsutil devdrv enable /disallowAv
          fsutil devdrv query "${letter}:"
          if ($env:MOUNT_MODE -ne 'junction') { New-Item -ItemType Directory -Force -Path $env:MOUNT | Out-Null }
          if ($env:MOUNT_MODE -eq 'junction') {
            New-Item -ItemType Directory -Force -Path "${letter}:\target" | Out-Null
            cmd /c mklink /J "$env:MOUNT" "${letter}:\target"
          } else {
            Add-PartitionAccessPath -DiskNumber $part.DiskNumber -PartitionNumber $part.PartitionNumber -AccessPath $env:MOUNT
          }
          "DEVDRIVE_LETTER=$letter" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "dev drive ready in $($sw.Elapsed.TotalSeconds) s"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: ${{ !contains(inputs.variant, 'ddw') }}
      - name: Dev Drive at target
        if: runner.os == 'Windows' && contains(inputs.variant, 'ddj')
        shell: pwsh
        env:
          MOUNT: ${{ github.workspace }}\target
          MOUNT_MODE: junction
        run: |
          $ErrorActionPreference = 'Stop'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $disk = New-VHD -Path C:\devdrive.vhdx -SizeBytes 40GB -Dynamic | Mount-VHD -Passthru | Initialize-Disk -PartitionStyle GPT -Passthru
          $part = $disk | New-Partition -AssignDriveLetter -UseMaximumSize
          try { $vol = $part | Format-Volume -DevDrive -Confirm:$false -Force } catch { Write-Host "DevDrive format failed: $_"; $vol = $part | Format-Volume -FileSystem ReFS -Confirm:$false -Force }
          $letter = $vol.DriveLetter
          Write-Host "volume $letter fs $($vol.FileSystem)"
          fsutil devdrv trust /f "${letter}:"
          fsutil devdrv enable /disallowAv
          fsutil devdrv query "${letter}:"
          if ($env:MOUNT_MODE -ne 'junction') { New-Item -ItemType Directory -Force -Path $env:MOUNT | Out-Null }
          if ($env:MOUNT_MODE -eq 'junction') {
            New-Item -ItemType Directory -Force -Path "${letter}:\target" | Out-Null
            cmd /c mklink /J "$env:MOUNT" "${letter}:\target"
          } else {
            Add-PartitionAccessPath -DiskNumber $part.DiskNumber -PartitionNumber $part.PartitionNumber -AccessPath $env:MOUNT
          }
          "DEVDRIVE_LETTER=$letter" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "dev drive ready in $($sw.Elapsed.TotalSeconds) s"
      - name: Experiment settings
        shell: bash
        run: |
          v="${{ inputs.variant }}"
          if [[ "$v" == *lld* && "$RUNNER_OS" == Windows ]]; then
            echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld.exe" >> "$GITHUB_ENV"
          fi
          if [[ "$v" == *w2* ]]; then
            awk '/^\[profile.ci\]/{ci=1} {if(ci) sub(/opt-level = 3/,"opt-level = 2"); print}' Cargo.toml > Cargo.new && mv Cargo.new Cargo.toml
          fi
          if [[ "$v" == *d1* ]]; then
            awk '/^\[profile.ci.package."\*"\]/{star=1;print;next} star&&/opt-level/{print "opt-level = 1";star=0;next} {print}' Cargo.toml > Cargo.new && mv Cargo.new Cargo.toml
          fi
          if [[ "$v" == *cgu16* ]]; then
            awk '{print} /^strip = "debuginfo"/{print "codegen-units = 16"}' Cargo.toml > Cargo.new && mv Cargo.new Cargo.toml
          fi
          git diff --stat Cargo.toml || true
          if [[ "$v" == *sccache* ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          fi
      - name: Folders for the test run
        shell: bash
        run: |
          echo "PANOPLY_DATA_DIR=$RUNNER_TEMP/panoply-data" >> "$GITHUB_ENV"
          echo "PANOPLY_ENGINES_DIR=$RUNNER_TEMP/panoply-engines" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-wasip2
      - if: contains(inputs.variant, 'sccache')
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-libs
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-${{ matrix.os }}${{ inputs.variant && format('-{0}', inputs.variant) || '' }}
          # A failing test must not throw away a 15 minute build.
          cache-on-failure: true
          save-if: ${{ matrix.shard == 1 }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: nextest

      # The test corpus, cached by the hash of its manifests. A hit skips Python and the downloads.
      - id: corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/corpus/cache
          key: corpus-${{ runner.os }}-${{ hashFiles('tests/corpus/*.toml', 'tests/corpus/*.py') }}
      - if: steps.corpus.outputs.cache-hit != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch and generate the test corpus
        if: steps.corpus.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python -I tests/corpus/fetch.py --kind pdf,image
          python tests/corpus/generate.py --kind pdf,image || echo "some generated files need local tools; their tests skip"
      # Corpus tests run on every file that is present; set PANOPLY_REQUIRE_CORPUS=1
      # once generate.py builds every generated file on all three OSes.

      # Engines and models the tests download (pdfium, ONNX Runtime, the small models), cached by the
      # pins in the source: a new pin changes the key, a checksum is still verified on every use.
      - id: engines
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/panoply-engines
          key: engines-${{ runner.os }}-${{ hashFiles('crates/panoply-pdf/src/pdfium.rs', 'crates/panoply-ocr/src/models.rs', 'crates/panoply-id/src/runtime.rs', 'crates/panoply-vision/src/runtime.rs', 'crates/panoply-vision/src/models.rs', 'crates/panoply-vision/src/fetch.rs', 'crates/panoply-media/src/engine/pins.rs') }}

      # Some tests build small WebAssembly modules. Built here once, from a cache, they are ready
      # when the tests start instead of being compiled by a dozen test processes at the same moment.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: wasm
        with:
          path: |
            crates/panoply-wasm/tests/fixtures/*/target
            modules/examples-wasm/*/target
          key: wasm-${{ runner.os }}-${{ hashFiles('crates/panoply-wasm/tests/fixtures/**', 'modules/examples-wasm/**') }}
      - name: Build the WebAssembly test modules
        if: steps.wasm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          for d in crates/panoply-wasm/tests/fixtures/* modules/examples-wasm/*; do
            cargo build --release --target wasm32-wasip2 --quiet --manifest-path "$d/Cargo.toml"
          done

      - name: Build the tests
        shell: bash
        run: |
          start=$(date +%s)
          cargo nextest run ${{ env.NEXTEST_ARGS }} --no-run ${{ contains(inputs.variant, 'timings') && '--timings' || '' }}
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))"
          if command -v sccache >/dev/null; then sccache --show-stats; fi
      # Download the engines and models once, one after another, before the tests start (a cold
      # cache is the only time anything is fetched). Tests that find the download already done never
      # print the "Downloading ..." line some of them look for, and a dozen test processes never
      # fetch or unpack the same file at the same moment (on Windows that is "Access is denied").
      # The OCR tests keep their own copy of ONNX Runtime; PANOPLY_ORT_LIB points them at this one.
      # ffmpeg is left out on purpose: the media tests skip without it, as they always have.
      - name: Download the engines and models once
        shell: bash
        run: |
          panoply="${CARGO_TARGET_DIR:-target}/ci/panoply"
          "$panoply" models fetch pdfium onnxruntime isnet migan esrgan ppocr-det ppocr-rec-en \
            ppocr-rec-latin ppocr-rec-devanagari tessdata-ben tessdata-eng tessdata-hin yunet 2>&1 | tee fetch.log
          # The line "onnxruntime: ready at <path>" has the path in the form the tests need it.
          ort="$(sed -n 's/^onnxruntime: ready at //p' fetch.log | head -1)"
          test -n "$ort"
          echo "PANOPLY_ORT_LIB=$ort" >> "$GITHUB_ENV"
          rm fetch.log
      - name: Run the tests
        run: cargo nextest run ${{ env.NEXTEST_ARGS }} ${{ matrix.shards && format('--partition count:{0}/{1}', matrix.shard, matrix.shards) || '' }}
      # The timing tests (idle CPU and memory budgets) get the machine to themselves.
      - name: Run the timing tests alone
        if: matrix.shard == 1
        run: cargo nextest run --workspace --exclude gpui-base --cargo-profile ci --profile ci-idle --lib --bins --tests
      - name: Doc tests
        if: matrix.shard == 1
        run: cargo test --workspace --exclude gpui-base --profile ci --doc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            target/nextest/*/junit*.xml
            target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 3

  # ------------------------------------------------------------------------------------------------
  # Dependency checks and generated files.
  # ------------------------------------------------------------------------------------------------
  licenses:
    needs: changes
    if: needs.changes.outputs.deps == 'true' && inputs.variant == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources

  # Advisories are a separate job: a new advisory against an untouched dependency should show up here
  # without hiding the license result. Ignored advisories and their reasons are in deny.toml.
  advisories:
    needs: changes
    if: needs.changes.outputs.deps == 'true' && inputs.variant == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  # THIRD-PARTY-NOTICES.md is generated from Cargo.lock. This fails when Cargo.lock (or the hand-written
  # parts in tools/notices) changed and the file was not regenerated.
  notices:
    needs: changes
    if: needs.changes.outputs.notices == 'true' && inputs.variant == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fetch --locked
      - run: python3 -I tools/notices/generate.py --check

  conversions:
    needs: changes
    if: needs.changes.outputs.conversions == 'true' && inputs.variant == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Regenerate conversion graph and fail if it changed
        run: |
          python3 conversions/formats.py
          git diff --exit-code docs/CONVERSIONS.md crates/panoply-convert/data/graph.json

  # One name to require in branch protection. Skipped jobs (a docs-only push) count as passed;
  # failed or cancelled ones do not.
  ci:
    if: always()
    needs: [changes, docs, fmt, clippy, test, licenses, advisories, notices, conversions]
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job passed or was skipped
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c '
          import json, sys
          bad = {k: v["result"] for k, v in json.load(sys.stdin).items() if v["result"] not in ("success", "skipped")}
          print("all jobs passed or were skipped" if not bad else f"not green: {bad}")
          sys.exit(1 if bad else 0)'
