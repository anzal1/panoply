name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries for the GPUI desktop app
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pkg-config cmake clang libclang-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libfontconfig-dev libfreetype-dev libssl-dev libasound2-dev libvulkan-dev \
            libdbus-1-dev libgtk-3-dev
      - run: cargo fmt --all --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --workspace --exclude gpui-base --all-targets -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: tests/corpus/cache
          key: corpus-${{ runner.os }}-${{ hashFiles('tests/corpus/*.toml', 'tests/corpus/*.py') }}
      - name: Fetch and generate the test corpus
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python -I tests/corpus/fetch.py --kind pdf,image
          python tests/corpus/generate.py --kind pdf,image || echo "some generated files need local tools; their tests skip"
      # Corpus tests run on every file that is present; set PANOPLY_REQUIRE_CORPUS=1
      # once generate.py builds every generated file on all three OSes.
      # Tests that need a model or engine download it. Panoply asks before any download, so the
      # test run says yes the way `--yes` does (each yes is recorded in a throwaway data folder).
      - run: cargo test --workspace --exclude gpui-base --no-fail-fast
        env:
          PANOPLY_YES: "1"
          PANOPLY_DATA_DIR: ${{ runner.temp }}/panoply-data

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  # Advisories are a separate job: a new advisory against an untouched dependency should show up here
  # without hiding the license result. Ignored advisories and their reasons are in deny.toml.
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  # THIRD-PARTY-NOTICES.md is generated from Cargo.lock. This fails when Cargo.lock (or the hand-written
  # parts in tools/notices) changed and the file was not regenerated. It runs on every push and pull
  # request, which covers every Cargo.lock change.
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fetch --locked
      - run: python3 -I tools/notices/generate.py --check

  conversions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate conversion graph and fail if it changed
        run: |
          python3 conversions/formats.py
          git diff --exit-code docs/CONVERSIONS.md crates/panoply-convert/data/graph.json
