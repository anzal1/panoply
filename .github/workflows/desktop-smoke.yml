name: Desktop smoke

# Opens the real desktop app on a real desktop session and keeps screenshots as proof. CI elsewhere only
# renders the UI offscreen on macOS; this is the one place the Windows and Linux windows are actually seen.
#
# It tests the shipped files, not a fresh build: the .msi (Windows) and the .AppImage (Linux) are
# downloaded from a GitHub release, the .msi is installed for real, and the app is started, screenshotted,
# poked with its global hotkey and closed.
#
#   windows-latest  interactive desktop session; PowerShell + user32 (screenshot, hotkey, window list)
#   ubuntu-latest   Xvfb + openbox + software Vulkan (lavapipe); xdotool, wmctrl, ImageMagick
#
# Run by hand: Actions > Desktop smoke > Run workflow, or `gh workflow run desktop-smoke.yml -f tag=v0.1.1-beta`.
# With no tag the latest published prerelease is used. A pushed release tag runs it too, and waits (up to
# 100 minutes) for the Release workflow to attach its files to that tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (empty: the latest prerelease)"
        type: string
        default: ""
      run_id:
        description: "Instead of a release: the id of a Release workflow run whose artifacts to test (a manual run of Release from a branch)"
        type: string
        default: ""
  push:
    tags: ["v*"]

concurrency:
  group: desktop-smoke-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

# Write is only needed to see a draft release while a tag is being released. Nothing is written.
permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    outputs:
      tag: ${{ steps.r.outputs.tag }}
    steps:
      - id: r
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RUN: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_RUN" ]; then echo "tag=" >> "$GITHUB_OUTPUT"; echo "Testing the artifacts of run $INPUT_RUN" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          tag="$INPUT_TAG"
          if [ -z "$tag" ] && [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; fi
          if [ -z "$tag" ]; then
            tag="$(gh release list --limit 30 --json tagName,isPrerelease,isDraft \
              --jq '[.[] | select(.isDraft | not)] | (map(select(.isPrerelease)) + .)[0].tagName')"
          fi
          [ -n "$tag" ] || { echo "::error::no release found"; exit 1; }
          # A tag that was just pushed has no files until the Release workflow finishes.
          for i in $(seq 1 100); do
            n="$(gh release view "$tag" --json assets --jq '[.assets[].name | select(endswith(".msi") or endswith(".AppImage"))] | length' 2>/dev/null || echo 0)"
            [ "$n" -ge 4 ] && break
            [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::release $tag has no msi or AppImage files"; exit 1; }
            echo "waiting for the files of $tag ($i/100)"; sleep 60
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Testing release $tag" | tee -a "$GITHUB_STEP_SUMMARY"

  windows:
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the release files
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dl
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --name pkg-windows-x64 --dir dl
            rm -f dl/*selftest* dl/panoply-cli-*
          else
            gh release download "$TAG" --dir dl --pattern '*-windows-x64.msi' --pattern '*-windows-x64.zip' --pattern SHA256SUMS
            (cd dl && sha256sum -c SHA256SUMS --ignore-missing)
          fi
          ls -l dl
      - name: Install, launch, screenshot, close
        shell: powershell
        run: ./.github/scripts/desktop-smoke-windows.ps1 -Dir dl -Out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-smoke-windows
          path: out
          if-no-files-found: warn

  linux:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the release files
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dl
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --name pkg-linux-x64 --dir dl
            rm -f dl/panoply-cli-* dl/*.tar.gz
          else
            gh release download "$TAG" --dir dl --pattern '*-linux-x64.AppImage' --pattern SHA256SUMS
            (cd dl && sha256sum -c SHA256SUMS --ignore-missing)
          fi
          ls -l dl
      - name: Desktop packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox picom x11-utils x11-xserver-utils xdotool wmctrl \
            imagemagick dbus-x11 libvulkan1 mesa-vulkan-drivers vulkan-tools libxkbcommon-x11-0 libxcb-xkb1 \
            fontconfig strace fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji fonts-cantarell
      - name: Launch, screenshot, close
        run: bash ./.github/scripts/desktop-smoke-linux.sh dl out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-smoke-linux
          path: out
          if-no-files-found: warn
