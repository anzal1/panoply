name: Launch captures

# Renders the real app's windows offscreen (nothing is shown) and keeps the raw frames as an artifact, for the
# launch film (docs/launch). macOS only, because the renders use Metal. Run by hand only.
#   gh workflow run launch-captures.yml --ref launch/video   (works once this file is on the default branch)
# Until then, GitHub only lets a push start it from the launch/video branch: change docs/launch/trigger/captures.txt
# (the modes to run) and push. It never runs on any other push.
on:
  push:
    branches: [launch/video]
    paths: [docs/launch/trigger/captures.txt]
  workflow_dispatch:
    inputs:
      modes:
        description: "Self-check modes to run, space separated (frames, review)"
        type: string
        default: "frames"

permissions:
  contents: read

concurrency:
  group: launch-captures-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PANOPLY_YES: "1"
  # The same quick profile apps/desktop/tools/selfcheck.sh uses.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_STRIP: "false"

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: launch-captures
          save-if: ${{ github.ref == 'refs/heads/launch/video' || github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: nasm
        run: command -v nasm >/dev/null || brew install nasm
      - name: Build the app with the snapshot feature
        run: cargo build --release --locked -p panoply-desktop --features snapshot
      - name: Metal probe
        run: system_profiler SPDisplaysDataType | head -20 || true
      - name: Render the frames offscreen
        run: |
          set -euo pipefail
          mkdir -p captures
          modes="${{ inputs.modes }}"
          [ -n "$modes" ] || modes="$(cat docs/launch/trigger/captures.txt)"
          for mode in $modes; do
            case "$mode" in
              frames)
                for a in dark light; do
                  mkdir -p "captures/frames-$a"
                  perl -e 'alarm 900; exec @ARGV' ./target/release/panoply-desktop --selfcheck-frames --out "captures/frames-$a" --appearance "$a"
                done ;;
              review)
                perl -e 'alarm 900; exec @ARGV' ./target/release/panoply-desktop --selfcheck-review --out captures/review ;;
              *) echo "unknown mode $mode"; exit 1 ;;
            esac
          done
          du -sh captures/* || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launch-captures
          path: captures
          retention-days: 14
