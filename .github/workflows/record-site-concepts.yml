name: record-site-concepts
# Records the immersive homepage concepts with software WebGL so nothing heavy runs on a laptop.
on:
  push:
    branches: [site/concepts]
    paths: ['site-concepts/**']
concurrency:
  group: record-site-concepts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Playwright and ffmpeg
        working-directory: site-concepts/_record
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
          npm init -y >/dev/null && npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Serve the concepts
        run: |
          python3 -m http.server 8080 --directory site-concepts >/tmp/serve.log 2>&1 &
          sleep 2 && curl -sf http://localhost:8080/05-panoply/index.html >/dev/null
      - name: Record
        working-directory: site-concepts/_record
        env: { OUT: ../../out, BASE: 'http://localhost:8080', ONLY: '05-panoply' }
        run: node record.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-concept-previews
          path: out/
          retention-days: 14
