name: Update package repos

# When a release is published, render the Homebrew cask and the Scoop manifest from its assets and push
# them to the tap (anzal1/homebrew-panoply) and the bucket (anzal1/scoop-panoply). Skips with a notice
# until the secret PACKAGE_REPOS_TOKEN exists. Setup: packaging/README.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to the package repos, e.g. v0.1.0-beta.1"
        required: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      OWNER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ github.token }}
      PACKAGE_REPOS_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
      NOTARIZED: ${{ vars.PANOPLY_MACOS_NOTARIZED }}
    steps:
      - name: Check the token
        id: gate
        run: |
          if [ -z "$PACKAGE_REPOS_TOKEN" ]; then
            echo "::notice title=Package repos not updated::The secret PACKAGE_REPOS_TOKEN is not set. See packaging/README.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.skip != 'true'
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - name: Render the manifests from the release assets
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir release
          python3 -I packaging/scripts/render_manifests.py --version "$version" --repo "$GITHUB_REPOSITORY" \
            --sums release/SHA256SUMS --out manifests --macos-notarized "${NOTARIZED:-0}"
      - name: Push to the tap and the bucket
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          version="${TAG#v}"
          push_to() {  # repo, source file, destination path inside the repo
            local repo="$1" src="$2" dest="$3"
            git clone --depth 1 "https://x-access-token:${PACKAGE_REPOS_TOKEN}@github.com/${OWNER}/${repo}.git" "work/$repo"
            mkdir -p "work/$repo/$(dirname "$dest")"
            cp "$src" "work/$repo/$dest"
            git -C "work/$repo" config user.name "panoply release bot"
            git -C "work/$repo" config user.email "actions@users.noreply.github.com"
            git -C "work/$repo" add "$dest"
            if git -C "work/$repo" diff --cached --quiet; then
              echo "$repo already up to date"
            else
              git -C "work/$repo" commit -q -m "panoply $version"
              git -C "work/$repo" push -q origin HEAD
            fi
          }
          push_to homebrew-panoply manifests/homebrew/panoply.rb Casks/panoply.rb
          push_to scoop-panoply manifests/scoop/panoply.json bucket/panoply.json
