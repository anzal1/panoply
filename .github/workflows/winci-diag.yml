name: winci-diag
on:
  push:
    branches: [fix/windows-ci]
    paths: [".github/workflows/winci-diag.yml"]
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Corpus
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python -I tests/corpus/fetch.py --kind pdf,image
          python tests/corpus/generate.py --kind pdf,image || true
      - name: ocr probe
        if: always() && matrix.os == 'windows-latest'
        run: cargo test -p panoply-ocr --test zz_diag -- --nocapture --test-threads=1
