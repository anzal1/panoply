[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop"]
# Module projects (templates, examples, kill-test output) are standalone Cargo projects that
# build for wasm32-wasip2, so they stay out of the host workspace.
exclude = ["modules", "crates/panoply-wasm/tests/fixtures", "apps/desktop/patches/gpui-base"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anzal1/panoply"
homepage = "https://github.com/anzal1/panoply"
publish = false

# Small dependency tree on purpose. Every addition must be permissively
# licensed (see deny.toml) and justified against the idle-memory budget.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
infer = "0.22"
sha2 = "0.11"
# Pinned to the 49 line. Only the runtime, the compiler and the component model are on:
# no async, no GC, no profiler, no parallel compile threads.
wasmtime = { version = "49", default-features = false, features = ["runtime", "cranelift", "winch", "component-model", "std"] }
wasmtime-wasi = { version = "49", default-features = false, features = ["p2"] }

# PDF engine (ADR 0002: every dependency permissive). pdfium is loaded at run time from a
# checksum-pinned download, never linked or committed. lopdf only repairs damaged files.
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_7881", "thread_safe"] }
lopdf = { version = "0.45", default-features = false }
miniz_oxide = "0.9"
zune-jpeg = "0.5"
zune-core = "0.5"
jpeg-encoder = "0.7"
png = "0.18"
weezl = "0.2"

panoply-core = { path = "crates/panoply-core" }
panoply-pdf = { path = "crates/panoply-pdf" }
panoply-image = { path = "crates/panoply-image" }
panoply-id = { path = "crates/panoply-id" }
panoply-ocr = { path = "crates/panoply-ocr" }
panoply-media = { path = "crates/panoply-media" }
panoply-vision = { path = "crates/panoply-vision" }
panoply-manifest = { path = "crates/panoply-manifest" }
panoply-convert = { path = "crates/panoply-convert" }
panoply-host = { path = "crates/panoply-host" }
panoply-share = { path = "crates/panoply-share" }
panoply-mcp = { path = "crates/panoply-mcp" }
panoply-wasm = { path = "crates/panoply-wasm" }
panoply-disk = { path = "crates/panoply-disk" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwind, not abort: MozJPEG (panoply-image) reports a corrupt JPEG by unwinding, and with
# panic = "abort" one bad file would kill the whole process instead of showing a plain error.
panic = "unwind"
strip = true

# Prerelease tags (v0.1.0-beta.2, v0.2.0-rc.1) build with this profile: the release profile with thin
# instead of fat LTO, which links noticeably faster. Stable tags use `release` with fat LTO. See
# .github/workflows/release.yml, which picks the profile from the tag.
[profile.beta]
inherits = "release"
lto = "thin"

[profile.dev]
debug = "line-tables-only"

# Dependencies (wasmtime above all, which compiles every community module before it runs)
# are optimized even in dev builds, so tests and the kill test measure real module speed.
[profile.dev.package."*"]
opt-level = 2

# The PDF engine does real per-byte work (parsing, recoding, SSIM), so it is optimized in dev
# builds too. Tests on the 300 MB corpus file would otherwise take minutes.
[profile.dev.package.panoply-pdf]
opt-level = 3

# The image engine does per-pixel work (resampling, SSIM, quantizing) and its tests run on
# multi-megapixel files, so it is optimized in dev builds too.
[profile.dev.package.panoply-image]
opt-level = 3

# The media engine does real per-sample and per-pixel work (loudness metering, HDR tone-map
# tables, MP4 table rebuilding), so it is optimized in dev builds too.
[profile.dev.package.panoply-media]
opt-level = 3

# The OCR engine does real per-pixel work (detection post-processing, image preparation) and its
# tests run recognition on page-sized images, so it is optimized in dev builds too.
[profile.dev.package.panoply-ocr]
opt-level = 3

# The ID modules do per-pixel work (face crops, background cut, thresholding) in tests on
# multi-megapixel portraits, so they are optimized in dev builds too.
[profile.dev.package.panoply-id]
opt-level = 3

# The vision modules (background removal, erase, watermark, upscale) run small ONNX models and
# do per-pixel work (mask refinement, tiling, blending), so they are optimized in dev builds too.
[profile.dev.package.panoply-vision]
opt-level = 3

# CI only (cargo ... --profile ci, see .github/workflows/ci.yml). The dev profile with no debug info
# (smaller objects, much faster links, a smaller build cache to restore), no incremental state (every
# CI build starts from a restored cache, so incremental data is dead weight) and debug info stripped
# from the std rlibs that get linked in. Optimization levels are repeated from the dev profile above
# on purpose: package overrides are per profile and are not inherited. Keep the two lists in step.
[profile.ci]
inherits = "dev"
debug = false
incremental = false
strip = "debuginfo"

[profile.ci.package."*"]
opt-level = 2

[profile.ci.package.panoply-pdf]
opt-level = 3

[profile.ci.package.panoply-image]
opt-level = 3

[profile.ci.package.panoply-media]
opt-level = 3

[profile.ci.package.panoply-ocr]
opt-level = 3

[profile.ci.package.panoply-id]
opt-level = 3

[profile.ci.package.panoply-vision]
opt-level = 3
