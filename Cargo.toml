[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anzal1/panoply"
publish = false

# Small dependency tree on purpose. Every addition must be permissively
# licensed (see deny.toml) and justified against the idle-memory budget.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
infer = "0.22"
sha2 = "0.11"

panoply-core = { path = "crates/panoply-core" }
panoply-manifest = { path = "crates/panoply-manifest" }
panoply-convert = { path = "crates/panoply-convert" }
panoply-host = { path = "crates/panoply-host" }
panoply-mcp = { path = "crates/panoply-mcp" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = "line-tables-only"
