[package]
name = "panoply-desktop"
description = "The Panoply desktop app: command bar and app window, one GPUI app for macOS, Windows and Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["desktop-app","gpui","pdf","image","privacy"]
categories = ["gui","multimedia"]

[lib]
name = "panoply_desktop"
path = "src/lib.rs"

[[bin]]
name = "panoply-desktop"
path = "src/main.rs"

[features]
# Dev only: offscreen render to PNG and the headless self check (`panoply-desktop --selfcheck`).
# Never part of a shipping build.
snapshot = ["gpui/test-support", "gpui_platform/test-support", "dep:png"]

[dependencies]
panoply-core.workspace = true
panoply-manifest.workspace = true
panoply-convert.workspace = true
panoply-image.workspace = true
panoply-disk.workspace = true
panoply-host.workspace = true
panoply-wasm.workspace = true
panoply-find.workspace = true
panoply-share.workspace = true
serde.workspace = true
serde_json.workspace = true

# GPUI from the crates.io snapshot that GPUI Kit pins (ADR 0001 amendment). The kit's `gpui-base`
# input is vendored in patches/gpui-base with our grapheme patch applied (patches/*.diff).
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "runtime_shaders"] }
gpui-base = { path = "patches/gpui-base" }
global-hotkey = "0.9"
futures = "0.3"
# The share engine runs the LocalSend node on its own runtime, started only while the Share screen is open
# or receiving is on. Same features panoply-share already pulls in.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time"] }
anyhow = "1"
# The result card hands a decoded preview to GPUI as an `image::Frame`; the codecs come from panoply-image.
image = { version = "0.25", default-features = false, features = ["png"] }
png = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The notification-area icon that keeps the background app visible and quittable on Windows
# (MIT OR Apache-2.0; it only pulls in muda, crossbeam-channel and windows-sys).
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }
raw-window-handle = "0.6"

# gpui-pre-linux ships with both display backends off unless asked (its `default` is dropped by
# gpui-pre-platform). Without these two the Linux build has no X11 and no Wayland: the process starts,
# opens no window and sits there. Found by .github/workflows/desktop-smoke.yml on v0.1.1-beta.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["x11", "wayland"] }
# Keyboard focus for the command bar on X11 (see platform::x11_take_focus). Same version GPUI uses.
x11rb = { version = "0.14", default-features = false }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
raw-window-handle = "0.6"

[dev-dependencies]
png.workspace = true

# Everything inherited from the workspace except `unsafe_code`: the AppKit window helpers in
# src/platform/ need Objective-C messages. Unsafe is denied everywhere else in this crate.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
