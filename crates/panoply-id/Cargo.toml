[package]
name = "panoply-id"
description = "ID, forms and document photos: passport and visa photo, print sheet, signature cleaner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["passport-photo", "id-photo", "image", "forms"]
categories = ["multimedia::images", "graphics"]

[dependencies]
panoply-core.workspace = true
panoply-manifest.workspace = true
panoply-image.workspace = true
panoply-pdf.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
sha2.workspace = true

# ONNX Runtime (MIT OR Apache-2.0), only as a loader: the runtime library is never linked and
# never shipped. The first job that needs the YuNet face model downloads the pinned runtime and
# model with a checksum and opens them at run time (src/runtime.rs).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }

# Apple Vision (faces, landmarks, the subject mask) is the engine on macOS (ADR 0004).
[target.'cfg(target_os = "macos")'.dependencies]
panoply-platform-macos = { path = "../panoply-platform-macos" }

[dev-dependencies]
png.workspace = true

[lints]
workspace = true
