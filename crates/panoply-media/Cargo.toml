[package]
name = "panoply-media"
description = "The Panoply video and audio engine: stream copy first, OS hardware encoders, an LGPL ffmpeg helper process, and the wave 1 media operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["video", "audio", "ffmpeg", "transcode"]
categories = ["multimedia::video", "multimedia::audio"]

[dependencies]
panoply-core.workspace = true
panoply-manifest.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
sha2.workspace = true
# RNNoise in pure Rust (BSD-3-Clause), the model weights are inside the crate. No default features:
# they only add the command line tool and its wav reader.
nnnoiseless = { version = "0.5", default-features = false }

[lints]
workspace = true
