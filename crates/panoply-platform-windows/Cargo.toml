[package]
name = "panoply-platform-windows"
description = "The only crate in the workspace allowed to use unsafe on Windows: file change events from the NTFS USN journal and ReadDirectoryChangesW behind a safe API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["windows", "ntfs", "usn", "watcher"]
categories = ["os::windows-apis", "filesystem"]

[target.'cfg(windows)'.dependencies]
# Raw bindings only (no wrappers, no macros). Already in the tree through other crates.
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
] }

# Not the workspace lints: this crate is the one place `unsafe` is allowed on Windows, and every unsafe
# block in it carries a SAFETY comment. See the crate docs.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# UTF-16 and little endian decoding of byte buffers reads better with chunks_exact than with as_chunks.
chunks_exact_to_as_chunks = "allow"
