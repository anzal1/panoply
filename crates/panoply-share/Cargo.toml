[package]
name = "panoply-share"
description = "LocalSend v2 compatible device sharing and a QR browser fallback for Panoply"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
panoply-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
clap.workspace = true

tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "io-util", "fs", "time", "sync", "macros", "signal"] }
hyper = { version = "1", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"
getrandom = "0.3"
crc32fast = "1"
qrcode = { version = "0.14", default-features = false }
fs4 = { version = "1", default-features = false }

[lints]
workspace = true
