[package]
name = "panoply-smoke"
description = "Smoke matrix: every module over real corpus files, through the same path the desktop app uses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["smoke-test", "corpus", "testing"]
categories = ["development-tools::testing"]

[lib]
name = "panoply_smoke"
path = "src/lib.rs"

[[bin]]
name = "panoply-smoke"
path = "src/main.rs"

[dependencies]
panoply-core.workspace = true
panoply-manifest.workspace = true
panoply-host.workspace = true
panoply-bench = { path = "../panoply-bench" }
panoply-desktop = { path = "../../apps/desktop" }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
