[package]
name = "panoply-tts"
description = "Text to speech on the operating system's own voices (AVSpeechSynthesizer, Windows.Media.SpeechSynthesis), chunked, cancellable, written to a WAV file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["tts", "speech", "audio"]
categories = ["multimedia::audio", "text-processing"]

[dependencies]
panoply-core.workspace = true
panoply-pdf.workspace = true
thiserror.workspace = true
pdfium-render.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
panoply-platform-macos = { path = "../panoply-platform-macos" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_SpeechSynthesis",
    "Storage_Streams",
    "Win32_System_Com",
    "Win32_System_WinRT",
] }

# Not the workspace lints: the Windows engine has two small unsafe calls (RoInitialize and
# CoIncrementMTAUsage), allowed on that function with a SAFETY note, like the OCR engine.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Sample loops read better with chunks_exact than with as_chunks.
chunks_exact_to_as_chunks = "allow"
