[package]
name = "panoply-vision"
description = "Image AI modules (remove background, erase, remove watermark, upscale): a small model manager and ONNX Runtime inference, OS engines first"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["onnx", "background-removal", "upscale", "inpainting"]
categories = ["multimedia::images", "science"]

[dependencies]
panoply-core.workspace = true
panoply-manifest.workspace = true
panoply-image.workspace = true
serde_json.workspace = true
sha2.workspace = true
miniz_oxide.workspace = true
fast_image_resize = "6"
# ONNX Runtime is loaded at run time from a checksum-pinned download, never linked: no
# download-binaries feature, no build-time network, nothing resident until the first job that
# needs a model. Same `ort` line and runtime release (1.28.3) as the OCR and ID crates, so one
# runtime library serves the whole process.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }

# Apple Vision's foreground mask is the engine on macOS (ADR 0004); CoreML runs the models that
# gain from it.
[target.'cfg(target_os = "macos")'.dependencies]
panoply-platform-macos = { path = "../panoply-platform-macos" }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "coreml"] }

# DirectML where the runtime build has it; the CPU provider otherwise.
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "directml"] }

[lints]
workspace = true
