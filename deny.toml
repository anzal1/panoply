# cargo-deny policy. CI runs `cargo deny check`.
# Philosophy: permissive licenses only, small dependency tree.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    # MPL-2.0 is file-level copyleft. Allowed only for separately shipped
    # helpers, and each use must be reviewed by hand.
    "MPL-2.0",
]
# GPL, LGPL and AGPL (any version) are denied explicitly: they are not in the
# allow list above and must never be added. Anything not listed is rejected.

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
