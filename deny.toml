# cargo-deny policy. CI runs `cargo deny check`.
# Philosophy: permissive licenses only, small dependency tree.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    # NCSA (University of Illinois) is BSD-like, attribution only. It comes in through
    # libfuzzer-sys, which rav1e (the AVIF encoder behind panoply-image) lists for its fuzzing
    # feature; it is not compiled into any Panoply binary.
    "NCSA",
    # IJG is the libjpeg license: BSD-like, attribution only. jpeg-encoder (the pure Rust JPEG
    # encoder behind PDF image recompression) is "(MIT OR Apache-2.0) AND IJG". Shipping it
    # means keeping the IJG credit line in the docs (see crates/panoply-pdf/README.md).
    "IJG",
    # MPL-2.0 is file-level copyleft. Allowed only for separately shipped
    # helpers, and each use must be reviewed by hand.
    "MPL-2.0",
]
# GPL, LGPL and AGPL (any version) are denied explicitly: they are not in the
# allow list above and must never be added. Anything not listed is rejected.

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# Every entry is an "unmaintained" notice, not a vulnerability. The rule: an advisory may be ignored
# only with the dependency path, why it cannot be upgraded, what the exposure is, and when to look
# again. Run `cargo deny check advisories` after every `cargo update`.
ignore = [
    # paste is a build-time proc macro that its author stopped maintaining. No vulnerability is
    # reported and it is not linked. It arrives through rav1e (ravif, AVIF encoding in
    # panoply-image). Revisit when rav1e moves to pastey or drops it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time macro, no vulnerability; comes in through rav1e" },

    # rustybuzz (text shaping) and ttf-parser (font parsing) come in through GPUI: gpui-pre 0.3.9
    # depends on usvg 0.46, which depends on rustybuzz 0.20 and ttf-parser 0.25, and gpui-pre's
    # Linux text system (cosmic-text, fontdb) depends on ttf-parser too. gpui-pre 0.3.9 is the
    # newest release on crates.io (checked 2026-10-14) and the desktop app pins it with `=0.3.9`
    # because GPUI Kit does. usvg's maintained versions (0.47 and later) are a different semver
    # line, so a lock file update cannot reach them. The advisories name harfrust and skrifa as
    # the replacements; both need a GPUI release that has moved. Exposure: neither crate has a
    # reported vulnerability. They parse the bundled icon SVGs and the fonts installed on the
    # user's own machine, never a file a stranger sends. Revisit when GPUI publishes a release
    # past 0.3.9, and every beta.
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is unmaintained, no vulnerability; pinned by gpui-pre 0.3.9 through usvg 0.46, no newer GPUI exists yet" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained, no vulnerability; pinned by gpui-pre 0.3.9 through usvg 0.46 and cosmic-text, no newer GPUI exists yet" },

    # zvariant, zvariant_derive and zbus_names (D-Bus, Linux only) come in through zbus 5.19, which gpui-pre-linux 0.3.9
    # pulls in (directly and through accesskit_unix, ashpd, oo7 and notify-rust), and gpui-base through
    # ashpd. Published 2026-10-18, unmaintained only: both crates were merged into zbus 6. No
    # vulnerability is reported. Revisit when gpui-pre-linux moves to zbus 6, and every beta.
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained only, merged into zbus 6; pulled in by gpui-pre-linux 0.3.9 through zbus 5.19; drop when gpui-pre-linux moves to zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained only, merged into zbus 6; pulled in by gpui-pre-linux 0.3.9 through zbus 5.19; drop when gpui-pre-linux moves to zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained only, merged into zbus 6; pulled in by gpui-pre-linux 0.3.9 through zbus 5.19; drop when gpui-pre-linux moves to zbus 6" },
]

# Fixed instead of ignored, kept here so nobody re-adds them by accident:
#   RUSTSEC-2024-0384 instant: removed from the vendored gpui-base (std::time is the same type).
#   RUSTSEC-2025-0134 rustls-pemfile: it was a dev-dependency of the vendored gpui-base; the
#     vendored manifest no longer has dev-dependencies (apps/desktop/patches/gpui-base/PANOPLY-CHANGES.md).
