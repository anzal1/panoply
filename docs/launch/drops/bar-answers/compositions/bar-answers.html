<!doctype html>
<html><head><meta charset="UTF-8"></head><body>
<template>
  <style>
    @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Variable-latin.woff2") format("woff2"); font-weight: 100 900; }
    @font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono-latin.woff2") format("woff2"); font-weight: 100 900; }

    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #fff; }
    #ground { position: absolute; inset: 0; background: #0c0c0f; }
    #blue { position: absolute; inset: 0; background: #2d6cdf; opacity: 0; }
    #lift { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 70% at 50% 46%, rgba(255,255,255,.09), rgba(255,255,255,0) 100%); opacity: 0; }
    #grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .4; pointer-events: none; }

    /* 1. the pain, in Midnight */
    #pain { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
    .pl { font-size: 150px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; white-space: nowrap; color: #ececf1; opacity: 0; }

    /* 2. keycaps (the launch film's, same sizes) */
    .caps { position: absolute; left: 0; right: 0; top: 84px; height: 104px; display: flex; justify-content: center; gap: 24px; opacity: 0; }
    .cap-label { position: absolute; left: 0; right: 0; top: 122px; line-height: 40px; text-align: center; font-family: "Geist Mono", ui-monospace, monospace; font-size: 36px; font-weight: 500; color: rgba(255,255,255,.9); white-space: nowrap; }
    .key { height: 104px; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 52px; font-weight: 600; letter-spacing: -0.02em; color: #fff;
      background: rgba(255,255,255,.16); border: 2px solid rgba(255,255,255,.45);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 18px 40px rgba(8,24,70,.28); }

    /* captions above the bar */
    .cap-line { position: absolute; left: 0; right: 0; top: 40px; text-align: center; font-size: 68px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.05; white-space: nowrap; color: #fff; opacity: 0; }
    .cap-line .v { font-weight: 500; opacity: .82; }

    /* the bar: real renders as plates. 1440 x 920 source, shown at 1100 wide */
    #push { position: absolute; left: 410px; top: 270px; width: 1100px; height: 703px; transform-origin: 50% 0%; }
    #open { position: absolute; inset: 0; transform-origin: 50% 50%; visibility: hidden; }
    #plate { position: absolute; inset: 0; overflow: hidden; border-radius: 28.8px; background: #f1f2f5;
      box-shadow: 0 0 0 1.5px rgba(255,255,255,.35), 0 40px 100px rgba(8,24,70,.5); }
    #plate img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; opacity: 0; }

    /* 3. proof */
    #proof { position: absolute; inset: 0; }
    .pcol { position: absolute; top: 290px; width: 600px; text-align: center; opacity: 0; }
    .pnum { font-size: 200px; font-weight: 700; letter-spacing: -0.045em; line-height: 1; white-space: nowrap; }
    .pnum small { font-size: 108px; letter-spacing: -0.03em; font-weight: 600; margin-left: 10px; }
    .plab { margin-top: 30px; font-family: "Geist Mono", ui-monospace, monospace; font-size: 38px; font-weight: 500; line-height: 1.35; color: rgba(255,255,255,.9); }
    #pnote { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font-size: 56px; font-weight: 600; letter-spacing: -0.02em; color: rgba(255,255,255,.92); opacity: 0; }

    /* 4. end card (the launch film's) */
    #end { position: absolute; inset: 0; opacity: 0; }
    #fan { position: absolute; left: 790px; top: 70px; width: 340px; height: 340px; }
    #fan svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .eline { position: absolute; left: 0; right: 0; text-align: center; color: #fff; white-space: nowrap; }
    #ename { top: 420px; font-weight: 700; font-size: 170px; letter-spacing: -0.04em; line-height: 0.98; }
    #etag { top: 660px; font-weight: 500; font-size: 60px; letter-spacing: -0.015em; line-height: 1.1; color: rgba(255,255,255,.9); }
    #eurl { top: 800px; font-family: "Geist Mono", ui-monospace, monospace; font-weight: 500; font-size: 56px; letter-spacing: -0.01em; line-height: 1.1; color: rgba(255,255,255,.92); }
  </style>

  <div id="root" data-composition-id="bar-answers" data-width="1920" data-height="1080">
    <div id="ground"></div>
    <div id="blue"></div>
    <div id="lift"></div>
    <img id="grain" src="assets/grain/grain.png" alt="">

    <div id="pain">
      <div class="pl" id="pl1">A quick sum.</div>
      <div class="pl" id="pl2">A unit conversion.</div>
      <div class="pl" id="pl3">Another browser tab.</div>
    </div>

    <div class="caps" id="caps-mac"><div class="key" style="width:104px">&#x2325;</div><div class="key" style="width:250px">Space</div><div class="cap-label">macOS</div></div>
    <div class="caps" id="caps-win"><div class="key" style="width:150px">Ctrl</div><div class="key" style="width:130px">Alt</div><div class="key" style="width:250px">Space</div><div class="cap-label">Windows and Linux</div></div>

    <div class="cap-line" id="capA1">Do the math.</div>
    <div class="cap-line" id="capA2">Return copies <span class="v">360</span></div>
    <div class="cap-line" id="capB1">Convert units.</div>
    <div class="cap-line" id="capB2">Return copies <span class="v">22.2222</span></div>
    <div class="cap-line" id="capC1">Ask for a tool.</div>
    <div class="cap-line" id="capC2">A tool search stays a tool search.</div>

    <div id="push" data-layout-allow-overflow>
      <div id="open">
        <div id="plate" data-layout-allow-overflow>
          <img id="base" src="assets/plates/base.png" alt="">
          <img id="Ah" src="assets/plates/A-head.png" alt=""><img id="Ab" src="assets/plates/A-body.png" alt="">
          <img id="Bh" src="assets/plates/B-head.png" alt=""><img id="Bb" src="assets/plates/B-body.png" alt="">
          <img id="Ch" src="assets/plates/C-head.png" alt=""><img id="Cb" src="assets/plates/C-body.png" alt="">
        </div>
      </div>
    </div>

    <div id="proof">
      <div class="pcol" id="pc1" style="left:100px"><div class="pnum">&lt;1<small>ms</small></div><div class="plab">per query,<br>asserted by a test</div></div>
      <div class="pcol" id="pc2" style="left:660px"><div class="pnum">8</div><div class="plab">kinds of units,<br>length to temperature</div></div>
      <div class="pcol" id="pc3" style="left:1220px"><div class="pnum">29</div><div class="plab">calc and search<br>tests pass</div></div>
      <div id="pnote">Pure Rust. No network.</div>
    </div>

    <div id="end">
      <div id="fan"></div>
      <div class="eline" id="ename">Panoply</div>
      <div class="eline" id="etag">Free. Open source. Runs on your computer.</div>
      <div class="eline" id="eurl">github.com/anzal1/panoply</div>
    </div>
  </div>

  <script>
    (() => {
      const F = 1 / 60;
      const XO = 'expo.out';
      const tl = gsap.timeline({ paused: true });

      /* the fan mark, same path as docs/assets/panoply-mark.svg, three cards about one pivot (as the film's end card) */
      const CARD = 'M316.414 65.569C331.243 65.569 338.657 65.569 344.722 67.279A45.552 45.552 0 0 1 376.199 98.757C377.909 104.821 377.909 112.235 377.909 127.065L377.909 382.508C377.909 397.338 377.909 404.752 376.199 410.816A45.552 45.552 0 0 1 344.722 442.294C338.657 444.004 331.243 444.004 316.414 444.004L229.163 444.004C214.334 444.004 206.919 444.004 200.855 442.294A45.552 45.552 0 0 1 169.378 410.816C167.668 404.752 167.668 397.338 167.668 382.508L167.668 127.065C167.668 112.235 167.668 104.821 169.378 98.757A45.552 45.552 0 0 1 200.855 67.279C206.919 65.569 214.334 65.569 229.163 65.569Z';
      const PIVOT = '272.788 612.197';
      document.getElementById('fan').innerHTML =
        '<svg viewBox="0 0 544 544" fill="none">' +
        '<path id="cardL" d="' + CARD + '" fill="rgba(255,255,255,.42)"/>' +
        '<path id="cardR" d="' + CARD + '" fill="rgba(255,255,255,.62)"/>' +
        '<path id="cardF" d="' + CARD + '" fill="#ffffff"/></svg>';
      gsap.set('#cardL', { rotation: -12, svgOrigin: PIVOT });
      gsap.set('#cardR', { rotation: 12, svgOrigin: PIVOT });

      const land = (sel, t, o = {}) => {
        const ir = t === 0;
        tl.fromTo(sel, { x: o.x || 0, y: o.y === undefined ? 24 : o.y }, { x: 0, y: 0, duration: o.dur || 0.45, ease: XO, immediateRender: ir }, t);
        tl.fromTo(sel, { opacity: 0.5 }, { opacity: 1, duration: 0.08, ease: 'power1.out', immediateRender: ir }, t);
      };
      const show = (sel, t) => tl.set(sel, { opacity: 1 }, t);
      const hide = (sel, t) => tl.set(sel, { opacity: 0 }, t);
      const swapCap = (from, to, t) => { hide(from, t - F); land(to, t - F, { y: 14, dur: 0.35 }); };

      /* ---------- 1. the pain, 0 to 2.8 s, in Midnight ---------- */
      land('#pl1', 0.15, { y: 30 });
      land('#pl2', 0.8, { y: 30 });
      land('#pl3', 1.45, { y: 30 });
      tl.to('#pl1', { color: '#6f6f7a', duration: 0.3, ease: 'none' }, 0.8);
      tl.to('#pl2', { color: '#6f6f7a', duration: 0.3, ease: 'none' }, 1.45);
      tl.fromTo('#pain', { scale: 1 }, { scale: 1.03, duration: 2.65, ease: 'none', immediateRender: false }, 0);

      /* ---------- 2. THE DROP at 2.8 s: hard cut to brand blue; keycaps in; the bar opens at 3.05 ---------- */
      tl.set('#blue', { opacity: 1 }, 2.8);
      tl.set('#lift', { opacity: 1 }, 2.8);
      tl.set('#pain', { opacity: 0 }, 2.8);
      land('#caps-mac', 2.8, { y: 30 });
      tl.set('#open', { visibility: 'visible' }, 3.05);
      tl.fromTo('#open', { scale: 0.96 }, { scale: 1, duration: 0.5, ease: XO, immediateRender: false }, 3.05);
      tl.fromTo('#open', { opacity: 0.5 }, { opacity: 1, duration: 0.08, ease: 'power1.out', immediateRender: false }, 3.05);
      /* the Mac row is cut and the Windows and Linux row lands on the same frame, never two rows at once */
      hide('#caps-mac', 3.65 - F);
      land('#caps-win', 3.65 - F, { y: 16, dur: 0.3 });
      tl.fromTo('#caps-win', { opacity: 1 }, { opacity: 0, duration: 0.2, ease: 'none', immediateRender: false }, 4.45);

      /* camera: a slow drift while the bar settles, then the push to 1.28 that lifts the plate to top 144 so the whole bar stays in frame */
      const SC = 1.28, LIFT = -126;
      tl.fromTo('#push', { scale: 1 }, { scale: 1.03, duration: 1.45, ease: 'none', immediateRender: false }, 3.05);
      tl.fromTo('#push', { scale: 1.03, y: 0 }, { scale: SC, y: LIFT, duration: 0.8, ease: 'power2.inOut', immediateRender: false }, 4.5);
      tl.fromTo('#push', { scale: SC, y: LIFT }, { scale: SC + 0.012, y: LIFT, duration: 8.3, ease: 'none', immediateRender: false }, 5.3);

      /* ---------- the typing: real glyphs of the real renders, one character per keystroke ---------- */
      const BOUNDS = {
        A: [115, 141, 176, 176, 208, 222, 222, 253, 278, 301, 1440],
        B: [122, 145, 145, 168, 168, 191, 212, 212, 1440],
        C: [112, 133, 155, 190, 213, 213, 245, 267, 1440]
      };
      const clip = (id, xb) => `inset(0% ${(100 - xb / 14.4).toFixed(3)}% 0% 0%)`;
      const type = (key, t0, step) => {
        const head = '#' + key + 'h', body = '#' + key + 'b';
        gsap.set(head, { clipPath: clip(head, 95) });
        tl.set(head, { opacity: 1, clipPath: clip(head, 95) }, t0 - 0.002);
        BOUNDS[key].forEach((xb, i) => tl.set(head, { clipPath: clip(head, xb) }, t0 + i * step));
        return t0 + (BOUNDS[key].length - 1) * step;     /* the last keystroke, when the answer lands */
      };
      const land_body = (key, t) => {
        const body = '#' + key + 'b';
        tl.fromTo(body, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: 'power1.out', immediateRender: false }, t);
      };
      const clear = (key, t) => { hide('#' + key + 'h', t); hide('#' + key + 'b', t); };

      gsap.set('#base', { opacity: 1 });
      /* A: "15% of 2400" */
      const A0 = 5.4, A_STEP = 0.085;
      land('#capA1', 5.3, { y: 20, dur: 0.5 });
      const A_END = type('A', A0, A_STEP);
      land_body('A', A_END);
      swapCap('#capA1', '#capA2', 7.1);
      clear('A', 8.4 - F);

      /* B: "72 f to c" */
      const B0 = 8.5, B_STEP = 0.095;
      swapCap('#capA2', '#capB1', 8.4);
      const B_END = type('B', B0, B_STEP);
      land_body('B', B_END);
      swapCap('#capB1', '#capB2', 10.0);
      clear('B', 11.2 - F);

      /* C: "merge pdf", a tool, not a number */
      const C0 = 11.3, C_STEP = 0.095;
      swapCap('#capB2', '#capC1', 11.2);
      const C_END = type('C', C0, C_STEP);
      land_body('C', C_END);
      swapCap('#capC1', '#capC2', 12.35);

      /* ---------- the bar leaves, the proof lands (13.7 to 15.5) ---------- */
      tl.to(['#open', '#capC2'], { opacity: 0, duration: 0.3, ease: 'power2.in', immediateRender: false }, 13.45);
      land('#pc1', 13.8, { y: 30 });
      land('#pc2', 14.15, { y: 30 });
      land('#pc3', 14.5, { y: 30 });
      land('#pnote', 14.9, { y: 20 });
      tl.fromTo('#proof', { scale: 1 }, { scale: 1.02, duration: 1.8, ease: 'none', immediateRender: false }, 13.8);
      tl.to('#proof', { opacity: 0, duration: 0.25, ease: 'power2.in', immediateRender: false }, 15.45);

      /* ---------- 4. end card, 15.7 s to the end ---------- */
      tl.set('#end', { opacity: 1 }, 15.7);
      gsap.set(['#etag', '#eurl'], { opacity: 0 });
      land('#ename', 15.7, { y: 30 });
      land('#fan', 15.7, { y: 30 });
      tl.fromTo('#cardL', { rotation: -12 }, { rotation: -20, duration: 0.6, ease: XO, svgOrigin: PIVOT, immediateRender: false }, 15.7);
      tl.fromTo('#cardR', { rotation: 12 }, { rotation: 20, duration: 0.6, ease: XO, svgOrigin: PIVOT, immediateRender: false }, 15.7);
      land('#etag', 16.05, { y: 24 });
      land('#eurl', 16.25, { y: 24 });

      window.__timelines["bar-answers"] = tl;
    })();
  </script>
</template>
</body></html>
