<!doctype html>
<html><head><meta charset="UTF-8"></head><body>
<template>
  <style>
    @font-face{font-family:"Geist";src:url("assets/fonts/Geist-Variable-latin.woff2") format("woff2");font-weight:100 900}
    @font-face{font-family:"Geist Mono";src:url("assets/fonts/GeistMono-latin.woff2") format("woff2");font-weight:100 900}

    #root{position:absolute;inset:0;overflow:hidden;font-family:"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#fff;background:#0c0c0f}
    #root *{box-sizing:border-box}
    #root .fill{position:absolute;inset:0}
    #root .abs{position:absolute}
    #root .h1{font-weight:700;letter-spacing:-0.04em;line-height:1}
    #root .row{display:block;white-space:nowrap;opacity:0}
    #m-pain .row{opacity:1}
    #root b.w{color:#ff6961;font-weight:700}

    #m-ground{background:#2d6cdf;clip-path:inset(0 100% 0 0)}
    .win{position:absolute;border-radius:26px;overflow:hidden;background:#1c1c1f;box-shadow:0 0 0 1.5px rgba(255,255,255,.22),0 40px 110px rgba(8,24,70,.5);opacity:0}
    .chrome{position:absolute;left:0;right:0;top:0;height:68px;background:#161619;display:flex;align-items:center;padding:0 28px;gap:12px}
    .chrome i{width:16px;height:16px;border-radius:50%;background:#3a3a40;display:block}
    .chrome span{position:absolute;left:0;right:0;text-align:center;font-family:"Geist Mono",monospace;font-size:30px;color:#a9a9b3;font-weight:500}
    .body{position:absolute;left:0;right:0;top:68px;bottom:0}
    .blk{position:absolute;left:0;right:0}
    .tl{position:absolute;left:0;right:0;font-family:"Geist Mono",monospace;font-weight:500;color:#ececf1;white-space:pre;opacity:0;letter-spacing:-0.02em}
    .tl .d{color:#a9a9b3}
    .tl .t{color:#0a84ff;font-weight:600}
    .tl .ok{color:#30d158}
    .tl .u{color:#fff;font-weight:600}
    .chip{position:absolute;border-radius:26px;background:#2a2a30;box-shadow:0 0 0 2px rgba(255,255,255,.14);display:flex;align-items:center;gap:22px;font-family:"Geist Mono",monospace;font-weight:500;color:#ececf1;opacity:0;letter-spacing:-0.02em}
    .chip svg{flex:none;fill:none;stroke:#ff453a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .chip .sz{color:#30d158;font-weight:700}
    .chip .nm{white-space:pre;line-height:1.2}

    .lview{position:absolute;overflow:hidden}
    .lscroll{position:absolute;left:0;top:0}
    .tr{position:absolute;font-family:"Geist Mono",monospace;font-weight:600;color:#ececf1;letter-spacing:-0.02em;white-space:nowrap}
    .tr i{font-style:normal;color:#0a84ff}
    .vrule{position:absolute;width:1px;background:rgba(255,255,255,.12)}
    .st{position:absolute;opacity:0}
    .st .big{display:block;font-weight:700;letter-spacing:-0.05em;line-height:1;color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}
    .st .big small{letter-spacing:-0.03em;font-weight:600;color:#a9a9b3;margin:0 10px}
    .st .lab{display:block;font-weight:600;letter-spacing:-0.025em;color:rgba(255,255,255,.78);white-space:nowrap;margin-top:14px}

    #m-efan svg{width:100%;height:100%;display:block;overflow:visible}
    #m-grain{position:absolute;left:0;top:0;pointer-events:none;opacity:.08;mix-blend-mode:soft-light}
  </style>

  <div id="root" data-composition-id="mcp" data-width="__W__" data-height="__H__">
    <div id="m-ground" class="fill"></div>
    <div id="m-pain" class="fill"><div id="m-pcam" class="fill"><div id="m-pwords" class="abs h1"></div></div></div>
    <div id="m-s2" class="fill">
      <div id="m-head" class="abs h1"></div>
      <div id="m-cam" class="fill">
        <div id="m-win1" class="win"><div class="chrome"><i></i><i></i><i></i><span>agent session</span></div><div class="body" id="m-b1"></div></div>
        <div id="m-win2" class="win"><div class="chrome"><i></i><i></i><i></i><span>agent session</span></div><div class="body" id="m-b2"></div></div>
      </div>
    </div>
    <div id="m-hook" class="fill"><div id="m-hwords" class="abs h1"></div></div>
    <div id="m-end" class="fill"><div id="m-endcam" class="fill">
      <div id="m-efan" class="abs" style="opacity:0"></div>
      <div id="m-ename" class="abs h1" style="opacity:0">Panoply</div>
      <div id="m-eline" class="abs" style="opacity:0"></div>
      <div id="m-eurl" class="abs" style="opacity:0;font-family:'Geist Mono',monospace">github.com/anzal1/panoply</div>
    </div></div>
    <canvas id="m-grain" width="480" height="270" style="width:__W__px;height:__H__px"></canvas>
  </div>

  <script>
  (function () {
    const FMT = '__FORMAT__', wide = FMT === 'wide';
    const W = wide ? 1920 : 1080, H = wide ? 1080 : 1350;

    function build(D) {
      const $ = id => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const XO = 'expo.out', P1O = 'power1.out';
      const set = (el, css) => Object.assign((typeof el === 'string' ? $(el) : el).style, css);
      const px = o => { const r = {}; for (const k in o) r[k] = typeof o[k] === 'number' ? o[k] + 'px' : o[k]; return r; };

      const enter = (sel, t, o = {}) => {
        const d = o.dur || 0.5;
        tl.fromTo(sel, { y: o.y === undefined ? 26 : o.y, scale: o.s || 1 }, { y: 0, scale: 1, duration: d, ease: XO }, t);
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: P1O }, t);
      };
      const fadeOut = (sel, tStart, dur = 0.25) => tl.to(sel, { opacity: 0, duration: dur, ease: 'power1.in' }, tStart);

      /* ---------------- layouts ---------------- */
      const L = wide ? {
        pain: { size: 150, left: 200, rh: 150, rows: ['Agents still send you', 'to a <b class="w">website</b>', 'to merge a PDF.'] },
        head: { size: 110, top: 64, rh: 130, rows: ['Panoply is now an MCP server.'] },
        win: { left: 80, top: 250, w: 1760, h: 700 },
        pad: 44,
        p1: [{ s: 70, h: 104, html: `<span class="d">$</span> claude mcp add panoply -- panoply mcp` }, { s: 70, h: 104, html: `<span class="d">&gt;</span> <span class="u">merge these 2 PDFs under 1 MB</span>` }],
        p2: [{ s: 100, h: 140, html: `<span class="t">pdf_merge</span>` }, { s: 84, h: 116, html: `<span class="ok">✓</span> <span class="u">${D.merge.note}</span>` }],
        p3: [{ s: 100, h: 140, html: `<span class="t">pdf_compress</span>` }, { s: 84, h: 116, html: `<span class="ok">✓</span> <span class="u">${D.compress.note}</span>` }],
        chip: { s: 60, h: 112, lines: [D.compress.outName], iconS: 56, padX: 30 },
        win2: { left: 80, top: 90, w: 1760, h: 900 },
        list: { left: 0, top: 0, w: 800, h: 832, size: 60, rh: 104, padL: 44, hdr: 24 },
        stats: { left: 840, w: 880, st1: 60, st2: 440, big1: 190, big2: 124, small: 56, lab: 64 },
        hook: { size: 124, left: 200, rh: 150, groups: [['Your agent can now do'], ['31 built-in file jobs'], ['on your computer,', 'no upload.']] },
        end: { fanLeft: 770, fanTop: 48, fan: 380, nameTop: 452, nameS: 196, lineTop: 700, lineS: 68, urlTop: 860, urlS: 44, line: ['Free. Open source. Runs on your computer.'] },
      } : {
        pain: { size: 128, left: 70, rh: 140, rows: ['Agents still', 'send you to', 'a <b class="w">website</b>', 'to merge a PDF.'] },
        head: { size: 120, top: 100, rh: 134, rows: ['Panoply is now', 'an MCP server.'] },
        win: { left: 50, top: 470, w: 980, h: 780 },
        pad: 36,
        p1: [{ s: 50, h: 76, html: `<span class="d">$</span> claude mcp add panoply` }, { s: 50, h: 76, html: `    -- panoply mcp` }, { s: 50, h: 100, html: `<span class="d">&gt;</span> <span class="u">merge these 2 PDFs</span>` }, { s: 50, h: 76, html: `  <span class="u">under 1 MB</span>` }],
        p2: [{ s: 96, h: 130, html: `<span class="t">pdf_merge</span>` }, { s: 54, h: 90, html: `<span class="ok">✓</span> <span class="u">${D.merge.note}</span>` }],
        p3: [{ s: 96, h: 124, html: `<span class="t">pdf_compress</span>` }, { s: 60, h: 80, html: `<span class="ok">✓</span> <span class="u">${D.compress.note.split(', ')[0]},</span>` }, { s: 60, h: 90, html: `  <span class="u">${D.compress.note.split(', ')[1]}</span>` }],
        chip: { s: 44, h: 150, lines: ['part-1 (merged)', '(compressed).pdf'], iconS: 52, padX: 26 },
        win2: { left: 50, top: 80, w: 980, h: 1190 },
        list: { left: 0, top: 590, w: 980, h: 532, size: 54, rh: 96, padL: 40, hdr: 20 },
        stats: { left: 40, w: 900, st1: 40, st2: 340, big1: 170, big2: 104, small: 52, lab: 58 },
        hook: { size: 120, left: 70, rh: 140, groups: [['Your agent'], ['can now do'], ['31 built-in'], ['file jobs on'], ['your computer,'], ['no upload.']] },
        end: { fanLeft: 350, fanTop: 250, fan: 380, nameTop: 660, nameS: 190, lineTop: 900, lineS: 72, urlTop: 1130, urlS: 46, line: ['Free. Open source.', 'Runs on your computer.'] },
      };

      /* ---------------- data ---------------- */
      const names = D.tools.map(t => t.name);

      /* ---------------- scene 1: the pain, full on frame 0 ---------------- */
      const pw = $('m-pwords');
      set(pw, px({ left: L.pain.left, top: (H - L.pain.rows.length * L.pain.rh) / 2, fontSize: L.pain.size }));
      L.pain.rows.forEach(r => pw.insertAdjacentHTML('beforeend', `<span class="row" style="height:${L.pain.rh}px;line-height:${L.pain.rh}px">${r}</span>`));
      tl.fromTo('#m-pcam', { scale: 1, x: 0 }, { scale: 1.03, x: -12, duration: 2.4, ease: 'none' }, 0);
      fadeOut('#m-pwords', 2.15, 0.25);

      /* the drop: ground wipes to brand blue, ends clean at 2.5 s */
      tl.fromTo('#m-ground', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.55, ease: 'power3.inOut' }, 1.95);

      /* ---------------- headline ---------------- */
      const hd = $('m-head');
      set(hd, px({ left: 0, right: 0, top: L.head.top, fontSize: L.head.size, textAlign: wide ? 'center' : 'left', paddingLeft: wide ? 0 : 70, opacity: 0 }));
      hd.innerHTML = L.head.rows.map(r => `<span class="row" style="opacity:1;height:${L.head.rh}px;line-height:${L.head.rh}px">${r}</span>`).join('');
      enter('#m-head', 2.35, { y: 30, dur: 0.6 });

      /* ---------------- terminal window ---------------- */
      const w1 = $('m-win1');
      set(w1, px({ left: L.win.left, top: L.win.top, width: L.win.w, height: L.win.h }));
      enter('#m-win1', 2.65, { y: 40, s: 0.97, dur: 0.7 });
      tl.fromTo('#m-cam', { scale: 1.02 }, { scale: 1, duration: 9, ease: 'power2.out' }, 2.65);
      const bodyH1 = L.win.h - 68;
      const b1 = $('m-b1');

      const mkBlock = (id, rows, chip) => {
        const blk = document.createElement('div'); blk.className = 'blk'; blk.id = id;
        let total = rows.reduce((a, r) => a + r.h, 0) + (chip ? chip.h + 24 : 0);
        let y = Math.max(16, (bodyH1 - total) / 2);
        const els = [];
        rows.forEach((r, i) => {
          const el = document.createElement('div'); el.className = 'tl'; el.id = id + '-r' + i;
          set(el, px({ left: L.pad, top: y, height: r.h, lineHeight: r.h, fontSize: r.s }));
          el.innerHTML = r.html; blk.appendChild(el); els.push(el); y += r.h;
        });
        let chipEl = null;
        if (chip) {
          y += 24;
          chipEl = document.createElement('div'); chipEl.className = 'chip'; chipEl.id = id + '-chip';
          const icon = `<svg width="${chip.iconS}" height="${chip.iconS}" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>`;
          chipEl.innerHTML = `${icon}<span class="nm">${chip.lines.join('\n')}</span><span class="sz">${D.compress.sizeOut}</span>`;
          set(chipEl, px({ left: L.pad, top: y, height: chip.h, padding: '0 ' + chip.padX + 'px', fontSize: chip.s }));
          blk.appendChild(chipEl);
        }
        b1.appendChild(blk);
        return { blk, els, chipEl };
      };

      const P1 = mkBlock('m-p1', L.p1), P2 = mkBlock('m-p2', L.p2), P3 = mkBlock('m-p3', L.p3, L.chip);
      /* tall: the two command rows and the two ask rows arrive as pairs */
      const t1 = wide ? [3.0, 3.4] : [3.0, 3.0, 3.4, 3.4];
      P1.els.forEach((el, i) => enter(el, t1[i], { y: 18, dur: 0.45 }));
      fadeOut(P1.blk, 5.4, 0.25);
      P2.els.forEach((el, i) => enter(el, [5.7, 6.1][i], { y: 18, dur: 0.45 }));
      fadeOut(P2.blk, 8.05, 0.25);
      const t3 = wide ? [8.35, 8.75] : [8.35, 8.75, 8.75];
      P3.els.forEach((el, i) => enter(el, t3[i], { y: 18, dur: 0.45 }));
      enter(P3.chipEl, 9.2, { y: 24, dur: 0.6 });
      fadeOut('#m-win1', 11.35, 0.25);
      fadeOut('#m-head', 11.35, 0.25);

      /* ---------------- list and proof window ---------------- */
      const w2 = $('m-win2');
      set(w2, px({ left: L.win2.left, top: L.win2.top, width: L.win2.w, height: L.win2.h }));
      tl.fromTo('#m-win2', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: XO }, 11.65);
      const b2 = $('m-b2');
      const lv = document.createElement('div'); lv.className = 'lview';
      const bh2 = L.win2.h - 68;
      set(lv, px({ left: L.list.left, top: L.list.top, width: L.list.w, height: L.list.h }));
      lv.style.webkitMaskImage = lv.style.maskImage = `linear-gradient(to bottom,transparent 0,#000 36px,#000 ${L.list.h - 36}px,transparent ${L.list.h}px)`;
      const sc = document.createElement('div'); sc.className = 'lscroll'; sc.id = 'm-lscroll'; lv.appendChild(sc);
      const RH = L.list.rh, N = names.length, viewH = L.list.h;
      names.forEach((n, i) => {
        const el = document.createElement('div'); el.className = 'tr';
        const k = n.indexOf('_');
        set(el, px({ left: L.list.padL, top: L.list.hdr + i * RH, height: RH, lineHeight: RH, fontSize: L.list.size }));
        el.innerHTML = `<i>${n.slice(0, k)}</i>${n.slice(k)}`; sc.appendChild(el);
      });
      const total = 2 * L.list.hdr + N * RH;
      set(sc, px({ width: L.list.w, height: total }));
      b2.appendChild(lv);
      if (wide) { const vr = document.createElement('div'); vr.className = 'vrule'; set(vr, px({ left: L.list.w, top: 30, height: bh2 - 60 })); b2.appendChild(vr); }

      const mkStat = (id, top, big, lab) => {
        const el = document.createElement('div'); el.className = 'st'; el.id = id;
        set(el, px({ left: L.stats.left, top, width: L.stats.w }));
        el.innerHTML = `<span class="big">${big}</span><span class="lab" style="font-size:${L.stats.lab}px">${lab}</span>`;
        b2.appendChild(el); return el;
      };
      mkStat('m-st1', L.stats.st1, `<span id="m-n1" style="font-size:${L.stats.big1}px">${Math.floor((viewH - L.list.hdr) / RH)}</span>`, 'built-in tools');
      mkStat('m-st2', L.stats.st2, `<span style="font-size:${L.stats.big2}px">${D.compress.sizeIn.replace(' MB', '')}<small style="font-size:${L.stats.small}px">MB</small>→${D.compress.sizeOut.replace(' KB', '')}<small style="font-size:${L.stats.small}px">KB</small></span>`,
        `under 1 MB, in ${(D.compress.ms / 1000).toFixed(1)} s`);
      enter('#m-st1', 11.8, { y: 28, dur: 0.6 });
      enter('#m-st2', 12.8, { y: 28, dur: 0.6 });

      /* the scroll drives the counter: tools counted = rows that have come into view */
      const sp = { s: 0 }, sMax = total - viewH, n1 = $('m-n1');
      tl.to(sp, { s: sMax, duration: 2.5, ease: 'power1.inOut', onUpdate: () => {
        sc.style.transform = `translateY(${-sp.s}px)`;
        n1.textContent = String(Math.min(N, Math.floor((viewH + sp.s - L.list.hdr) / RH)));
      } }, 11.85);
      fadeOut('#m-win2', 15.1, 0.3);

      /* ---------------- the claim ---------------- */
      const hw = $('m-hwords');
      const nRows = L.hook.groups.reduce((a, g) => a + g.length, 0);
      set(hw, px({ left: L.hook.left, top: (H - nRows * L.hook.rh) / 2, fontSize: L.hook.size }));
      L.hook.groups.forEach((g, gi) => {
        const wrap = document.createElement('span'); wrap.className = 'row'; wrap.id = 'm-hg' + gi;
        wrap.innerHTML = g.map(r => `<span style="display:block;height:${L.hook.rh}px;line-height:${L.hook.rh}px">${r}</span>`).join('');
        hw.appendChild(wrap);
      });
      const gT = wide ? [15.45, 15.8, 16.15] : [15.45, 15.7, 15.95, 16.2, 16.45, 16.7];
      L.hook.groups.forEach((g, gi) => enter('#m-hg' + gi, gT[gi], { y: 36, dur: 0.6 }));
      tl.fromTo('#m-hwords', { scale: 1.02 }, { scale: 1, duration: 2.2, ease: 'power2.out' }, 15.45);
      fadeOut('#m-hwords', 20.1, 0.3);

      /* ---------------- end card ---------------- */
      const CARD = 'M316.414 65.569C331.243 65.569 338.657 65.569 344.722 67.279A45.552 45.552 0 0 1 376.199 98.757C377.909 104.821 377.909 112.235 377.909 127.065L377.909 382.508C377.909 397.338 377.909 404.752 376.199 410.816A45.552 45.552 0 0 1 344.722 442.294C338.657 444.004 331.243 444.004 316.414 444.004L229.163 444.004C214.334 444.004 206.919 444.004 200.855 442.294A45.552 45.552 0 0 1 169.378 410.816C167.668 404.752 167.668 397.338 167.668 382.508L167.668 127.065C167.668 112.235 167.668 104.821 169.378 98.757A45.552 45.552 0 0 1 200.855 67.279C206.919 65.569 214.334 65.569 229.163 65.569Z';
      const PIVOT = '272.788 612.197';
      const E = L.end;
      set('m-efan', px({ left: E.fanLeft, top: E.fanTop, width: E.fan, height: E.fan }));
      $('m-efan').innerHTML = `<svg viewBox="0 0 544 544" fill="none"><path id="m-f-l" d="${CARD}" fill="rgba(255,255,255,.42)"/><path id="m-f-r" d="${CARD}" fill="rgba(255,255,255,.62)"/><path id="m-f-c" d="${CARD}" fill="#ffffff"/></svg>`;
      gsap.set(['#m-f-l', '#m-f-r'], { svgOrigin: PIVOT });
      set('m-ename', px({ left: 0, right: 0, top: E.nameTop, textAlign: 'center', fontSize: E.nameS }));
      set('m-eline', px({ left: 0, right: 0, top: E.lineTop, textAlign: 'center', fontSize: E.lineS, fontWeight: 500, letterSpacing: '-0.025em', color: 'rgba(255,255,255,.92)', lineHeight: 1.15 }));
      $('m-eline').innerHTML = E.line.join('<br>');
      set('m-eurl', px({ left: 0, right: 0, top: E.urlTop, textAlign: 'center', fontSize: E.urlS, color: 'rgba(255,255,255,.95)', letterSpacing: '-0.01em' }));
      const T0 = 20.45;
      enter('#m-efan', T0, { y: 24, s: 0.92, dur: 0.5 });
      tl.fromTo('#m-f-l', { rotation: 0 }, { rotation: -20, duration: 0.6, ease: XO }, T0);
      tl.fromTo('#m-f-r', { rotation: 0 }, { rotation: 20, duration: 0.6, ease: XO }, T0);
      enter('#m-ename', T0, { y: 40, dur: 0.5 });
      enter('#m-eline', T0 + 0.15, { y: 26 });
      enter('#m-eurl', T0 + 0.35, { y: 20 });
      tl.fromTo('#m-endcam', { scale: 1.03 }, { scale: 1, duration: 1.2, ease: 'power2.out' }, T0);

      (function () {
        const c = $('m-grain'), g = c.getContext('2d'), d = g.createImageData(480, 270);
        let s = 12345; const r = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
        for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() - 0.5) * 90; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
        g.putImageData(d, 0, 0);
      })();

      window.__timelines["mcp"] = tl;
    }

    const x = new XMLHttpRequest();
    x.open('GET', 'assets/data/session.json', false);
    x.send(null);
    if (!(x.status === 200 || x.status === 0)) throw new Error('assets/data/session.json is missing');
    build(JSON.parse(x.responseText));
  })();
  </script>
</template>
</body></html>
