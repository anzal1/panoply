  (function () {
    /* ---- every time in the film, measured from the music (retime here, nothing else needs touching) ---- */
    const CUES = {
      hit0: 0.25, h1: 2.15, wave2: 3.97, assemble: 6.74, h2: 7.67, hold: 12.0, proof: 16.0,
      m1: 18.8, enter1: 19.7, reset: 23.4, enter2: 27.1, climax: 30.0,
      n1: 31.9, n2: 32.88, n3: 33.80, mural: [34.73, 35.66, 36.58, 37.50, 38.43, 39.36],

    /* bar jobs: every step is offsets from these anchors */
    const J1 = { chip: 16.7, list: 17.0, typeAt: 17.6, match: CUES.m1, enter: CUES.enter1, run: 19.95, result: 21.0, count: 21.15, head: 21.7, out: 23.27 };
    const J2 = { chip: 23.75, list: 24.05, typeAt: 24.5, match: 25.7, enter: CUES.enter2, run: 27.35, result: 28.3, count: 28.45, head: 28.9, out: 29.95 };

    const ID = 'odyssey-4x5', wide = false;
    const W = wide ? 1920 : 1080, H = wide ? 1080 : 1350;
    const $ = id => document.getElementById(id);
    const tl = gsap.timeline({ paused: true });
    const css = (el, o) => { const e = typeof el === 'string' ? $(el) : el; for (const k in o) e.style[k] = (typeof o[k] === 'number' && k !== 'opacity' && k !== 'zIndex') ? o[k] + 'px' : o[k]; return e; };
    const lerp = (a, b, t) => a + (b - a) * t;
    const P3 = 'power3.out', P2IO = 'power2.inOut';
    const clamp01 = v => Math.max(0, Math.min(1, v));
    const rise = (sel, t, y = 24, d = 0.9) => {
      tl.fromTo(sel, { y }, { y: 0, duration: d, ease: P3 }, t);
      tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: Math.min(0.6, d), ease: 'power1.out' }, t);
    };
    /* a hard cut: opacity to 0 within one frame at time t */
    const cut = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.001, ease: 'none' }, t);
    /* old out over 4 frames, then the new one in: the new view lands exactly on landT */
    const swap = (a, b, landT) => { tl.to(a, { opacity: 0, duration: 0.133, ease: 'none' }, landT - 0.133); tl.to(b, { opacity: 1, duration: 0.133, ease: 'none' }, landT); };

    /* ------------------------------ layout ------------------------------ */
    const L = wide ? {
      bust: { FH: 1040, top: 20, cx: 0.66 * W },
      head: { size: 124, left: 110, rh: 136 },
      fb: 210, orb: { rx: 430, ry: 330, cy: 540, s: 0.9 },

      burst: { rx: 780, ry: 380, fb: 230 },

      rest: [[.08,.12],[.30,.10],[.52,.08],[.74,.07],[.92,.14],[.95,.42],[.93,.72],[.78,.9],[.55,.92],[.32,.9],[.10,.88],[.05,.20],[.24,.82],[.44,.82]],

      bust: { FH: 960, top: 372, cx: 0.5 * W },
      head: { size: 112, left: 70, top: 136, rh: 122 },
      fb: 170, orb: { rx: 430, ry: 290, cy: 800, s: 0.8 },
      bar: { w: 1000, h: 940, fs: 36, fs2: 44, big: 84, rad: 22, bt: 112, ft: 92, padl: 24, gap: 14, ic: 40, fiw: 52, rp: 12 },
      mural: { h: 1000, top: 40, cx: W / 2, lab: 76, labTop: 1120, dx: 30 },
      priv: { h: 880, top: 20, cx: 0.5 * W, t: { size: 104, left: 70, top: 930, rh: 112 } },
      owl: { h: 860, top: 20, cx: 0.5 * W, t: { size: 100, left: 70, top: 930, rh: 106 }, term: { size: 33, top: 1170, left: 70, padx: 22, pady: 14 } },
      num: { big: 200, bigTop: 520, lab: 46, labTop: 760 },
      tp: { left: 40, top: 400, w: 1000, h: 600, rad: 22, fs: 34, cx: 40, cy: 80, oy: 400 },
      burst: { rx: 440, ry: 430, fb: 190 },
      ring: 300,
      end: { icon: 200, cy: 400, rx: 400, ry: 190, fb: 150, name: { size: 150, top: 630 }, tag: { size: 66, top: 822 }, url: { size: 54, top: 930 }, small: { size: 34, top: 1090 }, smallLines: ['Free and open source.', 'macOS, Windows and Linux.'] },
      rest: [[.12,.40],[.88,.40],[.09,.55],[.91,.58],[.12,.74],[.9,.75],[.15,.92],[.5,.94],[.86,.93],[.5,.58],[.3,.43],[.7,.41],[.5,.68],[.3,.83]],
    };
    const BH = L.bust.FH, BW = BH * 2200 / 1228, BTOP = L.bust.top, BCX = L.bust.cx;
    const fx = (u) => BCX - 0.64 * BW + u * BW, fy = (v) => BTOP + v * BH;
    const CX = W / 2, CY = H / 2;
    const bustCY = BTOP + 0.5 * BH;
    const bustShift = wide ? CX - BCX : 0;

    /* ---------------- glow pools ---------------- */
    css('gl', { width: wide ? 2000 : 1500, height: wide ? 833 : 625, left: W / 2 - (wide ? 1000 : 750), top: (wide ? H / 2 - 416 : H * 0.47 - 312) });
    gsap.set('#gl', { opacity: 0.95, scale: 0.9 });
    tl.to('#gl', { opacity: 1, scale: 1, duration: 0.8, ease: 'power2.out' }, 0);
    tl.to('#gl', { opacity: 0.5, duration: 0.4, ease: 'power1.inOut' }, CUES.proof);
    tl.to('#gl', { opacity: 1, duration: 0.4, ease: 'power1.out' }, CUES.climax);
    tl.to('#gl', { opacity: 0.55, duration: 0.3, ease: 'power1.inOut' }, CUES.n1);
    tl.to('#gl', { opacity: 0, duration: 0.15, ease: 'none' }, CUES.silence - 0.15);
    tl.to('#gl', { opacity: 0.8, duration: 0.7, ease: 'power1.out' }, CUES.breath);
    tl.to('#gl', { opacity: 0, duration: 0.2, ease: 'none' }, CUES.end);

    /* ------------------------------ the bust ------------------------------ */
    css('bust', { left: BCX - 0.64 * BW, top: BTOP, width: BW, height: BH });
    gsap.set('#bustwrap', { transformOrigin: BCX + 'px ' + bustCY + 'px', opacity: 1 });
    tl.to('#bustwrap', { scale: 1.05, duration: CUES.proof - CUES.hold, ease: 'sine.inOut' }, CUES.hold);
    tl.to('#bustwrap', { scale: 0.9, x: bustShift, opacity: 0.3, duration: 0.6, ease: P2IO }, CUES.proof);
    /* the climax: the bust returns full size and full brightness */
    tl.to('#bustwrap', { scale: 1.0, x: bustShift, opacity: 1, duration: 0.5, ease: P3 }, CUES.climax);
    tl.to('#bustwrap', { opacity: 0, duration: 0.2, ease: 'none' }, CUES.n1 - 0.2);

    /* ------------------------------ 14 forms ------------------------------ */
    const FIDX = [0, 3, 6, 8, 10, 1, 4, 7, 9, 11, 2, 5, 3, 8];
    const SZ = [1.0, 1.15, .9, 1.05, 1.0, .95, 1.15, 1.0, .9, 1.1, 1.0, .95, 1.05, .9];
    const R0 = [150, -170, 190, -130, 160, -200, 140, -160, 180, -150, 170, -190, 130, -140];
    const R1 = [-14, 18, -8, 12, -18, 10, -6, 16, -12, 8, -16, 14, -10, 20];
    const QS = [0.62, 0.38, -1, 0.5, -1, 0.7, 0.42, -1, 0.56, -1, 0.66, 0.46, -1, -1];
    const NF = 14;
    const rightPts = [[.74,.20],[.76,.28],[.73,.36],[.77,.44],[.74,.50],[.76,.58],[.72,.42]];
    const leftPts = [[.54,.27],[.55,.33],[.54,.45],[.55,.53],[.54,.60],[.55,.64],[.54,.38]];
    const edgeDist = (dx, dy) => Math.min(dx ? (W / 2) / Math.abs(dx) : 1e9, dy ? (H / 2) / Math.abs(dy) : 1e9);
    const hdTop = L.head.top !== undefined ? L.head.top : (BTOP + 0.5 * BH - L.head.rh);
    const HB = { x0: L.head.left - 40, y0: hdTop - 40, x1: L.head.left + 6.6 * L.head.size + 40, y1: hdTop + 2 * L.head.rh + 40 };
    const avoid = (x, y, hw, hh, mode) => {
      if (x > HB.x0 - hw && x < HB.x1 + hw && y > HB.y0 - hh && y < HB.y1 + hh) {
        if (mode === 't') y = HB.y0 - hh; else if (mode === 'b') y = HB.y1 + hh; else x = HB.x1 + hw;
      }
      return [x, y];
    };
    const fixEl = (el, hw0, mode) => {
      const sc = gsap.getProperty(el, 'scale'), p = avoid(gsap.getProperty(el, 'x'), gsap.getProperty(el, 'y'), hw0 * sc, hw0 * sc * 0.8, mode);
      gsap.set(el, { x: p[0], y: p[1] });
    };
    const easeF = n => gsap.parseEase(n);
    const preEase = (q, name) => { const f = easeF(name); return q <= 0 ? f : (t => (f(q + (1 - q) * t) - f(q)) / (1 - f(q))); };
    const formsEl = $('forms'), blEl = $('blooms');
    const LAND = [];
    const A0 = CUES.assemble, REL = A0 - 2.4;   /* the bust's own clock runs 2.4 to 5.0 */
    let lateRank = 0;
    for (let i = 0; i < NF; i++) {
      const w = L.fb * SZ[i];
      const el = document.createElement('div'); el.className = 'fm'; el.id = 'f' + i;
      el.innerHTML = `<img src="assets/forms/f${FIDX[i]}.webp" alt="" style="${i >= 12 ? 'transform:scaleX(-1)' : ''}">`;
      css(el, { width: w }); formsEl.appendChild(el);
      const rx = L.rest[i][0] * W, ry = L.rest[i][1] * H;
      let dx = rx - CX, dy = ry - CY; const n = Math.hypot(dx, dy) || 1; dx /= n; dy /= n;
      const k = edgeDist(dx, dy);
      const q = Math.max(0, QS[i]);

      const v = MV[k];
      tl.fromTo(d, { x: v[0] * k_, y: v[2] * k_, scale: v[4] }, { x: v[1] * k_, y: v[3] * k_, scale: v[5], duration: Tn - T + 0.15, ease: 'none' }, T);
      tl.to(d, { opacity: 1, duration: 0.15, ease: 'power1.out' }, T);
      tl.to(d, { opacity: 0, duration: 0.15, ease: 'power1.in' }, Tn - 0.15);
      /* the label lands on the pulse; the old one left over 3 frames just before */
      tl.to(lb, { opacity: 1, duration: 0.1, ease: 'none' }, T);
      tl.fromTo(lb, { y: 10 }, { y: 0, duration: 0.4, ease: P3 }, T);
      tl.to(lb, { opacity: 0, duration: 0.1, ease: 'none' }, Tn - 0.1);
    });

    /* ------------------------------ silence: Harpocrates ------------------------------ */
    const PV = L.priv, pw = PV.h * 900 / 1117;
    css('pm', { left: PV.cx - pw / 2, top: PV.top, width: pw, height: PV.h });
    css($('pm').querySelector('img'), { left: 0, top: 0, width: pw, height: PV.h });
    css('gr', { width: PV.h * 1.5, height: PV.h * 1.5, left: PV.cx - PV.h * 0.75, top: PV.top + PV.h / 2 - PV.h * 0.75 });
    const PT = PV.t;
    css('pt1', { left: PT.left, top: PT.top, fontSize: PT.size });
    css('pt2', { left: PT.left, top: PT.top + PT.rh, fontSize: PT.size });
    $('pt1').textContent = 'Nothing leaves'; $('pt2').textContent = 'your computer.';
    tl.fromTo('#gr', { opacity: 0, scale: 0.92 }, { opacity: 0.85, scale: 1, duration: 0.5, ease: 'power2.out' }, CUES.silence - 0.15);
    tl.to('#pm', { opacity: 1, duration: 0.15, ease: 'power1.out' }, CUES.silence - 0.15);
    tl.fromTo('#pm', { scale: 1.0 }, { scale: 1.06, duration: CUES.agents - CUES.silence + 0.3, ease: 'none' }, CUES.silence - 0.15);
    rise('#pt1', CUES.silence, 22, 0.8);
    rise('#pt2', CUES.silence + 0.08, 22, 0.8);
    /* hand over to the owl: marble dissolves, Harpocrates' text out in 3 frames, then the owl's text lands */
    tl.to('#pm', { opacity: 0, duration: 0.15, ease: 'power1.in' }, CUES.agents - 0.13);
    tl.to('#gr', { opacity: 0, duration: 0.15, ease: 'none' }, CUES.agents - 0.13);
    tl.to(['#pt1', '#pt2'], { opacity: 0, duration: 0.1, ease: 'none' }, CUES.agents - 0.1);

    /* ------------------------------ agents: Athena's owl ------------------------------ */
    const OW = L.owl, ow = OW.h * 900 / 1117;
    css('om', { left: OW.cx - ow / 2, top: OW.top, width: ow, height: OW.h });
    css($('om').querySelector('img'), { left: 0, top: 0, width: ow, height: OW.h });
    css('gro', { width: OW.h * 1.5, height: OW.h * 1.5, left: OW.cx - OW.h * 0.75, top: OW.top + OW.h / 2 - OW.h * 0.75 });
    css('at1', { left: OW.t.left, top: OW.t.top, fontSize: OW.t.size });
    css('at2', { left: OW.t.left, top: OW.t.top + OW.t.rh, fontSize: OW.t.size });
    $('at1').textContent = 'Give your agent'; $('at2').textContent = 'the whole set.';
    css('atm', { left: OW.term.left, top: OW.term.top, fontSize: OW.term.size, padding: OW.term.pady + 'px ' + OW.term.padx + 'px' });
    $('atm').textContent = 'claude mcp add panoply -- panoply mcp';
    tl.fromTo('#gro', { opacity: 0, scale: 0.92 }, { opacity: 0.85, scale: 1, duration: 0.5, ease: 'power2.out' }, CUES.agents - 0.13);
    tl.to('#om', { opacity: 1, duration: 0.15, ease: 'power1.out' }, CUES.agents - 0.13);
    tl.fromTo('#om', { scale: 1.0 }, { scale: 1.06, duration: CUES.install - CUES.agents + 0.3, ease: 'none' }, CUES.agents - 0.13);
    rise('#at1', CUES.agents, 22, 0.8);
    rise('#at2', CUES.agents + 0.08, 22, 0.8);
    rise('#atm', CUES.term, 18, 0.6);
    tl.to('#om', { opacity: 0, duration: 0.15, ease: 'power1.in' }, CUES.install - 0.13);
    tl.to('#gro', { opacity: 0, duration: 0.15, ease: 'none' }, CUES.install - 0.13);
    tl.to(['#at1', '#at2', '#atm'], { opacity: 0, duration: 0.1, ease: 'none' }, CUES.install - 0.1);

    /* ------------------------------ install: a clean terminal line ------------------------------ */
    const TP = L.tp;
    css('tp', { left: TP.left, top: TP.top, width: TP.w, height: TP.h });
    $('tp').style.setProperty('--rad', TP.rad + 'px');
    css('tpc', { left: TP.cx, top: TP.cy, fontSize: TP.fs, whiteSpace: 'pre', lineHeight: '1.4' });
    css('tpo', { left: TP.cx, top: TP.oy, fontSize: TP.fs });
    const CMD = wide ? '$ curl -fsSL https://panoply.anzalabidi.dev/install.sh | sh' : '$ curl -fsSL https://panoply.anzalabidi.dev/\n  install.sh | sh';
    $('tpo').textContent = 'Installed Panoply 0.3.0 in 3.4 s';
    const tt = { n: 0 };
    tl.to('#tp', { opacity: 1, duration: 0.2, ease: 'power1.out' }, CUES.install);
    tl.to(tt, { n: CMD.length, duration: CUES.ok - CUES.install - 0.18, ease: 'none', onUpdate: () => { $('tpc').textContent = CMD.slice(0, Math.round(tt.n)); } }, CUES.install);
    rise('#tpo', CUES.ok, 14, 0.4);
    tl.to(['#tp', '#tpc', '#tpo'], { opacity: 0, duration: 0.4, ease: 'power1.in' }, CUES.breath);

    /* ------------------------------ the breath: one marble ring ------------------------------ */
    const rg = document.createElement('div'); rg.className = 'fm'; rg.id = 'ring';
    rg.innerHTML = '<img src="assets/forms/f0.webp" alt="">'; css(rg, { width: L.ring }); $('ringc').appendChild(rg);
    gsap.set(rg, { xPercent: -50, yPercent: -50, x: CX, y: CY, opacity: 0 });
    tl.to(rg, { opacity: 1, duration: 0.7, ease: 'power1.out' }, CUES.breath + 0.4);
    tl.fromTo(rg, { rotation: -20 }, { rotation: 100, duration: CUES.end - CUES.breath, ease: 'none' }, CUES.breath);
    tl.to(rg, { opacity: 0, duration: 0.001, ease: 'none' }, CUES.end);

    /* ------------------------------ end card ------------------------------ */
    const E = L.end, ICX = W / 2, ICY = E.cy;
    css('eicon', { left: ICX - E.icon / 2, top: ICY - E.icon / 2, width: E.icon, height: E.icon, opacity: 0 });
    css('ge', { width: wide ? 1400 : 1300, height: wide ? 583 : 542, left: ICX - (wide ? 700 : 650), top: ICY - (wide ? 291 : 271) });
    const bsz = E.icon * 2.6;
    css('ebloom', { width: bsz, height: bsz, left: ICX - bsz / 2, top: ICY - bsz / 2 });
    const lineCss = (id, o, txt) => { css(id, Object.assign({ left: 0, width: W, textAlign: 'center', opacity: 0 }, o)); if (txt !== undefined) $(id).textContent = txt; };
    lineCss('ename', { top: E.name.top, fontSize: E.name.size });
    lineCss('etag', { top: E.tag.top, fontSize: E.tag.size });
    lineCss('eurl', { top: E.url.top, fontSize: E.url.size });
    lineCss('esmall', { top: E.small.top, fontSize: E.small.size });
    $('esmall').innerHTML = E.smallLines.join('<br>');
    tl.fromTo('#ge', { opacity: 0 }, { opacity: 0.75, duration: 0.8, ease: 'power2.out' }, CUES.end);
    tl.fromTo('#eicon', { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.7, ease: P3 }, CUES.end);
    rise('#ename', CUES.end + 0.15, 24, 0.8);
    rise('#etag', CUES.end + 0.45, 24, 0.8);
    rise('#eurl', CUES.end + 0.75, 20, 0.8);
    rise('#esmall', CUES.end + 1.1, 18, 0.7);
    const eo = { e: 0, spin: 0 }, eoEl = $('eorbit'), eors = [];
    OIDX.forEach((fi2, k) => {
      const el = document.createElement('div'); el.className = 'fm'; el.id = 'e' + k;
      el.innerHTML = `<img src="assets/forms/f${fi2}.webp" alt="">`;
      css(el, { width: E.fb }); eoEl.appendChild(el); gsap.set(el, { xPercent: -50, yPercent: -50, opacity: 0 }); eors.push(el);
    });
    /* the ring bursts into the five orbiting forms */
    const updEnd = () => {
      eors.forEach((el, k) => {
        const a = -2.2 + k * (Math.PI * 2 / 5) + eo.spin;
        const d = Math.sin(a);
        const ox = ICX + E.rx * Math.cos(a), oy = ICY + E.ry * d;
        const e = eo.e;
        gsap.set(el, { x: lerp(CX, ox, e), y: lerp(CY, oy, e), scale: lerp(0.5, 0.95 * (1 + 0.12 * d), e), rotation: lerp(-20 + k * 40, 18 * k - 30, e), opacity: Math.min(1, e * 6), filter: 'blur(' + lerp(2, Math.max(0, d - 0.5) * 6, e).toFixed(2) + 'px)' });
      });
    };
    updEnd();
    tl.to(eo, { e: 1, duration: 1.4, ease: P3, onUpdate: updEnd }, CUES.end);
    tl.to(eo, { spin: 0.7, duration: CUES.bloom - 0.4 - CUES.end, ease: 'power2.out', onUpdate: updEnd }, CUES.end);
    /* a soft ivory bloom on the icon, then still */
    tl.to('#ebloom', { opacity: 0.7, scale: 1.0, duration: 0.1, ease: 'none' }, CUES.bloom);
    tl.to('#ebloom', { opacity: 0, scale: 1.25, duration: 0.1, ease: 'none' }, CUES.bloom + 0.1);
    gsap.set('#ebloom', { xPercent: 0, scale: 0.7 });

    /* alive grain at 12 fps, still from the hold */
    const gr = { f: 0 };
    const ghash = n => { let x = (n * 2654435761) >>> 0; x ^= x >>> 15; x = Math.imul(x, 2246822519) >>> 0; x ^= x >>> 13; return x / 4294967296; };
    const updGrain = () => { const n = Math.floor(gr.f + 1e-6); $('grain').style.backgroundPosition = Math.floor(ghash(n + 1) * 160) + 'px ' + Math.floor(ghash(n + 977) * 160) + 'px'; };
    updGrain();
    tl.to(gr, { f: CUES.still * 12, duration: CUES.still, ease: 'none', onUpdate: updGrain }, 0);
    tl.to({}, { duration: 0.001 }, CUES.total - 0.01);
    window.__timelines[ID] = tl;
    tl.seek(0);
  })();

  </script>
</template>
