<!doctype html>
<html><head><meta charset="UTF-8"></head><body>
<template>
  <style>
    @font-face{font-family:"Geist";src:url("assets/fonts/Geist-Variable-latin.woff2") format("woff2");font-weight:100 900}
    @font-face{font-family:"Geist Mono";src:url("assets/fonts/GeistMono-latin.woff2") format("woff2");font-weight:100 900}

    #root{position:absolute;inset:0;overflow:hidden;font-family:"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
    #root *{box-sizing:border-box}
    #root .fill{position:absolute;inset:0}
    #root .abs{position:absolute}
    #root .mono{font-family:"Geist Mono",ui-monospace,monospace}
    #root .h1{font-weight:700;letter-spacing:-0.04em;line-height:1}

    /* Midnight cold open */
    #sh-pwords{position:absolute;left:0;right:0;top:50%;margin-top:-260px;height:520px;text-align:center;font-size:124px}
    #sh-pwords .row{display:block;height:130px;line-height:130px;white-space:nowrap}
    #sh-pwords .bad{color:#ff6961}

    /* one blue ground from the wipe to the end card */
    #sh-blue{background:#2d6cdf;clip-path:inset(0 100% 0 0)}
    .cam{position:absolute;inset:0}
    .hd{position:absolute;left:0;right:0;top:80px;height:130px;line-height:130px;text-align:center;white-space:nowrap;font-size:128px;opacity:0}
    .hd2{position:absolute;left:0;right:0;top:56px;height:250px;text-align:center;font-size:120px;line-height:1.04;letter-spacing:-0.04em;font-weight:700;opacity:0}
    .hd2 span{display:block;white-space:nowrap}

    .plate{position:absolute;border-radius:23px;overflow:hidden;background:#f1f2f5;box-shadow:0 0 0 1.5px rgba(255,255,255,.25),0 40px 110px rgba(8,24,70,.5);opacity:0}
    .plate img{position:absolute;left:0;top:0;display:block}

    /* A: the result card with the Share button (footer rebuilt from panel.rs, 1440 x 920 space) */
    #sh-foot{position:absolute;left:0;top:0;width:1440px;height:920px;transform:scale(.69444);transform-origin:0 0}
    #sh-foot .b{position:absolute;top:832px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:28px;font-weight:500;letter-spacing:-0.012em;color:#1d1d1f}
    #sh-foot .b svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
    #sh-foot .ghost{color:#4a4a52}
    #sh-foot .sec{background:#d6d6d7}
    #sh-foot .ico{background:#e3e3e6;color:#4a4a52}
    #sh-foot .pri{background:#0072ef;color:#fff;font-weight:600}
    #sh-tip{position:absolute;left:946px;top:764px;width:100px;text-align:center;opacity:0}
    #sh-tip i{display:inline-block;padding:0 20px;height:48px;line-height:48px;border-radius:12px;background:#1d1d1f;color:#fff;font-style:normal;font-size:26px;font-weight:500}
    #sh-ring{position:absolute;left:956px;top:824px;width:80px;height:80px;border-radius:22px;border:6px solid #0a84ff;opacity:0}

    /* E: the numbers */
    .stat{position:absolute;top:390px;width:560px;text-align:center;opacity:0}
    .stat .n{font-size:150px;font-weight:700;letter-spacing:-0.05em;line-height:1;white-space:nowrap}
    .stat .l{margin-top:34px;font-size:44px;font-weight:600;letter-spacing:-0.025em;line-height:1.12;color:rgba(255,255,255,.95)}
    .stat .s{margin-top:26px;font-size:28px;font-weight:500;color:rgba(255,255,255,.72);letter-spacing:-0.01em}
    .statrule{position:absolute;top:410px;width:2px;height:420px;background:rgba(255,255,255,.28);opacity:0}

    /* end card */
    #sh-end{position:absolute;inset:0}
    #sh-endcam{position:absolute;inset:0}
    #sh-efan{position:absolute;left:770px;top:48px;width:380px;height:380px;opacity:0}
    #sh-efan svg{width:100%;height:100%;display:block;overflow:visible}
    #sh-ename{position:absolute;left:0;right:0;top:452px;text-align:center;font-size:196px;opacity:0}
    #sh-eline{position:absolute;left:0;right:0;top:700px;text-align:center;font-size:68px;font-weight:500;letter-spacing:-0.025em;color:rgba(255,255,255,.88);opacity:0}
    #sh-eurl{position:absolute;left:0;right:0;top:860px;text-align:center;font-size:44px;color:rgba(255,255,255,.9);letter-spacing:-0.01em;opacity:0}
    #sh-grain{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;opacity:.08;mix-blend-mode:soft-light}
  </style>

  <div id="root" data-composition-id="share" data-width="1920" data-height="1080">
    <div id="sh-gmid" class="fill" style="background:#0c0c0f"></div>

    <!-- 1. Midnight: the everyday pain, no names -->
    <div id="sh-pain" class="fill">
      <div id="sh-pwords" class="h1">
        <div class="row" id="sh-r1" style="opacity:0">Getting a file from</div>
        <div class="row" id="sh-r2" style="opacity:0">your laptop to your phone</div>
        <div class="row bad" id="sh-r3" style="opacity:0">shouldn't need a cable</div>
        <div class="row bad" id="sh-r4" style="opacity:0">or a cloud account.</div>
      </div>
    </div>

    <div id="sh-blue" class="fill"></div>

    <!-- 2. Every result has a Share button -->
    <div id="sh-camA" class="cam">
      <div id="sh-hA" class="hd h1">Share any result.</div>
      <div id="sh-pushA" class="fill" style="transform-origin:1149px 900px">
        <div id="sh-plA" class="plate" style="left:460px;top:345px;width:1000px;height:639px">
          <img src="assets/plates/result.png" width="1000" height="639" alt="">
          <div id="sh-foot">
            <div class="b ghost" style="left:540px;width:105px"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo</div>
            <div class="b sec" style="left:678px;width:270px"><svg viewBox="0 0 24 24"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>Show in folder</div>
            <div class="b ico" style="left:964px;width:64px"><svg viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="m16 6-4-4-4 4"/><path d="M12 2v14"/></svg></div>
            <div class="b sec" style="left:1036px;width:177px"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>Then...</div>
            <div class="b pri" style="left:1230px;width:162px"><svg viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>Open</div>
            <div id="sh-tip"><i>Share</i></div>
            <div id="sh-ring"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. Nearby devices, sending, done -->
    <div id="sh-camB" class="cam">
      <div id="sh-hB1" class="hd h1">Pick a device nearby.</div>
      <div id="sh-hB2" class="hd h1">Over your own Wi-Fi.</div>
      <div id="sh-hB3" class="hd h1">No cable. No account.</div>
      <div id="sh-pushB" class="fill" style="transform-origin:960px 600px">
        <div id="sh-plB" class="plate" style="left:160px;top:340px;width:1600px;height:504px">
          <img id="sh-iB1" src="assets/plates/devices.png" width="1600" height="504" alt="">
          <img id="sh-iB2" src="assets/plates/sending.png" width="1600" height="504" alt="" style="opacity:0">
          <img id="sh-iB3" src="assets/plates/done.png" width="1600" height="504" alt="" style="opacity:0">
        </div>
      </div>
    </div>

    <!-- 4. The receiving side asks first -->
    <div id="sh-camC" class="cam">
      <div id="sh-hC" class="hd2"><span>Nothing is saved</span><span>unless you accept.</span></div>
      <div id="sh-pushC" class="fill" style="transform-origin:960px 620px">
        <div id="sh-plC" class="plate" style="left:210px;top:400px;width:1500px;height:588px">
          <img src="assets/plates/incoming.png" width="1500" height="588" alt="">
        </div>
      </div>
    </div>

    <!-- 5. QR page for a phone without the app -->
    <div id="sh-camD" class="cam">
      <div id="sh-hD" class="hd h1">No app? Scan the code.</div>
      <div id="sh-pushD" class="fill" style="transform-origin:960px 600px">
        <div id="sh-plD" class="plate" style="left:110px;top:340px;width:1700px;height:519px">
          <img src="assets/plates/qr.png" width="1700" height="519" alt="">
        </div>
      </div>
    </div>

    <!-- 6. Three measured numbers -->
    <div id="sh-camE" class="cam">
      <div id="sh-hE" class="hd h1">The numbers.</div>
      <div id="sh-s1" class="stat" style="left:60px"><div class="n">128-bit</div><div class="l">token on every file you send</div><div class="s mono">panoply-share / receive.rs</div></div>
      <div id="sh-s2" class="stat" style="left:680px"><div class="n">600 s</div><div class="l">then the QR page closes</div><div class="s mono">panoply-share / qr.rs</div></div>
      <div id="sh-s3" class="stat" style="left:1300px"><div class="n">2 MiB</div><div class="l">sent between two engines, bytes match</div><div class="s mono">desktop / share.rs test</div></div>
      <div id="sh-ru1" class="statrule" style="left:650px"></div>
      <div id="sh-ru2" class="statrule" style="left:1270px"></div>
    </div>

    <!-- 7. End card, same blue -->
    <div id="sh-end">
      <div id="sh-endcam">
        <div id="sh-efan"></div>
        <div id="sh-ename" class="h1">Panoply</div>
        <div id="sh-eline">Free. Open source. Runs on your computer.</div>
        <div id="sh-eurl" class="mono">github.com/anzal1/panoply</div>
      </div>
    </div>

    <canvas id="sh-grain" width="480" height="270"></canvas>
  </div>

  <script>
  (function () {
    const F = 1 / 60;
    const $ = id => document.getElementById(id);
    const tl = gsap.timeline({ paused: true });
    const XO = 'expo.out', P2I = 'power2.in', P1O = 'power1.out';

    /* entrance starts on its time: a short expo.out glide on transform, opacity has its own power1.out */
    const enter = (sel, t, o = {}) => {
      const d = o.dur || 0.5;
      tl.fromTo(sel, { x: o.x || 0, y: o.y === undefined ? 26 : o.y, scale: o.s || 1 }, { x: 0, y: 0, scale: 1, duration: d, ease: XO }, t);
      tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: o.fade || 0.25, ease: P1O }, t);
    };
    /* the outgoing content fades in 0.15 s and ends one frame before time t, so old and new never share a frame */
    const out = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.15, ease: 'power1.in' }, t - 0.15 - F);
    const fade = (sel, t, d) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d || 0.3, ease: 'power1.inOut' }, t);
    const drift = (sel, t0, t1, from, to) => tl.fromTo(sel, { scale: from }, { scale: to, duration: t1 - t0, ease: 'none' }, t0);

    /* ---------- 1. pain, 0 to 3.2 s */
    enter('#sh-r1', 0.2, { y: 30 });
    enter('#sh-r2', 0.55, { y: 30 });
    enter('#sh-r3', 1.3, { y: 30 });
    enter('#sh-r4', 1.7, { y: 30 });
    drift('#sh-pwords', 0, 3.2, 1, 1.03);
    out('#sh-pain', 3.2);

    /* ---------- the ground turns brand blue by a straight wipe */
    tl.fromTo('#sh-blue', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 -1% 0 0)', duration: 0.55, ease: XO }, 3.2);

    /* ---------- 2. result card and the Share button, 3.4 to 5.7 s */
    enter('#sh-hA', 3.5, { y: 34 });
    enter('#sh-plA', 3.55, { y: 40, s: 1.03, dur: 0.7 });
    enter('#sh-tip', 4.3, { y: 10, dur: 0.4 });
    tl.fromTo('#sh-ring', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: P1O }, 4.3);
    tl.fromTo('#sh-pushA', { scale: 1 }, { scale: 1.45, duration: 1.4, ease: 'power2.inOut' }, 4.25);
    out('#sh-hA', 4.45);
    out('#sh-camA', 5.75);

    /* ---------- 3. devices, sending, done, 5.75 to 8.95 s */
    enter('#sh-hB1', 5.8, { y: 34 });
    enter('#sh-plB', 5.85, { y: 40, s: 1.03, dur: 0.7 });
    drift('#sh-pushB', 5.85, 8.95, 1, 1.07);
    out('#sh-hB1', 7.0);
    enter('#sh-hB2', 7.0, { y: 24 });
    fade('#sh-iB2', 7.0, 0.35);
    out('#sh-hB2', 8.0);
    enter('#sh-hB3', 8.0, { y: 24 });
    fade('#sh-iB3', 8.0, 0.35);
    out('#sh-camB', 9.0);

    /* ---------- 4. the prompt, 9.05 to 11.2 s */
    enter('#sh-hC', 9.03, { y: 34 });
    enter('#sh-plC', 9.07, { y: 40, s: 1.03, dur: 0.7 });
    tl.fromTo('#sh-pushC', { scale: 1 }, { scale: 1.16, duration: 1.6, ease: 'power2.inOut' }, 9.4);
    out('#sh-camC', 11.1);

    /* ---------- 5. the QR page, 11.3 to 12.95 s */
    enter('#sh-hD', 11.13, { y: 34 });
    enter('#sh-plD', 11.17, { y: 40, s: 1.03, dur: 0.7 });
    drift('#sh-pushD', 11.2, 12.85, 1, 1.07);
    out('#sh-camD', 12.9);

    /* ---------- 6. the numbers, 13.05 to 15.1 s */
    enter('#sh-hE', 12.93, { y: 30 });
    enter('#sh-s1', 13.15, { y: 34 });
    tl.fromTo('#sh-ru1', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: P1O }, 13.3);
    enter('#sh-s2', 13.45, { y: 34 });
    tl.fromTo('#sh-ru2', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: P1O }, 13.6);
    enter('#sh-s3', 13.75, { y: 34 });
    drift('#sh-camE', 12.95, 15.45, 1, 1.02);
    out('#sh-camE', 15.55);

    /* ---------- 7. end card, 15.6 s, same blue */
    const CARD = 'M316.414 65.569C331.243 65.569 338.657 65.569 344.722 67.279A45.552 45.552 0 0 1 376.199 98.757C377.909 104.821 377.909 112.235 377.909 127.065L377.909 382.508C377.909 397.338 377.909 404.752 376.199 410.816A45.552 45.552 0 0 1 344.722 442.294C338.657 444.004 331.243 444.004 316.414 444.004L229.163 444.004C214.334 444.004 206.919 444.004 200.855 442.294A45.552 45.552 0 0 1 169.378 410.816C167.668 404.752 167.668 397.338 167.668 382.508L167.668 127.065C167.668 112.235 167.668 104.821 169.378 98.757A45.552 45.552 0 0 1 200.855 67.279C206.919 65.569 214.334 65.569 229.163 65.569Z';
    const PIVOT = '272.788 612.197';
    $('sh-efan').innerHTML = `<svg viewBox="0 0 544 544" fill="none"><path id="sh-f-l" d="${CARD}" fill="rgba(255,255,255,.42)"/><path id="sh-f-r" d="${CARD}" fill="rgba(255,255,255,.62)"/><path id="sh-f-c" d="${CARD}" fill="#ffffff"/></svg>`;
    gsap.set(['#sh-f-l', '#sh-f-r'], { svgOrigin: PIVOT });
    const E0 = 15.6;
    enter('#sh-efan', E0, { y: 24, s: 0.92, dur: 0.6 });
    tl.fromTo('#sh-f-l', { rotation: 0 }, { rotation: -20, duration: 0.7, ease: XO }, E0);
    tl.fromTo('#sh-f-r', { rotation: 0 }, { rotation: 20, duration: 0.7, ease: XO }, E0);
    enter('#sh-ename', E0 + 0.1, { y: 40, dur: 0.6 });
    enter('#sh-eline', E0 + 0.45, { y: 26 });
    enter('#sh-eurl', E0 + 0.85, { y: 20 });
    tl.fromTo('#sh-endcam', { scale: 1.03 }, { scale: 1, duration: 1.6, ease: 'power2.out' }, E0);

    /* grain, painted once from a seeded generator */
    (function () {
      const c = $('sh-grain'), g = c.getContext('2d'), d = g.createImageData(480, 270);
      let s = 12345; const r = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
      for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() - 0.5) * 90; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
      g.putImageData(d, 0, 0);
    })();

    window.__timelines["share"] = tl;
  })();
  </script>
</template>
</body></html>
