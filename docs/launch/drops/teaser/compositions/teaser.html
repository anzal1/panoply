<!doctype html>
<html><head><meta charset="UTF-8"></head><body>
<template>
  <style>
    @font-face{font-family:"Inter";src:url("assets/fonts/Inter-Variable-latin.woff2") format("woff2");font-weight:100 900}
    #root{position:absolute;inset:0;overflow:hidden;font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#F4F0E8;background:#0D0E12}
    #root *{box-sizing:border-box}
    #root .abs{position:absolute}
    #root .dither{position:absolute;pointer-events:none;background-repeat:no-repeat;background-size:100% 100%;image-rendering:pixelated;image-rendering:crisp-edges}
    #root .g{background:linear-gradient(180deg,#FBF8F2 20%,#B4B2B0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600;letter-spacing:-.02em;line-height:1.04;white-space:nowrap}
    #root .fm{position:absolute;left:0;top:0;opacity:1}
    #root .fm img{display:block;width:100%;height:auto}
    #root .bloom{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(circle,rgba(244,240,232,.6) 0%,rgba(244,240,232,.18) 40%,rgba(244,240,232,0) 68%);opacity:0}
    #root .blend{mix-blend-mode:lighten}
    #root .blend img{display:block;position:absolute}
    #grain{position:absolute;inset:0;pointer-events:none;background:url("assets/grain.png") 0 0/160px 160px;opacity:.3;z-index:100}

    /* the command bar, rebuilt from the website's own .bar styles and scaled for video */
    #bar{position:absolute;border-radius:var(--rad);background:rgba(22,22,28,.95);box-shadow:0 0 0 1.5px rgba(255,255,255,.1),0 50px 120px -30px rgba(0,0,0,.95),0 0 120px rgba(255,255,255,.05);overflow:hidden;text-align:left;letter-spacing:-.01em;color:#EDEDF0;font-size:var(--fs);line-height:1.25;opacity:0;z-index:20}
    .bar-top{position:absolute;left:0;right:0;top:0;height:var(--bt);display:flex;align-items:center;gap:var(--gap);padding:0 20px 0 var(--padl);border-bottom:1.5px solid rgba(255,255,255,.08)}
    .bar-top>svg{flex:none;width:var(--ic);height:var(--ic);color:#8B8D96}
    .q{flex:1;min-width:0;white-space:nowrap;overflow:hidden;display:flex;align-items:center}
    .q .ph{color:#6F717A}
    .caret{display:inline-block;flex:none;width:3px;height:1.15em;background:#4C8DFF;margin-left:2px}
    .fchip{flex:none;display:flex;align-items:center;gap:12px;height:calc(var(--bt) - 30px);padding:0 16px 0 9px;border-radius:14px;background:#24252C;opacity:0}
    .fchip small{font-size:var(--fs);color:#8B8D96}
    .fchip i{font-style:normal;color:#6F717A;margin-left:2px}
    .fi{flex:none;width:var(--fiw);height:var(--fiw);border-radius:11px;display:grid;place-items:center}
    .fi svg{width:60%;height:60%}
    .fi.pdf{background:#3A1C22;color:#FF5F67}.fi.img{background:#2E2140;color:#C86BFA}.fi.id{background:#3A2A14;color:#F5A524}
    .bar-body{position:absolute;left:0;right:0;top:var(--bt);bottom:var(--ft)}
    .view{position:absolute;inset:0;padding:10px 14px;opacity:0}
    .sec{color:#7D7F88;padding:12px 14px 8px}
    .row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;column-gap:20px;padding:var(--rp) 14px;border-radius:16px}
    .row b{font-weight:500;white-space:nowrap}
    .row .d{color:#8B8D96;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .row .k{color:#7D7F88}
    .row.sel{background:rgba(25,40,61,0);box-shadow:inset 0 0 0 1.5px rgba(76,141,255,.16)}
    .row.sel .d{color:#AEB1BB}
    .row.sel.plain{box-shadow:none}
    .kbd{display:inline-grid;justify-self:end;place-items:center;min-width:calc(var(--fs) * 1.4);height:calc(var(--fs) * 1.2);padding:0 8px;border-radius:9px;background:rgba(255,255,255,.08);color:#8B8D96}
    .kbd svg{width:.8em;height:.8em}
    .opts{grid-column:2/4;display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
    .opts span{color:#A9ABB3;padding:7px 20px;border-radius:999px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16);opacity:0}
    .opts span b{color:#EDEDF0;font-weight:500;margin-left:10px}
    .est{grid-column:4;align-self:end;color:#3DD56D;white-space:nowrap;opacity:0}
    .tall .row{grid-template-columns:auto minmax(0,1fr) auto;column-gap:18px}
    .tall .row .fi{grid-column:1;grid-row:1/span 2}
    .tall .row b{grid-column:2;grid-row:1}
    .tall .row .d{grid-column:2;grid-row:2;white-space:normal;line-height:1.2}
    .tall .row .k,.tall .row .kbd{grid-column:3;grid-row:1/span 2}
    .tall .opts{grid-column:2;grid-row:3}
    .tall .est{grid-column:2;grid-row:4;margin-top:10px}
    .run{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
    .run b{font-size:var(--fs2);font-weight:600}
    .prog{width:62%;height:14px;border-radius:7px;background:rgba(255,255,255,.1);overflow:hidden}
    .prog i{display:block;height:100%;width:100%;background:#0A84FF;transform:scaleX(0);transform-origin:left}
    .run small{width:62%;display:flex;justify-content:space-between;font-size:var(--fs);color:#8B8D96}
    .done{padding:28px 30px}
    .done h4{margin:0;display:flex;align-items:center;gap:16px;font-size:var(--fs2);font-weight:600;line-height:1.15}
    .done h4 svg{flex:none;width:calc(var(--fs2) * 1.2);height:calc(var(--fs2) * 1.2);color:#3DD56D}
    .ba{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;margin-top:26px}
    .ba div{border-radius:18px;background:#202128;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08);padding:16px 24px}
    .ba small{display:block;font-size:var(--fs);color:#8B8D96}
    .ba strong{display:block;font-size:var(--big);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
    .ba .after strong{color:#3DD56D}
    .ba>span{color:#6F717A;display:grid}
    .ba>span svg{width:calc(var(--fs) * 1.4);height:calc(var(--fs) * 1.4)}
    .done .out{margin-top:24px;color:#8B8D96}
    .done .out span{display:inline-block;margin-top:10px;padding:10px 20px;border-radius:14px;background:#202128;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08);color:#EDEDF0}
    .bar-foot{position:absolute;left:0;right:0;bottom:0;height:var(--ft);border-top:1.5px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;padding:0 var(--padl);color:#7D7F88}
    .bar-foot .l{display:flex;align-items:center;gap:14px;white-space:nowrap}
    .bar-foot .l img{width:calc(var(--fs) * 1.1);height:calc(var(--fs) * 1.1)}
    .bar-foot .r{display:flex;align-items:center;gap:12px}
  </style>

  <div id="root" data-composition-id="teaser" data-width="1920" data-height="1080">
    <div id="gl" class="dither" style="background-image:url('assets/glow-wide.png');opacity:0"></div>
    <div id="gr" data-layout-allow-overflow class="dither" style="background-image:url('assets/glow-round.png');opacity:0"></div>
    <div id="ge" data-layout-allow-overflow class="dither" style="background-image:url('assets/glow-wide.png');opacity:0"></div>
    <div id="bustwrap" data-layout-allow-overflow class="abs blend" style="left:0;top:0;width:1920px;height:1080px"><img id="bust" src="assets/bust.webp" alt=""></div>
    <div id="forms" class="abs" style="left:0;top:0;width:1920px;height:1080px"></div>
    <div id="orbit" class="abs" style="left:0;top:0;width:1920px;height:1080px"></div>
    <div id="blooms" class="abs" style="left:0;top:0;width:1920px;height:1080px"></div>
    <div id="murals" class="abs" style="left:0;top:0;width:1920px;height:1080px"></div>
    <div id="pmwrap" class="abs" style="left:0;top:0;width:1920px;height:1080px"><div id="pm" class="abs blend" style="opacity:0"><img src="assets/private.webp" alt=""></div></div>
    <div id="head" class="abs" style="left:0;top:0;width:1920px;height:1080px"><div id="h1" class="g abs"></div><div id="h2" class="g abs"></div></div>
    <div id="bar"></div>
    <div id="mlabels" class="abs" style="left:0;top:0;width:1920px;height:1080px"></div>
    <div id="priv" class="abs" style="left:0;top:0;width:1920px;height:1080px"><div id="pt1" class="g abs"></div><div id="pt2" class="g abs"></div></div>
    <div id="end" class="abs" style="left:0;top:0;width:1920px;height:1080px">
      <div id="eorbit" class="abs" style="left:0;top:0;width:1920px;height:1080px"></div>
      <img id="eicon" class="abs" src="assets/icon.svg" alt="">
      <div id="ename" class="g abs">Panoply</div>
      <div id="etag" class="g abs">Every file tool. One app.</div>
      <div id="eurl" class="abs" style="color:#F4F0E8;font-weight:500;letter-spacing:-.01em;white-space:nowrap">panoply.anzalabidi.dev</div>
      <div id="esmall" class="abs" style="color:#8B8D96;font-weight:500;letter-spacing:-.01em;line-height:1.3"></div>
    </div>
    <div id="grain"></div>
  </div>

  <script>
  (function () {
    const ID = 'teaser', wide = true;
    const W = wide ? 1920 : 1080, H = wide ? 1350 - 270 : 1350;
    const $ = id => document.getElementById(id);
    const tl = gsap.timeline({ paused: true });
    const css = (el, o) => { const e = typeof el === 'string' ? $(el) : el; for (const k in o) e.style[k] = (typeof o[k] === 'number' && k !== 'opacity' && k !== 'zIndex') ? o[k] + 'px' : o[k]; return e; };
    const lerp = (a, b, t) => a + (b - a) * t;
    const P3 = 'power3.out', P2IO = 'power2.inOut';
    const rise = (sel, t, y = 24, d = 0.9) => {
      tl.fromTo(sel, { y }, { y: 0, duration: d, ease: P3 }, t);
      tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: Math.min(0.6, d), ease: 'power1.out' }, t);
    };

    /* ------------------------------ layout ------------------------------ */
    const L = wide ? {
      bust: { FH: 1040, top: 20, cx: 0.64 * W },
      head: { size: 96, left: 140, top: 250, rh: 108 },
      fb: 210, orb: { rx: 560, ry: 330, cy: 540, s: 0.9 },
      bar: { w: 1560, h: 740, fs: 34, fs2: 42, big: 84, rad: 24, bt: 108, ft: 80, padl: 30, gap: 18, ic: 40, fiw: 52, rp: 14 },
      mural: { h: 880, top: 10, cx: W / 2, lab: 64, labTop: 915 },
      priv: { h: 900, top: 90, cx: 0.68 * W, t: { size: 112, left: 140, top: 410, rh: 120 } },
      end: { icon: 220, cy: 305, rx: 450, ry: 185, fb: 150, name: { size: 120, top: 585 }, tag: { size: 64, top: 730 }, url: { size: 54, top: 828 }, small: { size: 36, top: 940 }, smallLines: ['Free and open source. macOS, Windows and Linux.'] },
      rest: [[.08,.12],[.30,.10],[.52,.08],[.74,.07],[.92,.14],[.95,.42],[.93,.72],[.78,.9],[.55,.92],[.32,.88],[.10,.85],[.06,.60],[.22,.66],[.46,.70]],
    } : {
      bust: { FH: 1040, top: 322, cx: 0.5 * W },
      head: { size: 104, left: 70, top: 80, rh: 114 },
      fb: 170, orb: { rx: 430, ry: 290, cy: 800, s: 0.8 },
      bar: { w: 1000, h: 810, fs: 30, fs2: 38, big: 76, rad: 22, bt: 100, ft: 76, padl: 24, gap: 14, ic: 36, fiw: 46, rp: 12 },
      mural: { h: 1000, top: 40, cx: W / 2, lab: 76, labTop: 1120 },
      priv: { h: 880, top: 20, cx: 0.5 * W, t: { size: 104, left: 70, top: 930, rh: 112 } },
      end: { icon: 260, cy: 400, rx: 400, ry: 190, fb: 150, name: { size: 150, top: 630 }, tag: { size: 66, top: 822 }, url: { size: 54, top: 930 }, small: { size: 34, top: 1090 }, smallLines: ['Free and open source.', 'macOS, Windows and Linux.'] },
      rest: [[.12,.31],[.88,.31],[.09,.52],[.91,.55],[.12,.74],[.9,.75],[.15,.92],[.5,.94],[.86,.93],[.5,.33],[.3,.3],[.7,.29],[.5,.62],[.3,.83]],
    };
    const BH = L.bust.FH, BW = BH * 2200 / 1228, BTOP = L.bust.top, BCX = L.bust.cx;
    const fx = (u) => BCX - 0.64 * BW + u * BW, fy = (v) => BTOP + v * BH;
    const CX = W / 2, CY = H / 2;

    /* grain-toned glow pools */
    css('gl', { width: wide ? 2000 : 1500, height: wide ? 833 : 625, left: W / 2 - (wide ? 1000 : 750), top: (wide ? H / 2 - 416 : H * 0.47 - 312) });
    gsap.set('#gl', { opacity: 0.8, scale: 0.85 });
    tl.to('#gl', { opacity: 1, scale: 1, duration: 0.8, ease: 'power2.out' }, 0);
    tl.to('#gl', { opacity: 0.5, duration: 0.4, ease: 'power1.inOut' }, 11.4);

    /* ------------------------------ the bust ------------------------------ */
    css('bust', { left: BCX - 0.64 * BW, top: BTOP, width: BW, height: BH });
    css('bustwrap', {});
    gsap.set('#bustwrap', { transformOrigin: BCX + 'px ' + (BTOP + 0.5 * BH) + 'px' });
    gsap.set('#bust', { opacity: 0, filter: 'blur(10px)' });
    tl.to('#bust', { opacity: 1, filter: 'blur(0px)', duration: 2.4, ease: P2IO }, 2.5);
    tl.to('#bustwrap', { scale: 1.04, duration: 1.2, ease: 'sine.inOut' }, 5.2);
    tl.to('#bustwrap', { scale: 0.9, x: wide ? CX - BCX : 0, opacity: 0.3, duration: 1.0, ease: P2IO }, 6.4);
    tl.to('#bustwrap', { opacity: 0, duration: 0.3, ease: 'power1.in' }, 11.35);

    /* ------------------------------ 14 forms ------------------------------ */
    const FIDX = [0, 3, 6, 8, 10, 1, 4, 7, 9, 11, 2, 5, 3, 8];
    const SZ = [1.0, 1.15, .9, 1.05, 1.0, .95, 1.15, 1.0, .9, 1.1, 1.0, .95, 1.05, .9];
    const R0 = [150, -170, 190, -130, 160, -200, 140, -160, 180, -150, 170, -190, 130, -140];
    const R1 = [-14, 18, -8, 12, -18, 10, -6, 16, -12, 8, -16, 14, -10, 20];
    const NF = 14;
    const rightPts = [[.74,.20],[.76,.28],[.73,.36],[.77,.44],[.74,.50],[.76,.58],[.72,.42]];
    const leftPts = [[.55,.27],[.57,.36],[.54,.45],[.58,.54],[.55,.62],[.56,.31],[.57,.64]];
    const edgeDist = (dx, dy) => Math.min(dx ? (W / 2) / Math.abs(dx) : 1e9, dy ? (H / 2) / Math.abs(dy) : 1e9);
    const formsEl = $('forms'), blEl = $('blooms');
    for (let i = 0; i < NF; i++) {
      const w = L.fb * SZ[i];
      const el = document.createElement('div'); el.className = 'fm'; el.id = 'f' + i;
      el.innerHTML = `<img src="assets/forms/f${FIDX[i]}.webp" alt="" style="${i >= 12 ? 'transform:scaleX(-1)' : ''}">`;
      css(el, { width: w }); formsEl.appendChild(el);
      const rx = L.rest[i][0] * W, ry = L.rest[i][1] * H;
      let dx = rx - CX, dy = ry - CY; const n = Math.hypot(dx, dy) || 1; dx /= n; dy /= n;
      const k = edgeDist(dx, dy);
      const early = i < 6;
      const near = i < 3, dr = n;
      const dd = near ? dr + 0.3 * (k - dr) : k + (early ? 0 : 420);
      const sx = CX + dx * dd, sy = CY + dy * dd;
      const delay = early ? 0 : 0.1 * (i - 5);
      const dur = Math.min(1.7, 2.4 - delay);
      gsap.set(el, { xPercent: -50, yPercent: -50, transformOrigin: '50% 50%' });
      tl.fromTo(el, { x: sx, y: sy, scale: near ? 1.9 : early ? 2.8 : 2.5, rotation: R0[i], filter: near ? 'blur(3px)' : 'blur(8px)' }, { x: rx, y: ry, scale: 1, rotation: R1[i], filter: 'blur(0px)', duration: dur, ease: P3 }, delay);
      /* assembly: converge on the fracture line */
      const pt = (i % 2 === 0 ? rightPts : leftPts)[Math.floor(i / 2)];
      const px = fx(pt[0]), py = fy(pt[1]);
      const t0 = 2.4 + i * 0.12, arr = t0 + 0.7;
      tl.to(el, { x: px, y: py, scale: 0.3, rotation: R1[i] * 3, duration: 0.7, ease: P2IO }, t0);
      tl.to(el, { opacity: 0, duration: 0.2, ease: 'power1.in' }, t0 + 0.5);
      const bl = document.createElement('div'); bl.className = 'bloom'; bl.id = 'bl' + i;
      css(bl, { width: wide ? 300 : 240, height: wide ? 300 : 240 }); blEl.appendChild(bl);
      gsap.set(bl, { xPercent: -50, yPercent: -50, x: px, y: py, scale: 0.2, opacity: 0 });
      tl.to(bl, { scale: 1.4, opacity: 0.55, duration: 0.22, ease: 'power2.out' }, arr - 0.06);
      tl.to(bl, { opacity: 0, scale: 1.8, duration: 0.5, ease: 'power1.out' }, arr + 0.16);
    }

    /* ------------------------------ headline ------------------------------ */
    const HD = L.head;
    ['h1', 'h2'].forEach((id, j) => { css(id, { left: HD.left, top: HD.top + j * HD.rh, fontSize: HD.size, opacity: 0 }); });
    $('h1').textContent = 'Every file tool.'; $('h2').textContent = 'One app.';
    rise('#h1', 0.9, 24, 0.9);
    rise('#h2', 3.6, 24, 0.9);
    tl.to(['#h1', '#h2'], { y: -80, opacity: 0, duration: 0.6, ease: 'power2.in' }, 6.4);

    /* ------------------------------ five forms peel off and orbit ------------------------------ */
    const OIDX = [0, 3, 6, 8, 10];
    const ob = { e: 0, spin: 0, m: 1, cx: BCX };
    const orbEl = $('orbit'), ors = [];
    OIDX.forEach((fi, k) => {
      const el = document.createElement('div'); el.className = 'fm'; el.id = 'o' + k;
      el.innerHTML = `<img src="assets/forms/f${fi}.webp" alt="">`;
      css(el, { width: L.fb * 0.95 }); orbEl.appendChild(el); gsap.set(el, { xPercent: -50, yPercent: -50, opacity: 0 }); ors.push(el);
    });
    const peelPts = [[.74,.28],[.55,.36],[.76,.5],[.57,.5],[.73,.4]];
    const updOrbit = () => {
      ors.forEach((el, k) => {
        const a = -0.6 + k * (Math.PI * 2 / 5) + ob.spin;
        const d = Math.sin(a);
        const ox = ob.cx + L.orb.rx * Math.cos(a), oy = L.orb.cy + L.orb.ry * d * 0.8;
        const px = fx(peelPts[k][0]), py = fy(peelPts[k][1]);
        const e = ob.e;
        const s = lerp(0.3, L.orb.s * (1 + 0.16 * d), e);
        gsap.set(el, { x: lerp(px, ox, e), y: lerp(py, oy, e), scale: s, rotation: 20 * k + ob.spin * 40, opacity: Math.min(1, e * 3) * ob.m, filter: 'blur(' + (Math.max(0, d - 0.45) * 7).toFixed(2) + 'px)' });
      });
    };
    updOrbit();
    tl.to(ob, { e: 1, duration: 1.1, ease: 'power2.out', onUpdate: updOrbit }, 5.3);
    tl.to(ob, { spin: 1.0, duration: 6.3, ease: 'none', onUpdate: updOrbit }, 5.3);
    tl.to(ob, { m: 0.4, duration: 0.8, ease: 'power1.inOut', onUpdate: updOrbit }, 6.4);
    if (wide) tl.to(ob, { cx: CX, duration: 1.0, ease: P2IO, onUpdate: updOrbit }, 6.4);
    tl.to(ob, { m: 0, duration: 0.3, ease: 'power1.in', onUpdate: updOrbit }, 11.3);

    /* ------------------------------ the command bar ------------------------------ */
    const B = L.bar;
    const barEl = $('bar');
    if (!wide) barEl.classList.add('tall');
    ['fs', 'fs2', 'big', 'rad', 'bt', 'ft', 'padl', 'gap', 'ic', 'fiw', 'rp'].forEach(k => barEl.style.setProperty('--' + k, B[k] + 'px'));
    css(barEl, { left: (W - B.w) / 2, top: (H - B.h) / 2, width: B.w, height: B.h });
    const ICONS = {
      pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
      img: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1.6"/><path d="m20 15-4-4-8 8"/></svg>',
      id: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M14 10h4M14 14h4M6 16h6"/></svg>',
    };
    const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="m8 12.5 2.7 2.7L16.5 9.5"/></svg>';
    const RET = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6v6a2 2 0 0 1-2 2H5"/><path d="m9 10-4 4 4 4"/></svg>';
    const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg>';
    const fi = k => `<span class="fi ${k}">${ICONS[k]}</span>`;
    const row = (k, name, desc, right) => `<div class="row">${fi(k)}<b>${name}</b><span class="d">${desc}</span><span class="k">${right}</span></div>`;
    const sel = (k, name, desc) => `<div class="row sel" id="selrow">${fi(k)}<b>${name}</b><span class="d">${desc}</span><span class="kbd">${RET}</span>`;
    const REST = `<div class="sec">Suggested</div>${row('img', 'Resize to exact KB', 'Fit a photo to the exact pixels and KB a form or exam portal asks for.', 'Image')}${row('pdf', 'Compress PDF', 'Make this PDF small enough to email or upload.', 'PDF')}${row('id', 'Print sheet', 'Put several copies of this photo on one sheet for the print shop.', 'ID and forms')}<div class="sec">Recent</div>${row('img', 'Resize to exact KB', 'signature.jpg', '2 min ago')}`;
    const FILEL = `<div class="sec">For this PDF document, best first</div>${sel('pdf', 'Compress PDF', 'Make this PDF small enough to email or upload.').replace('id="selrow"', '').replace('row sel', 'row sel plain')}</div>${row('pdf', 'Split PDF', 'Cut this PDF into parts by page ranges or every N pages.', 'PDF')}${row('pdf', 'Merge PDF', 'Put these PDFs in one file.', 'PDF')}${row('pdf', 'OCR', 'Make this scan searchable and selectable.', 'PDF')}${row('pdf', 'PDF to images', 'Turn each page of this PDF into a PNG or JPG picture.', 'PDF')}`;
    const MATCH = `<div class="sec">Best match</div>${sel('pdf', 'Compress PDF', 'Make this PDF small enough to email or upload.')}<div class="opts"><span id="o1">Target<b>under size</b></span><span id="o2">Stay under<b>2 MB</b></span></div><span class="est" id="est">4.2 MB to at most 2 MB</span></div><div class="sec">Also matches</div>${row('pdf', 'Split PDF', 'Cut this PDF into parts by page ranges or every N pages.', 'PDF')}${row('pdf', 'Merge PDF', 'Put these PDFs in one file.', 'PDF')}`;
    const RUN = `<div class="run" style="position:absolute;inset:0"><b>Running Compress PDF</b><div class="prog"><i id="progi"></i></div><small><span>Lease.pdf</span><span id="pct">0%</span></small></div>`;
    const DONE = `<h4><span id="chk" style="display:grid">${CHECK}</span><span>4.2 MB to 880 KB, 79% smaller</span></h4><div class="ba"><div><small>Before</small><strong>4.2 MB</strong></div><span>${ARROW}</span><div class="after"><small>After</small><strong id="after">4.2 MB</strong></div></div><div class="out">Written next to the original<br><span>Lease (compressed).pdf</span></div>`;
    barEl.innerHTML = `
      <div class="bar-top">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <div class="q"><span id="typed"></span><span class="caret" id="caret"></span><span class="ph" id="ph">${wide ? 'Search 31 tools and your files, or drop anything' : 'Search tools or drop a file'}</span></div>
        <div class="fchip" id="fchip"><span class="fi pdf">${ICONS.pdf}</span><span>Lease.pdf</span><small>4.2 MB</small><i>&times;</i></div>
      </div>
      <div class="bar-body" data-layout-allow-overlap>
        <div class="view" id="v-list" style="opacity:1">${REST}</div>
        <div class="view" id="v-list2">${FILEL}</div>
        <div class="view" id="v-match">${MATCH}</div>
        <div class="view" id="v-run">${RUN}</div>
        <div class="view done" id="v-done">${DONE}</div>
      </div>
      <div class="bar-foot"><span class="l"><img src="assets/icon.svg" alt="">Panoply <span>${wide ? '&nbsp;Everything runs on this computer' : '&nbsp;Runs on this computer'}</span></span><span class="r">Run <span class="kbd">${RET}</span></span></div>`;
    gsap.set(barEl, { y: 220, opacity: 0 });
    tl.to(barEl, { y: 0, opacity: 1, duration: 0.8, ease: P3 }, 6.4);
    const xfade = (a, b, t, d = 0.22) => { tl.to(a, { opacity: 0, duration: d, ease: 'power1.in' }, t); tl.to(b, { opacity: 1, duration: d, ease: 'power1.out' }, t); };
    gsap.set('#fchip', { y: -30, scale: 0.9, opacity: 0 });
    tl.to('#fchip', { y: 0, scale: 1, opacity: 1, duration: 0.45, ease: P3 }, 6.8);
    tl.set('#ph', { textContent: 'What should happen?' }, 6.8);
    xfade('#v-list', '#v-list2', 6.95);
    const ty = { n: 0 }, ask = 'under 2 mb';
    tl.set('#ph', { opacity: 0 }, 7.2);
    tl.to(ty, { n: ask.length, duration: 0.8, ease: 'none', onUpdate: () => { $('typed').textContent = ask.slice(0, Math.round(ty.n)); } }, 7.2);
    xfade('#v-list2', '#v-match', 8.2, 0.2);
    gsap.set('#selrow', { backgroundColor: 'rgba(25,40,61,0)' });
    tl.to('#selrow', { backgroundColor: 'rgba(25,40,61,1)', duration: 0.2, ease: 'power1.out' }, 8.2);
    gsap.set(['#o1', '#o2'], { y: 8, opacity: 0, scale: 0.94 });
    tl.to('#o1', { y: 0, opacity: 1, scale: 1, duration: 0.3, ease: P3 }, 8.3);
    tl.to('#o2', { y: 0, opacity: 1, scale: 1, duration: 0.3, ease: P3 }, 8.4);
    gsap.set('#est', { y: 6 });
    tl.to('#est', { y: 0, opacity: 1, duration: 0.35, ease: 'power2.out' }, 8.5);
    tl.to('#selrow', { backgroundColor: 'rgba(34,64,106,1)', duration: 0.08, ease: 'power1.out' }, 9.0);
    tl.to('#selrow', { backgroundColor: 'rgba(25,40,61,1)', duration: 0.12, ease: 'power1.in' }, 9.08);
    tl.set('#caret', { opacity: 0 }, 9.2);
    xfade('#v-match', '#v-run', 9.2, 0.15);
    const pr = { p: 0 };
    tl.to(pr, { p: 1, duration: 0.7, ease: 'power1.inOut', onUpdate: () => { $('progi').style.transform = 'scaleX(' + pr.p.toFixed(4) + ')'; $('pct').textContent = Math.round(pr.p * 100) + '%'; } }, 9.2);
    xfade('#v-run', '#v-done', 9.95, 0.2);
    gsap.set('#chk', { scale: 0.5, opacity: 0, transformOrigin: '50% 50%' });
    tl.to('#chk', { scale: 1, opacity: 1, duration: 0.45, ease: 'back.out(1.6)' }, 10.0);
    const cnt = { v: 4200 };
    tl.to(cnt, { v: 880, duration: 0.9, ease: 'power2.out', onUpdate: () => { const v = cnt.v; $('after').textContent = v >= 1000 ? (v / 1000).toFixed(1) + ' MB' : Math.round(v) + ' KB'; } }, 10.2);
    tl.to(barEl, { y: 24, opacity: 0, duration: 0.2, ease: 'power1.in' }, 11.45);

    /* ------------------------------ the set: six murals ------------------------------ */
    const M = L.mural, mEl = $('murals');
    const MUR = [['docs', 'Documents'], ['image', 'Images'], ['sound', 'Sound and video'], ['convert', 'Everything else'], ['share', 'Sharing'], ['plugins', 'Plugins']];
    const mw = M.h * 900 / 1117;
    MUR.forEach((m, k) => {
      const t = 11.6 + k * 0.8;
      const d = document.createElement('div'); d.className = 'abs blend'; d.id = 'm' + k;
      css(d, { left: M.cx - mw / 2, top: M.top, width: mw, height: M.h, opacity: 0 });
      d.innerHTML = `<img src="assets/${m[0]}.webp" alt="" style="left:0;top:0;width:${mw}px;height:${M.h}px">`;
      mEl.appendChild(d);
      const lb = document.createElement('div'); lb.className = 'abs'; lb.setAttribute('data-layout-allow-overlap', ''); lb.style.cssText = 'color:#F4F0E8;font-weight:600;letter-spacing:-.02em;line-height:1.1;white-space:nowrap'; lb.id = 'ml' + k; lb.textContent = m[1];
      css(lb, { left: 0, width: W, textAlign: 'center', top: M.labTop, fontSize: M.lab, opacity: 0 });
      $('mlabels').appendChild(lb);
      const inT = k === 0 ? 0.15 : 0.15;
      tl.fromTo(d, { scale: 1.0 }, { scale: 1.06, duration: 0.95, ease: 'none' }, t);
      tl.to([d, lb], { opacity: 1, duration: inT, ease: 'power1.out' }, t);
      tl.fromTo(lb, { y: 10 }, { y: 0, duration: 0.4, ease: P3 }, t);
      tl.to([d, lb], { opacity: 0, duration: 0.15, ease: 'power1.in' }, t + 0.8);
    });

    /* ------------------------------ silence: Harpocrates ------------------------------ */
    const PV = L.priv, pw = PV.h * 900 / 1117;
    css('pm', { left: PV.cx - pw / 2, top: PV.top, width: pw, height: PV.h });
    css($('pm').querySelector('img'), { left: 0, top: 0, width: pw, height: PV.h });
    css('gr', { width: PV.h * 1.5, height: PV.h * 1.5, left: PV.cx - PV.h * 0.75, top: PV.top + PV.h / 2 - PV.h * 0.75 });
    const PT = PV.t;
    css('pt1', { left: PT.left, top: PT.top, fontSize: PT.size, opacity: 0, textAlign: wide ? 'left' : 'left' });
    css('pt2', { left: PT.left, top: PT.top + PT.rh, fontSize: PT.size, opacity: 0 });
    $('pt1').textContent = 'Nothing leaves'; $('pt2').textContent = 'your computer.';
    tl.to('#gl', { opacity: 0, duration: 0.15, ease: 'power1.in' }, 16.4);
    tl.fromTo('#gr', { opacity: 0, scale: 0.92 }, { opacity: 0.85, scale: 1, duration: 0.5, ease: 'power2.out' }, 16.4);
    tl.to('#pm', { opacity: 1, duration: 0.15, ease: 'power1.out' }, 16.4);
    tl.fromTo('#pm', { scale: 1.0 }, { scale: 1.06, duration: 2.0, ease: 'none' }, 16.4);
    rise('#pt1', 16.65, 22, 0.8);
    rise('#pt2', 16.85, 22, 0.8);
    tl.set(['#pm', '#pt1', '#pt2', '#gr'], { opacity: 0 }, 18.4);

    /* ------------------------------ end card ------------------------------ */
    const E = L.end;
    const ICX = W / 2, ICY = E.cy;
    css('eicon', { left: ICX - E.icon / 2, top: ICY - E.icon / 2, width: E.icon, height: E.icon, opacity: 0 });
    css('ge', { width: wide ? 1400 : 1300, height: wide ? 583 : 542, left: ICX - (wide ? 700 : 650), top: ICY - (wide ? 291 : 271) });
    const lineCss = (id, o, txt) => { css(id, Object.assign({ left: 0, width: W, textAlign: 'center', opacity: 0 }, o)); if (txt !== undefined) $(id).textContent = txt; };
    lineCss('ename', { top: E.name.top, fontSize: E.name.size });
    lineCss('etag', { top: E.tag.top, fontSize: E.tag.size });
    lineCss('eurl', { top: E.url.top, fontSize: E.url.size });
    lineCss('esmall', { top: E.small.top, fontSize: E.small.size });
    $('esmall').innerHTML = E.smallLines.join('<br>');
    tl.fromTo('#ge', { opacity: 0 }, { opacity: 0.75, duration: 0.8, ease: 'power2.out' }, 18.4);
    tl.fromTo('#eicon', { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.7, ease: P3 }, 18.5);
    rise('#ename', 19.0, 24, 0.8);
    rise('#etag', 19.3, 24, 0.8);
    rise('#eurl', 19.6, 20, 0.8);
    rise('#esmall', 20.0, 18, 0.7);
    const eo = { e: 0, spin: 0 }, eoEl = $('eorbit'), eors = [];
    OIDX.forEach((fi2, k) => {
      const el = document.createElement('div'); el.className = 'fm'; el.id = 'e' + k;
      el.innerHTML = `<img src="assets/forms/f${fi2}.webp" alt="">`;
      css(el, { width: E.fb }); eoEl.appendChild(el); gsap.set(el, { xPercent: -50, yPercent: -50, opacity: 0 }); eors.push(el);
    });
    const updEnd = () => {
      eors.forEach((el, k) => {
        const a = -2.2 + k * (Math.PI * 2 / 5) + eo.spin;
        const d = Math.sin(a);
        const ox = ICX + E.rx * Math.cos(a), oy = ICY + E.ry * d;
        const dx = Math.cos(a), dy = Math.sin(a) * 0.9;
        const far = edgeDist(dx, dy);
        const sx = ICX + dx * (far + 380), sy = ICY + dy * (far + 380);
        const e = eo.e;
        gsap.set(el, { x: lerp(sx, ox, e), y: lerp(sy, oy, e), scale: lerp(2.4, 0.95 * (1 + 0.12 * d), e), rotation: lerp(k % 2 ? -150 : 160, 18 * k - 30, e), opacity: Math.min(1, e * 5), filter: 'blur(' + lerp(8, Math.max(0, d - 0.5) * 6, e).toFixed(2) + 'px)' });
      });
    };
    updEnd();
    tl.to(eo, { e: 1, duration: 1.5, ease: P3, onUpdate: updEnd }, 18.4);
    tl.to(eo, { spin: 0.7, duration: 2.4, ease: 'power2.out', onUpdate: updEnd }, 18.4);

    tl.to({}, { duration: 0.001 }, 21.99);
    window.__timelines[ID] = tl;
    tl.seek(0);
  })();
  </script>
</template>
