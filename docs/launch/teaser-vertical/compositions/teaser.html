egory":"pdf"},{"id":"files.hash","name":"Hash files","category":"files"}]};

    const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

    const $ = (id) => document.getElementById(id);
    const html = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };

    /* ------------------------------------------------------------ the fan mark, same path as the app icon */
    const CARD = "M316.414 65.569C331.243 65.569 338.657 65.569 344.722 67.279A45.552 45.552 0 0 1 376.199 98.757C377.909 104.821 377.909 112.235 377.909 127.065L377.909 382.508C377.909 397.338 377.909 404.752 376.199 410.816A45.552 45.552 0 0 1 344.722 442.294C338.657 444.004 331.243 444.004 316.414 444.004L229.163 444.004C214.334 444.004 206.919 444.004 200.855 442.294A45.552 45.552 0 0 1 169.378 410.816C167.668 404.752 167.668 397.338 167.668 382.508L167.668 127.065C167.668 112.235 167.668 104.821 169.378 98.757A45.552 45.552 0 0 1 200.855 67.279C206.919 65.569 214.334 65.569 229.163 65.569Z";
    const fanSVG = (id, a, b, c) => `<svg viewBox="0 0 544 544" fill="none"><path id="${id}-a" d="${CARD}" fill="${a}"/><path id="${id}-b" d="${CARD}" fill="${b}"/><path id="${id}-c" d="${CARD}" fill="${c}"/></svg>`;
    const FAN_ONBLUE = ["rgba(255,255,255,.42)", "rgba(255,255,255,.62)", "#ffffff"];
    const FAN_NATIVE = ["#727884", "#808692", "#2d6cdf"];
    const PIVOT = "272.788 612.197";
    $("tv-fan").innerHTML = fanSVG("tv-f1", ...FAN_ONBLUE);
    $("tv-endfan").innerHTML = fanSVG("tv-f2", ...FAN_ONBLUE);
    $("tv-fanmini").innerHTML = fanSVG("tv-f3", ...FAN_NATIVE);
    gsap.set("#tv-f3-a", { rotation: -20, svgOrigin: "272.788 612.197" });
    gsap.set("#tv-f3-b", { rotation: 20, svgOrigin: "272.788 612.197" });

    /* ------------------------------------------------------------ cold open: an unbranded window wall */
    const K = ["#e5484d", "#3e63dd", "#30a46c", "#f76b15", "#8e4ec6", "#d6409f"];
    const WT = [
      (k) => `<div class="drop" style="--k:${k}">Drop your PDF here</div><p>2 free tasks per day.</p>`,
      (k) => `<div class="file" style="--k:${k}"><u></u>scan_final_v3.pdf</div><div class="prog" style="--k:${k}"><b></b></div><p>Uploading... 43%</p>`,
      (k) => `<h4>Daily limit reached</h4><div class="price" style="--k:${k}">$9<small> / month</small></div><span class="btn" style="--k:${k}">Go Premium</span>`,
      (k) => `<h4>Sign up to download</h4><p>Remove the watermark.</p><span class="btn" style="--k:${k}">Create account</span>`,
      (k) => `<h4>Select all traffic lights</h4><div class="grid3"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><span class="btn" style="--k:${k};position:absolute;right:30px;bottom:24px">Verify</span>`,
      (k) => `<h4>Where to send it?</h4><div class="field">you@email.com</div><span class="btn" style="--k:${k}">Email me the link</span>`,
      (k) => `<h4>We value your privacy</h4><div class="lines"><i style="width:92%"></i><i style="width:80%"></i><i style="width:58%"></i></div><span class="btn" style="--k:${k}">Accept all</span>`,
      (k) => `<div class="banner" style="--k:${k}">File too large. Max 25 MB.</div><p>Try Premium.</p>`,
    ];
    const WX = [-80, 290, 660], WY = [-30, 255, 540, 825, 1110, 1395, 1680];
    const wins = [];
    WY.forEach((y, ri) => WX.forEach((x, ci) => {
      const i = ri * WX.length + ci, k = K[i % K.length];
      const jx = Math.round((rnd() - .5) * 60), jy = Math.round((rnd() - .5) * 50);
      const rot = (rnd() - .5) * 6.8, sc = 0.96 + rnd() * 0.12;
      const w = html(`<div class="tv-win" data-layout-ignore style="left:${x + jx}px;top:${y + jy}px"><div class="bar"><i></i><i></i><i></i><span class="url"></span></div><div class="body">${WT[(i * 3 + ri) % WT.length](k)}</div></div>`);
      $("tv-wall0").appendChild(w);
      gsap.set(w, { rotation: rot, scale: sc });
      wins.push({ el: w, rot, sc });
    }));
    /* landing order: seeded shuffle; 4 stand already at beat 0, the rest land two per half beat */
    const order = wins.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }

    /* ------------------------------------------------------------ typed frames, 16ths */
    const typed = $("tv-typed");
    for (let k = 1; k <= 11; k++) {
      const n = String(k).padStart(2, "0");
      typed.appendChild(html(`<img id="tv-t${k}" src="assets/captures/demo-light-${n}.png" alt="" style="opacity:0">`));
    }
    typed.style.cssText = "position:absolute;inset:0";
    $("tv-r-from").textContent = RESULT.from;
    $("tv-r-to").textContent = RESULT.to;
    $("tv-pct").textContent = "0";
    $("tv-cnt").textContent = "2";

    /* ------------------------------------------------------------ tools: cards interleaved by category, chips */
    const COL = { pdf: "#ff453a", image: "#bf5af2", media: "#ff7828", id: "#ff9f0a", files: "#1a84f3" };
    const CATNAME = { pdf: "PDF", image: "Images", media: "Video", id: "ID and forms", files: "Files" };
    const CATS = ["pdf", "image", "media", "id", "files"];
    const IC = {
      pdf: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>',
      image: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 9"/>',
      media: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 4v16M16 4v16M3 9h5M3 15h5M16 9h5M16 15h5"/>',
      id: '<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.7 1.8-2.4 3-2.4s2.4.7 3 2.4M14.5 10h4M14.5 14h3"/>',
      files: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    };
    const byCat = {}; CATS.forEach(c => byCat[c] = tools.tools.filter(t => t.category === c));
    const mixed = [];
    for (let n = 0; mixed.length < tools.tools.length; n++) CATS.forEach(c => { if (byCat[c][n]) mixed.push(byCat[c][n]); });
    const cards = mixed.map((t, i) => {
      const col = i % 2, row = Math.floor(i / 2);
      const el = html(`<div class="tv-tc" style="left:${col * 432}px;top:${row * 132}px;--k:${COL[t.category]}"><span class="tic"><span class="base"><svg viewBox="0 0 24 24">${IC[t.category]}</svg></span><span class="lit"><svg viewBox="0 0 24 24">${IC[t.category]}</svg></span></span><span class="tn">${t.name}</span></div>`);
      $("tv-board").appendChild(el);
      return { el, col, row, cat: t.category, lit: el.querySelector(".lit") };
    });
    CATS.forEach(c => {
      $("tv-chips").appendChild(html(`<div class="tv-chip" id="tv-chip-${c}" style="--k:${COL[c]}"><i></i>${CATNAME[c]}<span class="on"><i></i>${CATNAME[c]}</span></div>`));
    });

    /* ------------------------------------------------------------ plugin: three file chips */
    const FCH = ["module.toml", "word_count.wasm", "module.wit"];
    FCH.forEach((n, i) => $("tv-fchips").appendChild(html(`<div class="tv-fchip" id="tv-fch${i}" style="top:0"><u></u>${n}</div>`)));

    /* ------------------------------------------------------------ the community wall: two real modules, the rest wait for you */
    const REAL = [
      { name: "Word count", sum: "Count words and lines." },
      { name: "Slugify lines", sum: "Make clean slugs." },
    ];
    const slots = [];
    for (let i = 0; i < 8; i++) {
      const col = i % 2, row = Math.floor(i / 2);
      const real = REAL[i];
      const pos = `left:${col * 432}px;top:${row * 196}px`;
      const el = real
        ? html(`<div class="tv-slot full" style="${pos}"><span class="tag">Example</span><div class="nm">${real.name}</div><div class="sm">${real.sum}</div></div>`)
        : html(`<div class="tv-slot dash" style="${pos}">+ your tool</div>`);
      $("tv-slots").appendChild(el);
      slots.push(el);
    }

    $("tv-endline").textContent = END_LINE;

    /* ------------------------------------------------------------ grain, painted once from the seeded LCG */
    (() => {
      const c = $("tv-grain"), g = c.getContext("2d"), d = g.createImageData(270, 480);
      let s = 12345; const r = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
      for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() - .5) * 90; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
      g.putImageData(d, 0, 0);
    })();

    /* stacked scenes share slots in time; mark the intentional layering for the layout audit */
    document.querySelectorAll("#tv-words .w, #tv-stop span, #tv-hot .ln, #tv-pct-wrap span, #tv-tools-h span, #tv-chips .tv-chip, #tv-plug-h .ln, #tv-wall-h .ln, #tv-stack .t span, #tv-end > div, #tv-strip, #tv-slots .tv-slot, #tv-board .tv-tc, #tv-mod div, #tv-mod span, .tv-key").forEach(n => { n.setAttribute("data-layout-allow-overlap", ""); n.setAttribute("data-layout-allow-occlusion", ""); });
    document.querySelectorAll("#root .layer, #tv-end, #tv-board, #tv-bar, #tv-mod, #tv-folder").forEach(n => n.setAttribute("data-layout-allow-overflow", ""));

    /* ------------------------------------------------------------ timeline */
    gsap.set("#tv-bar", { transformOrigin: "50% 0%" });
    const tl = gsap.timeline({ paused: true });
    const EO = "expo.out";
    /* entrance: transform on its own expo.out tween (0.3 to 0.45 s), opacity on its own power1.out 0.25 s tween, both start ON the beat */
    const en = (sel, b, o = {}) => {
      const t = at(b), from = { y: o.y === undefined ? 40 : o.y }, to = { y: 0, duration: o.d || 0.4, ease: EO, stagger: o.s || 0 };
      if (o.x !== undefined) { from.x = o.x; to.x = 0; }
      if (o.sc) { from.scale = o.sc; to.scale = 1; }
      tl.fromTo(sel, from, to, t);
      tl.fromTo(sel, { opacity: 0 }, { opacity: o.to === undefined ? 1 : o.to, duration: 0.25, ease: "power1.out", stagger: o.s || 0 }, t);
    };
    /* ONE TRANSITION RULE: the outgoing content fades to 0 in 0.15 s (power1.in), ENDING on the beat; the next thing starts on that same beat */
    const out = (sel, endBeat, d = 0.15) => tl.to(sel, { opacity: 0, duration: d, ease: "power1.in", overwrite: "auto" }, at(endBeat) - d);
    const wipe = (sel, b, d = 0.45) => tl.fromTo(sel, { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: d, ease: EO }, at(b));

    /* camera drift, one slow scale per scene layer (the tool grid holds still from beat 15 to the cut) */
    const drift = (sel, b0, b1, s0 = 1, s1 = 1.03) => tl.fromTo(sel, { scale: s0 }, { scale: s1, duration: at(b1) - at(b0), ease: "none" }, at(b0));
    drift("#tv-cold", 0, 8, 1, 1.04);
    drift("#tv-drop", 8, 13.75, 1, 1.03);
    drift("#tv-plug", 18, 24, 1, 1.03);
    drift("#tv-wall", 24, 28, 1, 1.03);
    drift("#tv-stack", 28, 32.5, 1, 1.02);
    drift("#tv-end", 32.5, 36.5, 1, 1.02);

    /* ---- beats 0 to 4.39: the upload chaos, the four words on 0, 1, 2, 3 (frame 0 already full: "Upload." at full opacity, eight windows up) */
    order.forEach((wi, n) => {
      const w = wins[wi];
      if (n < 8) return;
      const slot = Math.min(7, Math.floor((n - 8) / 1.625));
      const b = 0.5 + slot * 0.5;
      tl.fromTo(w.el, { y: 60, scale: w.sc * 1.05, rotation: w.rot }, { y: 0, scale: w.sc, rotation: w.rot, duration: 0.45, ease: EO }, at(b));
      tl.fromTo(w.el, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, at(b));
    });
    tl.fromTo("#tv-w1", { y: 28 }, { y: 0, duration: 0.45, ease: EO }, 0);
    [["#tv-w2", 1], ["#tv-w3", 2], ["#tv-w4", 3]].forEach(([sel, b]) => {
      tl.fromTo(sel, { y: 50 }, { y: 0, duration: 0.45, ease: EO }, at(b));
      tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, at(b));
    });

    /* ---- beats 4.39 to 7.92: the STOP. the words are gone on 4.39, the scrim only deepens, one line glides in */
    out("#tv-words", 4.39);
    tl.fromTo("#tv-deep", { opacity: 0 }, { opacity: 0.92, duration: at(7.92) - at(4.39), ease: "power2.out" }, at(4.39));
    tl.fromTo("#tv-stop span", { y: 44 }, { y: 0, duration: 0.45, ease: EO, stagger: 0.07 }, at(5.0));
    tl.fromTo("#tv-stop span", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out", stagger: 0.07 }, at(5.0));
    out("#tv-stop", 8.0);

    /* ---- beat 8 THE DROP: the ground wipes bottom to top, keycaps down, the real bar opens */
    wipe("#tv-bluescene", 8.0, 0.45);
    en("#tv-hot .hl", 8.0, { y: 56, d: 0.45 });
    en("#tv-keys1", 8.0, { y: -28, d: 0.4 });
    en("#tv-bar", 8.0, { y: 40, d: 0.45, sc: 0.97 });

    /* ---- beat 9 (HIT .76): the file chip lands visibly ON 3.70 s (a 0.2 s move that ends on the beat and holds) */
    tl.fromTo("#tv-chipslice", { y: -30 }, { y: 0, duration: 0.2, ease: "power2.out" }, at(9) - 0.2);
    tl.fromTo("#tv-chipslice", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, at(9) - 0.2);

    /* ---- beats 9.25 to 11.75: "under 50 kb" typed on 16ths from the real frames, all eleven */
    for (let k = 1; k <= 11; k++) {
      tl.set("#tv-t" + k, { opacity: 1 }, at(9.25 + (k - 1) * 0.25));
      if (k > 1) tl.set("#tv-t" + (k - 1), { opacity: 0 }, at(9.25 + (k - 1) * 0.25));
    }
    tl.set("#tv-rest", { opacity: 0 }, at(9.25));
    tl.set("#tv-chipslice", { opacity: 0 }, at(9.25));
    /* a slow push toward the query, easing out on Return, then a drift (the bar reads at phone size) */
    tl.fromTo("#tv-bar", { scale: 1 }, { scale: 1.24, duration: at(12) - at(9), ease: "power1.out", immediateRender: false }, at(9));
    tl.to("#tv-bar", { scale: 1.255, duration: at(13.75) - at(12), ease: "none" }, at(12));

    /* ---- beat 12 (HIT .85): the Return keycap lands on 11.75 and presses on 12, "One hotkey." stays until 12, then a hard swap to the result */
    out("#tv-keys1", 11.75);
    en("#tv-keys2", 11.75, { y: 14, d: 0.3 });
    tl.to("#tv-retkey", { backgroundColor: "rgba(255,255,255,1)", color: "#2d6cdf", borderColor: "rgba(255,255,255,1)", duration: 0.1, ease: "none" }, at(12));
    out("#tv-hot", 12.0);
    tl.set("#tv-t11", { opacity: 0 }, at(12));
    tl.set("#tv-result", { opacity: 1 }, at(12));
    en("#tv-pct-wrap", 12, { y: 56, d: 0.4 });
    tl.fromTo("#tv-pct", { textContent: 0 }, { textContent: RESULT.pct, snap: { textContent: 1 }, duration: 0.12, ease: "power1.out" }, at(12));
    en("#tv-strip", 12, { y: 24, d: 0.4 });

    /* ---- beat 13.75: the payoff has rested 0.45 s; it fades out ENDING on 13.75, then the tools start on that beat */
    out("#tv-pct-wrap, #tv-strip, #tv-bar, #tv-keys2", 13.75);

    /* ---- beats 13.75 to 15: cards two per half beat, the count follows the cards, the ripple starts on 15 (6.167 s) and the count locks there */
    en("#tv-chips", 13.75, { y: 24, d: 0.35 });
    en("#tv-tools-h", 13.75, { y: 50, d: 0.45 });
    [[0, 1, 13.75], [2, 3, 14.25]].forEach(([a, b2, bt]) => [a, b2].forEach(ci => {
      const c = cards[ci], dir = c.col === 0 ? -1 : 1;
      tl.fromTo(c.el, { x: dir * 320, y: 30 }, { x: 0, y: 0, duration: 0.45, ease: EO }, at(bt));
      tl.fromTo(c.el, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, at(bt));
    }));
    const cb0 = 13.75, cb1 = 15, lockLead = 0.08 / BEAT;
    tl.fromTo("#tv-cnt", { textContent: 2 }, { textContent: tools.count, snap: { textContent: 1 }, duration: at(cb1) - at(cb0), ease: (p) => {
      const b = cb0 + p * (cb1 - cb0);
      let v;
      if (b < 14.25) v = 2;
      else if (b < 14.4) v = 2 + 2 * (b - 14.25) / 0.15;
      else if (b < cb1 - lockLead) v = 4;
      else v = 4 + (tools.count - 4) * Math.min(1, (b - (cb1 - lockLead)) / lockLead);
      return (v - 2) / (tools.count - 2);
    } }, at(cb0));
    const rest = cards.filter((c, i) => i > 3);
    const anchor = { col: 0.5, row: 1.5 };
    const dist = (c) => Math.hypot((c.col - anchor.col) * 1.1, c.row - anchor.row);
    const ranked = rest.slice().sort((a, b) => dist(a) - dist(b));
    ranked.forEach((c, rank) => {
      const t0 = at(15) + rank * 0.008;   /* under half a frame at 60 fps between neighbours */
      tl.fromTo(c.el, { y: 40, scale: 0.97 }, { y: 0, scale: 1, duration: 0.35, ease: EO }, t0);
      tl.fromTo(c.el, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, t0);
    });
    /* the board settles into its place exactly at the hit and then holds completely still */
    tl.fromTo("#tv-board", { y: 18 }, { y: 0, duration: at(15) - at(13.75), ease: "none" }, at(13.75));

    /* ---- beat 17.0 (6.987 s, the loudest jump): ALL categories light together; then the grid holds still until the cut on 18 */
    CATS.forEach((c) => {
      tl.to("#tv-chip-" + c + " .on", { opacity: 1, duration: 0.2, ease: "power1.out" }, at(17));
      cards.filter(x => x.cat === c).forEach(x => tl.to(x.lit, { opacity: 1, duration: 0.2, ease: "power1.out" }, at(17)));
    });
    out("#tv-tools", 18.0);

    /* ---- beats 18 to 24: the plugin beat */
    en("#tv-plug-h .ln", 18, { y: 50, d: 0.45, s: 0.08 });
    en("#tv-fan", 18, { y: 40, d: 0.4 });
    tl.fromTo("#tv-f1-a", { rotation: 0, svgOrigin: PIVOT }, { rotation: -20, svgOrigin: PIVOT, duration: 0.45, ease: EO }, at(18.05));
    tl.fromTo("#tv-f1-b", { rotation: 0, svgOrigin: PIVOT }, { rotation: 20, svgOrigin: PIVOT, duration: 0.45, ease: EO }, at(18.05));
    en("#tv-folder", 18.25, { y: 60, d: 0.45 });
    FCH.forEach((n, i) => {
      const ox = [-150, 0, 150][i], bt = 18.75 + i * 0.5;
      tl.fromTo("#tv-fch" + i, { x: ox, y: -300 }, { x: 0, y: 96 - i * 6, duration: 0.45, ease: EO }, at(bt));
      tl.fromTo("#tv-fch" + i, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, at(bt));
    });
    /* the live Modules list arrives with an empty slot; the folder flies into the slot, and on arrival the Word count row lands and the count flips 31 to 32 */
    en("#tv-mod", 20.25, { y: 140, d: 0.45 });
    tl.set("#tv-mr3", { opacity: 0 }, 0);
    tl.to("#tv-folder", { x: -364, y: 158, scale: 0.2, duration: 0.45, ease: EO }, at(20.75));
    out("#tv-folder", 21.1);
    en("#tv-mr3", 21.1, { y: 24, d: 0.4 });
    tl.to("#tv-mslot", { opacity: 0, duration: 0.2, ease: "power1.out" }, at(21.1));
    tl.fromTo("#tv-hc", { textContent: 31 }, { textContent: 32, snap: { textContent: 1 }, duration: 0.12, ease: "none" }, at(21.1));
    out("#tv-plug", 24.0);

    /* ---- beats 24 to 28: the wall of example slots, tiles arrive until beat 27 */
    en("#tv-wall-h .ln", 24, { y: 50, d: 0.45, s: 0.08 });
    slots.forEach((el, i) => en(el, 24 + i * 0.43, { y: 44, d: 0.4, sc: 0.97 }));
    out("#tv-wall", 28.0);

    /* ---- beats 28 to 32.5: one blue ground, the three phrases stack and stay */
    en("#tv-st1 span", 28, { y: 50, d: 0.45 });
    en("#tv-st2 span", 29.5, { y: 50, d: 0.45, s: 0.06 });
    en("#tv-st3 span", 31, { y: 50, d: 0.45, s: 0.06 });
    out("#tv-stack", 32.5);

    /* ---- beat 32.5 (HIT .33): the end card. The fan opens, the name settles. beat 34: the url */
    en("#tv-endfan", 32.5, { y: 36, d: 0.45 });
    tl.fromTo("#tv-f2-a", { rotation: 0, svgOrigin: PIVOT }, { rotation: -20, svgOrigin: PIVOT, duration: 0.45, ease: EO }, at(32.55));
    tl.fromTo("#tv-f2-b", { rotation: 0, svgOrigin: PIVOT }, { rotation: 20, svgOrigin: PIVOT, duration: 0.45, ease: EO }, at(32.55));
    en("#tv-endname", 32.5, { y: 44, d: 0.45 });
    en("#tv-endline", 32.6, { y: 30, d: 0.4 });
    en("#tv-endurl", 34, { y: 24, d: 0.4 });

    window.__timelines["teaser"] = tl;
  </script>
