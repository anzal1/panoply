      const XO = 'expo.out', P2I = 'power2.in', P1O = 'power1.out';
      let seed = 20260915;
      const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

      /* launch date, optional project variable */
      let launch = '';
      try { const v = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : null; if (v && v.launchDate) launch = String(v.launchDate).trim(); } catch (e) {}
      $('tz-eline').textContent = launch ? 'Coming ' + launch : END_LINE;

      /* G1: an entrance starts ON the beat (one frame early at most). The move is expo.out on transform (0.3 to 0.45 s),
         opacity has its own short power1.out tween so nothing pops on its first frame. */
      const enter = (sel, t, o = {}) => {
        const d = o.dur || 0.4;
        tl.fromTo(sel, { x: o.x || 0, y: o.y === undefined ? 26 : o.y, scale: o.s || 1 }, { x: 0, y: 0, scale: 1, duration: d, ease: XO }, t);

      };
      const land = (sel, b, o) => enter(sel, at(b) - 0.017, o);
      const leave = (sel, t, o = {}) =>
        tl.to(sel, { opacity: 0, y: o.y === undefined ? -28 : o.y, x: o.x || 0, scale: o.s || 1, duration: o.dur || 0.3, ease: P2I }, t);
      const wipe = (sel, b, d = 0.55) => tl.fromTo(sel, { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 -3% 0 0)', duration: d, ease: XO }, at(b));
      /* counters never write at build time: the markup carries the first value */
      const count = (el, from, to, b, secs, ease) => {
        const o = { v: from };
        tl.to(o, { v: to, duration: secs, ease: ease || 'power2.out', onUpdate: () => { el.textContent = String(Math.round(o.v)); } }, at(b));
      };
      const drift = (sel, b0, b1, from, to, x0, x1, ease) =>
        tl.fromTo(sel, { scale: from, x: x0 || 0 }, { scale: to, x: x1 || 0, duration: at(b1) - at(b0), ease: ease || 'none' }, at(b0));

      /* the fan mark, same path as docs/assets/panoply-mark.svg, three cards about one pivot */
      const CARD = 'M316.414 65.569C331.243 65.569 338.657 65.569 344.722 67.279A45.552 45.552 0 0 1 376.199 98.757C377.909 104.821 377.909 112.235 377.909 127.065L377.909 382.508C377.909 397.338 377.909 404.752 376.199 410.816A45.552 45.552 0 0 1 344.722 442.294C338.657 444.004 331.243 444.004 316.414 444.004L229.163 444.004C214.334 444.004 206.919 444.004 200.855 442.294A45.552 45.552 0 0 1 169.378 410.816C167.668 404.752 167.668 397.338 167.668 382.508L167.668 127.065C167.668 112.235 167.668 104.821 169.378 98.757A45.552 45.552 0 0 1 200.855 67.279C206.919 65.569 214.334 65.569 229.163 65.569Z';
      const PIVOT = '272.788 612.197';
      const fanSVG = (id) => `<svg viewBox="0 0 544 544" fill="none"><path id="${id}-l" d="${CARD}" fill="rgba(255,255,255,.42)"/><path id="${id}-r" d="${CARD}" fill="rgba(255,255,255,.62)"/><path id="${id}-c" d="${CARD}" fill="#ffffff"/></svg>`;
      const openFan = (id, b, d) => {
        gsap.set([`#${id}-l`, `#${id}-r`], { svgOrigin: PIVOT });

      };

      /* ============================================================ 1. PAIN WALL */
      const K = ['#e5484d', '#3e63dd', '#30a46c', '#f76b15', '#8e4ec6', '#d6409f'];
      const T = [
        k => `<div class="drop" style="--k:${k}">Drop your PDF here<small>Max 25 MB. 2 free tasks per day.</small></div><span class="btn" style="--k:${k}">Select file</span>`,

        k => `<h4>Daily limit reached</h4><p>Upgrade to keep going.</p><div class="price" style="--k:${k}">$9<small> / month, billed yearly</small></div>`,
        k => `<div class="page" style="--k:${k}"><em>WATERMARK</em></div><div style="margin-left:215px"><h4>Your file is ready</h4><p>Sign up to remove the watermark.</p><span class="btn" style="--k:${k}">Create account</span></div>`,
        k => `<h4>Select all squares with traffic lights</h4><div class="grid"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><span class="btn" style="--k:${k};position:absolute;right:30px;bottom:24px">Verify</span>`,
        k => `<h4>Where should we send your file?</h4><div class="field">you@email.com</div><span class="btn" style="--k:${k}">Email me the link</span>`,
        k => `<h4>We value your privacy</h4><div class="lines"><i style="width:92%"></i><i style="width:84%"></i><i style="width:60%"></i></div><div class="two" style="margin-top:20px"><span class="btn" style="--k:#888">Manage</span><span class="btn" style="--k:${k}">Accept all</span></div>`,

      ];
      const xs = [-170, 160, 490, 820, 1150, 1480], ys = [-90, 270, 630];
      const rot0 = [-3.2, 2.4, -1.4, 3.1, -2.2, 1.6, -3.4, 2.8, -0.8, 3.3, -2.6, 1.1, -1.9, 2.2, -3.0];
      const off0 = [[0,20],[-30,-10],[20,0],[10,-30],[0,25],[-20,15],[25,-20],[-10,10],[15,25],[-25,0],[20,-15],[0,0],[-15,30],[30,-5],[-10,-20]];
      const rot = Array.from({ length: 18 }, (_, i) => rot0[(i * 4) % 15]);
      const off = Array.from({ length: 18 }, (_, i) => off0[(i * 7 + 2) % 15]);
      const wall = $('tz-wall');

      ys.forEach((y, ri) => xs.forEach((x, ci) => {

          `<div class="wslot" style="left:${x + off[i][0]}px;top:${y + off[i][1]}px;transform:rotate(${rot[i]}deg) scale(${1.1 + ((i * 7) % 5) * 0.035})"><div class="win" id="tz-win${i}"><div class="bar"><i></i><i></i><i></i><span class="url"></span></div><div class="body">${T[(i * 3 + ri) % T.length](k)}</div></div></div>`);
        wins[i] = $('tz-win' + i);

      const initial = [0, 5, 12, 17, 2, 3, 8, 9, 14, 15];   // already there on frame 0
      const entering = [1, 4, 6, 7, 10, 11, 13, 16];         // one per half beat, beats 0.5 to 4.0
      entering.forEach((wi, n) => enter(wins[wi], at(0.5 + n * 0.5) - 0.017, { y: 26, s: 1.05 }));

      tl.fromTo('#tz-wall', { scale: 1, x: 0 }, { scale: 1.035, x: -26, duration: at(4.39), ease: 'power1.out' }, 0);

      /* the four words on beats 0, 1, 2, 3 (Upload. is already down on frame 0) */
      land('#tz-w2', 1, { y: 30 }); land('#tz-w3', 2, { y: 30 }); land('#tz-w4', 3, { y: 30 });

      dim('#tz-w1', 0.55, 1); dim('#tz-w1', 0.45, 2); dim('#tz-w2', 0.6, 2);

      /* STOP, beat 4.39 to 7.92: the words are fully gone (0.2 s) before the line starts on beat 5, then it holds */
      tl.to('#tz-deep', { opacity: 0.6, duration: 0.4, ease: P1O }, at(4.39));

      land('#tz-pline', 5, { y: 34, dur: 0.45 });

      /* ============================================================ 2. THE DROP, beat 8 */
      wipe('#tz-blue', 8, 0.55);
      /* once the blue ground has covered it, the cold open is switched off */
      tl.set('#tz-pain', { opacity: 0 }, at(8) + 0.6);

      /* the bar opens in place on the rest frame */
      tl.set('#tz-i-rest', { opacity: 1 }, at(8));
      enter('#tz-plate', at(8) + 0.05, { y: 18, s: 0.96 });

      /* a file chip lands ON beat 9 (pixel-exact crop of the captured chip), then the first typed frame replaces it on 9.25 */
      tl.fromTo('#tz-chipwrap', { x: 240, y: -100 }, { x: 0, y: 0, duration: 0.4, ease: XO }, at(9) - 0.18);
      tl.fromTo('#tz-chipwrap', { opacity: 0 }, { opacity: 1, duration: 0.15, ease: P1O }, at(9) - 0.18);
      tl.to('#tz-chipshadow', { opacity: 0, duration: 0.2, ease: 'none' }, at(9.25) - 0.2);
      tl.set('#tz-chipwrap', { opacity: 0 }, at(9.25));

      /* "under 50 kb" on 16ths, frame k at beat 9.25 + (k - 1) * 0.25 */
      const pad = n => (n < 10 ? '0' : '') + n;
      tl.set('#tz-i-rest', { opacity: 0 }, at(9.25));
      for (let k = 1; k <= 11; k++) {
        const b = 9.25 + (k - 1) * 0.25;
        tl.set('#tz-i-' + pad(k), { opacity: 1 }, at(b));
        if (k > 1) tl.set('#tz-i-' + pad(k - 1), { opacity: 0 }, at(b));
      }
      /* a slow push toward the search row, easing out on Return, then a hold that never fully rests */
      tl.fromTo('#tz-push', { scale: 1 }, { scale: 1.2, duration: at(12) - at(9), ease: 'power1.out' }, at(9));
      tl.to('#tz-push', { scale: 1.215, duration: at(14.15) - at(12), ease: 'none' }, at(12));

      /* Return on beat 12: the key presses, the real result cuts in, 35 percent counts up in 0.3 s */
      $('tz-hres').setAttribute('aria-label', RESULT.from + ' to ' + RESULT.to + ', ' + RESULT.pct + '% smaller');
      leave('#tz-keys1', at(11.3), { dur: 0.22, y: -10 });
      land('#tz-keys2', 11.75, { y: 14, dur: 0.3 });
      tl.to('#tz-retkey', { backgroundColor: 'rgba(255,255,255,1)', color: '#2d6cdf', borderColor: 'rgba(255,255,255,1)', duration: 0.1, ease: 'none' }, at(12));
      leave('#tz-hhot', at(12) - 0.22, { dur: 0.22, y: -34 });
      land('#tz-hres', 12, { y: 30 });
      count($('tz-cnt'), 0, RESULT.pct, 12, 0.3, 'power2.out');
      tl.set('#tz-i-res', { opacity: 1 }, at(12));
      tl.set('#tz-i-11', { opacity: 0 }, at(12));
      tl.fromTo('#tz-plate', { scale: 0.985 }, { scale: 1, duration: 0.4, ease: XO, immediateRender: false }, at(12));

      /* the payoff holds from beat 12.3 to beat 14, then leaves upward before the tools arrive */
      const outT = at(14) - 0.15;
      tl.to('#tz-plate', { opacity: 0, y: -40, scale: 0.92, duration: 0.3, ease: P2I }, outT);
      leave('#tz-keys2', outT, { dur: 0.3, y: -24 });
      leave('#tz-hres', outT, { dur: 0.3, y: -34 });

      /* ============================================================ 3. THE TOOLS, beats 14 to 18 */
      const CATS = [['pdf', 'PDF', '#ff453a'], ['id', 'ID and forms', '#ff9f0a'], ['image', 'Images', '#bf5af2'], ['media', 'Video', '#ff7828'], ['files', 'Files', '#1a84f3']];
      const GLYPH = {
        pdf: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>',
        image: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 9"/>',
        media: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 4v16M16 4v16M3 9h5M3 15h5M16 9h5M16 15h5"/>',
        id: '<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.7 1.8-2.4 3-2.4s2.4.7 3 2.4M14.5 10h4M14.5 14h3"/>',
        files: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
      };
      const colOf = c => CATS.find(x => x[0] === c)[2];
      const sorted = CATS.flatMap(c => DATA.tools.filter(t => t.category === c[0]));
      const TOTAL = DATA.count;
      const grid = $('tz-grid');
      const GX = 600, GY = 107, PW = 300, PH = 96, GAPX = 16, GAPY = 14;
      const pills = sorted.map((t, i) => {
        const col = Math.floor(i / 8), row = i % 8, k = colOf(t.category);
        const x = GX + col * (PW + GAPX), y = GY + row * (PH + GAPY);
        grid.insertAdjacentHTML('beforeend',
          `<div class="pill" id="tz-p${i}" style="left:${x}px;top:${y}px;--k:${k}"><span class="ic"><i class="tb"></i><svg class="g0" viewBox="0 0 24 24">${GLYPH[t.category]}</svg><svg class="g1" viewBox="0 0 24 24">${GLYPH[t.category]}</svg></span><span class="nm">${t.name}</span><i class="ring"></i></div>`);
        return { el: $('tz-p' + i), cat: t.category, cx: x + PW / 2, cy: y + PH / 2, i };
      });
      /* nothing of the tools scene starts before beat 14. Four cards on quarter beats, then the ripple on 15 */
      const early = pills.filter(p => p.i >= 24 && p.i <= 27);
      const later = pills.filter(p => !early.includes(p));
      early.forEach((p, n) => enter(p.el, at(14 + n * 0.25) - 0.017, { x: 150, y: 56 }));
      const GCX = GX + (4 * PW + 3 * GAPX) / 2;
      later.forEach(p => {
        const dist = Math.hypot(p.cx - GCX, p.cy - 540), dx = (p.cx - GCX) / (dist || 1), dy = (p.cy - 540) / (dist || 1);
        enter(p.el, at(15) - 0.017 + dist * 0.0004, { x: dx * 70, y: dy * 70 + 30, s: 0.94 });
      });

      /* ONE monotone count, 1 to tools.count, ending exactly on beat 15 (the strongest hit); never below the cards on screen */
      land('#tz-count', 14, { y: 30 });
      count($('tz-cnt2'), 1, TOTAL, 14, at(15) - at(14), 'power2.in');

      /* categories, listed at the left, light in a quick row from the 16.5 hit */
      const cats = $('tz-cats');
      CATS.forEach((c, i) => {
        const n = DATA.tools.filter(t => t.category === c[0]).length;
        cats.insertAdjacentHTML('beforeend', `<div class="cat" id="tz-cat${i}"><i></i><b>${c[1]}</b><em>${n}</em></div>`);

      CATS.forEach((c, i) => {
        const t0 = at(16.5 + i * 0.1), lit = pills.filter(p => p.cat === c[0]).map(p => p.el);

          tl.to(el.querySelector('.tb'), { opacity: 1, duration: 0.25, ease: P1O }, tt);
          tl.to(el.querySelector('.g1'), { opacity: 1, duration: 0.25, ease: P1O }, tt);
          tl.to(el.querySelector('.g0'), { opacity: 0, duration: 0.25, ease: P1O }, tt);
          tl.to(el.querySelector('.ring'), { opacity: 1, duration: 0.25, ease: P1O }, tt);
        });
      });
      drift('#tz-cam2', 14, 18, 1, 1.03, 0, -12);

      /* the grid leaves from beat 17.0 and is gone as the next scene starts; the left column follows */
      tl.to(pills.map(p => p.el), { opacity: 0, scale: 0.95, duration: 0.36, ease: P2I, stagger: { each: 0.003, from: 'center' } }, at(17));
      leave('#tz-count', at(17.3), { dur: 0.3, y: -24 });
      leave('#tz-cats', at(17.3), { dur: 0.3, y: 24 });

      /* ============================================================ 4. ANYONE CAN ADD A TOOL, beats 18 to 24 */
      $('tz-fan').innerHTML = fanSVG('tz-f1');
      land('#tz-hplug', 18, { y: 30 });
      enter('#tz-fan', at(18) - 0.017, { y: 20, s: 0.9 });
      openFan('tz-f1', 18.1, 0.5);
      land('#tz-mwin', 18.25, { x: 150, y: 0, dur: 0.45 });
      land('#tz-fold', 18.5, { y: 40 });

      /* the folder slides into the Modules list and cross-fades into the new row before beat 21; the list makes room first */
      tl.to('#tz-fold .front b, #tz-fold .front span', { opacity: 0, duration: 0.15, ease: 'none' }, at(20.5));
      tl.to('#tz-fold', { x: 492, y: -90, scale: 0.2, duration: 0.5, ease: XO }, at(20.5));
      tl.to('#tz-mslide', { y: 135, duration: 0.4, ease: XO }, at(20.75));
      enter('#tz-mrow', at(20.85), { x: -20, y: 0, dur: 0.4 });
      tl.to('#tz-fold', { opacity: 0, duration: 0.13, ease: 'none' }, at(20.85));
      tl.to('#tz-fan', { opacity: 0, y: -20, duration: 0.25, ease: P2I }, at(21.0));
      /* header: 31 rolls to 32, on beat 21.1 */
      tl.to('#tz-mhl', { opacity: 1, duration: 0.25, ease: P1O }, at(21.1));
      tl.to('#tz-r1', { y: -44, duration: 0.45, ease: XO }, at(21.1));
      tl.to('#tz-mwin', { x: -360, duration: 0.5, ease: XO }, at(21.6));
      drift('#tz-cam3', 18, 23.6, 1, 1.03, 0, -10);
      /* exit overlaps the wall entrance by 0.1 s */
      tl.to('#tz-cam3', { opacity: 0, y: -24, duration: 0.3, ease: P2I }, at(23.5));

      /* ============================================================ 5. THE WALL, beats 24 to 28 */
      const w2 = $('tz-wall2');

      land('#tz-hwall', 24, { y: 30 });
      drift('#tz-cam4', 24, 28.2, 1.04, 1, 0, 0, 'none');
      leave('#tz-cam4', at(27.75), { dur: 0.22, y: -20 });

      /* ============================================================ 6. THE STACK, one ground, beats 28 to 32.5 */
      land('#tz-sl1', 28, { y: 40 });
      land('#tz-sl2', 29.5, { y: 40 });
      land('#tz-sl3', 31, { y: 40 });
      drift('#tz-cam5', 28, 32.5, 1, 1.03, 0, 0, 'none');
      leave('#tz-cam5', at(32.1), { dur: 0.22, y: 0, x: -60 });

      /* ============================================================ 7. END CARD, beat 32.5, same blue */
      $('tz-efan').innerHTML = fanSVG('tz-f2');
      enter('#tz-efan', at(32.5) - 0.017, { y: 24, s: 0.92, dur: 0.45 });
      openFan('tz-f2', 32.5, 0.6);
      enter('#tz-ename', at(32.5) + 0.06, { y: 40, dur: 0.45 });
      enter('#tz-eline', at(32.5) + 0.18, { y: 26 });
      land('#tz-eurl', 34, { y: 20 });
      /* a drift that settles into the still hold */
      tl.fromTo('#tz-endcam', { scale: 1.03 }, { scale: 1, duration: at(34.2) - at(32.5), ease: 'power2.out' }, at(32.5));

      /* ============================================================ grain, painted once from a seeded LCG */
      (function () {
        const c = $('tz-grain'), g = c.getContext('2d'), d = g.createImageData(480, 270);
        let s = 12345; const r = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
        for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() - 0.5) * 90; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
        g.putImageData(d, 0, 0);
      })();

      window.__timelines["teaser"] = tl;
    }

    /* read the real tools.json synchronously so the timeline registers in the same tick (fallback copy if it cannot be read) */
    let DATA = TOOLS_FALLBACK;
    try {
      const x = new XMLHttpRequest();
      x.open('GET', 'assets/data/tools.json', false);
      x.send(null);
      if (x.status === 200 || x.status === 0) {
        const j = JSON.parse(x.responseText);
        if (j && Array.isArray(j.tools) && j.tools.length) DATA = { count: j.count || j.tools.length, tools: j.tools };
      }
    } catch (e) {}
    window.__tzToolsSource = DATA === TOOLS_FALLBACK ? 'fallback' : 'tools.json';
    build(DATA);
  })();
  </script>
