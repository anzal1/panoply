<!doctype html>
<html><head><meta charset="UTF-8"></head><body>
<template>
  <style>
    @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Variable-latin.woff2") format("woff2"); font-weight: 100 900; }
    @font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono-latin.woff2") format("woff2"); font-weight: 100 900; }

    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #ececf1; }
    #f1-ground { position: absolute; inset: 0; background: #0c0c0f; }
    #f1-content { position: absolute; inset: 0; }
    #f1-wall { position: absolute; inset: 0; transform-origin: 50% 50%; }
    #f1-scrim, #f1-scrim2 { position: absolute; inset: 0; opacity: 0; }
    /* the scrim is OFF on frame 0 (the poster shows bright windows) and comes in just ahead of Upload. on beat 4, solid under the words */
    #f1-scrim { background: radial-gradient(ellipse 62% 58% at 50% 50%, rgba(12,12,15,1) 0%, rgba(12,12,15,1) 60%, rgba(12,12,15,.30) 100%); }
    #f1-scrim2 { background: rgba(12,12,15,.55); }

    /* the generic upload-site windows (unbranded on purpose) */
    .f1-slot { position: absolute; width: 560px; height: 380px; }
    .f1-win { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; font-size: 20px;
      background: #2a2a30; color: #ececf1; box-shadow: 0 24px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.07); }
    .f1-win .bar { height: 46px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #3a3a42; }
    .f1-win .bar i { width: 11px; height: 11px; border-radius: 50%; display: block; background: #4a4a52; }
    .f1-win .bar .url { margin-left: 14px; height: 24px; flex: 1; border-radius: 12px; background: #1a1a1e; }
    .f1-win .body { flex: 1; padding: 26px 30px; position: relative; }
    .f1-win h4 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
    .f1-win p { opacity: .62; font-size: 19px; margin-top: 10px; line-height: 1.35; }
    .f1-win .btn { display: inline-block; margin-top: 18px; padding: 12px 22px; border-radius: 10px; color: #fff; font-weight: 600; font-size: 20px; background: var(--k); }
    .f1-win .drop { margin-top: 18px; height: 160px; border-radius: 14px; border: 3px dashed var(--k); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-weight: 600; font-size: 26px; }
    .f1-win .drop small { font-weight: 500; font-size: 18px; opacity: .6; margin-top: 8px; }
    .f1-win .prog { margin-top: 22px; height: 16px; border-radius: 8px; background: rgba(128,128,140,.25); overflow: hidden; }
    .f1-win .prog b { display: block; height: 100%; width: 43%; background: var(--k); border-radius: 8px; }
    .f1-win .file { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 22px; }
    .f1-win .file u { width: 38px; height: 46px; border-radius: 6px; background: var(--k); display: block; opacity: .9; }
    .f1-win .price { font-size: 72px; font-weight: 800; letter-spacing: -0.04em; margin-top: 12px; color: var(--k); }
    .f1-win .price small { font-size: 22px; font-weight: 600; opacity: .6; letter-spacing: 0; }
    .f1-win .page { position: absolute; left: 30px; top: 22px; width: 190px; height: 240px; background: rgba(128,128,140,.2); border-radius: 6px; overflow: hidden; }
    .f1-win .page em { position: absolute; left: -30px; top: 100px; width: 280px; transform: rotate(-32deg); font-style: normal; font-weight: 800; font-size: 34px; color: var(--k); opacity: .75; letter-spacing: .04em; }
    .f1-win .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 14px; width: 270px; }
    .f1-win .grid i { display: block; aspect-ratio: 1; background: rgba(128,128,140,.3); border-radius: 4px; }
    .f1-win .field { margin-top: 18px; height: 50px; border-radius: 10px; border: 2px solid rgba(128,128,140,.45); display: flex; align-items: center; padding: 0 16px; opacity: .8; }
    .f1-win .banner { padding: 14px 18px; border-radius: 10px; background: var(--k); color: #fff; font-weight: 700; font-size: 22px; }
    .f1-win .lines i { display: block; height: 11px; border-radius: 6px; background: rgba(128,128,140,.3); margin-top: 11px; }
    .f1-win .two { display: flex; gap: 12px; }

    /* the four words and the sub line */
    #f1-words { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .f1-line { text-shadow: 0 6px 48px rgba(0,0,0,.55); font-size: 184px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; white-space: nowrap; text-align: center; }
    .f1-w { display: inline-block; opacity: 0; }
    #f1-w4 { color: #ff6961; }
    #f1-sub { margin-top: 34px; font-size: 52px; font-weight: 500; letter-spacing: -0.015em; color: #a9a9b3; opacity: 0; }

    /* the stop line */
    #f1-stop { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    #f1-stop div { max-width: 1400px; text-wrap: balance; text-align: center; font-size: 104px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.02; color: #fff; opacity: 0; }
  </style>

  <div id="root" data-composition-id="f1-pain" data-width="1920" data-height="1080">
    <div id="f1-ground"></div>
    <div id="f1-content">
      <div id="f1-wall"></div>
      <div id="f1-scrim"></div>
      <div id="f1-scrim2"></div>
      <div id="f1-words">
        <div class="f1-line"><span class="f1-w" id="f1-w1">Upload.</span> <span class="f1-w" id="f1-w2">Wait.</span></div>
        <div class="f1-line"><span class="f1-w" id="f1-w3">Sign up.</span> <span class="f1-w" id="f1-w4">Pay.</span></div>
        <div id="f1-sub">Just to shrink one PDF.</div>
      </div>
      <div id="f1-stop"><div id="f1-stopline">Your file just left your computer.</div></div>
    </div>
  </div>

  <script>
    (() => {
      const BEAT = 60 / 130, START = 0, F = 1 / 60;
      /* every event is placed on the 60 fps grid: the frame start snap (window.__snap, see assemble-index.py) is taken out, and half a frame is taken off,
         so an event at exact time t first shows on frame round(t * 60), the frame the cue sheet names */
      const SNAP = ((window.__snap && window.__snap['f1-pain']) || 0) + 1 / 120;
      const at = b => Math.max(0, (b - START) * BEAT - SNAP);

      /* every cue in beats, in one place */
      const WORD_BEATS = [4, 6, 8, 10];            /* Upload. beat 4 (frame 111), Wait. beat 6, Sign up. beat 8 (the measured hit), Pay. beat 10; each lands one frame early so its beat frame already shows it */
      const WORD_DIM = [0.38, 0.55, 0.75];         /* settled opacity of words 1..3 once the next lands */
      const SUB_BEAT = 11;
      const WORD_RISE = 0.4;                       /* seconds, the move STARTS one frame before the beat (expo.out) */
      const STOP_BEAT = 13.32, LINE_BEAT = 14.0, STOP_END = 15.93;
      /* entrance beat per window, in entrance order (the first three, beat 0, are already in on frame 0: the poster); beats 1, 2, 3 add one each before the first word; two land on the hit at beat 8 */
      const WIN_BEATS = [0, 0, 0, 1, 2, 3, 4.5, 5, 5.5, 6, 7, 7.5, 8, 8, 10];
      const POSTER = 3;
      const ORDER = [7, 11, 3, 9, 5, 1, 13, 8, 0, 14, 6, 2, 10, 4, 12];  /* grid slots, spread so each early window lands somewhere new */

      /* ---------- build the wall (copied from the style frame, ids and classes prefixed) ---------- */
      const K = ['#d24e51', '#4a66cf', '#3a9a6c', '#e0722a', '#8657b5', '#c64a9a'];
      const T = [
        (k) => `<div class="drop" style="--k:${k}">Drop your PDF here<small>Max 25 MB. 2 free tasks per day.</small></div><span class="btn" style="--k:${k}">Select file</span>`,
        (k) => `<div class="file" style="--k:${k}"><u></u>scan_final_v3.pdf</div><div class="prog" style="--k:${k}"><b></b></div><p>Uploading to our servers... 43%<span style="display:block">Please do not close this tab.</span></p>`,
        (k) => `<h4>Daily limit reached</h4><p>Upgrade to keep going.</p><div class="price" style="--k:${k}">$9<small> / month, billed yearly</small></div><span class="btn" style="--k:${k}">Go Premium</span>`,
        (k) => `<div class="page" style="--k:${k}"><em>WATERMARK</em></div><div style="margin-left:240px"><h4>Your file is ready</h4><p>Sign up to remove the watermark.</p><span class="btn" style="--k:${k}">Create account</span></div>`,
        (k) => `<h4>Select all squares with traffic lights</h4><div class="grid"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><span class="btn" style="--k:${k};position:absolute;right:30px;bottom:22px">Verify</span>`,
        (k) => `<h4>Where should we send your file?</h4><div class="field">you@email.com</div><span class="btn" style="--k:${k}">Email me the link</span><p>You agree to our weekly newsletter.</p>`,
        (k) => `<h4>We value your privacy</h4><div class="lines"><i style="width:92%"></i><i style="width:84%"></i><i style="width:60%"></i></div><div class="two"><span class="btn" style="--k:#6a6a72">Manage</span><span class="btn" style="--k:${k}">Accept all</span></div>`,
        (k) => `<div class="banner" style="--k:${k}">File too large. Max 25 MB.</div><div class="file" style="--k:${k};margin-top:26px"><u></u>lease_signed.pdf, 41 MB</div><p>Try Premium for files up to 100 MB.</p>`,
      ];
      const xs = [-150, 300, 750, 1200, 1620], ys = [-90, 285, 660];
      const rot = [-3.2, 2.4, -1.4, 3.1, -2.2, 1.6, -3.4, 2.8, -0.8, 3.3, -2.6, 1.1, -1.9, 2.2, -3.0];
      const off = [[0,20],[-30,-10],[20,0],[10,-30],[0,25],[-20,15],[25,-20],[-10,10],[15,25],[-25,0],[20,-15],[0,0],[-15,30],[30,-5],[-10,-20]];
      const wall = document.getElementById('f1-wall');
      const wins = [];
      for (let i = 0; i < 15; i++) {
        const ri = Math.floor(i / 5), ci = i % 5, k = K[i % K.length];
        let t = (i * 3 + ri) % 8;
        if (i === 7) t = 0;       /* the frame-0 window is the drop zone */
        else if (i === 5) t = 6;  /* and the swap keeps the wall from showing four drop zones */
        const sc = i === 7 ? 1.3 : 1 + ((i * 7) % 5) * 0.04;
        const slot = document.createElement('div');
        slot.className = 'f1-slot';
        slot.style.cssText = `left:${xs[ci] + off[i][0]}px;top:${ys[ri] + off[i][1]}px;transform:rotate(${rot[i]}deg) scale(${sc})`;
        slot.innerHTML = `<div class="f1-win" id="f1-win${i}"><div class="bar"><i></i><i></i><i></i><span class="url"></span></div><div class="body">${T[t](k)}</div></div>`;
        wall.appendChild(slot);
        wins.push(slot.firstChild);
        /* the windows are scenery behind the words: mark the layering as intentional for the layout audit */
        slot.querySelectorAll('.body, .body *').forEach((e) => { e.setAttribute('data-layout-allow-overlap', ''); e.setAttribute('data-layout-allow-occlusion', ''); e.setAttribute('data-layout-allow-overflow', ''); });
      }

      document.querySelectorAll('.f1-w, #f1-sub, #f1-stopline').forEach((e) => e.setAttribute('data-layout-allow-overlap', ''));

      /* ---------- timeline ---------- */
      const tl = gsap.timeline({ paused: true });
      const XO = 'expo.out';

      /* a hit-frame entrance: the move is expo.out on transform, opacity goes 0.5 to 1 in 0.08 s, both start one frame BEFORE the beat */
      const land = (sel, b, o = {}) => {
        const t = Math.max(0, at(b) - F);
        tl.fromTo(sel, { x: 0, y: o.y === undefined ? 28 : o.y, scale: o.s || 1 }, { x: 0, y: 0, scale: 1, duration: o.dur || WORD_RISE, ease: XO, immediateRender: false }, t);
        tl.fromTo(sel, { opacity: o.from === undefined ? 0.5 : o.from }, { opacity: 1, duration: 0.08, ease: 'power1.out', immediateRender: false }, t);
      };
      /* a lit state that changes on a hit tweens in 0.08 s */
      const dim = (sel, o, b) => tl.to(sel, { opacity: o, duration: 0.08, ease: 'none' }, Math.max(0, at(b) - F));

      /* everything that enters later is invisible until its beat; the wall windows are scenery under the full scrim */
      const later = ORDER.filter((_, n) => n >= POSTER).map((i) => wins[i]);
      gsap.set(later, { opacity: 0 });
      gsap.set(['#f1-w1', '#f1-w2', '#f1-w3', '#f1-w4', '#f1-sub', '#f1-stopline'], { opacity: 0 });
      gsap.set(ORDER.slice(0, POSTER).map((i) => wins[i]), { opacity: 1 });   /* frame 0 poster: three bright windows, no words, no scrim */

      /* windows land one frame early on each beat: expo.out 0.45 s, opacity 0.5 to 1 in 0.08 s */
      ORDER.forEach((slotIdx, n) => {
        if (n < POSTER) return;
        const t = at(WIN_BEATS[n]) - F;
        tl.fromTo(wins[slotIdx], { scale: 1.04, y: 20 }, { scale: 1, y: 0, duration: 0.45, ease: XO, immediateRender: false }, t);
        tl.fromTo(wins[slotIdx], { opacity: 0.5 }, { opacity: 1, duration: 0.08, ease: 'power1.out', immediateRender: false }, t);
      });

      /* the wall drifts to rest on the stop */
      tl.fromTo('#f1-wall', { scale: 1, x: 0 }, { scale: 1.015, x: -16, duration: at(STOP_BEAT), ease: 'none' }, 0);

      /* the scrim comes in just ahead of beat 4 (no flash, 0.1 s power2.out, done a frame before the beat), so Upload. reads on the beat frame */
      tl.fromTo('#f1-scrim', { opacity: 0 }, { opacity: 1, duration: 0.1, ease: 'power2.out', immediateRender: false }, at(WORD_BEATS[0]) - 0.1 - F);

      /* the words land on beats 4, 6, 8, 10; earlier words settle dimmer on the same frame */
      WORD_BEATS.forEach((b, n) => {
        land('#f1-w' + (n + 1), b, { y: 30 });
        if (n > 0) dim('#f1-w' + n, WORD_DIM[n - 1], b);
      });
      land('#f1-sub', SUB_BEAT, { y: 14 });

      /* the hit at beat 8 (0.63): "Sign up." lands and two windows land on the same frame (above), and the accent word waits for beat 10 */

      /* STOP at 13.32 (a measured stop): the scrim deepens, the words and sub line leave completely and are gone before the line lands */
      tl.fromTo('#f1-scrim2', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.out', immediateRender: false }, at(STOP_BEAT));
      tl.to('#f1-words', { y: -20, duration: 0.28, ease: 'power2.out' }, at(STOP_BEAT));
      tl.to('#f1-words', { opacity: 0, duration: 0.28, ease: 'power1.out' }, at(STOP_BEAT));
      /* the line lands in the silence, one frame early like every entrance (words are fully out by 6.42 s, the line starts at 6.446 s) */
      land('#f1-stopline', LINE_BEAT, { y: 28 });

      /* the line holds completely still, then everything fades to the empty Midnight ground, ending one frame before the stop ends (the deliberate silence) */
      tl.fromTo('#f1-content', { opacity: 1 }, { opacity: 0, duration: 0.15, ease: 'power1.in', immediateRender: false }, at(STOP_END) - 0.15 - F);

      window.__timelines["f1-pain"] = tl;
    })();
  </script>
</template>
</body></html>
