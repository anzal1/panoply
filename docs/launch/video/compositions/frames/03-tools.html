<!doctype html>
<html><head><meta charset="UTF-8"></head><body>
<template>
  <style>
    @font-face{font-family:"Geist";src:url("assets/fonts/Geist-Variable-latin.woff2") format("woff2");font-weight:100 900}
    @font-face{font-family:"Geist Mono";src:url("assets/fonts/GeistMono-latin.woff2") format("woff2");font-weight:100 900}

    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Geist", system-ui, sans-serif; color: #fff; }
    #root * { box-sizing: border-box; }

    /* ground: its own child, flat brand blue with a very faint centred radial lift */
    /* identical to frame 2's blue (flat brand blue plus the same very faint centred lift) so the cut at beat 24 is invisible */
    #f3-ground { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 55% at 50% 48%, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 100%), #2d6cdf; }

    /* frame 2's headline and Ctrl Alt Space keycaps, still on screen at its last frame; they glide away at the start of this frame */
    #f3-intro { position: absolute; inset: 0; }
    #f3-intro-head { position: absolute; left: 0; right: 0; top: 84px; text-align: center; font-size: 116px; font-weight: 700; letter-spacing: -0.04em; line-height: 0.98; color: #fff; }
    .f3-caps { position: absolute; left: 0; right: 0; top: 232px; height: 104px; display: flex; justify-content: center; gap: 24px; }
    .f3-cap-label { position: absolute; left: 0; right: 0; top: 122px; text-align: center; font-family: "Geist Mono", ui-monospace, monospace; font-size: 30px; font-weight: 500; color: rgba(255,255,255,.78); letter-spacing: 0; }
    .f3-key { height: 104px; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 52px; font-weight: 600; letter-spacing: -0.02em; color: #fff;
      background: rgba(255,255,255,.16); border: 2px solid rgba(255,255,255,.45);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 18px 40px rgba(8,24,70,.28); }

    /* the command bar plate (frame 2 hands it over at 1120 px wide, centred, scale 1.06) */
    #f3-world, #f3-move { position: absolute; inset: 0; }
    #f3-plate { position: absolute; left: 50%; top: 50%; width: 1120px; height: 716px; margin-left: -560px; margin-top: -358px;
      border-radius: 29.3px; overflow: hidden; background: #f1f2f5;
      box-shadow: 0 0 0 1.5px rgba(255,255,255,.35), 0 40px 100px rgba(8,24,70,.5); }
    #f3-plate img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; opacity: 0; }

    /* the payoff number above the plate */
    #f3-result { position: absolute; left: 0; right: 0; top: 130px; height: 150px; display: flex; justify-content: center; align-items: baseline;
      font-weight: 700; font-size: 150px; line-height: 150px; letter-spacing: -0.04em; white-space: nowrap; opacity: 0; }
    #f3-pct { display: inline-block; width: 2ch; text-align: right; font-variant-numeric: tabular-nums; }
    #f3-pct-sfx { display: inline-block; margin-left: .02em; }

    /* the grid of tool cards */
    #f3-grid { position: absolute; left: 110px; top: 334px; width: 1700px; height: 632px; }
    .f3-pos { position: absolute; height: 80px; }
    .f3-card { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 24px 0 14px; gap: 14px; border-radius: 24px; background: #fff;
      box-shadow: 0 14px 34px rgba(8,24,70,.24), 0 2px 6px rgba(8,24,70,.12);
      font-weight: 600; font-size: 38px; line-height: 1; letter-spacing: -0.02em; color: #14161c; white-space: nowrap; }
    .f3-tile { position: relative; flex: none; width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; }
    .f3-fill { position: absolute; inset: 0; border-radius: 15px; opacity: 0; }
    .f3-ic { position: relative; width: 30px; height: 30px; display: block; }
    .f3-ic svg { width: 30px; height: 30px; display: block; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

    /* counter and category label, top centre */
    #f3-head { position: absolute; left: 0; right: 0; top: 0; height: 330px; }
    #f3-count { position: absolute; left: 0; right: 0; top: 70px; height: 160px; display: flex; justify-content: center; align-items: center;
      font-weight: 700; font-size: 168px; line-height: 160px; letter-spacing: -0.04em; white-space: nowrap; opacity: 0; }
    #f3-nb { position: relative; width: 184px; height: 160px; flex: none; }
    .f3-n { position: absolute; right: 0; top: 0; height: 160px; line-height: 160px; opacity: 0; }
    #f3-tools { display: block; margin-left: 24px; opacity: 0; }
    #f3-labels { position: absolute; left: 0; right: 0; top: 246px; height: 40px; }
    .f3-label { position: absolute; left: 0; right: 0; top: 0; text-align: center; opacity: 0;
      font-family: "Geist Mono", ui-monospace, monospace; font-weight: 500; font-size: 30px; line-height: 40px; letter-spacing: 0.02em; white-space: nowrap; color: rgba(255,255,255,.94); }

    /* the real Home screen the grid resolves into */
    #f3-home { position: absolute; left: 50%; top: 50%; width: 1500px; height: 931px; margin-left: -750px; margin-top: -465.5px;
      border-radius: 15.75px; overflow: hidden; opacity: 0; background: #f1f3f8;
      box-shadow: 0 0 0 1.5px rgba(255,255,255,.35), 0 34px 90px rgba(8,24,70,.42); }
    #f3-home img { width: 100%; height: 100%; display: block; }
  </style>

  <div id="root" data-composition-id="f3-tools" data-width="1920" data-height="1080">
    <div id="f3-ground"></div>
    <div id="f3-intro" data-layout-allow-overflow>
      <div id="f3-intro-head">One hotkey. Any file.</div>
      <div class="f3-caps"><div class="f3-key" style="width:150px">Ctrl</div><div class="f3-key" style="width:130px">Alt</div><div class="f3-key" style="width:250px">Space</div><div class="f3-cap-label">Windows and Linux</div></div>
    </div>
    <div id="f3-world" data-layout-allow-overflow><div id="f3-move" data-layout-allow-overflow><div id="f3-plate"></div></div></div>
    <div id="f3-result" aria-label="35% smaller"><span id="f3-pct">0</span><span id="f3-pct-sfx">% smaller</span></div>
    <div id="f3-grid" data-layout-allow-overflow></div>
    <div id="f3-head" data-layout-allow-overflow>
      <div id="f3-count"><div id="f3-nb"></div><div id="f3-tools">tools.</div></div>
      <div id="f3-labels"></div>
    </div>
    <div id="f3-home"><img src="assets/captures/app-home-light.png" alt=""></div>
  </div>

  <script>
    const BEAT = 60 / 130, START = 24;
    const at = b => (b - START) * BEAT;              /* local seconds of an absolute beat */

    /* ---- constants the real captures / the real build can change ---- */
    const RUN_FRAMES = 6;                             /* run-light-01 .. run-light-<RUN_FRAMES>.png */
    /* These MUST equal the text in the real bar-result-light.png capture ("67 KB to 43 KB, 35% smaller"). */
    const RESULT = { from: "67 KB", to: "43 KB", pct: 35 };
    const TOOL_COUNT = 31;                            /* = assets/data/tools.json "count" */

    /* Tools of assets/data/tools.json with a baked, seeded layout (assets/f3-tools/layout.py, LCG seed 19, annealed row packing).
       [id, name, category, x, y, width, row] in a 1700 x 632 grid, row-major arrival order, rows of 5,4,5,4,5,4,4.
       Regenerate with layout.py if tools.json changes. */
    const TOOLS = [
      ["image.resize_to_kb","Resize to exact KB","image",0,0,441.8,0],
      ["files.hash","Hash files","files",455.8,0,285.9,0],
      ["pdf.ocr","OCR","pdf",755.6,0,190.2,0],
      ["image.resize","Resize image","image",959.8,0,345.3,0],
      ["media.to_mono","Stereo to mono","media",1319.2,0,380.8,0],
      ["image.remove_background","Remove background","image",0,92,477.2,1],
      ["media.repair","Repair video","media",491.2,92,330.0,1],
      ["id.passport_photo","Passport photo","id",835.1,92,381.4,1],
      ["pdf.organize","Organize PDF pages","pdf",1230.6,92,469.4,1],
      ["pdf.split","Split PDF","pdf",0,184,287.2,2],
      ["image.erase","Erase object","image",301.2,184,342.9,2],
      ["media.streams","Streams","media",658.2,184,273.7,2],
      ["id.print_sheet","Print sheet","id",945.9,184,318.7,2],
      ["image.compress","Compress image","image",1278.6,184,421.4,2],
      ["media.info","Video and audio info","media",0,276,471.0,3],
      ["id.signature_cleaner","Signature cleaner","id",485.0,276,427.2,3],
      ["media.compress","Compress video","media",926.2,276,396.5,3],
      ["pdf.images_to_pdf","Images to PDF","pdf",1336.7,276,363.3,3],
      ["image.to_text","Image to text","image",0,368,351.9,4],
      ["media.extract_audio","Extract audio","media",365.9,368,354.9,4],
      ["pdf.to_images","PDF to images","pdf",734.8,368,369.9,4],
      ["image.upscale","Upscale","image",1118.6,368,258.4,4],
      ["pdf.merge","Merge PDF","pdf",1391.1,368,308.9,4],
      ["pdf.compress","Compress PDF","pdf",0,460,372.5,5],
      ["media.convert","Convert video or audio","media",386.5,460,509.9,5],
      ["image.remove_watermark","Remove watermark","image",910.5,460,459.5,5],
      ["media.hdr_to_sdr","HDR to SDR","media",1383.9,460,316.0,5],
      ["media.trim","Trim video or audio","media",0,552,446.7,6],
      ["image.strip_metadata","Strip metadata","image",460.7,552,378.5,6],
      ["media.normalize","Normalize loudness","media",853.2,552,462.5,6],
      ["image.convert","Convert image","image",1329.7,552,370.3,6]
    ];
    const ROW_OF = TOOLS.map(t => t[6]);

    const CAT = {
      pdf:   { name: "PDF",             col: "#ff453a", rgb: "255,69,58",  icon: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>' },
      image: { name: "Images",          col: "#bf5af2", rgb: "191,90,242", icon: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 9"/>' },
      media: { name: "Video and audio", col: "#ff7828", rgb: "255,120,40", icon: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 4v16M16 4v16M3 9h5M3 15h5M16 9h5M16 15h5"/>' },
      id:    { name: "ID photos",       col: "#ff9f0a", rgb: "255,159,10", icon: '<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.7 1.8-2.4 3-2.4s2.4.7 3 2.4M14.5 10h4M14.5 14h3"/>' },
      files: { name: "Files",           col: "#1a84f3", rgb: "26,132,243", icon: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>' },
    };
    const CAT_ORDER = ["pdf", "image", "media", "id", "files"];   /* the five lights, beats 34 to 38 */
    const catCount = c => TOOLS.filter(t => t[2] === c).length;
    if (TOOLS.length !== TOOL_COUNT) { throw new Error("f3-tools: TOOLS.length " + TOOLS.length + " != tools.count " + TOOL_COUNT); }

    /* ---- build the DOM ---- */
    const $ = id => document.getElementById(id);
    const plate = $("f3-plate");
    const runImgs = [];
    for (let k = 1; k <= RUN_FRAMES; k++) {
      const im = document.createElement("img");
      im.src = "assets/captures/run-light-0" + k + ".png"; im.alt = "";
      plate.appendChild(im); runImgs.push(im);
    }
    const resImg = document.createElement("img");
    resImg.src = "assets/captures/bar-result-light.png"; resImg.alt = "";
    resImg.setAttribute("data-result", RESULT.from + " to " + RESULT.to + ", " + RESULT.pct + "% smaller");
    plate.appendChild(resImg);

    const grid = $("f3-grid");
    const posEls = [], cardEls = [], fillEls = [], icEls = [];
    TOOLS.forEach(t => {
      const c = CAT[t[2]];
      const pos = document.createElement("div");
      pos.className = "f3-pos";
      pos.style.cssText = "left:" + t[3] + "px;top:" + t[4] + "px;width:" + t[5] + "px";
      pos.innerHTML =
        '<div class="f3-card"><span class="f3-tile" style="background:rgba(' + c.rgb + ',.16)">' +
        '<i class="f3-fill" style="background:' + c.col + '"></i>' +
        '<span class="f3-ic" style="color:' + c.col + '"><svg viewBox="0 0 24 24">' + c.icon + '</svg></span></span>' +
        '<span class="f3-name">' + t[1] + '</span></div>';
      grid.appendChild(pos);
      posEls.push(pos);
      cardEls.push(pos.querySelector(".f3-card"));
      fillEls.push(pos.querySelector(".f3-fill"));
      icEls.push(pos.querySelector(".f3-ic"));
    });

    const nb = $("f3-nb");
    const numEls = {};
    const NUMS = [1, 2, 3, 4, 5, 6, 7, 8, 9, TOOL_COUNT];
    NUMS.forEach(n => {
      const s = document.createElement("div");
      s.className = "f3-n"; s.textContent = String(n);
      nb.appendChild(s); numEls[n] = s;
    });
    const labels = $("f3-labels");
    const labelEls = CAT_ORDER.map(k => {
      const d = document.createElement("div");
      d.className = "f3-label"; d.textContent = CAT[k].name + "  ·  " + catCount(k);
      labels.appendChild(d); return d;
    });

    /* ---- timeline ---- */
    const tl = gsap.timeline({ paused: true });
    const OUT = "expo.out", IN = "power3.in";

    /* camera: slow drift on the plate layer, slow 3 degree orbit + 1.5 percent push on the grid, slow drift on the counter */
    /* start from frame 2's last picture: the plate (left 400, top 402, 1120 x 716) centred at y 760, scale 1.06 */
    gsap.set("#f3-move", { scale: 1.06, x: 0, y: 220, transformOrigin: "50% 50%" });
    gsap.set("#f3-world", { transformOrigin: "50% 50%" });
    tl.fromTo("#f3-world", { scale: 1 }, { scale: 1.03, duration: at(32.2), ease: "none" }, 0);
    tl.fromTo("#f3-grid", { rotation: -1.5, scale: 1, transformOrigin: "50% 50%" }, { rotation: 1.5, scale: 1.015, duration: at(39) - at(26), ease: "none" }, at(26));
    tl.fromTo("#f3-head", { scale: 1, transformOrigin: "50% 0%" }, { scale: 1.03, duration: at(39) - at(26), ease: "none" }, at(26));

    /* beat 24.0 to 24.6: the job runs (hard swaps), then the real result card */
    for (let k = 0; k < RUN_FRAMES; k++) {
      const t0 = at(24 + 0.6 * k / RUN_FRAMES);
      tl.set(runImgs[k], { opacity: 1 }, t0);
      if (k > 0) tl.set(runImgs[k - 1], { opacity: 0 }, t0);
    }
    tl.set(resImg, { opacity: 1 }, at(24.6));
    tl.set(runImgs[RUN_FRAMES - 1], { opacity: 0 }, at(24.6));

    /* frame 2's headline and keycaps leave (they were still up at its last frame) */
    tl.fromTo("#f3-intro", { y: -12, opacity: 1 }, { y: -90, opacity: 0, duration: at(24.55) - at(24.15), ease: IN }, at(24.15));

    /* the plate eases up and smaller to make room for the payoff number */
    tl.to("#f3-move", { scale: 0.72, y: 165, duration: 0.6, ease: OUT }, at(24.5));

    /* the number counts up 0 to 35, beats 24.6 to 25.6, then holds to 26 */
    const cnt = { v: 0 };
    tl.to(cnt, { v: RESULT.pct, duration: at(25.6) - at(24.6), ease: OUT,
      onUpdate: () => { $("f3-pct").textContent = String(Math.round(cnt.v)); } }, at(24.6));
    tl.fromTo("#f3-result", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: OUT }, at(24.6));

    /* beat 26.0: the plate slides down and shrinks into an anchor at the bottom centre, the payoff leaves */
    tl.to("#f3-move", { scale: 0.38, y: 320, duration: 0.6, ease: OUT }, at(26));
    tl.to("#f3-result", { opacity: 0, y: -30, duration: 0.3, ease: IN }, at(26));
    /* the anchor clears the stage before the stop (it sits where the lower rows land) */
    tl.to("#f3-move", { y: 700, duration: at(32.1) - at(31.3), ease: IN }, at(31.3));

    /* counter group appears once the payoff has left */
    tl.fromTo("#f3-count", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: OUT }, at(26) + 0.3);
    tl.set(numEls[1], { opacity: 1 }, 0);

    /* cards: one per beat 26 to 31, then 8ths 31.5, 32, 32.5. Each glide FINISHES on its beat. */
    const CARD_DUR = 0.55;
    const early = [26, 27, 28, 29, 30, 31, 31.5, 32, 32.5];            /* the first nine cards (rows 0 and 1) */
    const cardFrom = { y: 80, opacity: 0 }, cardTo = { y: 0, opacity: 1 };
    early.forEach((b, i) => {
      if (i === 0) {
        /* the first card glides like the rest and lands on beat 26, but it only becomes visible in the last tenth of a second,
           so the two beat hold on the result stays clean */
        tl.fromTo(posEls[0], { y: 80 }, { y: 0, duration: CARD_DUR, ease: OUT }, at(b) - CARD_DUR);
        tl.fromTo(posEls[0], { opacity: 0 }, { opacity: 1, duration: 0.1, ease: OUT }, at(b) - 0.1);
      } else if (i === 1) {
        /* the second card also stays invisible until the hold is over (it would cross the plate's top edge) */
        tl.fromTo(posEls[1], { y: 80 }, { y: 0, duration: CARD_DUR, ease: OUT }, at(b) - CARD_DUR);
        tl.fromTo(posEls[1], { opacity: 0 }, { opacity: 1, duration: at(b) - at(26), ease: OUT }, at(26));
      } else {
        tl.fromTo(posEls[i], cardFrom, { ...cardTo, duration: CARD_DUR, ease: OUT }, at(b) - CARD_DUR);
      }
      if (i > 0) {                                                     /* counter ticks as the card lands */
        tl.set(numEls[i], { opacity: 0 }, at(b));
        tl.set(numEls[i + 1], { opacity: 1 }, at(b));
      }
    });

    /* STOP, beats 32.61 to 32.93: nothing is scheduled. HIT at beat 33.0: ordered ripple, row by row, 40 ms steps. */
    const HIT = 33, RIPPLE_STEP = 0.04, RIPPLE_DUR = 0.19;
    const rippleStart = early.length;
    for (let i = rippleStart; i < TOOLS.length; i++) {
      const r = ROW_OF[i] - ROW_OF[rippleStart];
      tl.fromTo(posEls[i], cardFrom, { ...cardTo, duration: RIPPLE_DUR, ease: OUT }, at(HIT) + r * RIPPLE_STEP);
    }
    /* the counter LOCKS on the real count exactly at 33.0 and reads "31 tools." */
    tl.set(numEls[9], { opacity: 0 }, at(HIT));
    tl.set(numEls[TOOL_COUNT], { opacity: 1 }, at(HIT));
    tl.fromTo("#f3-tools", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: OUT }, at(HIT));

    /* beats 34 to 38: one category per beat lights, everything else dims to 55 percent */
    const LIGHT_DUR = 0.3, DIM = 0.55;
    let prev = null;
    CAT_ORDER.forEach((cat, k) => {
      const end = at(34 + k), st = end - LIGHT_DUR;
      TOOLS.forEach((t, i) => {
        const lit = t[2] === cat, wasLit = t[2] === prev;
        const fromOp = prev === null ? 1 : (wasLit ? 1 : DIM);
        if (lit) {
          tl.fromTo(cardEls[i], { opacity: fromOp }, { opacity: 1, duration: LIGHT_DUR, ease: OUT }, st);
          tl.fromTo(fillEls[i], { opacity: 0 }, { opacity: 1, duration: LIGHT_DUR, ease: OUT }, st);
          tl.fromTo(icEls[i], { color: CAT[t[2]].col }, { color: "#ffffff", duration: LIGHT_DUR, ease: OUT }, st);
        } else if (prev === null || wasLit) {
          tl.fromTo(cardEls[i], { opacity: fromOp }, { opacity: DIM, duration: LIGHT_DUR, ease: OUT }, st);
          if (wasLit) {
            tl.fromTo(fillEls[i], { opacity: 1 }, { opacity: 0, duration: LIGHT_DUR, ease: OUT }, st);
            tl.fromTo(icEls[i], { color: "#ffffff" }, { color: CAT[t[2]].col, duration: LIGHT_DUR, ease: OUT }, st);
          }
        }
      });
      /* label: previous leaves, this one lands on the beat */
      if (k > 0) tl.to(labelEls[k - 1], { opacity: 0, y: -8, duration: 0.15, ease: IN }, st - 0.15);
      tl.fromTo(labelEls[k], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: OUT }, st);
      prev = cat;
    });

    /* beats 39 to 40: the grid resolves into the real Home screen by cross-fade, then it holds still */
    tl.to("#f3-grid", { opacity: 0, duration: at(39.7) - at(39), ease: "power2.inOut" }, at(39));
    tl.to("#f3-head", { opacity: 0, duration: at(39.5) - at(39), ease: "power2.inOut" }, at(39));
    tl.fromTo("#f3-home", { opacity: 0 }, { opacity: 1, duration: at(40) - at(39.2), ease: "power2.inOut" }, at(39.2));
    tl.fromTo("#f3-home", { scale: 0.97, transformOrigin: "50% 50%" }, { scale: 1, duration: at(40) - at(39), ease: OUT }, at(39));

    window.__timelines["f3-tools"] = tl;
  </script>
</template>
</body></html>
