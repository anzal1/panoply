<!doctype html>
<html><head><meta charset="UTF-8"></head><body>
<template>
  <style>
    @font-face{font-family:"Geist";src:url("assets/fonts/Geist-Variable-latin.woff2") format("woff2");font-weight:100 900}
    @font-face{font-family:"Geist Mono";src:url("assets/fonts/GeistMono-latin.woff2") format("woff2");font-weight:100 900}

    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Geist", system-ui, sans-serif; color: #fff; }
    #root * { box-sizing: border-box; }

    /* ground: its own child, identical to frame 2's blue (flat brand blue, same very faint centred lift) so the cut at beat 24 is invisible */
    #f3-ground { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 55% at 50% 48%, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 100%), #2d6cdf; }

    /* the command bar plate, the exact geometry frame 2 ends on: 920 wide, top 396, scale 1.04 about its centre */
    #f3-slide { position: absolute; inset: 0; }
    #f3-push { position: absolute; left: 500px; top: 396px; width: 920px; height: 588px; transform-origin: 50% 50%; }
    #f3-plate { position: absolute; inset: 0; border-radius: 24.1px; overflow: hidden; background: #f1f2f5;
      box-shadow: 0 0 0 1.5px rgba(255,255,255,.35), 0 40px 100px rgba(8,24,70,.5); }
    #f3-plate img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }

    /* the payoff number above the plate */
    #f3-result { position: absolute; left: 0; right: 0; top: 168px; height: 150px; display: flex; justify-content: center; align-items: baseline;
      font-weight: 700; font-size: 150px; line-height: 150px; letter-spacing: -0.04em; white-space: nowrap; opacity: 0; }
    #f3-pct { display: inline-block; width: 2ch; text-align: right; font-variant-numeric: tabular-nums; }
    #f3-pct-sfx { display: inline-block; margin-left: .02em; }

    /* the grid of tool cards: x 95 to 1825, y 312 to 958 */
    #f3-grid { position: absolute; left: 95px; top: 312px; width: 1730px; height: 646px; }
    .f3-pos { position: absolute; height: 82px; }
    .f3-card { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 26px 0 13px; gap: 16px; border-radius: 24px; background: #fff;
      box-shadow: 0 14px 34px rgba(8,24,70,.24), 0 2px 6px rgba(8,24,70,.12);
      font-weight: 600; font-size: 38px; line-height: 1; letter-spacing: -0.02em; color: #14161c; white-space: nowrap; }
    .f3-tile { position: relative; flex: none; width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; }
    .f3-fill { position: absolute; inset: 0; border-radius: 16px; opacity: 0; }
    .f3-ic { position: relative; width: 32px; height: 32px; display: block; }
    .f3-ic svg { width: 32px; height: 32px; display: block; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

    /* counter and category label, top centre */
    #f3-head { position: absolute; left: 0; right: 0; top: 0; height: 300px; }
    #f3-count { position: absolute; left: 0; right: 0; top: 70px; height: 160px; display: flex; justify-content: center; align-items: center;
      font-weight: 700; font-size: 168px; line-height: 160px; letter-spacing: -0.04em; white-space: nowrap; opacity: 0; }
    /* one layer per count, each always "N tool(s)." (a number never shows without its unit); layers are switched with seek-safe sets */
    .f3-cl { position: absolute; left: 0; right: 7px; top: 0; /* right 7px: optical centring of the ink of "31 tools." */ height: 160px; display: flex; justify-content: center; align-items: center; opacity: 0; }
    .f3-nb { display: block; width: 184px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
    .f3-wd { display: block; margin-left: 24px; }
    .f3-wd i { font-style: normal; visibility: hidden; }
    #f3-labels { position: absolute; left: 0; right: 0; top: 236px; height: 52px; }
    .f3-label { position: absolute; left: 0; right: 0; top: 0; text-align: center; opacity: 0;
      font-weight: 600; font-size: 44px; line-height: 52px; letter-spacing: -0.015em; white-space: nowrap; color: rgba(255,255,255,.9); }

    /* the real Home screen the grid resolves into */
    #f3-home { position: absolute; left: 50%; top: 50%; width: 1500px; height: 931px; margin-left: -750px; margin-top: -465.5px;
      border-radius: 15.75px; overflow: hidden; opacity: 0; background: #f1f2f5;
      box-shadow: 0 0 0 1.5px rgba(255,255,255,.35), 0 34px 90px rgba(8,24,70,.42); }
    #f3-home img { width: 100%; height: 100%; display: block; }
  </style>

  <div id="root" data-composition-id="f3-tools" data-width="1920" data-height="1080">
    <div id="f3-ground"></div>
    <div id="f3-slide" data-layout-allow-overflow><div id="f3-push" data-layout-allow-overflow><div id="f3-plate">
      <img id="f3-res-img" src="assets/captures/bar-result-light.png" alt="">
    </div></div></div>
    <div id="f3-result" data-layout-allow-overlap aria-label="35% smaller"><span id="f3-pct">10</span><span id="f3-pct-sfx">% smaller</span></div>
    <div id="f3-grid" data-layout-allow-overflow></div>
    <div id="f3-head" data-layout-allow-overflow>
      <div id="f3-count"></div>
      <div id="f3-labels"></div>
    </div>
    <div id="f3-home"><img src="assets/captures/app-home-light.png" alt=""></div>
  </div>

  <script>
    const BEAT = 60 / 130, START = 24, F = 1 / 60;
    const at = b => (b - START) * BEAT;              /* local seconds of an absolute beat */

    /* ---- constants the real captures / the real build can change ---- */
    /* Hard cut at beat 24: the real result card is on screen on the very first frame (no running frames, no cross-fade). */
    /* These MUST equal the text in the real bar-result-light.png capture ("67 KB to 43 KB, 35% smaller"). */
    const RESULT = { from: "67 KB", to: "43 KB", pct: 35 };
    const TOOL_COUNT = 31;                            /* = assets/data/tools.json "count" */
    const PLATE_SCALE_START = 1.25;                   /* frame 2 ends pulled back to about 1.25x, bar centred; the cut at beat 24 must not jump */

    /* Tools of assets/data/tools.json with a baked, seeded layout (assets/f3-tools/layout.py, LCG seed 94, annealed row packing).
       [id, name, category, x, y, width, row] in a 1730 x 646 grid, row-major arrival order, rows of 4,4,4,5,5,5,4.
       Regenerate with layout.py + gen.py if tools.json changes. */
    const TOOLS = [
      ["pdf.images_to_pdf","Images to PDF","pdf",0,0,371.3,0],
      ["image.remove_background","Remove background","image",385.3,0,485.3,0],
      ["id.print_sheet","Print sheet","id",884.6,0,313.9,0],
      ["media.convert","Convert video or audio","media",1212.5,0,517.5,0],
      ["pdf.organize","Organize PDF pages","pdf",0,94,477.3,1],
      ["id.signature_cleaner","Signature cleaner","id",491.3,94,435.1,1],
      ["image.strip_metadata","Strip metadata","image",940.3,94,386.3,1],
      ["id.passport_photo","Passport photo","id",1340.7,94,389.3,1],
      ["image.erase","Erase object","image",0,188,337.9,2],
      ["media.info","Video and audio info","media",351.9,188,478.8,2],
      ["image.remove_watermark","Remove watermark","image",844.7,188,466.9,2],
      ["media.compress","Compress video","media",1325.6,188,404.4,2],
      ["media.extract_audio","Extract audio","media",0,282,360.9,3],
      ["image.convert","Convert image","image",374.9,282,382.9,3],
      ["pdf.merge","Merge PDF","pdf",771.9,282,315.0,3],
      ["media.hdr_to_sdr","HDR to SDR","media",1100.8,282,328.2,3],
      ["pdf.split","Split PDF","pdf",1443.0,282,287.0,3],
      ["image.compress","Compress image","image",0,376,419.1,4],
      ["files.hash","Hash files","files",433.1,376,296.1,4],
      ["image.to_text","Image to text","image",743.2,376,355.8,4],
      ["media.repair","Repair video","media",1113.0,376,340.6,4],
      ["image.upscale","Upscale","image",1467.6,376,262.4,4],
      ["image.resize","Resize image","image",0,470,358.7,5],
      ["pdf.ocr","OCR","pdf",372.7,470,203.5,5],
      ["media.trim","Trim video or audio","media",590.2,470,460.4,5],
      ["pdf.to_images","PDF to images","pdf",1064.6,470,376.9,5],
      ["media.streams","Streams","media",1455.5,470,274.5,5],
      ["media.normalize","Normalize loudness","media",0,564,470.3,6],
      ["image.resize_to_kb","Resize to exact KB","image",484.3,564,449.3,6],
      ["media.to_mono","Stereo to mono","media",947.7,564,388.4,6],
      ["pdf.compress","Compress PDF","pdf",1350.1,564,379.9,6]
    ];
    const ROW_OF = TOOLS.map(t => t[6]);

    const CAT = {
      pdf:   { name: "PDF",          col: "#ff453a", rgb: "255,69,58",  icon: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>' },
      image: { name: "Images",       col: "#bf5af2", rgb: "191,90,242", icon: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 9"/>' },
      media: { name: "Video",        col: "#ff7828", rgb: "255,120,40", icon: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 4v16M16 4v16M3 9h5M3 15h5M16 9h5M16 15h5"/>' },
      id:    { name: "ID and forms", col: "#ff9f0a", rgb: "255,159,10", icon: '<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.7 1.8-2.4 3-2.4s2.4.7 3 2.4M14.5 10h4M14.5 14h3"/>' },
      files: { name: "Files",        col: "#1a84f3", rgb: "26,132,243", icon: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>' },
    };
    const CAT_ORDER = ["pdf", "image", "media", "id", "files"];   /* the five lights, beats 34 to 38 (names are the app's sidebar names) */
    const catCount = c => TOOLS.filter(t => t[2] === c).length;
    if (TOOLS.length !== TOOL_COUNT) { throw new Error("f3-tools: TOOLS.length " + TOOLS.length + " != tools.count " + TOOL_COUNT); }

    /* ---- build the DOM ---- */
    const $ = id => document.getElementById(id);
    const grid = $("f3-grid");
    const posEls = [], cardEls = [], fillEls = [], icEls = [];
    TOOLS.forEach(t => {
      const c = CAT[t[2]];
      const pos = document.createElement("div");
      pos.className = "f3-pos";
      pos.style.cssText = "left:" + t[3] + "px;top:" + t[4] + "px;width:" + t[5] + "px";
      pos.innerHTML =
        '<div class="f3-card"><span class="f3-tile" style="background:rgba(' + c.rgb + ',.16)">' +
        '<i class="f3-fill" style="background:' + c.col + '"></i>' +
        '<span class="f3-ic" style="color:' + c.col + '"><svg viewBox="0 0 24 24">' + c.icon + '</svg></span></span>' +
        '<span class="f3-name">' + t[1] + '</span></div>';
      grid.appendChild(pos);
      posEls.push(pos);
      cardEls.push(pos.querySelector(".f3-card"));
      fillEls.push(pos.querySelector(".f3-fill"));
      icEls.push(pos.querySelector(".f3-ic"));
    });

    /* the cards, impact entrances: each one STARTS 0.18 s before its beat and ENDS on it (power2.in, an impact).
       Beats chosen on the level jumps of the edit (27.0, 28.51, 30.01, 30.76, 31.5) so every landing is a picture event. */
    /* the cue sheet: first tile on 26, one per beat 27 to 30, then on 8ths from 31 (31, 31.5, 32, 32.5); STOP 32.6 to 32.9, HIT 33 */
    const EARLY = [26, 27, 28, 29, 30, 31, 31.5, 32, 32.5];
    /* frame grid of the film: this composition starts at project 11.07692 s, 60 fps. A beat lands on frame round(project * 60);
       an entrance starts so that its first visible frame is the frame BEFORE the beat frame (just before that frame's time). */
    const PROJ0 = 11.07692, FR = 60;
    const beatFrame = b => Math.round((PROJ0 + at(b)) * FR);
    const frameT = n => n / FR - PROJ0;                       /* local seconds of project frame n */
    const firstVisible = n => frameT(n) - 0.003;              /* a tween starting here is already running (just) on frame n */
    const labels = $("f3-labels");
    const labelEls = CAT_ORDER.map(k => {
      const d = document.createElement("div");
      d.className = "f3-label"; d.textContent = CAT[k].name + "  ·  " + catCount(k);
      labels.appendChild(d); return d;
    });

    /* ---- timeline ---- */
    const tl = gsap.timeline({ paused: true });
    const OUT = "expo.out", FADE = "power1.out";
    const NF = { immediateRender: false };
    /* entrance on the hit frame: transform expo.out, opacity fromTo 0.5 to 1 in 0.08 s */
    const enter = (sel, t, o = {}) => {
      tl.fromTo(sel, { y: o.y === undefined ? 24 : o.y }, { y: 0, duration: o.dur || 0.4, ease: OUT, ...NF }, t);
      tl.fromTo(sel, { opacity: 0.5 }, { opacity: 1, duration: 0.08, ease: FADE, ...NF }, t);
    };

    gsap.set("#f3-push", { scale: PLATE_SCALE_START, transformOrigin: "50% 50%" });
    gsap.set("#f3-grid", { rotation: -1.5, transformOrigin: "50% 50%" });
    gsap.set("#f3-head", { scale: 1, transformOrigin: "50% 0%" });
    gsap.set(posEls, { opacity: 0, y: 80 });                 /* every card is hidden until its own beat */

    /* ---- beats 24 to 26: the result card, on screen from frame 0, nothing else moves ---- */
    /* the big number counts 0 to 35 with an impact (power2.in) that ENDS exactly on beat 25, then rests with the card */
    /* it starts on a real value (never 0): the first frame the number is visible already reads "10% smaller" */
    const cnt = { v: 10 };
    $("f3-pct").textContent = String(RESULT.pct);
    tl.fromTo(cnt, { v: 10 }, { v: RESULT.pct, duration: at(25) - at(24.25), ease: "power2.in", ...NF,
      onUpdate: () => { $("f3-pct").textContent = String(Math.max(10, Math.round(cnt.v))); } }, at(24.25));
    tl.fromTo("#f3-result", { opacity: 0.5 }, { opacity: 1, duration: 0.08, ease: FADE, ...NF }, at(24.25));
    /* the number leaves ending one frame before beat 26, the plate and the first card take over on beat 26 */
    tl.to("#f3-result", { opacity: 0, duration: 0.15, ease: "power1.in" }, at(26) - 0.15 - F);
    /* the bar slides down and shrinks to a small anchor, then is gone under the cards */
    tl.fromTo("#f3-push", { scale: PLATE_SCALE_START }, { scale: 0.42, duration: 0.5, ease: OUT, ...NF }, at(26) - F);
    tl.fromTo("#f3-slide", { y: 0 }, { y: 330, duration: 0.5, ease: OUT, ...NF }, at(26) - F);
    tl.fromTo("#f3-slide", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.in", ...NF }, at(26) - F);

    /* the big counter lands with the first card */
    const T_FIRST = firstVisible(beatFrame(26) - 1);          /* first card and the counter share this frame */
    tl.set("#f3-count", { opacity: 0 }, 0);
    enter("#f3-count", T_FIRST, { y: 24 });

    /* ---- cards ----
       early cards (beats 26 to 32.5): each entrance starts so its first visible frame is the frame before its beat frame (expo.out, lands on the beat).
       HIT (beat 33, frame 914): STOP 32.6 to 32.9 holds, then ALL the remaining cards arrive on the hit frame (row by row only in how long the rise
       takes, 40 ms per row), so the counter can lock on the real total on that same frame without ever running below the cards on screen. */
    const STOP_A = 32.61, STOP_B = 32.93, HIT = 33;
    const EARLY_DUR = 0.28, EARLY_Y = 44;
    const startT = [];                                         /* local second each card first shows (index = tool) */
    EARLY.forEach((b, i) => {
      const t = firstVisible(beatFrame(b) - 1);
      startT.push(t);
      tl.fromTo(posEls[i], { y: EARLY_Y }, { y: 0, duration: EARLY_DUR, ease: OUT, ...NF }, t);
      tl.fromTo(posEls[i], { opacity: 0.5 }, { opacity: 1, duration: 0.08, ease: FADE, ...NF }, t);
    });
    const T_HIT = firstVisible(beatFrame(HIT));                /* first visible frame = the beat frame (914) */
    const RIPPLE_STEP = 0.04, RIPPLE_DUR = 0.3;
    const rippleStart = EARLY.length;
    for (let i = rippleStart; i < TOOLS.length; i++) {
      const r = ROW_OF[i] - ROW_OF[rippleStart];
      startT.push(T_HIT);
      tl.fromTo(posEls[i], { y: 80 }, { y: 0, duration: RIPPLE_DUR + r * RIPPLE_STEP, ease: OUT, ...NF }, T_HIT);
      tl.fromTo(posEls[i], { opacity: 0.5 }, { opacity: 1, duration: 0.08, ease: FADE, ...NF }, T_HIT);
    }

    /* The counter always reads the number of cards on screen (a card counts from its first visible frame), as "N tool(s).".
       One layer per value, switched by seek-safe sets on the same time the cards appear: 1..9 with the early cards, then 31 on the hit frame. */
    const steps = [...new Set(startT)].sort((x, y) => x - y).map(t => ({ t, n: startT.filter(x => x <= t).length }));
    const countLayers = {};
    steps.forEach(st => {
      const d = document.createElement("div");
      d.className = "f3-cl";
      d.innerHTML = '<span class="f3-nb">' + st.n + '</span><span class="f3-wd">' + (st.n === 1 ? "tool.<i>s</i>" : "tools.") + '</span>';
      $("f3-count").appendChild(d);
      countLayers[st.n] = d;
    });
    steps.forEach((st, k) => {
      if (k > 0) tl.set(countLayers[steps[k - 1].n], { opacity: 0 }, st.t);
      tl.set(countLayers[st.n], { opacity: 1 }, st.t);
    });
    if (steps[steps.length - 1].n !== TOOL_COUNT) { throw new Error("f3-tools: counter does not lock on " + TOOL_COUNT); }

    /* slow 3 degree orbit of the grid and slow drift of the counter, in two segments around the stop */
    const SEGS = [[26, STOP_A], [STOP_B, 39]];
    const TOT = SEGS.reduce((s, g) => s + g[1] - g[0], 0);
    let acc = 0;
    SEGS.forEach(([a, b]) => {
      const f0 = acc / TOT; acc += b - a; const f1 = acc / TOT;
      tl.fromTo("#f3-grid", { rotation: -1.5 + 3 * f0 }, { rotation: -1.5 + 3 * f1, duration: at(b) - at(a), ease: "none", ...NF }, at(a));
      tl.fromTo("#f3-head", { scale: 1 + 0.03 * f0 }, { scale: 1 + 0.03 * f1, duration: at(b) - at(a), ease: "none", ...NF }, at(a));
    });

    /* beats 34 to 38: one category per beat lights, on a hit (34, 35, 36, 37, 38 all carry a level jump or onset).
       0.08 s tweens starting on the hit frame, so the lit grid holds from 38 to the resolve. Everything else dims to 55 percent. */
    const LIGHT_DUR = 0.08, DIM = 0.55;
    let prev = null;
    CAT_ORDER.forEach((cat, k) => {
      const st = at(34 + k) - F;
      TOOLS.forEach((t, i) => {
        const lit = t[2] === cat, wasLit = t[2] === prev;
        const fromOp = prev === null ? 1 : (wasLit ? 1 : DIM);
        if (lit) {
          tl.fromTo(cardEls[i], { opacity: fromOp }, { opacity: 1, duration: LIGHT_DUR, ease: FADE, ...NF }, st);
          tl.fromTo(fillEls[i], { opacity: 0 }, { opacity: 1, duration: LIGHT_DUR, ease: FADE, ...NF }, st);
          tl.fromTo(icEls[i], { color: CAT[t[2]].col }, { color: "#ffffff", duration: LIGHT_DUR, ease: FADE, ...NF }, st);
        } else if (prev === null || wasLit) {
          tl.fromTo(cardEls[i], { opacity: fromOp }, { opacity: DIM, duration: LIGHT_DUR, ease: FADE, ...NF }, st);
          if (wasLit) {
            tl.fromTo(fillEls[i], { opacity: 1 }, { opacity: 0, duration: LIGHT_DUR, ease: FADE, ...NF }, st);
            tl.fromTo(icEls[i], { color: "#ffffff" }, { color: CAT[t[2]].col, duration: LIGHT_DUR, ease: FADE, ...NF }, st);
          }
        }
      });
      /* label: the previous one is out one frame before the beat, the new one lands on it */
      if (k > 0) tl.to(labelEls[k - 1], { opacity: 0, duration: 0.1, ease: "power1.in" }, at(34 + k) - 0.1 - F);
      enter(labelEls[k], st, { y: 12 });
      prev = cat;
    });

    /* beat 39: the lit grid resolves into the real Home screen on the hit frame (cut, no cross-dissolve of two text layers), then
       everything is still until the hard cut into frame 4 on beat 40 (no fade through blank). */
    const HOME_T = at(39) - F;
    tl.fromTo("#f3-home", { opacity: 0.5 }, { opacity: 1, duration: 0.08, ease: FADE, ...NF }, HOME_T);
    tl.fromTo("#f3-home", { scale: 0.97, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.4, ease: OUT, ...NF }, HOME_T);
    tl.set(["#f3-head", "#f3-grid"], { opacity: 0 }, HOME_T);   /* the lit grid is cut on the hit frame, Home is already arriving */

    window.__timelines["f3-tools"] = tl;
  </script>
</template>
</body></html>
