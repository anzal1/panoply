<!doctype html>
<html><head><meta charset="UTF-8"></head><body>
<template>
  <style>
    @font-face{font-family:"Geist";src:url("assets/fonts/Geist-Variable-latin.woff2") format("woff2");font-weight:100 900}
    @font-face{font-family:"Geist Mono";src:url("assets/fonts/GeistMono-latin.woff2") format("woff2");font-weight:100 900}
    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #1d1d1f; }
    #f4-ground { position: absolute; inset: 0; background: #2d6cdf; }
    #f4-grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .08; mix-blend-mode: soft-light; pointer-events: none; }
    #f4-cam { position: absolute; inset: 0; transform-origin: 50% 50%; }

    /* the real Home plate, exactly where frame 3 ends: 1500 wide at left 210, top 74 */
    #f4-plate { position: absolute; left: 210px; top: 74px; width: 1500px; height: 931px; border-radius: 15.75px; overflow: hidden;
      box-shadow: 0 0 0 1.5px rgba(255,255,255,.35), 0 40px 120px rgba(8,24,70,.45); }
    #f4-plate img { width: 100%; height: 100%; display: block; }

    /* the real Find page (offscreen render of the app, sidebar cropped away), 980 x 760, same box frame 5 uses: left 470, top 140 */
    #f4-cardwrap { position: absolute; left: 470px; top: 140px; width: 980px; height: 760px; border-radius: 28px;
      box-shadow: 0 0 0 1.5px rgba(255,255,255,.35), 0 40px 120px rgba(8,24,70,.45); }
    #f4-card { position: absolute; inset: 0; border-radius: 28px; overflow: hidden; background: #fafafb; }
    #f4-zoom { position: absolute; left: 0; top: 0; width: 980px; height: 760px; transform-origin: 0 0; }
    #f4-zoom img { position: absolute; left: 0; top: 0; width: 980px; height: 760px; display: block; opacity: 0; }

    .f4-line { position: absolute; left: 0; right: 0; top: 930px; text-align: center; color: #fff; white-space: nowrap; font-weight: 700; font-size: 112px; letter-spacing: -0.04em; line-height: 0.98; }
    #f4-lat { position: absolute; right: 410px; top: 100px; height: 64px; padding: 0 30px; display: flex; align-items: center; justify-content: center; gap: 14px; border-radius: 999px; background: #0b1b44; color: #fff;
      font-family: "Geist Mono", ui-monospace, monospace; font-weight: 500; font-size: 38px; letter-spacing: -0.01em; box-shadow: 0 10px 30px rgba(8,24,70,.35); }
    #f4-lat i { display: block; width: 14px; height: 14px; border-radius: 50%; background: #30d158; }
  </style>
  <div id="root" data-composition-id="f4-find" data-width="1920" data-height="1080">
    <div id="f4-ground"></div>
    <div id="f4-cam" data-layout-allow-overflow>
      <div id="f4-plate"><img src="assets/captures/app-home-light.png" alt=""></div>
      <div id="f4-cardwrap">
        <div id="f4-card" data-layout-allow-occlusion>
          <div id="f4-zoom" data-layout-allow-overflow data-layout-allow-occlusion>
            <img id="f4-t0" src="assets/f4-find/type-0.png" alt="">
            <img id="f4-t2" src="assets/f4-find/type-2.png" alt="">
            <img id="f4-t3" src="assets/f4-find/type-3.png" alt="">
            <img id="f4-t4" src="assets/f4-find/type-4.png" alt="">
            <img id="f4-t5" src="assets/f4-find/type-5.png" alt="">
            <img id="f4-t6" src="assets/f4-find/type-6.png" alt="">
          </div>
        </div>
      </div>
      <div class="f4-line" id="f4-l1">Every file on your disk.</div>
      <div class="f4-line" id="f4-l2">Before you finish typing.</div>
      <div id="f4-lat" data-layout-allow-overlap><i></i><span id="f4-lat-txt"></span></div>
    </div>
    <img id="f4-grain" src="assets/f4-find/grain.png" alt="">
  </div>
  <script>
    const BEAT = 60 / 130, START = 40, F = 1 / 60;
    const at = b => (b - START) * BEAT;

    /* the measured time from a keystroke to a drawn frame: p50 of 14 keystrokes in assets/data/find-report.json (release build, Mac runner) */
    const LATENCY_MS = 3;
    document.getElementById('f4-lat-txt').textContent = LATENCY_MS + ' ms';

    const tl = gsap.timeline({ paused: true });
    /* a hit-frame entrance: transform expo-out, opacity 0.5 to 1 in 0.08 s, starting one frame before the beat so the beat frame already shows it */
    const enter = (sel, beat, from, dur = 0.4) => {
      const t = Math.max(0, at(beat) - F);
      tl.fromTo(sel, from, { x: 0, y: 0, duration: dur, ease: 'expo.out', immediateRender: false }, t);
      tl.fromTo(sel, { opacity: 0.5 }, { opacity: 1, duration: 0.08, ease: 'power1.out', immediateRender: false }, t);
    };
    gsap.set(['#f4-l1', '#f4-l2', '#f4-lat'], { opacity: 0 });
    gsap.set('#f4-t0', { opacity: 1 });

    /* the Home plate is on screen exactly as frame 3 ends, then glides away from the first frame */
    tl.fromTo('#f4-plate', { x: 0, y: 0, scale: 1 }, { x: -330, y: 120, scale: 0.62, duration: 0.5, ease: 'expo.out', transformOrigin: '50% 50%', immediateRender: false }, 0);
    /* the real Find page lands on beat 40 (already arriving on the first frame) */
    enter('#f4-cardwrap', 40, { x: 320 }, 0.45);

    /* the push: about 1.7x on the search field and the first rows so the typing reads on a phone (top-left origin, card pixels) */
    const K = 760 / 1440;              /* card pixels per source pixel */
    const S1 = 1.7, S2 = 1.3;
    tl.fromTo('#f4-zoom', { scale: 1, x: 0, y: 0 }, { scale: S1, x: 0, y: -100 * K * S1, duration: 0.6, ease: 'expo.out', immediateRender: false }, at(40.4));

    /* the typing, one real capture per 16th note: re, rep, repo, repor, report */
    const STEPS = [[41, 't2'], [41.25, 't3'], [41.5, 't4'], [41.75, 't5'], [42, 't6']];
    STEPS.forEach(([b, id], i) => {
      tl.set('#f4-' + id, { opacity: 1 }, at(b));
      tl.set(i === 0 ? '#f4-t0' : '#f4-' + STEPS[i - 1][1], { opacity: 0 }, at(b));
    });

    /* copy lands on its beat; the first line leaves one frame before the second lands */
    enter('#f4-l1', 44, { y: 40 });
    tl.to('#f4-l1', { opacity: 0, y: -30, duration: 0.2, ease: 'power3.in', immediateRender: false }, at(46.5) - F - 0.2);
    enter('#f4-l2', 46.5, { y: 40 });

    /* HIT beat 46.5: the latency pill lands as an impact that ENDS on the beat, and the camera pulls back so the whole result list reads */
    tl.fromTo('#f4-lat', { y: -26 }, { y: 0, duration: 0.18, ease: 'power2.in', immediateRender: false }, at(46.5) - 0.18);
    tl.fromTo('#f4-lat', { opacity: 0.5 }, { opacity: 1, duration: 0.08, ease: 'power1.out', immediateRender: false }, at(46.5) - 0.18);
    tl.to('#f4-zoom', { scale: S2, x: 0, y: -40 * K * S2, duration: 0.5, ease: 'expo.out', immediateRender: false }, at(46.5) - F);

    /* slow drift across the scene */
    tl.fromTo('#f4-cam', { scale: 1 }, { scale: 1.02, duration: 8 * BEAT, ease: 'none' }, 0);

    /* hard exit one frame before beat 48: the ground stays blue, frame 5 lands on beat 48 */
    tl.to('#f4-cam', { opacity: 0, duration: 0.15, ease: 'power1.in' }, at(48) - 0.15 - F);

    window.__timelines["f4-find"] = tl;
  </script>
</template>
</body></html>
