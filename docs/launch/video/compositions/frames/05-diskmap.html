<!doctype html>
<html><head><meta charset="UTF-8"></head><body>
<template>
  <style>
    @font-face{font-family:"Geist";src:url("assets/fonts/Geist-Variable-latin.woff2") format("woff2");font-weight:100 900}
    @font-face{font-family:"Geist Mono";src:url("assets/fonts/GeistMono-latin.woff2") format("woff2");font-weight:100 900}
    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #1d1d1f; }
    #f5-ground { position: absolute; inset: 0; background: #2d6cdf; }
    #f5-grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .08; mix-blend-mode: soft-light; pointer-events: none; }
    #f5-cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
    .f5-line { position: absolute; left: 0; right: 0; top: 810px; text-align: center; color: #fff; white-space: nowrap; font-weight: 700; font-size: 112px; letter-spacing: -0.04em; line-height: 0.98; }

    /* FINAL CARD GEOMETRY (frame 6 shrinks it into the fan): 902 x 700, left 509, top 70, radius 28, content at pose 1 (the whole page) from beat 55.
       The real Disk map page (offscreen render of the app, sidebar cropped away) sits inside it. */
    #f5-cardwrap { position: absolute; left: 509px; top: 70px; width: 902px; height: 700px; border-radius: 28px;
      box-shadow: 0 0 0 1.5px rgba(255,255,255,.35), 0 40px 120px rgba(8,24,70,.45); }
    #f5-card { position: absolute; inset: 0; border-radius: 28px; overflow: hidden; background: #fafafb; }
    #f5-zoom { position: absolute; left: 0; top: 0; width: 902px; height: 700px; transform-origin: 0 0; }
    #f5-zoom img.pl { position: absolute; left: 0; top: 0; width: 902px; height: 700px; display: block; opacity: 0; }
    /* the three review rows, cut out of the review capture so they can leave on the click (same pixels, same place) */
    .f5-row { position: absolute; left: 0; top: 0; width: 902px; height: 700px; opacity: 0; background: url("assets/f5-diskmap/review.png") 0 0 / 902px 700px no-repeat; }
    #f5-row1 { clip-path: inset(118px 306px 527px 28px); }
    #f5-row2 { clip-path: inset(172.6px 306px 481px 28px); }
    #f5-row3 { clip-path: inset(218.8px 306px 424px 28px); }
    /* hides the empty-state text of the moved page until the last row has left (same colour as the page) */
    #f5-mask { position: absolute; background: #fafafb; opacity: 0; }
    /* the leaving rows are clipped to the Review pane (source x 20..1262, y 140..1330), so they never slide over the page's other panels */
    #f5-rows { position: absolute; left: 0; top: 0; width: 902px; height: 700px; clip-path: inset(68px 270px 54px 10px); }
    #f5-cursor { position: absolute; left: 0; top: 0; width: 40px; height: 40px; opacity: 0; transform-origin: 6px 4px; }
    #f5-cursor svg { width: 40px; height: 40px; display: block; overflow: visible; filter: drop-shadow(0 3px 5px rgba(0,0,0,.35)); }
    #f5-freed { position: absolute; left: 1450px; top: 84px; height: 64px; padding: 0 30px; display: flex; align-items: center; justify-content: center; gap: 14px; border-radius: 999px; background: #0b1b44; color: #fff;
      font-family: "Geist Mono", ui-monospace, monospace; font-weight: 500; font-size: 38px; letter-spacing: -0.01em; box-shadow: 0 10px 30px rgba(8,24,70,.35); font-variant-numeric: tabular-nums; white-space: nowrap; }
    #f5-freed i { display: block; width: 14px; height: 14px; border-radius: 50%; background: #30d158; }
  </style>
  <div id="root" data-composition-id="f5-diskmap" data-width="1920" data-height="1080">
    <div id="f5-ground"></div>
    <div id="f5-cam" data-layout-allow-overflow>
      <div class="f5-line" id="f5-title">See what is eating your space.</div>
      <div id="f5-cardwrap">
        <div id="f5-card" data-layout-allow-occlusion>
          <div id="f5-zoom" data-layout-allow-overflow data-layout-allow-occlusion>
            <img class="pl" id="f5-map" src="assets/f5-diskmap/map.png" alt="">
            <img class="pl" id="f5-drilled" src="assets/f5-diskmap/drilled.png" alt="">
            <img class="pl" id="f5-picked" src="assets/f5-diskmap/picked.png" alt="">
            <img class="pl" id="f5-review" src="assets/f5-diskmap/review.png" alt="">
            <img class="pl" id="f5-moved" src="assets/f5-diskmap/moved.png" alt="">
            <img class="pl" id="f5-after" src="assets/f5-diskmap/after.png" alt="">
            <div id="f5-mask"></div>
            <div id="f5-rows"><div class="f5-row" id="f5-row1"></div><div class="f5-row" id="f5-row2"></div><div class="f5-row" id="f5-row3"></div></div>
            <div id="f5-cursor"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6.2 1.6L9.6 19z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
          </div>
        </div>
      </div>
      <div id="f5-freed" data-layout-allow-overlap><i></i><span id="f5-freed-txt">0 GB freed</span></div>
    </div>
    <img id="f5-grain" src="assets/f5-diskmap/grain.png" alt="">
  </div>
  <script>
    const BEAT = 60 / 130, START = 48, F = 1 / 60;
    /* every event is placed on the 60 fps grid: the frame start snap (window.__snap, see assemble-index.py) is taken out, and half a frame is taken off,
         so an event at exact time t first shows on frame round(t * 60), the frame the cue sheet names */
      const SNAP = ((window.__snap && window.__snap['f5-diskmap']) || 0) + 1 / 120;
      const at = b => Math.max(0, (b - START) * BEAT - SNAP);

    /* the freed number is the real result of the render: "Moved 3 items, 27.8 GB, to the Trash" (moved.png). The three picks are the trip video, an installer and a browser cache folder */
    const FREED_GB = 27.8;
    /* source rectangle (cropped plate pixels) of the three review rows: x, y, w, h */
    const MASK = [40, 236, 1210, 342];   /* the review rows and their separators, plate pixels */

    const tl = gsap.timeline({ paused: true });
    /* a hit-frame entrance: transform expo-out, opacity 0.5 to 1 in 0.08 s, starting one frame before the beat */
    const enter = (sel, beat, from, dur = 0.4) => {
      const t = Math.max(0, at(beat) - F);
      tl.fromTo(sel, from, { x: 0, y: 0, duration: dur, ease: 'expo.out', immediateRender: false }, t);
      tl.fromTo(sel, { opacity: 0.5 }, { opacity: 1, duration: 0.08, ease: 'power1.out', immediateRender: false }, t);
    };
    gsap.set(['#f5-title', '#f5-freed'], { opacity: 0 });
    gsap.set('#f5-map', { opacity: 1 });

    /* camera in card pixels (top-left origin). K = card pixels per source pixel; a pose is a scale and the cropped-plate source pixel at the card's top-left corner */
    const K = 700 / 1440;
    const pose = (s, x0, y0) => ({ scale: s, x: -x0 * K * s, y: -y0 * K * s });
    /* poses change as hard cuts on the beat (a punch-in is a cut), so no frame ever shows a crop halfway through a word; every static crop edge was
       checked to fall on a line with no text (the treemap panel is 1284 source pixels wide, so 1.45x ends exactly at its edge) */
    const snap = (to, beat) => tl.set('#f5-zoom', pose(...to), at(beat));
    gsap.set('#f5-zoom', pose(1, 0, 0));
    const ZS = 1.45;   /* the view is then 1280 source pixels wide, which stops just short of the file list */
    /* source pixel to card pixel inside the zoom layer */
    const px = v => v * K;

    /* HIT beat 48: the real Disk map is on screen at full opacity from the first frame (hard cut from the Find card), and the push starts on that frame */
    /* beat 48 shows the whole page; the punch-in to the treemap panel is a cut on 48.5 */
    snap([ZS, 0, 92], 48.5);
    /* 49.0 the headline lands over the treemap, the strongest frames of the shot */
    enter('#f5-title', 49, { y: 40 });

    /* 50.0 DRILL into Movies on the beat: the captured drilled view takes the beat frame (several coloured children), same camera */
    tl.set('#f5-drilled', { opacity: 1 }, at(50));
    tl.set('#f5-map', { opacity: 0 }, at(50));

    /* 51.0 the trip video is ticked (checkbox on its block), same camera */
    tl.set('#f5-picked', { opacity: 1 }, at(51));
    tl.set('#f5-drilled', { opacity: 0 }, at(51));

    /* 52.0 the review: three rows with real paths, read at 1.45x for 0.7 beat, then the camera widens to the whole page (no crop through a panel) while the cursor travels */
    tl.set('#f5-review', { opacity: 1 }, at(52));
    tl.set('#f5-picked', { opacity: 0 }, at(52));
    snap([ZS, 0, 130], 52);
    snap([1, 0, 0], 52.7);
    const BTN = [1107, 1358], FROM = [900, 900];   /* source pixels (cropped plate): the Move to Trash button centre, and where the cursor comes from */
    const place = (xy) => ({ x: px(xy[0]) - 6, y: px(xy[1]) - 4 });
    tl.fromTo('#f5-cursor', Object.assign({ opacity: 0, scale: 1 }, place(FROM)), Object.assign({ opacity: 1, duration: 0.12, ease: 'none', immediateRender: false }, place(FROM)), at(52.55));
    tl.to('#f5-cursor', Object.assign({ duration: at(53) - at(52.7), ease: 'power2.inOut', immediateRender: false }, place(BTN)), at(52.7));
    tl.to('#f5-cursor', { scale: 0.82, duration: 0.07, ease: 'power1.in', immediateRender: false }, at(53) - 0.07);
    tl.to('#f5-cursor', { scale: 1, duration: 0.1, ease: 'power1.out', immediateRender: false }, at(53));
    tl.to('#f5-cursor', { opacity: 0, duration: 0.15, ease: 'power1.in', immediateRender: false }, at(53) + 0.25);

    /* 53.0 CLICK: the result takes the beat frame ("Moved 3 items, 27.8 GB, to the Trash") and the three real rows leave, one after another, sliding right and fading.
       The empty-state text of the page stays covered until the last row has gone, then fades in. */
    /* the page does not change until the last row has gone: the rows are covered on the review capture and the captured copies slide away on top, then the result page replaces it */
    const M = MASK, mk = document.getElementById('f5-mask');
    mk.style.cssText = `left:${px(M[0])}px;top:${px(M[1])}px;width:${px(M[2])}px;height:${px(M[3])}px`;
    tl.set('#f5-mask', { opacity: 1 }, at(53));
    [1, 2, 3].forEach((n, i) => {
      const sel = '#f5-row' + n, t = at(53) + i * 0.06;
      tl.set(sel, { opacity: 1 }, at(53));
      tl.fromTo(sel, { x: 0 }, { x: 260, duration: 0.32, ease: 'power2.in', immediateRender: false }, t);
      tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: 'power1.in', immediateRender: false }, t + 0.02);
    });
    tl.set('#f5-row1, #f5-row2, #f5-row3', { opacity: 0 }, at(53) + 0.45);
    tl.set('#f5-moved', { opacity: 1 }, at(53) + 0.46);
    tl.set('#f5-review', { opacity: 0 }, at(53) + 0.46);
    tl.set('#f5-mask', { opacity: 0 }, at(53) + 0.46);
    /* the pill sits outside the card, clear of the header buttons, and counts with the click */
    enter('#f5-freed', 53, { y: -20 }, 0.35);
    const st = { v: 0 };
    tl.to(st, { v: FREED_GB, duration: 0.5, ease: 'power2.out', immediateRender: false, onUpdate() {
      document.getElementById('f5-freed-txt').textContent = st.v.toFixed(1) + ' GB freed';
    } }, at(53));

    /* 54.5 back to the map: the same home after the move (a real render of the app, 97 GB down to 69 GB); this is the page frame 6 shrinks into the fan */
    tl.set('#f5-after', { opacity: 1 }, at(54.5));
    tl.set('#f5-moved', { opacity: 0 }, at(54.5));

    /* the pill leaves with the page still, before the cut */
    tl.to('#f5-freed', { opacity: 0, y: -14, duration: 0.2, ease: 'power3.in', immediateRender: false }, at(55));

    /* slow drift that ends at scale 1 on beat 55, so the card is exactly at rest from there on */
    tl.fromTo('#f5-cam', { scale: 1.02 }, { scale: 1, duration: 7 * BEAT, ease: 'none' }, 0);

    window.__timelines["f5-diskmap"] = tl;
  </script>
</template>
</body></html>
