<!doctype html>
<html><head><meta charset="UTF-8"></head><body>
<template>
  <style>
    @font-face{font-family:"Geist";src:url("assets/fonts/Geist-Variable-latin.woff2") format("woff2");font-weight:100 900}
    @font-face{font-family:"Geist Mono";src:url("assets/fonts/GeistMono-latin.woff2") format("woff2");font-weight:100 900}
    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #1d1d1f; }
    #f5-ground { position: absolute; inset: 0; background: #2d6cdf; }
    #f5-grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .08; mix-blend-mode: soft-light; pointer-events: none; }
    #f5-cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
    .f5-line { position: absolute; left: 0; right: 0; top: 930px; text-align: center; color: #fff; white-space: nowrap; font-weight: 700; font-size: 112px; letter-spacing: -0.04em; line-height: 0.98; }

    /* FINAL CARD GEOMETRY (frame 6 morphs from it): 980 x 760, left 470, top 140, radius 28, scale 1, at rest from beat 55.
       The real Disk map page (offscreen render of the app, sidebar cropped away) sits inside it. */
    #f5-cardwrap { position: absolute; left: 470px; top: 140px; width: 980px; height: 760px; border-radius: 28px;
      box-shadow: 0 0 0 1.5px rgba(255,255,255,.35), 0 40px 120px rgba(8,24,70,.45); }
    #f5-card { position: absolute; inset: 0; border-radius: 28px; overflow: hidden; background: #fafafb; }
    #f5-zoom { position: absolute; left: 0; top: 0; width: 980px; height: 760px; transform-origin: 0 0; }
    #f5-zoom img { position: absolute; left: 0; top: 0; width: 980px; height: 760px; display: block; opacity: 0; }
    #f5-freed { position: absolute; right: 410px; top: 100px; height: 64px; padding: 0 30px; display: flex; align-items: center; justify-content: center; gap: 14px; border-radius: 999px; background: #0b1b44; color: #fff;
      font-family: "Geist Mono", ui-monospace, monospace; font-weight: 500; font-size: 38px; letter-spacing: -0.01em; box-shadow: 0 10px 30px rgba(8,24,70,.35); font-variant-numeric: tabular-nums; }
    #f5-freed i { display: block; width: 14px; height: 14px; border-radius: 50%; background: #30d158; }
  </style>
  <div id="root" data-composition-id="f5-diskmap" data-width="1920" data-height="1080">
    <div id="f5-ground"></div>
    <div id="f5-cam" data-layout-allow-overflow>
      <div class="f5-line" id="f5-title">See what is eating your space.</div>
      <div id="f5-cardwrap">
        <div id="f5-card" data-layout-allow-occlusion>
          <div id="f5-zoom" data-layout-allow-overflow data-layout-allow-occlusion>
            <img id="f5-map" src="assets/f5-diskmap/map.png" alt="">
            <img id="f5-drilled" src="assets/f5-diskmap/drilled.png" alt="">
            <img id="f5-review" src="assets/f5-diskmap/review.png" alt="">
            <img id="f5-moved" src="assets/f5-diskmap/moved.png" alt="">
          </div>
        </div>
      </div>
      <div id="f5-freed" data-layout-allow-overlap><i></i><span id="f5-freed-txt">0 MB freed</span></div>
    </div>
    <img id="f5-grain" src="assets/f5-diskmap/grain.png" alt="">
  </div>
  <script>
    const BEAT = 60 / 130, START = 48, F = 1 / 60;
    const at = b => (b - START) * BEAT;

    /* the freed number is the real result of the render: "Moved 3 items, 21 MB, to the Trash" (moved.png); the three picks are Movies, Downloads and a cache folder inside Library */
    const FREED_MB = 21;

    const tl = gsap.timeline({ paused: true });
    /* a hit-frame entrance: transform expo-out, opacity 0.5 to 1 in 0.08 s, starting one frame before the beat */
    const enter = (sel, beat, from, dur = 0.4) => {
      const t = Math.max(0, at(beat) - F);
      tl.fromTo(sel, from, { x: 0, y: 0, duration: dur, ease: 'expo.out', immediateRender: false }, t);
      tl.fromTo(sel, { opacity: 0.5 }, { opacity: 1, duration: 0.08, ease: 'power1.out', immediateRender: false }, t);
    };
    gsap.set(['#f5-title', '#f5-freed'], { opacity: 0 });
    gsap.set('#f5-map', { opacity: 1 });

    /* camera in card pixels (top-left origin). K = card pixels per source pixel; focus is given in cropped-plate source pixels */
    const K = 760 / 1440, CW = 980, CH = 760;
    /* a pose is given as a scale and the cropped-plate source pixel that sits at the card's top-left corner */
    const pose = (s, x0, y0) => ({ scale: s, x: -x0 * K * s, y: -y0 * K * s });
    let cur = pose(1, 0, 0);   /* every move starts from the pose the last one ended on, so any seek order gives the same picture */
    const move = (to, beat, dur = 0.55) => { const nx = pose(...to); tl.fromTo('#f5-zoom', Object.assign({}, cur), Object.assign({ duration: dur, ease: 'expo.out', immediateRender: false }, nx), at(beat)); cur = nx; };
    const ZS = 1.45;   /* the view is then 1281 source pixels wide, which stops just short of the file list */

    /* HIT beat 48: the real Disk map lands on the first frame (the Find card was cut one frame earlier, the blue stays) */
    enter('#f5-cardwrap', 48, { y: 60 }, 0.45);
    /* the push: about 1.45x on the treemap so the folders and sizes read on a phone */
    move([ZS, 0, 150], 48.5, 0.7);

    /* 50.0 drill into Developer: the captured drilled view takes the beat frame (same camera, the picture itself changes) */
    tl.set('#f5-drilled', { opacity: 1 }, at(50));
    tl.set('#f5-map', { opacity: 0 }, at(50));

    /* 52.0 the review: the picks (Movies, Downloads, a cache folder in Library) as rows, "3 selected, 21 MB" reads in the header */
    tl.set('#f5-review', { opacity: 1 }, at(52));
    tl.set('#f5-drilled', { opacity: 0 }, at(52));
    move([ZS, 0, 100], 52, 0.5);

    /* 53.0 moved: the result with Undo, and the freed number counts up with it */
    tl.set('#f5-moved', { opacity: 1 }, at(53));
    tl.set('#f5-review', { opacity: 0 }, at(53));
    move([1, 0, 0], 53, 0.6);   /* pull back to the whole page; the chip carries the number */
    enter('#f5-freed', 53, { y: -20 }, 0.35);
    const st = { v: 0 };
    tl.to(st, { v: FREED_MB, duration: 0.45, ease: 'power2.out', immediateRender: false, onUpdate() {
      document.getElementById('f5-freed-txt').textContent = Math.round(st.v) + ' MB freed';
    } }, at(53));

    /* the chip leaves with the card still, before the cut */
    tl.to('#f5-freed', { opacity: 0, y: -14, duration: 0.2, ease: 'power3.in', immediateRender: false }, at(55.2));

    /* 54.0 the line lands */
    enter('#f5-title', 54, { y: 40 });

    /* slow drift that ends at scale 1 on beat 55, so the card is exactly at rest from there on */
    tl.fromTo('#f5-cam', { scale: 1.02 }, { scale: 1, duration: 7 * BEAT, ease: 'none' }, 0);

    window.__timelines["f5-diskmap"] = tl;
  </script>
</template>
</body></html>
