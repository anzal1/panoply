  <div id="root" data-composition-id="f6-plugins" data-width="1920" data-height="1080">

        <svg viewBox="0 0 544 544" fill="none">
          <defs><clipPath id="f6-clip"><path d="M316.414 65.569C331.243 65.569 338.657 65.569 344.722 67.279A45.552 45.552 0 0 1 376.199 98.757C377.909 104.821 377.909 112.235 377.909 127.065L377.909 382.508C377.909 397.338 377.909 404.752 376.199 410.816A45.552 45.552 0 0 1 344.722 442.294C338.657 444.004 331.243 444.004 316.414 444.004L229.163 444.004C214.334 444.004 206.919 444.004 200.855 442.294A45.552 45.552 0 0 1 169.378 410.816C167.668 404.752 167.668 397.338 167.668 382.508L167.668 127.065C167.668 112.235 167.668 104.821 169.378 98.757A45.552 45.552 0 0 1 200.855 67.279C206.919 65.569 214.334 65.569 229.163 65.569Z"/></clipPath></defs>
          <g id="f6-sideL">
            <path d="M316.414 65.569C331.243 65.569 338.657 65.569 344.722 67.279A45.552 45.552 0 0 1 376.199 98.757C377.909 104.821 377.909 112.235 377.909 127.065L377.909 382.508C377.909 397.338 377.909 404.752 376.199 410.816A45.552 45.552 0 0 1 344.722 442.294C338.657 444.004 331.243 444.004 316.414 444.004L229.163 444.004C214.334 444.004 206.919 444.004 200.855 442.294A45.552 45.552 0 0 1 169.378 410.816C167.668 404.752 167.668 397.338 167.668 382.508L167.668 127.065C167.668 112.235 167.668 104.821 169.378 98.757A45.552 45.552 0 0 1 200.855 67.279C206.919 65.569 214.334 65.569 229.163 65.569Z" fill="rgba(255,255,255,.42)"/>
            <g clip-path="url(#f6-clip)"><image href="assets/captures/app-home-light.png" x="167.668" y="65.569" width="210.241" height="378.435" preserveAspectRatio="xMidYMid meet" opacity=".7"/></g>
          </g>
          <g id="f6-sideR">
            <path d="M316.414 65.569C331.243 65.569 338.657 65.569 344.722 67.279A45.552 45.552 0 0 1 376.199 98.757C377.909 104.821 377.909 112.235 377.909 127.065L377.909 382.508C377.909 397.338 377.909 404.752 376.199 410.816A45.552 45.552 0 0 1 344.722 442.294C338.657 444.004 331.243 444.004 316.414 444.004L229.163 444.004C214.334 444.004 206.919 444.004 200.855 442.294A45.552 45.552 0 0 1 169.378 410.816C167.668 404.752 167.668 397.338 167.668 382.508L167.668 127.065C167.668 112.235 167.668 104.821 169.378 98.757A45.552 45.552 0 0 1 200.855 67.279C206.919 65.569 214.334 65.569 229.163 65.569Z" fill="rgba(255,255,255,.62)"/>
            <g clip-path="url(#f6-clip)"><image href="assets/captures/app-tool-result-light.png" x="167.668" y="65.569" width="210.241" height="378.435" preserveAspectRatio="xMidYMid meet" opacity=".7"/></g>
          </g>
          <g id="f6-mid">
            <path d="M316.414 65.569C331.243 65.569 338.657 65.569 344.722 67.279A45.552 45.552 0 0 1 376.199 98.757C377.909 104.821 377.909 112.235 377.909 127.065L377.909 382.508C377.909 397.338 377.909 404.752 376.199 410.816A45.552 45.552 0 0 1 344.722 442.294C338.657 444.004 331.243 444.004 316.414 444.004L229.163 444.004C214.334 444.004 206.919 444.004 200.855 442.294A45.552 45.552 0 0 1 169.378 410.816C167.668 404.752 167.668 397.338 167.668 382.508L167.668 127.065C167.668 112.235 167.668 104.821 169.378 98.757A45.552 45.552 0 0 1 200.855 67.279C206.919 65.569 214.334 65.569 229.163 65.569Z" fill="#ffffff"/>
            <g clip-path="url(#f6-clip)"><image id="f6-midimg" href="assets/captures/bar-result-light.png" x="167.668" y="65.569" width="210.241" height="378.435" preserveAspectRatio="xMidYMid meet" opacity=".7"/></g>

      <div id="f6-folder">
        <svg viewBox="0 0 560 440" fill="none">
          <path id="f6-folderfill" d="M30 70 Q30 30 70 30 H214 Q232 30 244 44 L262 70 H490 Q530 70 530 110 V370 Q530 410 490 410 H70 Q30 410 30 370 Z" fill="rgba(255,255,255,.16)"/>
          <path id="f6-folderline" pathLength="1" d="M30 70 Q30 30 70 30 H214 Q232 30 244 44 L262 70 H490 Q530 70 530 110 V370 Q530 410 490 410 H70 Q30 410 30 370 Z" stroke="#ffffff" stroke-width="7" stroke-linejoin="round"/>
        </svg>
        <div id="f6-chip1" class="f6-chip" style="top:132px"><i style="background:#ff9f0a"></i>module.toml</div>

        <div id="f6-chip3" class="f6-chip" style="top:304px"><i style="background:#1a84f3"></i>icon.svg</div>
      </div>

      <div id="f6-plate">
        <img src="assets/captures/app-modules-light.png" alt="">
        <!-- REAL_CAPTURE = false : the patches below stand in for a capture with a user module installed and a settled sidebar.
             When a real capture exists, delete #f6-ringpatch, #f6-count, #f6-row, #f6-hl, #f6-listpatch and #f6-listclip and show the PNG as is. -->
        <div id="f6-ringpatch"></div>
        <div id="f6-listpatch"></div>
        <div id="f6-listclip"><div id="f6-listimg"></div></div>
        <div id="f6-hl"></div>
        <div id="f6-row">
          <div class="tile"><svg viewBox="0 0 32 32" fill="none" stroke="#0079fd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h11l6 6v18H8z"/><path d="M19 4v6h6"/><path d="M12 16h9M12 21h9"/></svg></div>
          <div class="name">Word count</div>
          <div class="sub">text.word_count<span id="f6-suffix">&nbsp;&nbsp;&middot;&nbsp;&nbsp;Chosen files only</span></div>
        </div>
        <div id="f6-count"><span class="f6-odo"><span class="f6-odo-in" id="f6-n1"><i>31</i><i>32</i></span></span> installed. Every module runs with only the files you choose.</div>
      </div>

      <div id="f6-card">
        <div id="f6-cardbg"></div>
        <div class="tile"><svg viewBox="0 0 32 32" fill="none" stroke="#0079fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h11l6 6v18H8z"/><path d="M19 4v6h6"/><path d="M12 16h9M12 21h9"/></svg></div>
        <div class="name">Word count</div>
        <div class="sub">text.word_count</div>
        <div class="sum" id="f6-cardsum">Count the lines, words and characters in a text file.</div>

  <script>
    // REAL_CAPTURE = false: when a real capture with a user module installed exists, remove the count patch, the row and the ring patch (see the comment in the plate).
    const REAL_CAPTURE = false;
    const BEAT = 60/130, START = 56;
    const at = b => (b - START) * BEAT;
    const tl = gsap.timeline({ paused: true });
    const OPA = { duration: 0.25, ease: 'power1.out' };

    /* ---- the wall: 6 big cards, seeded (2 real examples from modules/examples-wasm, 4 open slots) ---- */
    let seed = 20261014; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
    const COLS = 3, ROWS = 2, CW = 420, CH = 230, GAP = 28;
    const X0 = (1920 - (COLS * CW + (COLS - 1) * GAP)) / 2, Y0 = 410;
    const EXAMPLES = [{ name: 'Word count', id: 'text.word_count' }, { name: 'Slugify lines', id: 'text.slugify_lines' }];
    const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const cells = shuffle(Array.from({ length: COLS * ROWS }, (_, i) => i));
    const fullAt = [cells[0], cells[1]];
    const wall = document.getElementById('f6-wall');
    const ICON = '<svg viewBox="0 0 32 32" fill="none" stroke="#0079fd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h11l6 6v18H8z"/><path d="M19 4v6h6"/><path d="M12 16h9M12 21h9"/></svg>';
    for (let i = 0; i < COLS * ROWS; i++) {
      const el = document.createElement('div');
      const r = Math.floor(i / COLS), c = i % COLS, k = fullAt.indexOf(i);
      el.id = 'f6-slot' + i;
      el.className = 'f6-slot ' + (k >= 0 ? 'full' : 'empty');
      el.style.left = (X0 + c * (CW + GAP)) + 'px';
      el.style.top = (Y0 + r * (CH + GAP)) + 'px';
      el.innerHTML = k >= 0 ? '<div class="tile">' + ICON + '</div><div class="nm">' + EXAMPLES[k].name + '</div><div class="id">' + EXAMPLES[k].id + '</div><div class="tag">Example</div>' : '+ your tool';
      wall.appendChild(el);
    }
    const arrival = shuffle(Array.from({ length: COLS * ROWS }, (_, i) => i));

    /* ---- camera: slow pull back over the whole frame, ends settled on beat 68 ---- */
    tl.fromTo('#f6-cam', { scale: 1.03 }, { scale: 1, duration: at(68), ease: 'power1.out' }, 0);

    /* ---- 56.0 continuity: frame 5's white card shrinks into the fan's centre card, the side cards rotate out from behind it ---- */
    tl.to('#f6-t0', { y: -30, duration: 0.25, ease: 'power3.in' }, 0);
    tl.to('#f6-t0', { opacity: 0, duration: 0.25, ease: 'power3.in' }, 0);
    tl.to('#f6-morphshadow', { opacity: 0, duration: 0.25, ease: 'power1.out' }, 0);
    tl.to('#f6-morph', { clipPath: 'inset(240.6px 618.3px 227.2px 619.4px round 35px)', duration: 0.5, ease: 'expo.out' }, 0);
    tl.to('#f6-morph', { opacity: 0, duration: 0.12, ease: 'power1.out' }, 0.45);
    gsap.set(['#f6-sideL', '#f6-sideR'], { svgOrigin: '272.788 612.197', rotation: 0 });
    tl.to('#f6-sideL', { rotation: -20, duration: 0.5, ease: 'expo.out' }, 0);
    tl.to('#f6-sideR', { rotation: 20, duration: 0.5, ease: 'expo.out' }, 0);
    tl.fromTo('#f6-midimg', { opacity: 0 }, { opacity: 0.7, duration: 0.25, ease: 'power1.out' }, 0.3);
    tl.fromTo('#f6-fan-in', { scale: 1, rotation: 0 }, { scale: 1.04, rotation: 2, duration: at(60.2), ease: 'none' }, 0);

    /* ---- 57.0 line lands, the fan settles smaller, the folder draws ---- */
    tl.fromTo('#f6-t1', { y: 40 }, { y: 0, duration: 0.4, ease: 'expo.out' }, at(57));
    tl.fromTo('#f6-t1', { opacity: 0 }, Object.assign({}, OPA, { opacity: 1 }), at(57));
    tl.to('#f6-fan', { x: -340, y: 100, scale: 0.62, duration: 0.45, ease: 'expo.out' }, at(57));
    gsap.set('#f6-folderline', { strokeDasharray: 1, strokeDashoffset: 1 });
    tl.to('#f6-folderline', { strokeDashoffset: 0, duration: 0.45, ease: 'expo.out' }, at(57));
    tl.fromTo('#f6-folderfill', { opacity: 0 }, Object.assign({}, OPA, { opacity: 1 }), at(57) + 0.1);

    /* ---- 58, 59, 60 the chips start on the beat ---- */
    [{ id: '#f6-chip1', b: 58, x: 0, y: -150 }, { id: '#f6-chip2', b: 59, x: 260, y: 0 }, { id: '#f6-chip3', b: 60, x: 0, y: 150 }].forEach(c => {
      tl.fromTo(c.id, { x: c.x, y: c.y }, { x: 0, y: 0, duration: 0.4, ease: 'expo.out' }, at(c.b));
      tl.fromTo(c.id, { opacity: 0 }, Object.assign({}, OPA, { opacity: 1 }), at(c.b));
    });

    /* ---- 60: the line leaves, the fan leaves ---- */
    tl.to('#f6-t1', { y: -30, duration: 0.25, ease: 'power3.in' }, at(60));
    tl.to('#f6-t1', { opacity: 0, duration: 0.25, ease: 'power3.in' }, at(60));
    tl.to('#f6-fan', { opacity: 0, duration: 0.25, ease: 'power1.in' }, at(60.2));

    /* ---- the folder becomes the module card (one object), then travels into its row ---- */
    const T3 = at(60);
    tl.to(['#f6-chip1', '#f6-chip2', '#f6-chip3'], { opacity: 0, duration: 0.17, ease: 'power1.in' }, T3 + 0.1);
    tl.to(['#f6-folderline', '#f6-folderfill'], { opacity: 0, duration: 0.17, ease: 'power1.in' }, T3 + 0.1);
    tl.fromTo('#f6-card', { opacity: 0 }, { opacity: 1, duration: 0.17, ease: 'power1.out' }, T3 + 0.1);
    tl.fromTo('#f6-card', { scale: 0.93 }, { scale: 1, duration: 0.17, ease: 'expo.out' }, T3 + 0.1);

    gsap.set('#f6-plate', { scale: 0.58, opacity: 0 });
    tl.to('#f6-plate', { scale: 0.6034, duration: 0.45, ease: 'expo.out' }, at(60.5));
    tl.to('#f6-plate', Object.assign({}, OPA, { opacity: 1 }), at(60.5));
    gsap.set('#f6-row', { opacity: 0 });
    gsap.set('#f6-hl', { opacity: 0 });
    gsap.set('#f6-suffix', { opacity: 0 });

    /* card tile -> row tile: scale 38.6 / 112, aligned on the tile centre (602.8, 279.9) in the wide view */
    const CS = 38.64 / 112, CX = 1150, CY = 660;
    const TRAVEL = at(60.6), LAND = TRAVEL + 0.45;
    tl.to('#f6-card', { x: 602.8 - CX + 204 * CS, y: 279.9 - CY + 64 * CS, scale: CS, duration: 0.45, ease: 'expo.out' }, TRAVEL);
    tl.to(['#f6-cardbg', '#f6-cardsum'], { opacity: 0, duration: 0.2, ease: 'power1.in' }, TRAVEL + 0.1);
    tl.to('#f6-listimg', { y: 104, duration: 0.4, ease: 'expo.out' }, TRAVEL + 0.1);
    tl.set('#f6-card', { opacity: 0 }, LAND);
    tl.set('#f6-row', { opacity: 1 }, LAND);
    tl.to('#f6-suffix', Object.assign({}, OPA, { opacity: 1 }), LAND);
    tl.to('#f6-hl', Object.assign({}, OPA, { opacity: 1 }), LAND);
    tl.to('#f6-hl', { opacity: 0, duration: 0.25, ease: 'power1.in' }, at(62.7));

    /* ---- 61.6 push in about 1.8x onto the count line, the digits roll at 62.0, hold ---- */
    const S1 = 0.6034 * 1.8;
    tl.to('#f6-plate', { scale: S1, x: (1160 - 880) * S1, y: 385, duration: 0.45, ease: 'expo.out' }, at(61.6));
    tl.to('#f6-n1', { y: -52, duration: 0.6, ease: 'expo.out' }, at(62));

    /* ---- 63 the plate eases back and zooms out, the wall fills one card per half beat from 64 ---- */
    tl.to('#f6-plate', { scale: 0.6034 * 0.55, x: 0, y: 0, duration: 0.7, ease: 'expo.out' }, at(63));
    tl.to('#f6-plate', { opacity: 0, duration: 0.3, ease: 'power1.in' }, at(63) + 0.15);
    tl.fromTo('#f6-wall', { scale: 1.06 }, { scale: 1, duration: at(68) - at(63), ease: 'power2.out' }, at(63));
    arrival.forEach((idx, n) => {
      const b = 64 + 0.5 * n;
      tl.fromTo('#f6-slot' + idx, { y: 30, scale: 0.94 }, { y: 0, scale: 1, duration: 0.4, ease: 'expo.out' }, at(b));
      tl.fromTo('#f6-slot' + idx, { opacity: 0 }, Object.assign({}, OPA, { opacity: 1 }), at(b));
    });
    /* 65.0 line lands */
    tl.fromTo('#f6-t2', { y: 40 }, { y: 0, duration: 0.4, ease: 'expo.out' }, at(65));
    tl.fromTo('#f6-t2', { opacity: 0 }, Object.assign({}, OPA, { opacity: 1 }), at(65));

    window.__timelines["f6-plugins"] = tl;
  </script>
</template>
