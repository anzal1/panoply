  <script>
    const BEAT = 60/130, START = 56, F = 1/60;
    const at = b => (b - START) * BEAT;
    const OPA = { duration: 0.25, ease: 'power1.out' };
    const XO = 'expo.out';

    /* fallback copy of assets/data/modules.json rows (the real Modules list, 34 rows, 3 community), used only if the file cannot be read */
    const ROWS_FALLBACK = [{"id":"data.format","name":"Format JSON, YAML and TOML","category":"dev","tint":"#787882","community":true},{"id":"doc.markdown_to_html","name":"Markdown to HTML","category":"doc","tint":"#007aff","community":true},{"id":"files.hash","name":"Hash files","category":"files","tint":"#007aff","community":false},{"id":"id.passport_photo","name":"Passport photo","category":"id","tint":"#ff9500","community":false},{"id":"id.print_sheet","name":"Print sheet","category":"id","tint":"#ff9500","community":false},{"id":"id.signature_cleaner","name":"Signature cleaner","category":"id","tint":"#ff9500","community":false},{"id":"image.compress","name":"Compress image","category":"image","tint":"#af52de","community":false},{"id":"image.convert","name":"Convert image","category":"image","tint":"#af52de","community":false},{"id":"image.erase","name":"Erase object","category":"image","tint":"#af52de","community":false},{"id":"image.qr_code","name":"QR code maker","category":"image","tint":"#af52de","community":true},{"id":"image.remove_background","name":"Remove background","category":"image","tint":"#af52de","community":false},{"id":"image.remove_watermark","name":"Remove watermark","category":"image","tint":"#af52de","community":false},{"id":"image.resize","name":"Resize image","category":"image","tint":"#af52de","community":false},{"id":"image.resize_to_kb","name":"Resize to exact KB","category":"image","tint":"#af52de","community":false},{"id":"image.strip_metadata","name":"Strip metadata","category":"image","tint":"#af52de","community":false},{"id":"image.to_text","name":"Image to text","category":"image","tint":"#af52de","community":false},{"id":"image.upscale","name":"Upscale","category":"image","tint":"#af52de","community":false},{"id":"media.compress","name":"Compress video","category":"media","tint":"#ff6414","community":false},{"id":"media.convert","name":"Convert video or audio","category":"media","tint":"#ff6414","community":false},{"id":"media.extract_audio","name":"Extract audio","category":"media","tint":"#ff6414","community":false},{"id":"media.hdr_to_sdr","name":"HDR to SDR","category":"media","tint":"#ff6414","community":false},{"id":"media.info","name":"Video and audio info","category":"media","tint":"#ff6414","community":false},{"id":"media.normalize","name":"Normalize loudness","category":"media","tint":"#ff6414","community":false},{"id":"media.repair","name":"Repair video","category":"media","tint":"#ff6414","community":false},{"id":"media.streams","name":"Streams","category":"media","tint":"#ff6414","community":false},{"id":"media.to_mono","name":"Stereo to mono","category":"media","tint":"#ff6414","community":false},{"id":"media.trim","name":"Trim video or audio","category":"media","tint":"#ff6414","community":false},{"id":"pdf.compress","name":"Compress PDF","category":"pdf","tint":"#ff3b30","community":false},{"id":"pdf.images_to_pdf","name":"Images to PDF","category":"pdf","tint":"#ff3b30","community":false},{"id":"pdf.merge","name":"Merge PDF","category":"pdf","tint":"#ff3b30","community":false},{"id":"pdf.ocr","name":"OCR","category":"pdf","tint":"#ff3b30","community":false},{"id":"pdf.organize","name":"Organize PDF pages","category":"pdf","tint":"#ff3b30","community":false},{"id":"pdf.split","name":"Split PDF","category":"pdf","tint":"#ff3b30","community":false},{"id":"pdf.to_images","name":"PDF to images","category":"pdf","tint":"#ff3b30","community":false}];
    function loadRows() {
      let rows = ROWS_FALLBACK;
      try {
        const x = new XMLHttpRequest();
        x.open('GET', 'assets/data/modules.json', false);
        x.send(null);
        if (x.status === 200 || x.status === 0) { const j = JSON.parse(x.responseText); if (j && Array.isArray(j.rows) && j.rows.length) rows = j.rows; }
      } catch (e) {}
      return rows.slice().sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
    }

    function build(ROWS) {
      const $ = id => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      /* an entrance starts one frame before its beat, so it is already arriving on the beat frame */
      const enter = (sel, t, o = {}) => {
        tl.fromTo(sel, { x: o.x || 0, y: o.y === undefined ? 26 : o.y, scale: o.s || 1 }, { x: 0, y: 0, scale: 1, duration: o.dur || 0.4, ease: XO }, t);
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: o.od || 0.25, ease: 'power1.out' }, t);
      };
      const land = (sel, b, o) => enter(sel, at(b) - F, o);

      const GLYPH = {
        doc: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>',
        dev: '<path d="m8 8-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/>',
        image: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 9"/>',
        media: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 4v16M16 4v16M3 9h5M3 15h5M16 9h5M16 15h5"/>',
        id: '<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.7 1.8-2.4 3-2.4s2.4.7 3 2.4M14.5 10h4M14.5 14h3"/>',
        files: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
        pdf: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>'
      };

      /* ---- the Modules list, rows sorted by id exactly as the app sorts them ---- */
      const PITCH = 130;
      const mscroll = $('f6-mscroll');
      mscroll.style.height = (ROWS.length * PITCH) + 'px';
      ROWS.forEach((r, i) => {
        const g = GLYPH[r.category] || GLYPH.doc;
        mscroll.insertAdjacentHTML('beforeend',
          '<div class="f6-mrow" id="f6-mrow' + i + '" style="top:' + (i * PITCH) + 'px"><span class="rowbg"></span>' +
          '<div class="tile" style="background:' + r.tint + '29"><svg viewBox="0 0 24 24" stroke="' + r.tint + '">' + g + '</svg></div>' +
          '<div class="nm">' + r.name + '</div><div class="sb">' + r.id + ' &middot; Chosen files only</div>' +
          '<span class="bd' + (r.community ? ' c' : '') + '">' + (r.community ? 'Community, sandboxed' : 'Built in') + '</span></div>');
      });
      const comm = ROWS.map((r, i) => r.community ? i : -1).filter(i => i >= 0);   /* sorted places: 0, 1 and 9 */
      const top2 = comm.filter(i => i < 2), mid = comm.filter(i => i >= 2);        /* two at the very top, one in the middle */
      const QR = mid[0];
      /* before the community rows exist, every row below a missing one sits that many rows higher */
      ROWS.forEach((r, i) => {
        const above = comm.filter(c => c < i).length;
        if (r.community) gsap.set('#f6-mrow' + i, { opacity: 0 });
        else if (above) gsap.set('#f6-mrow' + i, { y: -above * PITCH });
      });
      const n0 = ROWS.length - comm.length;   /* 31 built in */

      /* ---- camera: slow drift over the build, then the push-in lives on #f6-pz ---- */
      tl.fromTo('#f6-cam', { scale: 1.03 }, { scale: 1, duration: at(60.5), ease: 'power1.out' }, 0);

      /* ---- 56.0 continuity: frame 5's white card shrinks into the fan's centre card, the side cards rotate out from behind it ---- */
      tl.to('#f6-t0', { y: -30, duration: 0.25, ease: 'power3.in' }, 0);
      tl.to('#f6-t0', { opacity: 0, duration: 0.25, ease: 'power3.in' }, 0);
      tl.to('#f6-morphshadow', { opacity: 0, duration: 0.25, ease: 'power1.out' }, 0);
      tl.to('#f6-morph', { clipPath: 'inset(240.6px 408.3px 227.2px 409.4px round 35px)', duration: 0.5, ease: XO }, 0);
      tl.to('#f6-morph', { opacity: 0, duration: 0.12, ease: 'power1.out' }, 0.45);
      gsap.set(['#f6-sideL', '#f6-sideR'], { svgOrigin: '272.788 612.197', rotation: 0 });
      tl.to('#f6-sideL', { rotation: -20, duration: 0.5, ease: XO }, 0);
      tl.to('#f6-sideR', { rotation: 20, duration: 0.5, ease: XO }, 0);
      tl.fromTo('#f6-midimg', { opacity: 0 }, { opacity: 0.7, duration: 0.25, ease: 'power1.out' }, 0.3);
      tl.fromTo('#f6-fan-in', { scale: 1, rotation: 0 }, { scale: 1.04, rotation: 2, duration: at(60.2), ease: 'none' }, 0);

      /* ---- 57.0 the line lands, the fan settles to the left, the folder arrives with all three real files readable ---- */
      land('#f6-t1', 57, { y: 40 });
      tl.to('#f6-fan', { x: -440, y: 100, scale: 0.62, duration: 0.45, ease: XO }, at(57));
      tl.fromTo('#f6-folder', { y: 40 }, { y: 0, duration: 0.4, ease: XO }, at(57) - F);
      tl.fromTo('#f6-folder', { opacity: 0 }, { opacity: 1, duration: 0.1, ease: 'power1.out' }, at(57) - F);

      /* ---- 58, 59, 60: each file drops behind the folder's front and LANDS on its beat (power2.in, 0.18 s, ending on the beat) ---- */
      [['#f6-chip1', 58, 1, -130], ['#f6-chip2', 59, 2, -232], ['#f6-chip3', 60, 3, -334]].forEach(c => {
        tl.fromTo(c[0], { y: 0 }, { y: 120 - c[3], duration: 0.18, ease: 'power2.in' }, at(c[1]) - 0.18);
        tl.set('#f6-fc' + c[2], { opacity: 1 }, at(c[1]));
        tl.set('#f6-fc' + (c[2] - 1), { opacity: 0 }, at(c[1]));
      });

      /* ---- 60.2 the line and the fan leave ---- */
      tl.to('#f6-t1', { y: -30, opacity: 0, duration: 0.2, ease: 'power3.in' }, at(60.1));
      tl.to('#f6-fan', { opacity: 0, duration: 0.2, ease: 'power1.in' }, at(60.1));

      /* ---- 60.35 the Modules page arrives, the folder flies to the top of its list ---- */
      land('#f6-win', 60.35, { y: 40, od: 0.2 });
      const FX = 1230, FY = 810;           /* folder centre */
      const TX = 340 + 44 + 38, TY = 186 + 210 + 20 + 30;   /* the tile slot of the first row */
      tl.to('#f6-folder .front b, #f6-folder .front .fc', { opacity: 0, duration: 0.15, ease: 'none' }, at(60.35));
      tl.to('#f6-folder', { x: TX - FX, y: TY - FY, scale: 0.11, duration: 0.45, ease: XO }, at(60.35));
      tl.to('#f6-folder', { opacity: 0, duration: 0.12, ease: 'power1.in' }, at(61) - F - 0.12);

      /* ---- push in about 1.35x so the header and rows read on a phone ---- */
      gsap.set('#f6-pz', { transformOrigin: '960px 570px' });
      tl.to('#f6-pz', { scale: 1.35, duration: 0.5, ease: XO }, at(60.6));

      /* ---- 61 two community rows land at the very top (Format JSON, Markdown to HTML); the list shifts down, header swaps once they are in ---- */
      const shiftRows = (idxs, dy, t) => idxs.forEach(i => tl.to('#f6-mrow' + i, { y: dy(i), duration: 0.4, ease: XO }, t));
      ROWS.forEach((r, i) => {
        if (r.community) return;
        const above = comm.filter(c => c < i).length;
        if (i > top2[top2.length - 1]) tl.to('#f6-mrow' + i, { y: -(above - top2.length) * PITCH, duration: 0.4, ease: XO }, at(61));
      });
      top2.forEach((i, n) => {
        tl.fromTo('#f6-mrow' + i, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: 'power1.out' }, at(61) + 0.1);
        tl.to('#f6-mrow' + i + ' .rowbg', { backgroundColor: 'rgba(10,132,255,0.10)', duration: 0.15, ease: 'power1.out' }, at(61) + 0.1);
      });
      const swap = (id, from, to, t) => { tl.set(id + ' i:nth-child(' + from + ')', { opacity: 0 }, t); tl.set(id + ' i:nth-child(' + to + ')', { opacity: 1 }, t); };
      const HL = 'rgba(10,132,255,0.14)';
      swap('#f6-r1', 1, 2, at(61) + 0.17); swap('#f6-r2', 1, 2, at(61) + 0.17);
      tl.to('#f6-hl', { backgroundColor: HL, duration: 0.12, ease: 'power1.out' }, at(61) + 0.17);

      /* ---- 61.55 the list scrolls to where the third plugin sorts (QR code maker) ---- */
      const SCROLL = (QR - 2) * PITCH;     /* QR code maker in the third slot, two built-in rows above it */
      tl.fromTo('#f6-mscroll', { y: 0 }, { y: -SCROLL, duration: 0.3, ease: XO }, at(61.55));

      /* ---- 62 the third row lands in its sorted place, rows below it move down, header swaps to 34 and 3 ---- */
      ROWS.forEach((r, i) => { if (i > QR && !r.community) tl.to('#f6-mrow' + i, { y: 0, duration: 0.4, ease: XO }, at(62)); });
      tl.fromTo('#f6-mrow' + QR, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: 'power1.out' }, at(62) + 0.06);
      tl.to('#f6-mrow' + QR + ' .rowbg', { backgroundColor: 'rgba(10,132,255,0.10)', duration: 0.12, ease: 'power1.out' }, at(62) + 0.06);
      swap('#f6-r1', 2, 3, at(62) + 0.12); swap('#f6-r2', 2, 3, at(62) + 0.12);
      tl.to('#f6-hl', { backgroundColor: 'rgba(10,132,255,0.22)', duration: 0.12, ease: 'power1.out' }, at(62) + 0.12);

      /* ---- 63.1 the page pulls back and cross-fades into the wall, the 34 and 3 header stays readable until then ---- */
      tl.to('#f6-pz', { scale: 0.88, duration: 0.35, ease: 'power2.in' }, at(63) + 0.1);
      tl.to('#f6-win', { opacity: 0, duration: 0.25, ease: 'power1.in' }, at(63) + 0.1);

      /* ---- the wall: the three real community plugins as large cards ---- */
      const CARDS = [
        { id: 'data.format', cat: 'Developer', k: 'dev', tint: '#787882' },
        { id: 'doc.markdown_to_html', cat: 'Documents', k: 'doc', tint: '#007aff' },
        { id: 'image.qr_code', cat: 'Images', k: 'image', tint: '#af52de' }
      ];
      /* one-line summaries copied from each module.toml on feat/community-plugins */
      const SUMMARY = {
        'data.format': 'Tidy, convert or check JSON, YAML and TOML files.',
        'doc.markdown_to_html': 'Turn a Markdown file into one clean HTML page that prints straight to PDF.',
        'image.qr_code': 'Turn the links or text in a file into QR codes, one per line, as PNG or SVG.'
      };
      const CW = 540, GAP = 40, X0 = (1920 - (3 * CW + 2 * GAP)) / 2;
      const wall = $('f6-wall');
      CARDS.forEach((c, i) => {
        const name = (ROWS.find(r => r.id === c.id) || { name: c.id }).name;
        wall.insertAdjacentHTML('beforeend',
          '<div class="f6-card" id="f6-card' + i + '" style="left:' + (X0 + i * (CW + GAP)) + 'px"><div class="tile" id="f6-ct' + i + '"><svg viewBox="0 0 24 24">' + GLYPH[c.k] + '</svg></div>' +
          '<div class="cat">' + c.cat + '</div><div class="nm">' + name + '</div><div class="sm">' + SUMMARY[c.id] + '</div><span class="bd" id="f6-cb' + i + '">Community, sandboxed</span></div>');
      });
      /* arrivals speed up into the fill: 63, 64, 65 */
      [63, 64, 65].forEach((b, i) => land('#f6-card' + i, b, { y: 36, s: 0.96 }));
      land('#f6-t2', 65, { y: 40 });
      tl.fromTo('#f6-wall', { scale: 1.04 }, { scale: 1, duration: at(67.9) - at(63), ease: 'power1.out' }, at(63));
      /* the drum fill: each card lights in its category tint on 66.5, 67 and 67.5 (0.08 s), then the wall holds still into the hit on 68 */
      [66.5, 67, 67.5].forEach((b, i) => {
        tl.to('#f6-ct' + i, { backgroundColor: CARDS[i].tint + '29', duration: 0.08, ease: 'power1.out' }, at(b));
        tl.to('#f6-ct' + i + ' svg', { stroke: CARDS[i].tint, duration: 0.08, ease: 'power1.out' }, at(b));
        tl.to('#f6-cb' + i, { backgroundColor: '#d2e6fc', color: '#0a60d0', duration: 0.08, ease: 'power1.out' }, at(b));
      });

      window.__timelines['f6-plugins'] = tl;
    }
    build(loadRows());
  </script>
</template>
