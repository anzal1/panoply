<!doctype html>
<html><head><meta charset="UTF-8"></head><body>
<template>
  <style>
    @font-face{font-family:"Geist";src:url("assets/fonts/Geist-Variable-latin.woff2") format("woff2");font-weight:100 900}
    @font-face{font-family:"Geist Mono";src:url("assets/fonts/GeistMono-latin.woff2") format("woff2");font-weight:100 900}
    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #fff; }
    #root * { box-sizing: border-box; }
    #f7-ground { position: absolute; inset: 0; background: #2d6cdf; }
    #f7-lift { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 70% at 50% 46%, rgba(255,255,255,.10), rgba(255,255,255,0) 100%); }
    #f7-grain { position: absolute; inset: 0; background: url("assets/f7-promise/grain.png") 0 0 / 100% 100% no-repeat; opacity: .5; }
    .f7-c { position: absolute; inset: 0; transform-origin: 0% 50%; }

    .f7-h { position: absolute; left: 140px; font-weight: 700; letter-spacing: -0.04em; line-height: .98; white-space: nowrap; color: #fff; }
    .f7-mono { font-family: "Geist Mono", ui-monospace, monospace; font-weight: 500; white-space: nowrap; }

    /* phrase 1 */
    #f7-free { top: 253px; font-size: 300px; }
    #f7-side1 { position: absolute; left: 1200px; top: 255px; width: 560px; }
    .f7-pill { display: block; width: max-content; margin-bottom: 26px; padding: 12px 34px; border: 2px solid rgba(255,255,255,.4); border-radius: 999px; font-weight: 500; font-size: 44px; line-height: 56px; letter-spacing: -0.015em; color: #fff; }

    /* phrase 2 */
    #f7-open { top: 282px; font-size: 240px; }
    #f7-lic { position: absolute; left: 140px; top: 606px; font-size: 48px; line-height: 60px; color: #fff; letter-spacing: -0.01em; }
    #f7-graph { position: absolute; left: 1000px; top: 596px; width: 720px; height: 110px; overflow: visible; }

    /* phrase 3 */
    #f7-device { top: 292px; font-size: 220px; }
    #f7-diagram { position: absolute; left: 170px; top: 600px; width: 1700px; height: 420px; overflow: visible; }
  </style>

  <div id="root" data-composition-id="f7-promise" data-width="1920" data-height="1080">
    <div id="f7-ground"></div>
    <div id="f7-lift"></div>
    <div id="f7-grain"></div>

    <!-- 68.0 Free. -->
    <div id="f7-c1" class="f7-c" data-layout-allow-overflow data-layout-allow-overlap>
      <div id="f7-free" class="f7-h" data-layout-allow-overlap>Free.</div>
      <div id="f7-side1" data-layout-allow-overlap>
        <span id="f7-p1" class="f7-pill">macOS</span>
        <span id="f7-p2" class="f7-pill">Windows</span>
        <span id="f7-p3" class="f7-pill">Linux</span>
      </div>
    </div>

    <!-- 72.0 Open source. -->
    <div id="f7-c2" class="f7-c" data-layout-allow-overflow data-layout-allow-overlap>
      <div id="f7-open" class="f7-h" data-layout-allow-overlap>Open source.</div>
      <div id="f7-lic" class="f7-mono" data-layout-allow-overlap>MIT OR Apache-2.0</div>
      <svg id="f7-graph" viewBox="0 0 720 110" fill="none">
        <defs><clipPath id="f7-gclip"><rect id="f7-grect" x="0" y="0" width="0" height="110"/></clipPath></defs>
        <g clip-path="url(#f7-gclip)">
          <path d="M12 74 H708" stroke="rgba(255,255,255,.55)" stroke-width="4" stroke-linecap="round"/>
          <path d="M262 74 C292 74 292 30 322 30 H442 C472 30 472 74 502 74" stroke="rgba(255,255,255,.55)" stroke-width="4" stroke-linecap="round"/>
        </g>
        <g id="f7-dots" fill="#2d6cdf" stroke="rgba(255,255,255,.85)" stroke-width="4">
          <circle class="f7-dot" cx="12" cy="74" r="10"/>
          <circle class="f7-dot" cx="97" cy="74" r="10"/>
          <circle class="f7-dot" cx="182" cy="74" r="10"/>
          <circle class="f7-dot" cx="262" cy="74" r="10"/>
          <circle class="f7-dot" cx="352" cy="30" r="10"/>
          <circle class="f7-dot" cx="432" cy="30" r="10"/>
          <circle class="f7-dot" cx="502" cy="74" r="10"/>
          <circle class="f7-dot" cx="602" cy="74" r="10"/>
          <circle class="f7-dot" cx="708" cy="74" r="10" fill="#ffffff"/>
        </g>
      </svg>
    </div>

    <!-- 74.0 On your device. -->
    <div id="f7-c3" class="f7-c" data-layout-allow-overflow data-layout-allow-overlap>
      <div id="f7-device" class="f7-h" data-layout-allow-overlap>On your device.</div>
      <svg id="f7-diagram" viewBox="0 0 1700 420" fill="none">
        <defs><clipPath id="f7-nclip"><rect id="f7-nrect" x="560" y="40" width="0" height="260"/></clipPath></defs>
        <g id="f7-lap">
        <rect id="f7-screen" x="10" y="10" width="480" height="300" rx="22" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
        <rect id="f7-base" x="-30" y="326" width="560" height="22" rx="11" stroke="#fff" stroke-width="5"/>
        </g>
        <g id="f7-file">
          <path d="M195 85 H265 L305 125 V235 H195 Z" fill="rgba(255,255,255,.14)" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
          <path d="M265 85 V125 H305" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
          <path d="M218 168 H282 M218 196 H282" stroke="rgba(255,255,255,.6)" stroke-width="5" stroke-linecap="round"/>
        </g>
        <!-- the line from the laptop stops at a visible break: end cap, gap, end cap. Nothing joins the file or the laptop to the network. -->
        <g clip-path="url(#f7-nclip)">
          <path d="M580 160 H920" stroke="rgba(255,255,255,.55)" stroke-width="5" stroke-dasharray="22 18"/>
          <circle cx="568" cy="160" r="12" stroke="rgba(255,255,255,.7)" stroke-width="5"/>
        </g>
        <g id="f7-capL"><path d="M940 120 V200" stroke="#fff" stroke-width="8" stroke-linecap="round"/></g>
        <g id="f7-capR"><path d="M1080 120 V200" stroke="#fff" stroke-width="8" stroke-linecap="round"/></g>
        <g id="f7-far">
          <path d="M1100 160 H1380" stroke="rgba(255,255,255,.35)" stroke-width="5" stroke-dasharray="22 18"/>
          <g stroke="rgba(255,255,255,.55)" stroke-width="6" stroke-linecap="round" fill="none">
            <path d="M1472 160 A40 40 0 0 1 1528 160"/>
            <path d="M1447 135 A75 75 0 0 1 1553 135"/>
            <path d="M1422 110 A110 110 0 0 1 1578 110"/>
          </g>
          <circle cx="1500" cy="190" r="9" fill="rgba(255,255,255,.55)"/>
        </g>
        <g id="f7-strike"><path d="M1405 62 L1595 232" stroke="#2d6cdf" stroke-width="22" stroke-linecap="round"/><path d="M1405 62 L1595 232" stroke="#fff" stroke-width="9" stroke-linecap="round"/></g>
        <text id="f7-nlabel" x="1010" y="300" text-anchor="middle" font-family="Geist Mono, monospace" font-weight="500" font-size="48" fill="#ffffff">Nothing leaves.</text>
      </svg>
    </div>
  </div>

  <script>
    const BEAT = 60/130, START = 68, F = 1/60;
    const at = b => (b - START) * BEAT;
    const tl = gsap.timeline({ paused: true });
    /* an entrance starts one frame BEFORE its beat: expo.out on transform, opacity 0.5 to 1 in 0.08 s, so the hit frame already shows it */
    const land = (sel, b, o = {}) => {
      const t = Math.max(0, at(b) - F) + (o.delay || 0), d = o.dur || 0.4;
      tl.fromTo(sel, { x: o.x || 0, y: o.y === undefined ? 40 : o.y }, { x: 0, y: 0, duration: d, ease: 'expo.out', immediateRender: false }, t);
      tl.fromTo(sel, { opacity: 0.5 }, { opacity: 1, duration: 0.08, ease: 'power1.out', immediateRender: false }, t);
    };
    /* fade out ENDING one frame before beat b (ground stays blue) */
    const out = (sel, b) => tl.to(sel, { opacity: 0, duration: 0.15, ease: 'power1.in' }, at(b) - 0.15 - F);
    /* hard cut one frame before beat b, used where a stop holds the picture still until just before the hit */
    const cut = (sel, b) => tl.set(sel, { opacity: 0 }, at(b) - F);
    gsap.set(['#f7-free', '#f7-p1', '#f7-p2', '#f7-p3', '#f7-open', '#f7-lic', '#f7-graph', '.f7-dot', '#f7-device', '#f7-lap', '#f7-file', '#f7-nlabel', '#f7-capL', '#f7-capR', '#f7-far', '#f7-strike'], { opacity: 0 });
    gsap.set('#f7-c2', { opacity: 0 }); gsap.set('#f7-c3', { opacity: 0 });
    tl.set('#f7-c2', { opacity: 1 }, at(72) - F);
    tl.set('#f7-c3', { opacity: 1 }, at(74) - F);

    /* ---- 68.0 HIT: Free. and the platform row land on the first frame, hold to 72 (1.8 s) ---- */
    tl.fromTo('#f7-c1', { scale: 1 }, { scale: 1.02, duration: at(72), ease: 'none' }, 0);
    land('#f7-free', 68, { y: 50 });
    ['#f7-p1', '#f7-p2', '#f7-p3'].forEach((id, i) => land(id, 68, { delay: i * 0.04, y: 30 }));
    out('#f7-c1', 72);

    /* ---- 72.0 HIT: Open source., the licence line and the commit graph start drawing on the hit frame, hold to 74 (0.92 s) ---- */
    land('#f7-open', 72, { y: 50 });
    land('#f7-lic', 72, { delay: 0.06, y: 30 });
    gsap.set('#f7-graph', { opacity: 1 });
    tl.fromTo('#f7-grect', { attr: { width: 0 } }, { attr: { width: 720 }, duration: 0.4, ease: 'expo.out', immediateRender: false }, at(72) - F);
    tl.fromTo('.f7-dot', { opacity: 0 }, { opacity: 1, duration: 0.1, ease: 'power1.out', stagger: 0.03, immediateRender: false }, at(72) - F);
    tl.fromTo('#f7-c2', { scale: 1 }, { scale: 1.02, duration: at(73.54) - at(72), ease: 'power1.out' }, at(72));
    /* 73.54 to 73.93 STOP: nothing moves (every tween above has ended, the drift ends exactly at 73.54).
       The phrase is cut one frame before the hit, which falls after the stop ends. */
    tl.set('#f7-c2', { opacity: 0 }, at(74) - F);

    /* ---- 74.0 HIT (the strongest): the phrase, the laptop outline and the file inside it land on the hit frame, then the flat network line draws ---- */
    /* hit frame 2049: phrase, laptop and file all start on the frame before and are already visibly moving on the hit (opacity starts at .75) */
    const hit = (sel, o) => {
      const t = at(74) - F;
      tl.fromTo(sel, { x: 0, y: o.y }, { x: 0, y: 0, duration: o.dur, ease: 'expo.out', immediateRender: false }, t);
      tl.fromTo(sel, { opacity: 0.75 }, { opacity: 1, duration: 0.06, ease: 'power1.out', immediateRender: false }, t);
    };
    hit('#f7-device', { y: 70, dur: 0.4 });
    hit('#f7-lap', { y: 50, dur: 0.4 });
    hit('#f7-file', { y: -90, dur: 0.3 });
    /* the line leaves the laptop and stops at the break, the far side and the struck network mark appear, then the label */
    tl.fromTo('#f7-nrect', { attr: { width: 0 } }, { attr: { width: 380 }, duration: 0.35, ease: 'expo.out', immediateRender: false }, at(74) + 0.1);
    tl.fromTo(['#f7-capL', '#f7-capR'], { opacity: 0 }, { opacity: 1, duration: 0.12, ease: 'power1.out', stagger: 0.04, immediateRender: false }, at(74) + 0.3);
    tl.fromTo('#f7-far', { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'power1.out', immediateRender: false }, at(74) + 0.3);
    tl.fromTo('#f7-strike', { opacity: 0 }, { opacity: 1, duration: 0.15, ease: 'power1.out', immediateRender: false }, at(74) + 0.45);
    tl.fromTo('#f7-nlabel', { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'power1.out', immediateRender: false }, at(74) + 0.45);
    tl.fromTo('#f7-c3', { scale: 1 }, { scale: 1.02, duration: at(75.54) - at(74), ease: 'power1.out' }, at(74));

    /* ---- 75.54 to 75.92 STOP: everything is still. One frame before 76.0 the picture is cut and frame 8 lands on the same blue ---- */
    cut('#f7-c3', 76);

    window.__timelines["f7-promise"] = tl;
  </script>
</template>
</body></html>
