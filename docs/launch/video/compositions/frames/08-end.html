<!doctype html>
<html><head><meta charset="UTF-8"></head><body>
<template>
  <style>
    @font-face{font-family:"Geist";src:url("assets/fonts/Geist-Variable-latin.woff2") format("woff2");font-weight:100 900}
    @font-face{font-family:"Geist Mono";src:url("assets/fonts/GeistMono-latin.woff2") format("woff2");font-weight:100 900}
    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    #f8-blue { position: absolute; inset: 0; background: #2d6cdf; }
    /* the same ground as frame 7: brand blue, the same soft lift and the same grain, so the cut changes nothing behind the type */
    #f8-lift { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 70% at 50% 46%, rgba(255,255,255,.10), rgba(255,255,255,0) 100%); }
    #f8-grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .5; pointer-events: none; }
    #f8-cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
    #f8-fan { position: absolute; left: 730px; top: 90px; width: 460px; height: 460px; }
    #f8-fan svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .f8-line { position: absolute; left: 0; right: 0; text-align: center; color: #fff; white-space: nowrap; }
    #f8-name { top: 560px; font-weight: 700; font-size: 190px; letter-spacing: -0.04em; line-height: 0.98; }
    #f8-plat { top: 810px; font-weight: 500; font-size: 44px; letter-spacing: -0.01em; line-height: 1.1; color: rgba(255,255,255,.8); display: flex; justify-content: center; gap: 72px; }
    #f8-url { top: 904px; font-family: "Geist Mono", ui-monospace, monospace; font-weight: 500; font-size: 44px; letter-spacing: -0.01em; line-height: 1.1; color: rgba(255,255,255,.9); }
  </style>
  <div id="root" data-composition-id="f8-end" data-width="1920" data-height="1080">
    <div id="f8-blue"></div>
    <div id="f8-lift"></div>
    <div id="f8-cam" data-layout-allow-overflow>
      <div id="f8-fan"></div>
      <div class="f8-line" id="f8-name">Panoply</div>
      <div class="f8-line" id="f8-plat"><span>macOS</span><span>Windows</span><span>Linux</span></div>
      <div class="f8-line" id="f8-url">github.com/anzal1/panoply</div>
    </div>
    <img id="f8-grain" src="assets/f7-promise/grain.png" alt="">
  </div>
<script>
    const BEAT = 60 / 130, START = 76, F = 1 / 60;
    /* every event is placed on the 60 fps grid: the frame start snap (window.__snap, see assemble-index.py) is taken out, and half a frame is taken off,
         so an event at exact time t first shows on frame round(t * 60), the frame the cue sheet names */
      const SNAP = ((window.__snap && window.__snap['f8-end']) || 0) + 1 / 120;
      const at = b => Math.max(0, (b - START) * BEAT - SNAP);

    // the fan mark, same path as docs/assets/panoply-mark.svg; three cards about one pivot
    const CARD = 'M316.414 65.569C331.243 65.569 338.657 65.569 344.722 67.279A45.552 45.552 0 0 1 376.199 98.757C377.909 104.821 377.909 112.235 377.909 127.065L377.909 382.508C377.909 397.338 377.909 404.752 376.199 410.816A45.552 45.552 0 0 1 344.722 442.294C338.657 444.004 331.243 444.004 316.414 444.004L229.163 444.004C214.334 444.004 206.919 444.004 200.855 442.294A45.552 45.552 0 0 1 169.378 410.816C167.668 404.752 167.668 397.338 167.668 382.508L167.668 127.065C167.668 112.235 167.668 104.821 169.378 98.757A45.552 45.552 0 0 1 200.855 67.279C206.919 65.569 214.334 65.569 229.163 65.569Z';
    const PIVOT = '272.788 612.197';
    document.getElementById('f8-fan').innerHTML =
      '<svg viewBox="0 0 544 544" fill="none">' +
      '<path id="f8-cardL" d="' + CARD + '" fill="rgba(255,255,255,.42)"/>' +
      '<path id="f8-cardR" d="' + CARD + '" fill="rgba(255,255,255,.62)"/>' +
      '<path id="f8-cardF" d="' + CARD + '" fill="#ffffff"/></svg>';

    const tl = gsap.timeline({ paused: true });

    // frame 7 holds its picture to its last frame (2104), and this card is on screen from its first sample (t = 0): the fan is already open
    // (cards at -12 and 12 degrees) and "Panoply" is fully settled. Only the platform row and the url are parked until beat 77.
    gsap.set('#f8-cardL', { rotation: -12, svgOrigin: PIVOT });
    gsap.set('#f8-cardR', { rotation: 12, svgOrigin: PIVOT });
    gsap.set(['#f8-plat', '#f8-url'], { opacity: 0 });

    // an entrance starts at the beat (host time 0 is the hit) or one frame before it: expo.out on transform, opacity 0.5 to 1 in 0.08 s
    const land = (sel, b, from, dur, delay = 0) => {
      const t = Math.max(0, at(b) - F) + delay;
      tl.fromTo(sel, from, { x: 0, y: 0, duration: dur, ease: 'expo.out', immediateRender: false }, t);
      tl.fromTo(sel, { opacity: 0.5 }, { opacity: 1, duration: 0.08, ease: 'power1.out', immediateRender: false }, t);
    };

    // BEAT 76.0, the final hit: the fan, already visible, opens a little further; "Panoply" is already in place and does not move
    tl.fromTo('#f8-cardL', { rotation: -12 }, { rotation: -20, duration: 0.5, ease: 'expo.out', svgOrigin: PIVOT, immediateRender: false }, 0.004);
    tl.fromTo('#f8-cardR', { rotation: 12 }, { rotation: 20, duration: 0.5, ease: 'expo.out', svgOrigin: PIVOT, immediateRender: false }, 0.004);

    // beat 77: the platform row and the url (the only place the url appears in the film)
    land('#f8-plat', 77, { y: 24 }, 0.4);
    land('#f8-url', 77, { y: 24 }, 0.4, 0.06);

    // from the end of that move nothing moves for the whole ring-out, not even a camera drift

    window.__timelines["f8-end"] = tl;
  </script>
</template>
</body></html>
