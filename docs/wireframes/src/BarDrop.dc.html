<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>File dropped on the bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#1D1D1F}
a{color:#2D6CDF}a:hover{color:#1F55B8}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:5px;background:rgba(0,0,0,.07);font-size:11px;color:rgba(29,29,31,.62);box-sizing:border-box}
.tile{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none}
.row{height:44px;display:flex;align-items:center;gap:12px;padding:0 12px;margin:0 8px;border-radius:10px}
.sel{background:rgba(0,0,0,.07)}
.sec{height:28px;display:flex;align-items:flex-end;padding:0 20px 6px;font-size:11px;font-weight:500;color:rgba(29,29,31,.45);box-sizing:border-box}
.name{font-size:13.5px;font-weight:500;white-space:nowrap}
.sub{font-size:12px;color:rgba(29,29,31,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.meta{margin-left:auto;font-size:11px;color:rgba(29,29,31,.45);flex:none}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; background: #CBD1DA">
  <div aria-hidden="true" style="position: absolute; left: 90px; top: 70px; width: 620px; height: 460px; border-radius: 14px; background: #E8EBF0; box-shadow: 0 10px 40px rgba(20,30,50,.12)"></div>
  <div aria-hidden="true" style="position: absolute; left: 640px; top: 260px; width: 560px; height: 420px; border-radius: 14px; background: #F3F4F6; box-shadow: 0 10px 40px rgba(20,30,50,.12)"></div>

  <div role="dialog" aria-label="Panoply command bar with a photo" style="position: absolute; left: 280px; top: 160px; width: 720px; height: 460px; border-radius: 20px; background: rgba(248,248,250,.8); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); box-shadow: 0 0 0 0.5px rgba(0,0,0,.14), 0 24px 70px rgba(15,20,40,.28); display: flex; flex-direction: column; overflow: hidden">
    <div style="height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 20px; box-sizing: border-box; flex: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(29,29,31,.5)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14zM20 20l-4-4"></path></svg>
      <label for="q2" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">What to do with this file</label>
      <input id="q2" type="text" placeholder="What do you want to do with this photo?" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 20px; color: #1D1D1F; padding: 0">
      <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 6px 0 4px; border-radius: 8px; background: rgba(0,0,0,.06); flex: none">
        <div aria-hidden="true" style="width: 24px; height: 24px; border-radius: 5px; background: #B9A48E; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,.15)"></div>
        <span style="font-size: 12px; font-weight: 500; max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">IMG_2041.HEIC</span>
        <span style="font-size: 11px; color: rgba(29,29,31,.5)">3.1 MB</span>
        <button type="button" aria-label="Remove file" style="width: 20px; height: 20px; border: 0; border-radius: 10px; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0; color: rgba(29,29,31,.5)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
    </div>
    <div style="height: 0.5px; background: rgba(0,0,0,.09); flex: none"></div>

    <div style="flex: 1; padding-top: 8px; overflow: hidden">
      <div class="sec">For this photo · best first</div>
      <sc-for list="{{ tools }}" as="item" hint-placeholder-count="7">
        <div class="row {{ item.selCls }}">
          <div class="tile" style="background: {{ item.bg }}; color: {{ item.fg }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ item.d }}"></path></svg></div>
          <span class="name">{{ item.name }}</span>
          <span class="sub">{{ item.sub }}</span>
          <sc-if value="{{ item.selected }}" hint-placeholder-val="{{ false }}"><span class="meta"><span class="kbd">↵</span></span></sc-if>
          <sc-if value="{{ item.unselected }}" hint-placeholder-val="{{ true }}"><span class="meta">{{ item.meta }}</span></sc-if>
        </div>
      </sc-for>
    </div>

    <div style="height: 0.5px; background: rgba(0,0,0,.09); flex: none"></div>
    <div style="height: 40px; display: flex; align-items: center; padding: 0 20px; gap: 8px; box-sizing: border-box; flex: none">
      <span style="font-size: 12px; color: rgba(29,29,31,.62)">7 of 31 tools fit a HEIC photo</span>
      <span style="margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(29,29,31,.62)">Run <span class="kbd">↵</span></span>
      <span style="width: 0.5px; height: 14px; background: rgba(0,0,0,.12); margin: 0 6px"></span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(29,29,31,.62)">Chain tools <span class="kbd">⌘</span><span class="kbd">↵</span></span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      person: 'M12 12a3.5 3.5 0 1 0 0-7a3.5 3.5 0 1 0 0 7zM5 20c1-4 4-5.5 7-5.5s6 1.5 7 5.5',
      wand: 'M15 4V2M15 10V8M11 6h-2M21 6h-2M17.5 8.5l1.5 1.5M17.5 3.5L19 2M3 21l11-11',
      kb: 'M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7',
      image: 'M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM8.5 10a1.5 1.5 0 1 0 0-3a1.5 1.5 0 1 0 0 3zM20 15l-5-5L5 20',
      tag: 'M3 3h8l10 10-8 8L3 11zM7.5 7.5h.01',
      send: 'M5 12a7 7 0 0 1 14 0M8.5 12a3.5 3.5 0 0 1 7 0M12 12v8',
      text: 'M4 7V5h16v2M9 19h6M12 5v14'
    };
    const t = (c) => ({ bg: c + '29', fg: c });
    return {
      tools: [
        { name: 'Passport photo', sub: 'A face was found, ready to crop', meta: 'ID and forms', d: I.person, ...t('#D98A00') },
        { name: 'Remove background', sub: 'Clean cutout', meta: 'Image', d: I.wand, ...t('#8E4EC6') },
        { name: 'Resize to exact KB', sub: 'For form uploads', meta: 'ID and forms', d: I.kb, ...t('#D98A00') },
        { name: 'HEIC to JPG', sub: 'Opens anywhere', meta: 'Image', d: I.image, ...t('#8E4EC6') },
        { name: 'Strip location', sub: 'This photo has GPS data', meta: 'Privacy', d: I.tag, ...t('#5F6B7A') },
        { name: 'Copy text from image', sub: 'Offline OCR', meta: 'Image', d: I.text, ...t('#8E4EC6') },
        { name: 'Send to iPhone', sub: 'Nearby now', meta: 'Nearby', d: I.send, ...t('#2D6CDF') }
      ].map((o, i) => ({ ...o, selected: i === 0, unselected: i !== 0, selCls: i === 0 ? 'sel' : '' }))
    };
  }
}
</script>
</body>
</html>
