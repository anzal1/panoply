<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Find anything</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#1D1D1F}
a{color:#2D6CDF}a:hover{color:#1F55B8}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;border:0;background:rgba(0,0,0,.05);font:inherit;font-size:12px;color:rgba(29,29,31,.75)}
.chip.on{background:#2D6CDF;color:#FFFFFF;font-weight:500}
.tok{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:rgba(45,108,223,.1);color:#1F55B8;font-size:12px}
mark{background:rgba(255,204,0,.45);color:inherit;border-radius:3px;padding:0 2px}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; background: #CBD1DA">
  <div style="position: absolute; left: 60px; top: 40px; width: 1160px; height: 720px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 0 0 0.5px rgba(0,0,0,.16), 0 24px 70px rgba(15,20,40,.25); overflow: hidden; display: flex; flex-direction: column">
    <div style="padding: 16px 24px 14px; border-bottom: 0.5px solid rgba(0,0,0,.1); background: #F7F7F8; display: flex; flex-direction: column; gap: 12px; flex: none">
      <div style="display: flex; align-items: center; gap: 16px">
        <div aria-hidden="true" style="display: flex; gap: 8px"><span style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57"></span><span style="width: 12px; height: 12px; border-radius: 6px; background: #FEBC2E"></span><span style="width: 12px; height: 12px; border-radius: 6px; background: #28C840"></span></div>
        <label for="fq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Find</label>
        <div style="flex: 1; height: 40px; border-radius: 10px; background: #FFFFFF; box-shadow: 0 0 0 0.5px rgba(0,0,0,.16); display: flex; align-items: center; gap: 10px; padding: 0 14px">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(29,29,31,.5)" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14zM20 20l-4-4"></path></svg>
          <input id="fq" type="text" value="wifi password" style="flex: 1; border: 0; outline: none; background: transparent; font: inherit; font-size: 16px">
          <span style="font-size: 12px; color: rgba(29,29,31,.5)">6 results</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding-left: 68px">
        <button type="button" class="chip">All</button>
        <button type="button" class="chip on">Screenshots</button>
        <button type="button" class="chip">Photos</button>
        <button type="button" class="chip">PDFs</button>
        <button type="button" class="chip">Documents</button>
        <span style="width: 0.5px; height: 16px; background: rgba(0,0,0,.15); margin: 0 4px"></span>
        <button type="button" class="chip">Any date</button>
        <button type="button" class="chip">Any place</button>
        <span style="margin-left: auto; font-size: 12px; color: rgba(29,29,31,.55); display: flex; align-items: center; gap: 6px">Read as <span class="tok">text inside screenshots</span></span>
      </div>
    </div>

    <div style="flex: 1; display: flex; min-height: 0">
      <div style="flex: 1; padding: 22px 24px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-content: start">
        <sc-for list="{{ results }}" as="item" hint-placeholder-count="6">
          <article style="display: flex; flex-direction: column; gap: 8px">
            <div style="height: 150px; border-radius: 10px; background: {{ item.bg }}; box-shadow: 0 0 0 0.5px rgba(0,0,0,.1); position: relative; overflow: hidden">
              <div aria-hidden="true" style="position: absolute; left: 14px; right: 40px; top: 18px; height: 8px; border-radius: 4px; background: rgba(0,0,0,.1)"></div>
              <div aria-hidden="true" style="position: absolute; left: 14px; right: 70px; top: 34px; height: 8px; border-radius: 4px; background: rgba(0,0,0,.07)"></div>
              <div aria-hidden="true" style="position: absolute; left: 14px; width: {{ item.hw }}; top: {{ item.ht }}; height: 18px; border-radius: 4px; background: rgba(255,204,0,.5); box-shadow: 0 0 0 1.5px rgba(214,160,0,.7)"></div>
              <div aria-hidden="true" style="position: absolute; left: 14px; right: 30px; bottom: 22px; height: 8px; border-radius: 4px; background: rgba(0,0,0,.07)"></div>
            </div>
            <div style="font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ item.name }}</div>
            <div style="font-size: 12px; color: rgba(29,29,31,.62); line-height: 1.4">“…{{ item.before }} <mark>{{ item.hit }}</mark> {{ item.after }}…”</div>
          </article>
        </sc-for>
      </div>

      <aside aria-label="Ask in plain words" style="width: 300px; border-left: 0.5px solid rgba(0,0,0,.1); padding: 22px 20px; box-sizing: border-box; flex: none; display: flex; flex-direction: column; gap: 14px; background: #FBFBFC">
        <h2 style="margin: 0; font-size: 13px; font-weight: 600">Ask in plain words</h2>
        <sc-for list="{{ asks }}" as="item" hint-placeholder-count="4">
          <button type="button" style="border: 0; text-align: left; font: inherit; border-radius: 10px; padding: 12px; background: #FFFFFF; box-shadow: 0 0 0 0.5px rgba(0,0,0,.1); display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 13px">{{ item.q }}</span>
            <span style="display: flex; flex-wrap: wrap; gap: 6px">
              <sc-for list="{{ item.toks }}" as="tk" hint-placeholder-count="2"><span class="tok">{{ tk }}</span></sc-for>
            </span>
          </button>
        </sc-for>
        <p style="margin: auto 0 0; font-size: 11.5px; color: rgba(29,29,31,.5); line-height: 1.45">The index lives on this Mac. Text in images and photo meaning come from on-device models.</p>
      </aside>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      results: [
        { name: 'Screenshot 2026-09-14 at 21.03', before: 'Network: HomeNet_5G', hit: 'Wi-Fi password', after: ': ••••••••', bg: '#EEF2F8', hw: '150px', ht: '62px' },
        { name: 'IMG_8812 (photo of router)', before: 'WPA2 key', hit: 'WiFi Password', after: 'printed on label', bg: '#EFEDE8', hw: '120px', ht: '88px' },
        { name: 'Screenshot 2026-08-02 at 10.17', before: 'Guest', hit: 'wifi password', after: 'for the office', bg: '#F1F0F6', hw: '170px', ht: '54px' },
        { name: 'WhatsApp Image 2026-07-21', before: 'here is the', hit: 'wifi password', after: 'for the flat', bg: '#E9F4EE', hw: '140px', ht: '96px' },
        { name: 'Airbnb check-in.pdf, page 2', before: 'House rules.', hit: 'Wi-Fi password', after: 'is on the fridge', bg: '#F6EEEE', hw: '160px', ht: '70px' },
        { name: 'Screenshot 2026-05-30 at 18.44', before: 'Cafe', hit: 'WIFI PASSWORD', after: 'latte2026', bg: '#EEF2F8', hw: '130px', ht: '80px' }
      ],
      asks: [
        { q: 'photos taken in Goa last December', toks: ['Photos', 'Place: Goa', 'Dec 2025'] },
        { q: 'pdfs over 50 pages from my bank', toks: ['PDFs', 'Pages > 50', 'Text: bank'] },
        { q: 'videos longer than 10 minutes', toks: ['Videos', 'Duration > 10 min'] },
        { q: 'my passport', toks: ['Photos and scans', 'Looks like: passport'] }
      ]
    };
  }
}
</script>
</body>
</html>
