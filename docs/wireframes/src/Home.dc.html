<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App window home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#1D1D1F}
a{color:#2D6CDF}a:hover{color:#1F55B8}
.nav{display:flex;align-items:center;gap:9px;height:28px;padding:0 10px;border-radius:7px;font-size:13px;color:#1D1D1F;text-decoration:none}
.nav.on{background:rgba(0,0,0,.08);font-weight:500}
.navh{font-size:11px;font-weight:600;color:rgba(29,29,31,.42);padding:14px 10px 6px}
.h{font-size:13px;font-weight:600;margin:0 0 10px}
.tile{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:5px;background:rgba(0,0,0,.07);font-size:11px;color:rgba(29,29,31,.62);box-sizing:border-box}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; background: #CBD1DA">
  <div style="position: absolute; left: 60px; top: 40px; width: 1160px; height: 720px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 0 0 0.5px rgba(0,0,0,.16), 0 24px 70px rgba(15,20,40,.25); overflow: hidden; display: flex">
    <nav aria-label="Sections" style="width: 220px; background: rgba(240,241,244,.92); border-right: 0.5px solid rgba(0,0,0,.1); padding: 16px 10px; box-sizing: border-box; flex: none; display: flex; flex-direction: column">
      <div aria-hidden="true" style="display: flex; gap: 8px; padding: 0 6px 18px"><span style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57"></span><span style="width: 12px; height: 12px; border-radius: 6px; background: #FEBC2E"></span><span style="width: 12px; height: 12px; border-radius: 6px; background: #28C840"></span></div>
      <sc-for list="{{ top }}" as="item" hint-placeholder-count="3">
        <a href="#" class="nav {{ item.cls }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ item.d }}"></path></svg>{{ item.name }}</a>
      </sc-for>
      <div class="navh">Tools</div>
      <sc-for list="{{ tools }}" as="item" hint-placeholder-count="10">
        <a href="#" class="nav"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{ item.c }}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ item.d }}"></path></svg>{{ item.name }}<span style="margin-left: auto; font-size: 11px; color: rgba(29,29,31,.4)">{{ item.n }}</span></a>
      </sc-for>
      <div class="navh">Panoply</div>
      <a href="#" class="nav"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12a7 7 0 0 1 14 0M8.5 12a3.5 3.5 0 0 1 7 0M12 12v8"></path></svg>Nearby</a>
      <a href="#" class="nav"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg>Modules</a>
    </nav>

    <main style="flex: 1; min-width: 0; padding: 22px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
      <div style="display: flex; align-items: center; gap: 10px">
        <label for="hs" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</label>
        <div style="flex: 1; height: 34px; border-radius: 9px; background: rgba(0,0,0,.05); display: flex; align-items: center; gap: 8px; padding: 0 12px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(29,29,31,.5)" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14zM20 20l-4-4"></path></svg>
          <input id="hs" type="text" placeholder="Search tools and files" style="flex: 1; border: 0; outline: none; background: transparent; font: inherit; font-size: 13px">
          <span class="kbd">⌥</span><span class="kbd">Space</span>
        </div>
      </div>

      <div style="height: 140px; border-radius: 14px; background: #F5F6F8; box-shadow: inset 0 0 0 1px rgba(0,0,0,.07); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2D6CDF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg>
        <span style="font-size: 15px; font-weight: 600">Drop anything here</span>
        <span style="font-size: 12px; color: rgba(29,29,31,.55)">PDFs, photos, videos, documents, folders. It stays on this Mac.</span>
      </div>

      <div style="display: flex; gap: 24px">
        <section style="flex: 1; min-width: 0">
          <h2 class="h">Quick actions</h2>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
            <sc-for list="{{ quick }}" as="item" hint-placeholder-count="6">
              <button type="button" style="height: 60px; border: 0; border-radius: 11px; background: #FFFFFF; box-shadow: 0 0 0 0.5px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.04); display: flex; align-items: center; gap: 10px; padding: 0 12px; font: inherit; text-align: left">
                <span class="tile" style="background: {{ item.bg }}; color: {{ item.fg }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ item.d }}"></path></svg></span>
                <span style="font-size: 13px; font-weight: 500">{{ item.name }}</span>
              </button>
            </sc-for>
          </div>
        </section>
        <section style="width: 260px; flex: none">
          <h2 class="h">Nearby</h2>
          <div style="border-radius: 11px; box-shadow: 0 0 0 0.5px rgba(0,0,0,.12); overflow: hidden">
            <sc-for list="{{ devices }}" as="item" hint-placeholder-count="3">
              <div style="height: 43px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 0.5px solid rgba(0,0,0,.07)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(29,29,31,.7)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ item.d }}"></path></svg>
                <span style="font-size: 13px">{{ item.name }}</span>
                <span style="margin-left: auto; font-size: 11px; color: rgba(29,29,31,.45)">{{ item.state }}</span>
              </div>
            </sc-for>
          </div>
        </section>
      </div>

      <section>
        <h2 class="h">Recent</h2>
        <sc-for list="{{ recent }}" as="item" hint-placeholder-count="3">
          <div style="height: 44px; display: flex; align-items: center; gap: 12px; border-bottom: 0.5px solid rgba(0,0,0,.07)">
            <span class="tile" style="background: {{ item.bg }}; color: {{ item.fg }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ item.d }}"></path></svg></span>
            <span style="font-size: 13px; font-weight: 500; width: 220px">{{ item.name }}</span>
            <span style="font-size: 12px; color: rgba(29,29,31,.6)">{{ item.result }}</span>
            <span style="margin-left: auto; font-size: 11px; color: rgba(29,29,31,.45)">{{ item.when }}</span>
            <a href="#" style="font-size: 12px; text-decoration: none">Show in Finder</a>
          </div>
        </sc-for>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>

    const I = {

    const t = (c) => ({ bg: c + '29', fg: c });

        { name: 'ID and forms', d: I.person, c: '#D98A00', n: '8' },

        { name: 'Video', d: I.video, c: '#F76B15', n: '26' },

</script>
</body>
</html>
