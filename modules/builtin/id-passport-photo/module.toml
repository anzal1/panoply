# Passport and visa photo. Pattern D (guided capture). Spec: docs/FLOWS.md worked example 2.
# Country rules: rules/*.toml, each with its source link, quote and date.
accepts = ["image/*"]
outputs = ["image/jpeg", "application/json"]

[module]
id = "id.passport_photo"
name = "Passport photo"
version = "0.1.0"
pattern = "D"
summary = "Make a photo that passes the passport or visa rules of a country, with live pass, warn and fail checks."

[options.country]
type = "text"
label = "Country"
help = "A country code or name, such as IN or US."

[options.document]
type = "choice"
values = ["passport", "visa"]
label = "Document"
help = "Left out, the passport rule is used."

[options.output]
type = "choice"
values = ["single", "sheet", "both"]
default = "single"
label = "Output"
help = "A digital file, a print sheet, or both."

[options.paper]
type = "text"
label = "Sheet paper"
help = "For example 4x6, 5x7, a4 or letter."

[options.copies]
type = "number"
min = 1
max = 200
label = "Copies on the sheet"
help = "Left out, the sheet is filled."

[options.dpi]
type = "number"
min = 72
max = 1200
label = "Print resolution (DPI)"
help = "Left out, the rule's own size is used."

[options.background]
type = "text"
label = "Background"
help = "A color such as #ffffff."

[options.whiten]
type = "bool"
default = true
label = "Make the background the rule's color"
help = "Cuts out the person and sets the background."

[options.cutout]
type = "choice"
values = ["auto", "color"]
default = "auto"
label = "Cut-out engine"
help = "Color needs an even backdrop."

[options.fix_tilt]
type = "bool"
default = true
label = "Straighten the head"

[options.fix_exposure]
type = "bool"
default = true
label = "Correct a dark or bright face"

[options.face]
type = "number"
min = 1
max = 20
label = "Which face"
help = "For several faces, 1 is the leftmost."

[options.engine]
type = "choice"
values = ["auto", "vision", "yunet"]
default = "auto"
label = "Face engine"
help = "Auto uses Apple Vision on a Mac."

[options.kb_basis]
type = "choice"
values = ["both", "1000", "1024"]
label = "What counts as 1 KB"
help = "Some portals use 1000 bytes, some 1024."

[options.strict]
type = "bool"
default = false
label = "Stop on a failed check"
help = "Writes nothing when any check fails."

[options.report]
type = "bool"
default = false
label = "Write the checks as a JSON file"

[capabilities]
network = true
network_reason = "Only on Windows and Linux, the first time: downloads the small face model (YuNet, 0.2 MB) and its runtime (ONNX Runtime, up to 80 MB), checked against pinned checksums. A Mac uses Apple Vision and downloads nothing."

[[capabilities.models]]
id = "yunet-2023mar"
size_mb = 1
license = "MIT"
