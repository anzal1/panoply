source_url = "https://www.khaleejtimes.com/life-and-living/visa-and-immigration-in-uae/uae-updates-personal-photo-criteria-for-issuing-renewing-passports-emirates-ids"
source_quote = "The dimensions of the photo must be 35mm X 40mm."
