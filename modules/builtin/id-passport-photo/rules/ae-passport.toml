notes = "The ICP FAQ states 3.5x4.5 cm, white background, recent, ICAO specifications, straight face and neutral expression. It gives no head size, so 70 to 80 percent is the ICAO default and this rule is marked stale. Hats and sunglasses are not allowed; only medical glasses that do not cover the eyes. A renewal photo must differ from the one in the current passport. No official pixel or KB limit was found. A 2022 Khaleej Times report on ICP criteria said 35x40 mm, and some third party sites say 40x60 mm; the current ICP page was preferred."

