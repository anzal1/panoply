notes = "Read from the Passport Office camera operator guidelines as hosted on an Australian consulate site; passports.gov.au itself did not load. Prints may be 35 to 40 mm wide and 45 to 50 mm high; 35 x 45 mm is the standard size used here. Background plain white or grey. No glasses unless medically required with proof; if worn, no frame over the eyes and no reflection. No head coverings blocking the face. Children under 3 may have the mouth open. Even lighting, no editing or filters. Glossy prints, 200 gsm or heavier."
