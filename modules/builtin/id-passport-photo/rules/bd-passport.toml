notes = "No official page states an adult photo size, head range or file limit: epassport.gov.bd blocked access and the biometric photo is taken live at enrolment. The size and white background come from a third party; head 70 to 80 percent is the ICAO default, not a Bangladesh figure. Missions ask for lab printed photos for children under 6 only (3R or 4R, 2 copies, not older than 3 months) and differ on background: London and Canberra say white, Chennai, Ottawa and Abuja say grey. Avoid white clothing. Confirm on the portal upload screen."

