notes = "Printed photos are 50 x 70 mm, two identical, taken within six months, against a plain white or light-coloured background. Glasses are allowed if the eyes are clear and there is no glare, but tinted lenses are refused. Head coverings are allowed only when worn daily for religious or medical reasons, with the full face visible. Children follow the same size and face rules, with no hands in the photo. Online renewal uses a separate 3:2 digital photo (1200 x 1800 to 3000 x 4500 px, 200 KB to 5 MB, face 45 to 50 percent of height), not recorded here."
