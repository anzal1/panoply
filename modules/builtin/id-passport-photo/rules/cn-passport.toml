notes = "Read from the Chinese Consulate General in Los Angeles visa page (the photo rule for visa applications; the page is dated 2018, and visa centres republish the same numbers). Background white with no edge frame. Head width 15 to 22 mm. Tilt up to 20 degrees left or right and 25 degrees up or down; the tilt value here is the left or right limit. Eyeglasses are allowed except thick rimmed, tinted or glare glasses. Head coverings only for religious reasons. Taken within the last 6 months. No digital pixel or file size is stated, so none is set."
