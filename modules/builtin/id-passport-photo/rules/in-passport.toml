notes = "The Passport Seva guideline (as posted by Indian missions) gives 630x810 pixels, colour, white background and a face of 80-85% of the frame, but no printed size in millimetres. 35x45 mm is the 7:9 shape of 630x810 and the usual ICAO print size, so treat it as derived. It tells applicants to remove glasses to avoid reflections. Head coverings are allowed only for religious reasons with the face from chin to forehead clear. Upload is mandatory from 1 December 2025. The Hague embassy still lists a 51x51 mm print with the face at 70 to 80 percent and a plain white or off-white background."

