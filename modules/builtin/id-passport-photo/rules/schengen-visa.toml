notes = "Read from the German Federal Foreign Office visa FAQ (German Embassy London), because the European Commission Schengen pages only say the photo must comply with ICAO standards and give no numbers. The same page gives 35 x 45 mm and a white or off-white background. Glasses are allowed if the frames do not cover any part of the eyes. Photo age limits differ by consulate (three to six months). Other states may add their own details, so the consulate or visa centre handling the application decides."
