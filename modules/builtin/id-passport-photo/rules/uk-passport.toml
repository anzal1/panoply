notes = "Printed photo is 45 mm high by 35 mm wide, not cropped down from a larger picture. GOV.UK asks for a plain cream or light grey background; the colour here is a light grey. The pixel size is the minimum for the online application (at least 600 x 750 pixels, 50 KB to 10 MB); the online service does the cropping. Glasses are allowed only if frames, glare or shadow do not cover the eyes. Head coverings only for religious or medical reasons. Children under 6 need not look at the camera; babies under 1 need not have open eyes. Photo must be under one month old."
