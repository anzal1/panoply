notes = "The Department of State Foreign Affairs Manual (8 FAM 402.1) sets a 2 x 2 inch color photo taken within six months, head measured from the top of the head to the bottom of the chin, and a plain white, off-white or light background. Glasses are refused except with a medical statement. Religious or medical head coverings need a signed statement and the full face must show. Infants may lie on a white sheet or sit in a car seat, and head tilt is accepted for infants. The eye line position and the online upload pixel rules are not recorded here."
