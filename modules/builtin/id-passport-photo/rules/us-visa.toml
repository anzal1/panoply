notes = "Printed photo figures come from a U.S. Embassy page, because travel.state.gov could not be read. It also gives the eye line as 1 1/8 to 1 3/8 inches from the bottom. The U.S. Embassy in Guyana (Ask the Consul, 20 November 2025) confirms a 2 x 2 inch color photo, plain white or off-white background, taken within six months, and no glasses unless a medical statement is given. Online DS-160 uploads follow a separate digital spec that was not checked here. Recheck on travel.state.gov."
