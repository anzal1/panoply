# Print sheet. Pattern B. Spec: docs/specs/id-and-image.md 2.2.
accepts = ["image/*"]
outputs = ["image/jpeg", "image/png", "application/pdf"]

[module]
id = "id.print_sheet"
name = "Print sheet"
version = "0.1.0"
pattern = "B"
summary = "Put several copies of this photo on one sheet for the print shop, at the exact size."

[options.paper]
type = "text"
label = "Paper"
help = "For example 4x6, 5x7, a4 or letter."

[options.size]
type = "text"
label = "Photo size"
help = "For example 35x45, 3.5x4.5cm or 1.5x2in."

[options.rule]
type = "text"
label = "Take the size from a rule"
help = "A country or rule id such as in-passport."

[options.document]
type = "choice"
values = ["passport", "visa"]
label = "Document"

[options.copies]
type = "number"
min = 1
max = 500
label = "Copies"
help = "Left out, as many as fit."

[options.cut_marks]
type = "bool"
default = true
label = "Cut marks"
help = "Thin corner ticks to cut along."

[options.rotate]
type = "bool"
default = true
label = "Turn photos to fit more"
help = "A photo may be turned to fit more."

[options.margin]
type = "number"
min = 0
max = 30
default = 3
label = "Margin (mm)"

[options.gutter]
type = "number"
min = 0
max = 20
default = 2
label = "Gap between photos (mm)"

[options.dpi]
type = "number"
min = 150
max = 1200
default = 300
label = "Resolution (DPI)"

[options.format]
type = "choice"
values = ["jpg", "pdf", "png"]
default = "jpg"
label = "Format"
help = "PDF pages match the paper's exact size."
