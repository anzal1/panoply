# Signature cleaner. Pattern D. Spec: docs/specs/id-and-image.md 2.8.
accepts = ["image/*"]
outputs = ["image/png", "image/jpeg"]

[module]
id = "id.signature_cleaner"
name = "Signature cleaner"
version = "0.1.0"
pattern = "D"
summary = "Turn a photo of your signature into a clean transparent PNG."

[options.ink]
type = "choice"
values = ["keep", "black", "blue"]
default = "keep"
label = "Ink color"

[options.preset]
type = "text"
label = "Exam or portal preset"
help = "A preset id such as ssc-signature."

[options.width]
type = "number"
min = 8
max = 6000
label = "Width (px)"
help = "Both width and height, or neither."

[options.height]
type = "number"
min = 8
max = 6000
label = "Height (px)"

[options.background]
type = "choice"
values = ["transparent", "white"]
label = "Background"
help = "Transparent PNG by default, or a white JPG."

[options.thickness]
type = "choice"
values = ["auto", "off"]
default = "auto"
label = "Thin strokes"
help = "Auto thickens thin strokes at small sizes."

[options.remove_lines]
type = "bool"
default = false
label = "Remove ruled lines"
help = "Off by default, lines are only reported."

[options.kb_basis]
type = "choice"
values = ["both", "1000", "1024"]
label = "What counts as 1 KB"
