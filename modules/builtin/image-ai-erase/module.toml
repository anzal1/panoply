# Object eraser (image AI). Pattern C. Spec: docs/specs/id-and-image.md 3.14.
#
# Give the picture and a mask picture (white is erased) as two files, or set rect.
accepts = ["image/*"]
outputs = ["image/jpeg", "image/png", "image/webp"]

[module]
id = "image.erase"
name = "Erase object"
version = "0.1.0"
pattern = "C"
summary = "Paint over something and make it disappear. Give a mask picture as the second file (white is erased), or a rectangle."

[options.rect]
type = "text"
label = "Rectangle"
help = "As x,y,w,h, for example 100,200,300,80."

[options.mask]
type = "file"
label = "Mask picture"
help = "White marks what to erase."

[options.invert]
type = "bool"
default = false
label = "Black is erased"
help = "Use when the object is black on white."

[options.expand]
type = "number"
min = 0
max = 128
default = 8
label = "Expand mask (px)"
help = "Grows the mask to cover shadows and halos."

[options.format]
type = "choice"
values = ["keep", "png", "jpg", "webp"]
default = "keep"
label = "Format"

[options.quality]
type = "number"
min = 1
max = 100
label = "Quality"
help = "Left empty, a JPEG keeps its own quality."

[options.keep_metadata]
type = "bool"
default = true
label = "Keep metadata"

[options.animation]
type = "choice"
values = ["ask", "first"]
default = "ask"
label = "Animated files"

[capabilities]
files = "chosen"
network = true
network_reason = "Downloads a model once, after you say yes."

[[capabilities.models]]
id = "migan-512-places2"
size_mb = 28
license = "MIT"

[surfaces]
bar = true
panel = true
right_click = true
share_sheet = true
cli = true
mcp = true
