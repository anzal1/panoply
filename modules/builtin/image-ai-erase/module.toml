# Object eraser (image AI). Pattern C. Spec: docs/specs/id-and-image.md 3.14.
#
# Give the picture and a mask picture (white is erased) as two files, or set rect.
accepts = ["image/*"]
outputs = ["image/jpeg", "image/png", "image/webp"]

[module]
id = "image.erase"
name = "Erase object"
version = "0.1.0"
pattern = "C"
summary = "Paint over something and make it disappear. Give a mask picture as the second file (white is erased), or a rectangle."

[options.rect]
type = "text"
label = "Rectangle"
help = "What to erase, as x,y,w,h in pixels (100,200,300,80) or percentages (70%,85%,28%,12%). Several, separated by a semicolon. Without it, the second file is the mask."

[options.mask]
type = "file"
label = "Mask picture"
help = "A picture the size of the photo where white (or any visible alpha) marks what to erase. Used for every input."

[options.invert]
type = "bool"
default = false
label = "Black is erased"
help = "Turn on when your mask paints the object black on white."

[options.expand]
type = "number"
min = 0
max = 128
default = 8
label = "Expand mask (px)"
help = "Grows the mask so shadows and halos around the object go too."

[options.format]
type = "choice"
values = ["keep", "png", "jpg", "webp"]
default = "keep"
label = "Format"

[options.quality]
type = "number"
min = 1
max = 100
label = "Quality"
help = "Left empty, a JPEG keeps close to the quality it came in at."

[options.keep_metadata]
type = "bool"
default = true
label = "Keep metadata"

[options.animation]
type = "choice"
values = ["ask", "first"]
default = "ask"
label = "Animated files"

[capabilities]
files = "chosen"
network = true
network_reason = "Downloads the ONNX Runtime (about 33 MB) and the MI-GAN fill model (about 28 MB) once, the first time you erase something. Nothing else leaves your device."

[[capabilities.models]]
id = "migan-512-places2"
size_mb = 28
license = "MIT"

[surfaces]
bar = true
panel = true
right_click = true
share_sheet = true
cli = true
mcp = true
