# Remove background (image AI). Pattern B. Spec: docs/specs/id-and-image.md 3.8 and 3.10.
accepts = ["image/*"]
outputs = ["image/png", "image/webp", "image/jpeg"]

[module]
id = "image.remove_background"
name = "Remove background"
version = "0.1.0"
pattern = "B"
summary = "Cut the subject out with clean edges: a transparent PNG, a solid color, or a blurred background."

[options.result]
type = "choice"
values = ["transparent", "color", "blur"]
default = "transparent"
label = "Result"
help = "Transparent PNG, the subject on a solid color, or the subject on a blurred copy of the picture."

[options.background]
type = "text"
default = "#ffffff"
label = "Background color"
help = "For the color result, for example #ffffff for studio white."

[options.blur]
type = "number"
min = 1
max = 100
default = 30
label = "Blur strength"
help = "For the blur result. Scaled to the size of the picture."

[options.engine]
type = "choice"
values = ["auto", "os", "model"]
default = "auto"
label = "Engine"
help = "Auto uses the system's own subject finder where there is one (macOS) and the IS-Net model otherwise. Model forces IS-Net, which keeps more hair and fur."

[options.edge_refine]
type = "bool"
default = true
label = "Refine edges"
help = "Snaps the edge onto hair, fur and fabric at full resolution."

[options.decontaminate]
type = "bool"
default = true
label = "Clean edge colors"
help = "Removes the old background's color from the soft edge, so there is no halo on a new background."

[options.format]
type = "choice"
values = ["auto", "png", "webp", "jpg"]
default = "auto"
label = "Format"
help = "Auto writes a PNG for a transparent cutout, and the original's format for a color or blur result."

[options.quality]
type = "number"
min = 1
max = 100
label = "Quality"
help = "For JPG and WebP results."

[options.animation]
type = "choice"
values = ["ask", "first"]
default = "ask"
label = "Animated files"

[capabilities]
files = "chosen"
network = true
network_reason = "Downloads the ONNX Runtime (about 33 MB) and the IS-Net background model (about 44 MB) once, and only when the system's own subject finder is missing or you choose the model. Nothing else leaves your device."

[[capabilities.models]]
id = "isnet-general-int8"
size_mb = 44
license = "MIT"

[surfaces]
bar = true
panel = true
right_click = true
share_sheet = true
cli = true
mcp = true
