# Remove background (image AI). Pattern B. Spec: docs/specs/id-and-image.md 3.8 and 3.10.
accepts = ["image/*"]
outputs = ["image/png", "image/webp", "image/jpeg"]

[module]
id = "image.remove_background"
name = "Remove background"
version = "0.1.0"
pattern = "B"
summary = "Cut the subject out: a transparent PNG, a solid color or a blurred background."

[options.result]
type = "choice"
values = ["transparent", "color", "blur"]
default = "transparent"
label = "Result"
help = "Transparent, a solid color, or a blur."

[options.background]
type = "text"
default = "#ffffff"
label = "Background color"
help = "For example #ffffff for studio white."

[options.blur]
type = "number"
min = 1
max = 100
default = 30
label = "Blur strength"
help = "Scaled to the size of the picture."

[options.engine]
type = "choice"
values = ["auto", "os", "model"]
default = "auto"
label = "Engine"
help = "Model keeps more hair and fur."

[options.edge_refine]
type = "bool"
default = true
label = "Refine edges"
help = "Snaps the edge onto hair and fabric."

[options.decontaminate]
type = "bool"
default = true
label = "Clean edge colors"
help = "Removes the old background from soft edges."

[options.format]
type = "choice"
values = ["auto", "png", "webp", "jpg"]
default = "auto"
label = "Format"
help = "Auto writes PNG for a transparent cutout."

[options.quality]
type = "number"
min = 1
max = 100
label = "Quality"
help = "For JPG and WebP results."

[options.animation]
type = "choice"
values = ["ask", "first"]
default = "ask"
label = "Animated files"

[capabilities]
files = "chosen"
network = true
network_reason = "Downloads a model once, after you say yes."

[[capabilities.models]]
id = "isnet-general-int8"
size_mb = 44
license = "MIT"

[surfaces]
bar = true
panel = true
right_click = true
share_sheet = true
cli = true
mcp = true
