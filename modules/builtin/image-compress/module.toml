# Compress (image). Pattern B. Spec: docs/specs/id-and-image.md 3.2 and 3.3 (format shootout).
accepts = ["image/*"]
outputs = ["image/jpeg", "image/png", "image/webp", "image/avif", "image/heic", "image/heif", "image/tiff", "image/gif"]

[module]
id = "image.compress"
name = "Compress image"
version = "0.1.0"
pattern = "B"
summary = "Make this image smaller without it looking worse, or fit it under a size."

[options.target]
type = "choice"
values = ["smallest", "under_size", "quality"]
default = "smallest"
label = "Target"
help = "Smallest, under a size, or a fixed quality."

[options.ssim]
type = "number"
min = 0.9
max = 0.9999
default = 0.97
label = "Similarity to keep"
help = "Minimum SSIM score, for example 0.97."

[options.quality]
type = "number"
min = 1
max = 100
default = 80
label = "Quality"
help = "For the quality target."

[options.max_size]
type = "size"
label = "Stay under"
help = "For example 200kb or 1.5mb."

[options.format]
type = "choice"
values = ["keep", "smallest", "jpg", "png", "webp", "avif", "heic", "tiff", "gif"]
default = "keep"
label = "Format"
help = "Keep, force one, or try every format."

[options.strip_metadata]
type = "bool"
default = true
label = "Strip metadata"
help = "Drops EXIF, XMP and thumbnails."

[options.color_profile]
type = "choice"
values = ["keep", "srgb"]
default = "keep"
label = "Color profile"
help = "Keep a wide gamut, or convert to sRGB."

[options.lossy_png]
type = "choice"
values = ["auto", "on", "off"]
default = "auto"
label = "Reduce PNG colors"
help = "Auto reduces colors only for flat art."

[options.animation]
type = "choice"
values = ["ask", "first"]
default = "ask"
label = "Animated files"
help = "Stop and ask, or use the first frame."

[capabilities]
files = "chosen"
network = false

[surfaces]
bar = true
panel = true
right_click = true
share_sheet = true
cli = true
mcp = true
