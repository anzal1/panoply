# Convert (image). Pattern A. Spec: docs/specs/id-and-image.md 3.1.
accepts = ["image/*"]
outputs = ["image/jpeg", "image/png", "image/webp", "image/avif", "image/heic", "image/heif", "image/tiff", "image/bmp", "image/gif"]

[module]
id = "image.convert"
name = "Convert image"
version = "0.1.0"
pattern = "A"
summary = "Turn this image into another format and keep its colors, orientation and details."

[options.to]
type = "choice"
values = ["jpg", "png", "webp", "avif", "heic", "tiff", "bmp", "gif"]
default = "jpg"
label = "Convert to"
help = "The format of the new file."

[options.quality]
type = "number"
min = 1
max = 100
label = "Quality"
help = "Left empty, each format uses its own default."

[options.lossless]
type = "bool"
default = false
label = "Lossless WebP"
help = "Only for WebP. Bigger files, no quality loss."

[options.flatten_color]
type = "text"
default = "#ffffff"
label = "Background for transparency"
help = "Used for formats with no transparency."

[options.keep_metadata]
type = "bool"
default = true
label = "Keep metadata"
help = "Keeps camera details, date and GPS location."

[options.color_profile]
type = "choice"
values = ["keep", "srgb"]
default = "keep"
label = "Color profile"
help = "Keep a wide gamut, or convert to sRGB."

[options.animation]
type = "choice"
values = ["ask", "first"]
default = "ask"
label = "Animated files"
help = "Stop and ask, or use the first frame."

[capabilities]
files = "chosen"
network = false

[surfaces]
bar = true
panel = true
right_click = true
share_sheet = true
cli = true
mcp = true
