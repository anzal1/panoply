# Resize to exact KB, with exam and portal presets. Pattern B.
# Spec: docs/specs/id-and-image.md 2.3 and 2.4. Presets: presets/*.toml, each with its source link.
accepts = ["image/*"]
outputs = ["image/jpeg", "image/png", "image/webp"]

[module]
id = "image.resize_to_kb"
name = "Resize to exact KB"
version = "0.1.0"
pattern = "B"
summary = "Fit a photo to the exact pixels and KB a form or exam portal asks for."

[options.preset]
type = "text"
label = "Exam or portal preset"
help = "A preset id such as ssc-signature."

[options.width]
type = "number"
min = 1
max = 10000
label = "Width (px)"
help = "Both width and height, or neither."

[options.height]
type = "number"
min = 1
max = 10000
label = "Height (px)"

[options.min_kb]
type = "number"
min = 0
label = "Smallest size (KB)"

[options.max_kb]
type = "number"
min = 0
label = "Largest size (KB)"

[options.kb_basis]
type = "choice"
values = ["both", "1000", "1024"]
label = "What counts as 1 KB"
help = "Some portals use 1000 bytes, some 1024."

[options.fit]
type = "choice"
values = ["auto", "crop", "pad", "stretch"]
label = "Fit"
help = "Auto pads if the shape differs over 15%."

[options.anchor]
type = "choice"
values = ["center", "top"]
default = "center"
label = "Crop position"
help = "Top keeps the upper part of the picture."

[options.format]
type = "choice"
values = ["jpg", "webp", "png"]
label = "Format"

[options.background]
type = "text"
label = "Background"
help = "For padding and for transparent pictures."

[options.baseline]
type = "bool"
label = "Baseline JPEG only"
help = "Some portals reject progressive JPEG."

[options.pad_to_min]
type = "bool"
default = true
label = "Pad to reach the minimum"
help = "Adds a comment to reach a minimum size."

[options.animation]
type = "choice"
values = ["ask", "first"]
default = "ask"
label = "Animated files"

[capabilities]
files = "chosen"
network = false

[surfaces]
bar = true
panel = true
right_click = true
share_sheet = true
cli = true
mcp = true
