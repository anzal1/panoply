notes = "No official NID specification was found. nidw.gov.bd and services.nidw.gov.bd were not read, the Bangladesh High Commission London page only says to attach a recent passport size photo with glue, and the Ottawa mission page failed certificate verification. NO FILE SIZE LIMIT was found in any readable source: min_bytes_claimed and max_bytes_claimed are both 0 here and mean 'no published limit', not a real window. The 30 x 36 mm reading is from VisaPicPro (Last reviewed July 20, 2026) and describes a common studio size, not an official rule. A second third party, myphotomaker.net (undated), says 35 x 45 mm, 413 x 531 px at 300 DPI. The harvest figure of 30 x 30 mm (354 x 354 px) is not supported by any page we read; an NID card photo is normally taken at enrolment, so an upload limit may not exist. Treat as a rough size guide only."

