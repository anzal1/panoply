notes = "Read the official IBPS notification CRP PO/MT-XVI (54 pages, filename dated 30.06.2026, registration 01-07-2026 to 21-07-2026) hosted on ibps.in. Guidelines for scanning and upload, printed page 36 (PDF page 39), under Photograph Image: heading '(4.5cm x 3.5cm)' and bullets 'Dimensions 200 x 230 pixels (preferred)' and 'Size of file should be between 20kb-50 kb', with a note that the scanned image must not exceed 50kb. The pixels are labelled preferred, not mandatory. Width 200, height 230 as written. physical_mm [35, 45] is the heading's 4.5 cm x 3.5 cm entered as width x height (the notice writes it height first; clause 21 on the application rules repeats 4.5cm x 3.5cm). No dpi is stated for the photo, so dpi is omitted. File size basis is not stated. source_date comes from the notification filename (30.06.2026). Other IBPS notices differ (the thumb impression is 240 x 240), do not reuse these numbers across fields."
