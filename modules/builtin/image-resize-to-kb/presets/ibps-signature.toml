notes = "Read the official IBPS notification CRP PO/MT-XVI (54 pages, filename dated 30.06.2026, registration 01-07-2026 to 21-07-2026) hosted on ibps.in. Guidelines for scanning and upload, printed page 37 (PDF page 40), under Signature: sign on white paper with black ink, 'Dimensions 140 x 60 pixels (preferred)', 'Size of file should be between 10kb-20kb', scanned image not more than 20kb, signature not in capital letters. No centimetres and no dpi are stated for the signature, so physical_mm and dpi are omitted. File size basis is not stated. source_date comes from the notification filename (30.06.2026)."
