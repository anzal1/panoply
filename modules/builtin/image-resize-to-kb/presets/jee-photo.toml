notes = "Read the official JEE (Main) 2026 Information Bulletin (91 pages) linked from jeemain.nta.nic.in/2026-archive/ and jeemain.nta.nic.in/documents/. Chapter 3, Application Procedure, Step 2, printed page 4 (PDF page 10). The text asks for a recent passport size photograph in colour with 80 percent face (without mask) visible including ears against white background. No pixel size and no centimetres are given, so width_px, height_px and physical_mm are omitted. File size basis is not stated. source_date is the upload date in the NTA file path (2025/11/02); the bulletin text carries no issue date. A live photograph is also captured in the portal. A newer JEE (Main) 2027 bulletin (October 2026) exists on the same site with the same 10 to 200 kB wording, but it is for the 2027 cycle and was not used for this preset."
