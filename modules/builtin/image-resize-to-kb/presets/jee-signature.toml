notes = "Read the official JEE (Main) 2026 Information Bulletin (91 pages) linked from jeemain.nta.nic.in/2026-archive/ and jeemain.nta.nic.in/documents/. Chapter 3, Application Procedure, Step 2, printed page 4 (PDF page 10). No pixel size and no centimetres are given, so width_px, height_px and physical_mm are omitted. File size basis is not stated. source_date is the upload date in the NTA file path (2025/11/02); the bulletin text carries no issue date. The JEE (Main) 2027 bulletin (October 2026) repeats 10 to 100 kB but was not used."
