notes = "Read the official NEET (UG) 2026 Information Bulletin (124 pages) linked from neet.nta.nic.in/document/information-bulletin-english/. Step 2, item d(i), printed page 16 (PDF page 21): recent passport size photograph, colour or black and white, 80 percent face visible including ears, white background, 80 percent of the image should be the candidate's face. The bulletin gives no pixel size and no centimetres for the upload, so width_px, height_px and physical_mm are omitted. File size basis is not stated. source_date is the upload date in the NTA file path (2026/02/23); the bulletin text itself carries no issue date, and the application window it states is 31 Oct 2025 to 27 Nov 2025. A live photograph is also captured in the portal and is separate from this upload. The same bulletin asks for a Post Card size photo at the exam centre, which is not an upload."
