notes = "Read the official NEET (UG) 2026 Information Bulletin (124 pages) linked from neet.nta.nic.in/document/information-bulletin-english/. Step 2, item d(ii), printed page 16 (PDF page 21). The same limit applies to the scribe's signature (item xii). No pixel size and no centimetres are given, so width_px, height_px and physical_mm are omitted. File size basis is not stated. source_date is the upload date in the NTA file path (2026/02/23); the bulletin text carries no issue date. Note the left and right hand finger and thumb impression upload has its own limit and is not covered here (item iii says 10 to 200 kb, the later page 17 box says 50 to 300 kb; the bulletin contradicts itself there)."
