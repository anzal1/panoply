notes = "Read the official Protean page (copyright footer 2010, no other date). Its table gives photograph: 200 DPI, colour, JPEG, Max. 20 KB, dimension 3.5X2.5 cms. The page does not say which number is width; we read it as height 3.5 cm by width 2.5 cm (so physical_mm is [25, 35]) because the signature row reads 2X4.5 cms, which is clearly height by width. Only a maximum is stated, so min is 0. Marked stale because the page is titled for Form 49A and Protean now also publishes Form 93, an Application for Allotment of Permanent Account Number (PDF metadata dated 2026-03-26), which only prescribes two 4.5 cm x 3.5 cm paper photos and says nothing about uploads; one resizer site also claims a photo size change in April 2026 that we could not confirm. A DigiSafe guide dated 1 October 2026 agrees with 20 KB. The harvest figure of a 50 KB cap with 2.5 x 3.5 cm and 4.5 x 2.0 cm signature is not in any official text we read. No pixel size is published. onlineservices.nsdl.com could not be resolved from our network."
