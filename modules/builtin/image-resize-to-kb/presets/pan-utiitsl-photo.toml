last_verified = "2026-10-13"
notes = "Source is the portal's own upload validation script, read on 2026-10-13, not a published notice. The function checkDocImg computes iSize as the file size in bytes divided by 1024 and rejects the file when iSize is greater than 30, so the basis is 1024 and a file of exactly 30 KB (30,720 bytes) passes even though the message says less than. The same function accepts jpeg, jpg and png only; we output jpg. The script does not check pixel dimensions, so none are recorded; resizer sites quote fixed pixel sizes for UTIITSL, but the portal code we read does not enforce them. Only a maximum is stated, so min is 0. The harvest figure of 30 KB agrees. The official guideline page pan.utiitsl.com/PAN_ONLINE/IPGguidelines.html only mentions 4.5 cm x 3.5 cm paper photos and no upload limit. The harvest flagged a possible April 2026 spec change; the live script on the read date still enforces 30 KB, but the script has no version date."
