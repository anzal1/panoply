id = "pan-utiitsl-signature"
authority = "UTI Infrastructure Technology and Services Limited (UTIITSL)"
form = "PAN application via UTIITSL portal (online form)"
field = "signature"
tolerance_px = 0
min_bytes_claimed = 0
max_bytes_claimed = 60
unit_claimed = "KB"
kb_basis = "1024"
format = "jpg"
color_mode = "rgb"
baseline_only = true
strip_metadata = false
status = "verified"
verified_against = "official"
source_url = "https://www.pan.utiitsl.com/PANform/resources/js/validation.js"
source_quote = "Signature size must be less than 60KB."
source_date = ""
last_verified = "2026-10-13"
notes = "Source is the portal's own upload validation script, read on 2026-10-13, not a published notice. The function checkDocSign computes iSize as bytes divided by 1024 and rejects the file when iSize is greater than 60, so the basis is 1024 and exactly 60 KB (61,440 bytes) passes. It accepts jpeg, jpg and png only; we output jpg. The script does not check pixel dimensions, so none are recorded. Only a maximum is stated, so min is 0. The harvest figure of 60 KB agrees. The script has no version date, and the harvest flagged a possible April 2026 spec change that we could not confirm."
