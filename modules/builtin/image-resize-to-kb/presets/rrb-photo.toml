notes = "Marked stale because current RRB notices do not take an uploaded photo. We read two RRB notice texts: CEN 01/2026 (ALP, indicative notice 21.03.2026, copy hosted by AglaSem) and CEN 02/2026 (Technician, indicative notice 23.05.2026, copy hosted by SSC Drishti). Both say candidates are not required to upload a pre-existing photograph and that a live photograph is captured by webcam or phone. The 20 to 50 KB figure is a legacy compatibility target stated by easyPhoto, a third party, with no pixel size. A Physics Wallah page dated 2026-02-23 gives 320 x 240 px and 50 to 100 KB for Group D, which contradicts it; we could not read an older RRB notice to settle it, so no pixel size or physical size is recorded. The RRB sites rrbbhopal.gov.in and rrbguwahati.gov.in did not respond. Use only for a regional or older form that still asks for an uploaded photo."
