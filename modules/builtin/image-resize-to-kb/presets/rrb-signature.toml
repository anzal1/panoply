notes = "Read the full text of RRB CEN 02/2026 (Technician categories, 62 pages, paragraph 17.5.1) as a copy hosted by SSC Drishti, and the text of CEN 01/2026 (ALP) as a copy hosted by AglaSem; both copies give identical specifications. No RRB-hosted copy could be read (rrbguwahati.gov.in refused the connection, the rrbranchi.gov.in links returned 404), so verified_against is third-party even though the text is the RRB notice. The notice says: scan at a minimum resolution of 100 DPI, JPG/JPEG only, between 30 KB and 49 KB, image dimensions minimum 140 pixels (width) x 60 pixels (height), scan box 35 mm x 20 mm, black ink in running handwriting, not block or capital letters. Because 140 x 60 is a minimum, larger images are accepted by the text; we use the minimum as the target. dpi 100 is the stated scan minimum. source_date is the date of the indicative notice in Employment News. Other third party sites quote 10 to 40 KB or 10 to 20 KB for older CENs; the 2026 notices supersede them."
