notes = "Marked stale because the current official notices no longer ask for a photo upload. We read the official SSC notices for CGL 2026 (21 May 2026), CHSL 2026 (7 Sep 2026), Constable GD (1 Dec 2025, via an AglaSem copy) and Selection Post Phase XIV (13 Apr 2026): in all of them the photograph is captured live through the application module (webcam or mobile) and only the signature is uploaded (see ssc-signature). The 20 to 50 KB and 3.5 x 4.5 cm figures come from a Physics Wallah page dated 3 Dec 2025 whose table row reads that the scanned photograph is JPEG/JPG, 20 KB to 50 KB, 3.5 cm (width) x 4.5 cm (height); it matches the older SSC notice wording that third parties reproduce, but we could not read an older SSC notice at an SSC host (ssc.nic.in refused the connection). No pixel size is given by any source we read, so width_px and height_px are omitted. The dpi of 200 was chosen by us, not by the source. Another third party page (myexamphoto.in, 22 Jun 2026) also says 20 to 50 KB but adds 100 x 120 px for the photo, which we could not confirm anywhere and did not use. Use this preset only for SSC style forms that still ask for an uploaded photo, such as some regional or older notices."
