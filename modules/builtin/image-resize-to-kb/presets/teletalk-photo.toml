notes = "No official Teletalk page or circular was readable: dgnm.bdteletalk.com did not resolve, bpsc.teletalk.com.bd failed certificate verification, alljobs and dpe pages are script driven or reset the connection, ntrca refused the connection. Status stale is used here only because no official source could be read; the third party pages are recent. Sources read: signresize.in (dated Oct 06, 2026, same quote as above), tool.teamzlab.com (Oct 2026, says the Directorate General of Food circular of 2023 asks for a colour photo of 300 x 300 pixels, no larger than 100 KB), and photobip.com/about (Apr 09, 2025: photo 300x300 pixels, under 100kb). All agree. Only a maximum is stated, so min is 0. The signresize.in page also contains an inconsistent BCS box (3.5 x 3.5 cm, 10 to 100 KB), and each Teletalk circular can set its own limits, so check the circular for the post being applied for. Background white comes from the same signresize.in line (White/Light BG). The harvest figure of 100 KB and 300 x 300 px is consistent."
