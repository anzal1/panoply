notes = "No official Teletalk page or circular was readable (see teletalk-photo). Status stale is used only because no official source could be read; the third party pages are recent. Sources read: signresize.in (Oct 06, 2026), tool.teamzlab.com (Oct 2026, citing the Directorate General of Food circular of 2023: signature 300 x 80 pixels, no larger than 60 KB), photobip.com/blog/post/resize-signature-300x80-teletalk (published 16 Apr 2025: 300x80 px, 60KB, jpg) and photobip.com/about (Apr 09, 2025: signature 300x80 pixels, under 60kb). All agree. Only a maximum is stated, so min is 0. A university portal FAQ (CUET) reportedly uses 100 KB for a signature but it is not a Teletalk circular and we could not open it. Each circular can set its own limits."
