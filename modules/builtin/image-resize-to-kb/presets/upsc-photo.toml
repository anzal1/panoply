source_date = ""
last_verified = "2026-10-13"
notes = "The official page upsconline.nic.in/ngrp/assets/PDF/instruction-photo-signature-upload-upsc.pdf returned HTTP 404 on 2026-10-13, upsc.gov.in returned 403, so no UPSC host was readable. We did read a copy of the UPSC document titled Instructions for uploading the photo and signature (UPSC letterhead, no date) hosted by Vajiram and Ravi; it says 20KB to 200KB for the photo. Because three readable sources disagree (200, 300 and 100 KB) the top level uses the smallest maximum, as the preset rules require: 100 KB. That figure is from a coaching site and looks like a generalisation of the signature rule, so the UPSC document reading of 20 to 200 KB is the better evidence and is listed first in conflicts. Any size from 20 to 100 KB satisfies every reading. The UPSC document gives no pixel size for the photo; one third party gives 350 x 350 px, left out of the top level because no UPSC text we read supports it. The UPSC document requires a colour JPG named photo, plain white background, face covering at least 75 percent of the area, and a separate live photograph that is matched against the upload. File size basis is not stated."

