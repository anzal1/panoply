last_verified = "2026-10-13"
notes = "The official UPSC URL (upsconline.nic.in) returned 404 and upsc.gov.in returned 403 on 2026-10-13. We read a copy of the UPSC Instructions for uploading the photo and signature (UPSC letterhead, no date) hosted by Vajiram and Ravi. It requires three signatures, one below the other, on plain white paper in black ink, scanned as ONE jpg named signature, with file size 20 KB to 100 KB and image dimensions 350 - 500 pixels. It does not say whether the 350 to 500 range is the width, the height or both. The only source we read that gives a full width and height is a third party (350 x 150 px), so that is used at the top level; 350 is the low end of the UPSC range. If the portal rejects it, try a width of 500. The 20 to 100 KB window agrees across all sources, including a second coaching site. File size basis is not stated."

