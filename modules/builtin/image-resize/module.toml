# Resize (image). Pattern B. Spec: docs/specs/id-and-image.md 3.5.
accepts = ["image/*"]
outputs = ["image/jpeg", "image/png", "image/webp", "image/avif", "image/heic", "image/tiff", "image/bmp", "image/gif"]

[module]
id = "image.resize"
name = "Resize image"
version = "0.1.0"
pattern = "B"
summary = "Make this image an exact size, a percentage, or fit a longest side."

[options.mode]
type = "choice"
values = ["longest", "pixels", "percent"]
default = "longest"
label = "Mode"
help = "Longest side, exact pixels, or a percentage."

[options.longest]
type = "number"
min = 1
max = 65535
default = 1080
label = "Longest side (px)"
help = "The default, 1080, is the size most social platforms show."

[options.width]
type = "number"
min = 1
max = 65535
label = "Width (px)"

[options.height]
type = "number"
min = 1
max = 65535
label = "Height (px)"

[options.percent]
type = "number"
min = 1
max = 1000
label = "Percent"

[options.fit]
type = "choice"
values = ["contain", "cover", "pad", "stretch"]
default = "contain"
label = "Fit"
help = "For width and height together: fit inside, crop to fill, pad with a color, or stretch."

[options.enlarge]
type = "bool"
default = false
label = "Allow enlarging"
help = "Off by default: a picture smaller than the target stays as it is."

[options.format]
type = "choice"
values = ["keep", "jpg", "png", "webp", "avif", "heic", "tiff", "bmp", "gif"]
default = "keep"
label = "Format"

[options.quality]
type = "number"
min = 1
max = 100
label = "Quality"
help = "Left empty, a JPEG keeps close to the quality it came in at."

[options.keep_metadata]
type = "bool"
default = true
label = "Keep metadata"

[options.color_profile]
type = "choice"
values = ["keep", "srgb"]
default = "keep"
label = "Color profile"

[options.background]
type = "text"
default = "#ffffff"
label = "Background"
help = "For padding and for formats without transparency."

[options.animation]
type = "choice"
values = ["ask", "first"]
default = "ask"
label = "Animated files"

[capabilities]
files = "chosen"
network = false

[surfaces]
bar = true
panel = true
right_click = true
share_sheet = true
cli = true
mcp = true
