# Form uploads: there is no single limit. Every form builder sets its own cap per form.
# [[sizes]] entries with origin = "generic" are user-choosable caps, NOT any service's published limit.
# They use decimal MB (1 MB = 1000000 bytes) so a file that fits is also under the binary MiB figure.
# Entries with origin = "official" carry a source and a status.
id = "form-upload"
service = "Form uploads"
kind = "video"
container = "mp4"
video_codec = "h264"
audio_codec = "aac"
max_height = 0
max_duration_s = 0
last_verified = "2026-10-14"
notes = "Pick the cap the form asks for. If the form owner chose a cap in MiB the decimal values here are slightly smaller, so they are safe."

[[sizes]]
origin = "generic"
label = "1 MB"
limit_bytes = 1000000
limit_unit_claimed = "MB"
basis = "decimal"
notes = "Generic user-choosable cap, not a published limit of any service."

