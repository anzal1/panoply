notes = "Per file, stated without any plan distinction, so free and paid are treated as the same cap. Uploads may be restricted in Slack Connect conversations. Plan storage quotas are a separate matter and were not checked. For a quick share a smaller file previews inline better, but no smaller preview limit is published for video."
