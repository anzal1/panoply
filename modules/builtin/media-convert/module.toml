# Convert video or audio. Pattern A, instant transform. Spec: docs/specs/video-and-audio.md, sections 4.3 and 5.1.
# Built into panoply-host (crates/panoply-host/src/builtin/media.rs) on the panoply-media engine.
# A container change is a stream copy whenever the codecs fit the target; only a stream that does
# not fit is encoded, audio and subtitles before video, and pictures on the OS hardware encoder.
accepts = ["video/*", "audio/*", "*.mkv", "*.ts", "*.mts", "*.m2ts", "*.m4a", "*.opus", "*.webm", "*.avi", "*.mov"]
outputs = ["video/*", "audio/*"]

[module]
id = "media.convert"
name = "Convert video or audio"
version = "0.1.0"
pattern = "A"
summary = "Turn this video or audio file into MP4, MOV, MKV, WebM, MP3, M4A, WAV, FLAC and more."

[options.to]
type = "choice"
values = ["mp4", "mov", "mkv", "webm", "avi", "hevc", "av1", "mp3", "m4a", "aac", "wav", "flac", "ogg", "opus"]
label = "Convert to"
help = "A container, codec or audio format."

[options.track]
type = "text"
default = "first"
label = "Audio track"
help = "First, a number such as 2, or all."

[capabilities]
files = "chosen"
network = true
network_reason = "Downloads the video engine (an LGPL ffmpeg build, about 140 MB) once, the first time a video or audio job runs. Nothing else leaves your device."

[[capabilities.engines]]
id = "ffmpeg"
size_mb = 140
license = "LGPL-3.0-or-later"

[surfaces]
bar = true
panel = true
right_click = true
share_sheet = true
cli = true
mcp = true
