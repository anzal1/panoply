# Remove noise. Pattern A with a strength dial. Spec: docs/specs/video-and-audio.md, section 5.5.
# RNNoise, in pure Rust (nnnoiseless, BSD-3-Clause), with the model inside the program, so nothing
# is downloaded for it. The sound is decoded to 48 kHz by the helper and cleaned one channel at a
# time as it streams past; Strength is the share of the cleaned signal in the mix with the original.
# The picture of a video is copied untouched, the sound is encoded once.
accepts = ["video/*", "audio/*", "*.mkv", "*.ts", "*.mts", "*.m2ts", "*.m4a", "*.opus", "*.webm", "*.avi", "*.mov"]
outputs = ["video/*", "audio/*"]

[module]
id = "media.denoise"
name = "Remove noise"
version = "0.1.0"
pattern = "A"
summary = "Take background hiss, hum and room noise out of a recording or the sound of a video."

[options.strength]
type = "choice"
values = ["light", "normal", "strong"]
default = "normal"
label = "Strength"
help = "Light keeps more of the original, strong removes the most and can sound thin on music."

[options.track]
type = "text"
default = "first"
label = "Audio track"
help = "First, a number such as 2, or all."

[capabilities]
files = "chosen"
network = true
network_reason = "Downloads the video engine (an LGPL ffmpeg build, about 140 MB) once, the first time a video or audio job runs. Nothing else leaves your device."

[[capabilities.engines]]
id = "ffmpeg"
size_mb = 140
license = "LGPL-3.0-or-later"

[surfaces]
bar = true
panel = true
right_click = true
share_sheet = true
cli = true
mcp = true
