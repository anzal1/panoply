# Normalize. Pattern A with a target dial. Spec: docs/specs/video-and-audio.md, section 5.4.
# Measured with Panoply's own EBU R128 meter. Linear gain when the peaks allow it, otherwise a
# short look-ahead true-peak limiter; the result is measured again and corrected. Preset values
# live in presets/*.toml with the source link and the date they were checked.
accepts = ["video/*", "audio/*", "*.mkv", "*.ts", "*.mts", "*.m2ts", "*.m4a", "*.opus", "*.webm", "*.avi", "*.mov"]
outputs = ["video/*", "audio/*"]

[module]
id = "media.normalize"
name = "Normalize loudness"
version = "0.1.0"
pattern = "A"
summary = "Make the loudness even and meet the broadcast or podcast standard."

[options.preset]
type = "choice"
values = ["custom", "ebu-r128", "atsc-a85", "apple-podcasts", "spotify", "netflix", "podcast-general", "youtube"]
default = "custom"
label = "Standard"
help = "A named target. Custom uses the values below."

[options.target]
type = "number"
min = -70
max = -5
default = -16
label = "Target (LUFS)"
help = "-16 suits speech, -14 music, -23 broadcast."

[options.true_peak]
type = "number"
min = -20
max = 0
default = -1
label = "True peak ceiling (dBTP)"
help = "The result never goes over this."

[options.mode]
type = "choice"
values = ["loudness", "peak", "tags"]
default = "loudness"
label = "Mode"
help = "Tags only writes tags and changes no sound."

[options.track]
type = "text"
default = "first"
label = "Audio track"
help = "First, a number such as 2, or all."

[capabilities]
files = "chosen"
network = true
network_reason = "Downloads the video engine (an LGPL ffmpeg build, about 140 MB) once, the first time a video or audio job runs. Nothing else leaves your device."

[[capabilities.engines]]
id = "ffmpeg"
size_mb = 140
license = "LGPL-3.0-or-later"

[surfaces]
bar = true
panel = true
right_click = true
share_sheet = true
cli = true
mcp = true
