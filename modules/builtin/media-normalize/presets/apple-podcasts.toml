notes = "Apple Podcasts for Creators audio requirements. Values are recommendations for preconditioning audio and are measured per ITU-R BS.1770-5. The page gives one figure for all files and does not mention mono, so the common -19 LUFS mono convention is not Apple guidance (see podcast-general). The true peak limit is quoted as -1 dB FS."

