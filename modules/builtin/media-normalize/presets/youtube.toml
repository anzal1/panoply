notes = "No official YouTube or Google page states a numeric reference level. The YouTube Help page on stable volume and audio enhancements (https://support.google.com/youtube/answer/16619284) is purely qualitative, and the -14 LUFS figure comes from third-party guides and Wikipedia, which cites no YouTube document. Widely reported behaviour is that louder uploads are turned down and quieter ones are not raised, but that is not confirmed by an official page. No true peak ceiling was found. Treat as unverified and do not present it as an official YouTube spec."
