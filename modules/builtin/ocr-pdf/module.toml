# OCR (searchable PDF). Pattern B. Spec: docs/specs/pdf.md 12.
# Adds an invisible text layer over scanned pages; pages that already have text are skipped and
# page pictures are copied byte for byte.
accepts = ["application/pdf", "image/*"]
outputs = ["application/pdf", "text/plain"]

[module]
id = "pdf.ocr"
name = "OCR"
version = "0.1.0"
pattern = "B"
summary = "Make this scan searchable and selectable."

[options.languages]
type = "text"
default = "auto"
label = "Languages"
help = "auto, or a list such as hi,en. Hindi plus English is common."

[options.text_file]
type = "bool"
default = false
label = "Also save the text"
help = "Write name.txt with the recognized text, one page after another."

[options.dpi]
type = "number"
default = 300
min = 150
max = 600
label = "Reading resolution (DPI)"
help = "Pages are drawn at this resolution to be read. 300 suits printed text; lower is faster, higher helps small print."

[capabilities]
files = "chosen"
network = true
network_reason = "Downloads the text recognition model and the ONNX Runtime once, the first time a language needs them. Pages never leave the computer."

[[capabilities.models]]
id = "ppocrv5-mobile-det"
size_mb = 5
license = "Apache-2.0"

[[capabilities.models]]
id = "ppocrv5-mobile-rec-en"
size_mb = 8
license = "Apache-2.0"

[[capabilities.models]]
id = "ppocrv5-mobile-rec-latin"
size_mb = 8
license = "Apache-2.0"

[[capabilities.models]]
id = "ppocrv5-mobile-rec-devanagari"
size_mb = 8
license = "Apache-2.0"

[surfaces]
bar = true
panel = true
right_click = true
share_sheet = true
cli = true
mcp = true
