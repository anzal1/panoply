[package]
name = "panoply-module-data-format"
version = "0.1.0"
edition = "2024"
publish = false

# The compiled file is always target/wasm32-wasip2/release/module.wasm, whatever the
# package is called, so module.toml never needs the file name.
[lib]
name = "module"
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.62"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
toml = { version = "0.9", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
