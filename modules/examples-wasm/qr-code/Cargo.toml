[package]
name = "panoply-module-qr-code"
version = "0.1.0"
edition = "2024"
publish = false

# The compiled file is always target/wasm32-wasip2/release/module.wasm, whatever the
# package is called, so module.toml never needs the file name.
[lib]
name = "module"
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.62"
serde_json = "1"
qrcode = { version = "0.14", default-features = false }
png = "0.18"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
