[package]
name = "arsenal-gpui"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone project, not part of the Panoply workspace.
[workspace]

[features]
# Dev only: enables the /snapshot endpoint (offscreen render of the live frame). Never used for measurement.
snapshot = ["gpui/test-support", "gpui_platform/test-support"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "a63db9fd901bedf1e0b52acfc1f60f30e5495449" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "a63db9fd901bedf1e0b52acfc1f60f30e5495449", features = ["font-kit", "runtime_shaders"] }
global-hotkey = "0.7"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
anyhow = "1"
raw-window-handle = "0.6"
objc2 = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }

[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
