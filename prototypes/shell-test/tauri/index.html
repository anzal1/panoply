<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <title>Arsenal</title>
  </head>
  <body>
    <div class="panel" id="panel">
     <div class="inner" id="inner">
      <div class="search">
        <svg class="mag" id="mag" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
        <input id="q" type="text" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" enterkeyhint="go" aria-label="Search tools" />
        <div class="chip" id="chip" hidden>
          <span class="chip-name"><span class="a" id="chipA"></span><span class="b" id="chipB"></span></span>
          <span class="chip-x" id="chipX" aria-label="Clear file"><svg id="chipXIcon" viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></svg></span>
        </div>
        <div class="hair h-bottom"></div>
      </div>
      <div class="list" id="list">
        <div class="scroll" id="scroll">
          <div class="content" id="content">
            <div class="pill" id="pill"><i></i></div>
            <div class="items" id="items"></div>
          </div>
        </div>
        <div class="msg" id="empty" data-on="0"><div class="m1" id="emptyA"></div><div class="m2">Try “compress” or drop a file</div></div>
        <div class="msg" id="drop" data-on="0"><div class="m1" id="dropA"></div></div>
      </div>
      <div class="footer">
        <div class="hair h-top"></div>
        <div class="lead"><span class="glyph"></span><span class="lead-t" id="lead">Arsenal</span></div>
        <div class="trail">
          <span class="act">Open<span class="kc">↵</span></span>
          <span class="act">Actions<span class="kc">⌘</span><span class="kc">K</span></span>
        </div>
      </div>
     </div>
      <div class="ring" id="ring"></div>
      <div class="edge"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
