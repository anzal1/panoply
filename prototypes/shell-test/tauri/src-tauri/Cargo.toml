[package]
name = "arsenal-tauri"
version = "0.1.0"
description = "Arsenal command bar (Tauri 2 build of the UI shell kill test)"
edition = "2021"
publish = false

[lib]
name = "arsenal_tauri_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2.4"
tiny_http = "0.12"
serde_json = "1"
window-vibrancy = "0.8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSScreen", "NSEvent", "NSGlassEffectView", "NSColor", "NSGraphics", "NSRunningApplication", "NSWorkspace", "libc"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSArray", "NSObject"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
