# Office corpus. Word, Excel, PowerPoint, OpenDocument: encrypted, comments, tracked changes, right-to-left, macros, legacy binary formats, very large sheets.
#
# One [[file]] table per sample. Files download into tests/corpus/cache/office/ (gitignored).
#   id        stable id, used by fetch.py --id and by the panoply-bench corpus slices
#   file      path under cache/office/
#   url       where fetch.py gets it (commit-pinned or a stable archive URL); absent when generated
#   license   SPDX id, or Public-Domain / LicenseRef-* with a note
#   source    where the sample comes from
#   sha256    pinned digest (empty only for generated files that are not byte-stable)
#   size      bytes
#   tags      edge cases the file covers; the vocabulary is shared by all five manifests
#   why       the case it covers and the spec section that cares
#   password  open password for encrypted samples, when one is needed
#   tier      default, large or huge (generated only; generate.py --tier)

