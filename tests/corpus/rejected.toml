# Sources that were looked at and not used, so nobody adds them back by accident.
# reason_kind: license (no usable license, or terms we do not want to carry), size (too big for
# a corpus people download), technical (does not contain what its name promises, or is not stable).
# Share-alike files that ARE in the manifests (CC-BY-SA, LGPL) are marked by their license and
# skipped by `fetch.py --permissive-only`; they are not listed here.

[[rejected]]
source = "nokiatech/heif_conformance (63 HEIF and MIAF conformance files)"
url = "https://github.com/nokiatech/heif_conformance"
reason_kind = "license"
reason = "The repository has no license file and the README makes no license statement. The files would have covered depth, alpha, multilayer and burst cases; pillow_heif's test images are used instead (BSD-3-Clause)."

[[rejected]]
source = "webmproject/libwebp-test-data (WebP test vectors)"
url = "https://github.com/webmproject/libwebp-test-data"
reason_kind = "license"
reason = "No license file and no license statement in the repository. Animated WebP comes from Wikimedia Commons and from generate.py."

[[rejected]]
source = "FFmpeg FATE sample suite"
url = "https://fate-suite.ffmpeg.org/"
reason_kind = "license"
reason = "No per-file license. Many samples are third-party recordings or codec conformance streams with their own terms. The cases FATE is usually used for (VFR, rotated, HDR, multiple audio tracks, broken moov) are generated with ffmpeg by generate.py instead."

[[rejected]]
source = "ianare/exif-samples"
url = "https://github.com/ianare/exif-samples"
reason_kind = "license"
reason = "Archived. User contributed images are CC BY-SA 4.0 but the original photographers are not recorded, and the older files have unknown provenance."

[[rejected]]
source = "mozilla/pdf.js test/pdfs/*.link"
url = "https://github.com/mozilla/pdf.js/tree/master/test/pdfs"
reason_kind = "license"
reason = "Several hundred .link files point at third-party PDFs on other sites, fetched only when the test suite runs. No license information, and the targets can change or disappear."

[[rejected]]
source = "mozilla/pdf.js test/pdfs/freeculture.pdf"
url = "https://github.com/mozilla/pdf.js/blob/master/test/pdfs/freeculture.pdf"
reason_kind = "license"
reason = "A book published under a Creative Commons NonCommercial license, which is not openly licensed for our purposes."

[[rejected]]
source = "mozilla/pdf.js test/pdfs/tracemonkey.pdf and its annotated variants"
url = "https://github.com/mozilla/pdf.js/blob/master/test/pdfs/tracemonkey.pdf"
reason_kind = "license"
reason = "An academic paper. The repository's Apache-2.0 license does not tell us who holds the paper's copyright, and the file's provenance is not itemized."

[[rejected]]
source = "mozilla/pdf.js test/pdfs/xfa_filled_imm1344e.pdf"
url = "https://github.com/mozilla/pdf.js/blob/master/test/pdfs/xfa_filled_imm1344e.pdf"
reason_kind = "license"
reason = "A filled Government of Canada immigration form. Crown copyright terms were not checked, and a smaller XFA sample (xfa_issue14315.pdf) covers the case."

[[rejected]]
source = "apache/poi test-data files named after web domains or hashes (for example aascu.org_*.pptx)"
url = "https://github.com/apache/poi/tree/trunk/test-data"
reason_kind = "license"
reason = "Documents crawled from third-party sites, copyright unknown. Only files authored for POI or attached to POI bug reports are used."

[[rejected]]
source = "LibreOffice/core test documents (sw/qa, sd/qa data folders)"
url = "https://github.com/LibreOffice/core"
reason_kind = "license"
reason = "GitHub reports the repository as GPL-3.0 and most sources as MPL-2.0, and the test documents carry no license of their own. OpenDocument samples are generated by generate.py instead."

[[rejected]]
source = "weld_16bit.png and weld_sato_12B_8B_q0.avif in AOMediaCodec/libavif tests/data"
url = "https://github.com/AOMediaCodec/libavif/tree/main/tests/data"
reason_kind = "license"
reason = "A photo from signatureedits.com under a custom grant, not an OSI or Creative Commons license. 16-bit PNG is covered by PngSuite and by generate.py."

[[rejected]]
source = "py-pdf/sample-files"
url = "https://github.com/py-pdf/sample-files"
reason_kind = "license"
reason = "Reported as CC-BY-SA-4.0 as a whole. Not needed once qpdf, pdf.js, pyHanko and PDFBox test files are in; kept out to hold share-alike files to a minimum."

[[rejected]]
source = "Wikimedia Commons JPEGs named CMYK (CMYK closeup.jpg, Cmyk-rgb.jpg, CMYK channels demo.jpg)"
url = "https://commons.wikimedia.org/wiki/Category:CMYK"
reason_kind = "technical"
reason = "Downloaded and opened: all three are ordinary RGB JPEGs. A real CMYK TIFF (CC BY-SA 4.0) and a generated CMYK JPEG are used."

[[rejected]]
source = "Big Buck Bunny 4K WebM on Wikimedia Commons, Big Buck Bunny 1080p zip, Elephants Dream 480p, Tears of Steel 720p"
url = "https://download.blender.org/"
reason_kind = "size"
reason = "2.9 GB, 275 MB, 104 MB and 372 MB. The corpus uses 10 second Big Buck Bunny and Sintel clips (1 to 10 MB) and the 4.4 MB Sintel trailer."

[[rejected]]
source = "irs.gov current-year forms (f1040.pdf, fw9.pdf, p17.pdf)"
url = "https://www.irs.gov/pub/irs-pdf/f1040.pdf"
reason_kind = "technical"
reason = "The live URL is replaced every tax year, which would break the pinned hash. Archived editions under irs-prior are used."
