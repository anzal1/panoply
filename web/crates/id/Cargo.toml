[package]
name = "panoply-web-id"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.130"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
fast_image_resize = { version = "6", features = ["bytemuck"] }
bytemuck = "1"
