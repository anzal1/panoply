# Web fork of crates/panoply-pdf (anzal1/panoply): workspace inheritance removed, native pdfium binding
# calls gated out for wasm32. The merge/split/organize engine (pageops, writer, copy, doc) is unchanged.
[package]
name = "panoply-pdf"
version = "0.1.3"
edition = "2024"
publish = false

[dependencies]
panoply-core = { path = "../../../crates/panoply-core" }
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_7881", "thread_safe"] }
lopdf = { version = "0.45", default-features = false }
miniz_oxide = "0.9"
zune-jpeg = "0.5"
zune-core = "0.5"
jpeg-encoder = "0.7"
png = "0.18"
weezl = "0.2"
fax = "0.2.7"
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[workspace]
