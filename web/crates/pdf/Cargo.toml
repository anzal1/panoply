[package]
name = "panoply-web-pdf"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.130"
panoply-pdf = { path = "../panoply-pdf-web" }
panoply-core = { path = "../../../crates/panoply-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.4", features = ["wasm_js"] }
thiserror = "2"
