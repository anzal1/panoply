[package]
name = "panoply-web-vision"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.130"
panoply-core = { path = "../../../crates/panoply-core" }
fast_image_resize = { version = "6", features = ["bytemuck"] }
bytemuck = "1"
serde_json = "1"
getrandom = { version = "0.4", features = ["wasm_js"] }
